<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">

<title>Idle Estate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#ffffff; --mint:#eef9f2; --mint2:#dff3e7; --line:#d3ecdc;
  --g1:#6fd39a; --g2:#2fa862; --g3:#1f7f49; --ink:#113a28; --mut:#5f8571;
  --gold:#f4b73c; --gold2:#fff4d6; --red:#e5534b;
  --disp:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}

/* header */
.hd{position:sticky;top:0;z-index:20;background:linear-gradient(#e6f7ed 0%,#f4fcf7 70%,rgba(255,255,255,0));padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:6px;margin:0 calc(-1 * max(14px,env(safe-area-inset-left,0px)));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.card[hidden]{display:none}
.cash{font-family:var(--disp);font-weight:800;font-size:44px;letter-spacing:-.02em;line-height:1;display:flex;align-items:baseline;gap:4px;font-variant-numeric:tabular-nums}
.cash small{font-size:24px;color:var(--g2)}
.sub{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:600;background:rgba(255,255,255,.9);color:var(--g3);border-radius:99px;padding:4px 10px;white-space:nowrap}
.chip.gold{background:var(--gold2);color:#8a5a00}
.sky{height:78px;margin-top:4px}
.sky svg{width:100%;height:100%;display:block;overflow:visible}
.sky .sun{animation:sun 4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.sky .bld{animation:rise .6s cubic-bezier(.2,.9,.3,1.2) backwards}
@keyframes sun{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@keyframes rise{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
.sky .bld{transform-origin:bottom;transform-box:fill-box}

/* banners */
.bn{display:flex;align-items:center;gap:10px;border-radius:16px;padding:9px 11px;margin:8px 0;background:var(--mint)}
.bn.gold{background:linear-gradient(120deg,#fff4d6,#ffe9ad)}
.bn .tx{flex:1;min-width:0}
.bn b{display:block;font-family:var(--disp);font-size:16px}
.bn span{font-size:12.5px;color:var(--mut)}
.bn.gold span{color:#8a5a00}
.btn{background:var(--g2);color:#fff;font-weight:700;border-radius:12px;padding:10px 14px;font-size:14px;white-space:nowrap;transition:transform .08s}
.btn:active{transform:scale(.95)}
.btn.gold{background:var(--gold);color:#4a3000}
.btn[disabled]{background:#cfe3d7;color:#fff;cursor:default}
.dots{display:flex;gap:4px;margin-top:5px}
.dots i{width:16px;height:6px;border-radius:3px;background:#c6e6d2}
.dots i.on{background:var(--g2)}

/* cards */
.card{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:10px;margin:9px 0;position:relative;transition:transform .07s,border-color .2s}
.card.tap:active{transform:scale(.985)}
.card.ready{border-color:var(--g1)}
.card.locked{background:var(--mint);border-style:dashed}
.ic{width:58px;height:58px;border-radius:16px;background:linear-gradient(145deg,#f4fcf7,#d3f0df);box-shadow:inset 0 -3px 0 rgba(47,168,98,.12);display:grid;place-items:center;font-size:32px;position:relative;flex:none}
.ic em{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10.5px;font-weight:700;background:var(--g2);color:#fff;border-radius:99px;padding:1px 7px;white-space:nowrap}
.mid{flex:1;min-width:0}
.nm{font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.nm s{text-decoration:none;font-size:11px;font-weight:600;color:var(--g3);background:var(--mint);border-radius:6px;padding:1px 6px}
.bar{height:24px;border-radius:12px;background:#e4f4ea;margin-top:6px;position:relative;overflow:hidden;box-shadow:inset 0 1px 2px rgba(17,58,40,.08)}
.bar i{position:absolute;inset:0;background:linear-gradient(180deg,#8ae3ae,#3fbf75);transform-origin:left;transform:scaleX(0);border-radius:12px}
.bar b{position:relative;z-index:1;display:block;text-align:center;font-size:12.5px;line-height:24px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;text-shadow:0 0 6px #fff,0 0 3px #fff}
.act{display:flex;flex-direction:column;gap:5px;flex:none;width:104px}
.buy,.mgr{border-radius:11px;padding:7px 6px;font-weight:700;font-size:12.5px;line-height:1.15;text-align:center}
.buy{background:linear-gradient(#45c47b,#2a9d5c);color:#fff;box-shadow:0 3px 0 #1f7f49;transition:transform .06s,box-shadow .06s}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #1f7f49}
.buy small{display:block;font-weight:600;opacity:.95;font-size:11.5px}
.buy.off{background:#e1efe6;color:#86ad96;box-shadow:0 3px 0 #cfe3d7}
.buy.can{animation:glow 1.6s ease-in-out infinite}
.mgr{background:var(--gold2);color:#7a4f00}
.mgr.off{background:#f3efe2;color:#bba97a}
.mgr.on{background:var(--mint);color:var(--g3);cursor:default}
.seg{display:flex;gap:6px;margin:8px 0}
.seg button{flex:1;background:var(--mint);color:var(--g3);font-weight:700;border-radius:10px;padding:7px 0;font-size:13px}
.seg button.on{background:var(--g2);color:#fff}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1.5px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{display:flex;width:100%;max-width:520px}
.nav button{flex:1;background:none;padding:8px 0 9px;font-size:11.5px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.nav button span{font-size:22px;line-height:1.1}
.nav button.on{color:var(--g3)}
.nav button.on::before{content:"";position:absolute;top:-1.5px;left:25%;right:25%;height:3px;border-radius:2px;background:var(--g2)}
.nav i{position:absolute;top:5px;right:26%;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #fff}

/* panels */
.pane{display:none}.pane.on{display:block}
h2{font-family:var(--disp);font-size:24px;margin:16px 0 4px;letter-spacing:-.01em}
.lead{color:var(--mut);font-size:14px;margin:0 0 10px;line-height:1.4}
.box{background:var(--mint);border-radius:18px;padding:14px;margin:10px 0}
.big{font-family:var(--disp);font-weight:800;font-size:30px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:11px;margin:8px 0}
.row .e{font-size:28px;width:44px;text-align:center;flex:none}
.row .tx{flex:1;min-width:0}
.row b{display:block;font-size:15px}
.row span{font-size:12.5px;color:var(--mut);line-height:1.3;display:block}
.row.hot{border-color:var(--gold);background:linear-gradient(120deg,#fffaf0,#fff2cc)}
.star{background:var(--gold);color:#4a3000;font-weight:800;border-radius:12px;padding:9px 12px;font-size:14px;white-space:nowrap}
.star:active{transform:scale(.95)}
.top{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;font-size:14px}
.top:nth-child(odd){background:var(--mint)}
.top.me{background:var(--gold2)}
.top .rk{width:26px;font-family:var(--disp);font-weight:800;color:var(--g3)}
.top .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.top .p{font-weight:700;color:#8a5a00;white-space:nowrap}
.top .v{font-size:12px;color:var(--mut);width:64px;text-align:right}
.sw{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;font-size:14px;font-weight:600}
.sw button{width:48px;height:28px;border-radius:14px;background:#cfe3d7;position:relative}
.sw button::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw button.on{background:var(--g2)}.sw button.on::after{left:23px}

/* vip */
.vip{position:fixed;z-index:40;width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffe9a3,var(--gold));display:none;place-items:center;font-size:36px;box-shadow:0 6px 22px rgba(244,183,60,.6);animation:bob 1s ease-in-out infinite}
.vip.on{display:grid}
.vip svg{position:absolute;inset:-5px;width:84px;height:84px;transform:rotate(-90deg)}
.vip circle{fill:none;stroke:var(--g2);stroke-width:4;stroke-linecap:round}
.vip small{position:absolute;bottom:-18px;font-size:11px;font-weight:800;color:#8a5a00;white-space:nowrap}

/* modal, toast, floats */
.md{position:fixed;inset:0;z-index:60;background:rgba(17,58,40,.45);display:none;align-items:flex-end;justify-content:center}
.md.on{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));text-align:center;animation:up .25s ease-out}
.sheet h3{font-family:var(--disp);font-size:24px;margin:6px 0}
.sheet p{color:var(--mut);margin:4px 0 14px;font-size:14.5px;line-height:1.4}
.sheet .big{color:var(--g2);margin:6px 0 14px}
.sheet .btn{width:100%;padding:14px;font-size:16px}
.sheet .ghost{background:none;color:var(--mut);margin-top:6px;font-weight:600;padding:8px;width:100%}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:10px 16px;font-size:14px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
.toast.on{opacity:1}
.fl{position:fixed;z-index:70;font-family:var(--disp);font-weight:800;font-size:20px;color:var(--g2);pointer-events:none;text-shadow:0 1px 0 #fff,0 0 8px #fff;animation:fly .9s ease-out forwards}
.fl.gold{color:#c98a00;font-size:26px}
.load{position:fixed;inset:0;background:#fff;z-index:90;display:grid;place-items:center;text-align:center;font-family:var(--disp);font-size:20px;color:var(--g3)}
.load div{font-size:56px}

@keyframes pop{from{transform:translateY(8px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(47,168,98,.0)}50%{box-shadow:0 0 0 5px rgba(47,168,98,.22)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes fly{from{transform:translateY(0);opacity:1}to{transform:translateY(-60px);opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.sky{height:86px}
.sky .cloud{animation:drift 24s ease-in-out infinite alternate}
.sky .cloud2{animation:drift 31s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(26px)}}
.card{border:1.5px solid var(--line);border-radius:22px;box-shadow:0 2px 0 var(--line),0 10px 22px rgba(31,127,73,.07);padding:11px}
.card.ready{border-color:var(--g1);box-shadow:0 2px 0 var(--g1),0 10px 22px rgba(47,168,98,.14)}
.ic{width:62px;height:66px;border-radius:18px;background:linear-gradient(160deg,#e6f8ff,#d7f3e3 70%);box-shadow:inset 0 -4px 0 rgba(47,168,98,.14),inset 0 2px 0 #fff}
.ic svg{width:48px;height:56px;margin-top:-4px;filter:drop-shadow(0 2px 1px rgba(17,58,40,.18))}
.ic em{background:linear-gradient(#45c47b,#2a9d5c);box-shadow:0 2px 0 #1f7f49;bottom:-8px}
.bar i{background:repeating-linear-gradient(115deg,rgba(255,255,255,.28) 0 7px,transparent 7px 14px),linear-gradient(180deg,#8ae3ae,#3fbf75);background-size:28px 100%,100% 100%;animation:stripe 1s linear infinite}
@keyframes stripe{to{background-position:28px 0,0 0}}
.star{background:linear-gradient(#ffd466,#f2a91f);box-shadow:0 3px 0 #c98400;color:#4a3000}
.star:active{transform:translateY(2px);box-shadow:0 1px 0 #c98400}
.btn{background:linear-gradient(#45c47b,#2a9d5c);box-shadow:0 3px 0 #1f7f49}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #1f7f49}
.btn.gold{background:linear-gradient(#ffd466,#f2a91f);box-shadow:0 3px 0 #c98400;color:#4a3000}
.btn[disabled]{background:#dcebe2;box-shadow:0 3px 0 #cfe3d7}
.row{border-radius:20px;box-shadow:0 2px 0 var(--line),0 8px 18px rgba(31,127,73,.06)}
.row.hot{box-shadow:0 2px 0 #f2c76a,0 10px 22px rgba(244,183,60,.2)}
.row .e{font-size:30px;width:50px;height:50px;border-radius:16px;background:var(--mint);display:grid;place-items:center}
.box{border-radius:22px;background:linear-gradient(160deg,#eefaf3,#dff3e7)}
.nav{box-shadow:0 -6px 18px rgba(31,127,73,.08);border-top:0}
.nav button.on span{background:var(--mint2);border-radius:16px;padding:1px 16px}
.nav button.on::before{display:none}
.bn{border-radius:20px}
.seg button{border-radius:12px}
.seg button.on{background:linear-gradient(#45c47b,#2a9d5c);box-shadow:0 2px 0 #1f7f49}
</style>
</head>

  if (!S || S.vipEnd <= snow()) return;
  S.vipEnd = 0; vipShown = false; $('vip').classList.remove('on'); hap('ok');
  call({ act: 'vip' }).then(r => { if (r && r.reward) { float('+$' + fm(r.reward), vipPos ? vipPos[0] : 100, vipPos ? vipPos[1] : 200, true); toast(L.vipMsg + '$' + fm(r.reward)); } });
});

// tabs
function go(t) {
  tab = t;
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'p-' + t));
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  scrollTo(0, 0); hap('light');
  if (t === 'shop') renderShop(); else if (t === 'prest') renderPrest(); else if (t === 'top') loadTop();
}

// shop
function renderShop() {
  const order = ['welcome', 'b2', 'b3', 'perm2', 'vault', 'skip1', 'skip8'].filter(k => !(k === 'welcome' && S.welcome));
  let h = `<h2>${L.shopT}</h2><p class="lead">${L.shopS}</p>`;
  for (const k of order) {
    const it = L.items[k];
    const own = (k === 'perm2' && S.perm2) || (k === 'vault' && S.vault);
    h += `<div class="row${k === 'welcome' ? ' hot' : ''}"><div class="e">${it[0]}</div><div class="tx"><b>${it[1]}</b><span>${it[2]}</span></div>${own ? '<span class="chip">✅</span>' : `<button class="star" data-sku="${k}">⭐ ${S.shop[k]}</button>`}</div>`;
  }
  h += `<div class="sw"><span>🔔 ${L.remind}</span><button id="nt" class="${S.notify ? 'on' : ''}"></button></div>`;
  const p = $('p-shop'); p.innerHTML = h;
  p.onclick = e => {
    const s = e.target.closest('[data-sku]'); if (s) buy(s.dataset.sku);
    if (e.target.id === 'nt') { S.notify = !S.notify; e.target.classList.toggle('on', S.notify); call({ act: 'notify', on: S.notify }); }
  };
}
function buy(sku) {
  hap('medium');
  call({ act: 'invoice', sku }).then(r => {
    if (!r || !r.ok || !r.link) { toast(L.err); return; }
    if (!tgw || !tgw.openInvoice) { window.open(r.link, '_blank'); return; }
    tgw.openInvoice(r.link, st => {
      if (st === 'paid') { hap('ok'); toast(L.paid); setTimeout(() => call({ act: 'state' }).then(() => { buildBanners(); if (tab === 'shop') renderShop(); }), 1200); setTimeout(() => call({ act: 'state' }), 4000); }
      else if (st === 'cancelled' || st === 'failed') toast(L.cancelled);
    });
  });
}

// prestige
let sureSell = false;
function renderPrest() { sureSell = false; paintPrest(true); }
function paintPrest(force) {
  const p = $('p-prest'); const g = gainInv();
  const key = [Math.floor(S.inv), g, sureSell].join();
  if (!force && p.dataset.k === key) return; p.dataset.k = key;
  p.innerHTML = `<h2>${L.prestT}</h2><p class="lead">${L.prestS}</p>
   <div class="box"><span class="lead">${L.investors}</span><div class="big">${fmt(S.inv)} 👔</div><span class="lead">${L.bonus}: +${fmt(S.inv * 2)}%</span></div>
   ${sureSell ? `<div class="box"><p class="lead">${L.sure}</p><div style="display:flex;gap:8px"><button class="btn" id="sellYes" style="flex:1">${L.yes}</button><button class="btn" id="sellNo" style="flex:1;background:#cfe3d7">${L.no}</button></div></div>`
   : `<button class="btn gold" id="sellBtn" style="width:100%;padding:15px;font-size:16px" ${g < 1 ? 'disabled' : ''}>${g >= 1 ? L.sellFor.replace('{n}', fmt(g)) : L.needMore}</button>`}`;
  p.onclick = e => {
    if (e.target.id === 'sellBtn') { sureSell = true; paintPrest(true); }
    else if (e.target.id === 'sellNo') { sureSell = false; paintPrest(true); }
    else if (e.target.id === 'sellYes') { call({ act: 'prestige' }).then(r => { sureSell = false; if (r && r.gained) { hap('ok'); toast(L.sold.replace('{n}', fmt(r.gained))); go('estate'); } }); }
  };
}

// top
function loadTop() { call({ act: 'top' }).then(() => { if (tab === 'top') renderTop(); }); }
function renderTop() {
  const d = topData; const p = $('p-top'); if (!d) return;
  const left = Math.max(0, d.ends - snow()); const dd = Math.floor(left / 86400), hh = Math.floor(left % 86400 / 3600), mm = Math.floor(left % 3600 / 60);
  let h = `<h2>${L.topT}</h2><p class="lead">${L.topS}</p>
   <div class="box"><span class="lead">${L.pool}</span><div class="big">⭐ ${fmt(d.pool)}</div><span class="lead">${d.pool > 0 ? '' : L.noPool + ' '}${L.ends} ${dd}d ${hh}h ${mm}m</span></div>`;
  h += '<div>';
  d.top.forEach((r, i) => { const pr = Math.floor(d.pool * d.shares[i] / 100); h += `<div class="top${r.me ? ' me' : ''}"><span class="rk">${i + 1}</span><span class="n">${esc(r.n)}${r.me ? ' (' + L.yours + ')' : ''}</span><span class="v">$${fm(r.v)}</span><span class="p">${pr > 0 ? '⭐ ' + pr : ''}</span></div>`; });
  h += '</div>';
  h += `<div class="box"><span class="lead">${L.rank}</span><div class="big">#${d.rank}</div><span class="lead">$${fm(d.score)}</span></div>`;
  const w = d.wallet || {};
  h += `<div class="box"><span class="lead">👛 ${L.wallet}</span><div class="big">⭐ ${fmt(w.avail || 0)}</div><span class="lead">${L.locked}: ⭐ ${fmt(w.locked || 0)}</span></div>`;
  p.innerHTML = h;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- boot
async function boot() {
  if (!initData) { $('load').innerHTML = '<div><div>📱</div>' + L.openTg + '</div>'; return; }
  let r = await call({ act: 'state', first: true });
  if (!r || !r.ok) { $('load').querySelector('div').insertAdjacentHTML('beforeend', '<p style="font-size:14px;color:#5f8571">' + L.err + '</p>'); setTimeout(boot, 2500); return; }
  if (r.gap > 120 && r.away > 1) {
    modal(`<div style="font-size:54px">🏠</div><h3>${L.away}</h3><div class="big">+$${fm(r.away)}</div><p>${L.awayS}</p><button class="btn" id="okAway">${L.collect}</button>`);
    $('okAway').onclick = () => { hap('ok'); closeModal(); };
  }
}
boot();
})();
</script>
</body>
</html>
