<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Idle Estate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js" async></script>
<style>
:root{
  --navy:#12305e; --sky1:#4fb3f7; --sky2:#cdeeff; --bg:#e6f4ff;
  --gold:#ffc12e; --gold2:#ff9f1a; --green:#3ccf4e; --green2:#22a634; --red:#ff5a4d;
  --ink:#12305e; --mut:#5a7396; --line:#c6def3; --card:#ffffff;
  --disp:'Fredoka','Baloo 2',system-ui,-apple-system,sans-serif;
  --body:'Nunito',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:700;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button{font-family:inherit;font-weight:800;color:inherit;border:0;cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.ol{color:#fff;-webkit-text-stroke:3px var(--navy);paint-order:stroke fill;text-shadow:0 3px 0 rgba(18,48,94,.35);font-family:var(--disp);letter-spacing:.01em}

/* top bar */
.hd{position:sticky;top:0;z-index:20;margin:0 calc(-1 * max(12px,env(safe-area-inset-left,0px)));padding:max(10px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));background:linear-gradient(#1b4a8f,var(--navy));border-radius:0 0 26px 26px;box-shadow:0 5px 0 rgba(18,48,94,.25)}
.cash{font-family:var(--disp);font-weight:700;font-size:40px;line-height:1.05;display:flex;align-items:center;gap:8px;color:#fff;-webkit-text-stroke:0;text-shadow:0 3px 0 rgba(0,0,0,.28);font-variant-numeric:tabular-nums}
.cash .coin{flex:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.sub{display:flex;gap:7px;align-items:center;margin-top:5px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:800;background:rgba(255,255,255,.16);color:#fff;border-radius:99px;padding:4px 11px;white-space:nowrap}
.chip.gold{background:var(--gold);color:var(--navy)}
.scene{margin:8px 0 0;border-radius:20px;overflow:hidden;border:3px solid var(--navy);box-shadow:0 5px 0 var(--navy);background:linear-gradient(#4fb3f7,#bfe8ff 75%)}
.sky{height:188px}
.sky svg{width:100%;height:100%;display:block}
.sky .sun{animation:sun 4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.sky .cloud{animation:drift 24s ease-in-out infinite alternate}
.sky .cloud2{animation:drift 31s ease-in-out infinite alternate-reverse}
.sky .bld{animation:rise .6s cubic-bezier(.2,.9,.3,1.2) backwards;transform-origin:bottom;transform-box:fill-box}
.sky .bld *,.ic svg *{stroke:var(--navy);stroke-width:1.2;stroke-linejoin:round}
@keyframes sun{0%,100%{opacity:.92;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(26px)}}
@keyframes carA{from{transform:translate(0,0)}to{transform:translate(160px,80px)}}
@keyframes carB{from{transform:translate(0,0)}to{transform:translate(-160px,-80px)}}
.sky .carA{animation:carA 9s linear infinite}
.sky .carB{animation:carB 12s linear infinite;animation-delay:-4s}
.sky .wn{stroke:none}
.sky .plus{cursor:pointer;animation:bob 1.2s ease-in-out infinite}
@keyframes rise{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}

/* banners */
.bn{display:flex;align-items:center;gap:10px;border-radius:20px;padding:10px 12px;margin:12px 0;background:#fff;border:3px solid var(--navy);box-shadow:0 4px 0 var(--navy)}
.bn.gold{background:linear-gradient(#ffe38a,#ffc12e)}
.bn .tx{flex:1;min-width:0}
.bn b{display:block;font-family:var(--disp);font-size:17px;font-weight:600}
.bn span{font-size:13px;color:var(--mut);font-weight:700;line-height:1.3;display:block}
.bn.gold span{color:#7a4d00}
.dots{display:flex;gap:4px;margin-top:6px}
.dots i{width:18px;height:8px;border-radius:4px;background:#cfe0f0;border:1.5px solid var(--navy)}
.dots i.on{background:var(--green)}

/* buttons */
.btn,.star,.buy,.mgr,.seg button{border:2.5px solid var(--navy);border-radius:14px;color:#fff;text-shadow:0 2px 0 rgba(18,48,94,.5);transition:transform .06s,box-shadow .06s}
.btn{background:linear-gradient(#63ee70,#25b537);box-shadow:0 4px 0 var(--navy);padding:10px 14px;font-size:15px;white-space:nowrap;font-family:var(--disp);font-weight:600}
.btn.gold,.star{background:linear-gradient(#ffd75e,#ffa51f);color:var(--navy);text-shadow:0 1px 0 rgba(255,255,255,.6);box-shadow:0 4px 0 var(--navy);font-family:var(--disp);font-weight:600}
.star{padding:9px 12px;font-size:15px;white-space:nowrap}
.btn:active,.star:active,.buy:active,.mgr:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy)}
.btn[disabled]{background:#cfdceb;color:#fff;box-shadow:0 4px 0 #8aa4c4;border-color:#8aa4c4;text-shadow:none}

/* property cards */
.seg{display:flex;gap:7px;margin:4px 0 6px}
.seg button{flex:1;background:#fff;color:var(--navy);text-shadow:none;font-size:14px;padding:7px 0;box-shadow:0 3px 0 var(--navy);font-family:var(--disp);font-weight:600}
.seg button.on{background:linear-gradient(#63ee70,#25b537);color:#fff;text-shadow:0 2px 0 rgba(18,48,94,.5)}
.card{display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--navy);border-radius:24px;padding:10px;margin:14px 0;position:relative;box-shadow:0 5px 0 var(--navy);transition:transform .07s}
.card[hidden]{display:none}
.card.tap:active{transform:translateY(3px);box-shadow:0 2px 0 var(--navy)}
.card.ready{background:linear-gradient(#fffdf0,#fff3c4)}
.card.locked{background:#dbe9f6}
.card.locked .ic svg{filter:grayscale(.85) brightness(.9);opacity:.7}
.ic{width:64px;height:70px;border-radius:18px;border:2.5px solid var(--navy);background:linear-gradient(#7ccaff,#d5f1ff);display:grid;place-items:center;position:relative;flex:none;overflow:visible}
.ic svg{width:50px;height:58px;margin-top:-2px}
.ic em{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);font-style:normal;font-family:var(--disp);font-size:12px;font-weight:600;background:var(--gold);color:var(--navy);border:2px solid var(--navy);border-radius:99px;padding:0 8px;white-space:nowrap;line-height:17px}
.mid{flex:1;min-width:0}
.nm{font-family:var(--disp);font-weight:600;font-size:17px;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.nm .n{overflow:hidden;text-overflow:ellipsis}
.nm s{text-decoration:none;font-family:var(--body);font-size:11px;font-weight:800;color:#fff;background:#7b61ff;border:2px solid var(--navy);border-radius:8px;padding:0 6px;line-height:16px;flex:none}
.bar{height:28px;border-radius:14px;background:#cadff2;margin-top:6px;position:relative;overflow:hidden;border:2.5px solid var(--navy)}
.bar i{position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.3) 0 7px,transparent 7px 14px),linear-gradient(#7bf585,#2dc43f);background-size:28px 100%,100% 100%;transform-origin:left;transform:scaleX(0);animation:stripe 1s linear infinite}
.bar::after{content:"";position:absolute;left:6px;right:6px;top:2px;height:6px;border-radius:4px;background:rgba(255,255,255,.45)}
.bar b{position:relative;z-index:2;display:block;text-align:center;font-family:var(--disp);font-size:14px;line-height:23px;font-weight:600;color:#fff;-webkit-text-stroke:2.5px var(--navy);paint-order:stroke fill;font-variant-numeric:tabular-nums}
@keyframes stripe{to{background-position:28px 0,0 0}}
.act{display:flex;flex-direction:column;gap:6px;flex:none;width:104px}
.buy,.mgr{padding:6px 4px;font-size:13px;line-height:1.15;text-align:center;font-family:var(--disp);font-weight:600}
.buy{background:linear-gradient(#63ee70,#25b537);box-shadow:0 4px 0 var(--navy)}
.buy small{display:block;font-size:13px;font-weight:600;opacity:1}
.buy.off{background:linear-gradient(#d5e2ef,#aebfd3);box-shadow:0 4px 0 #6f88a9;border-color:#6f88a9;text-shadow:none;color:#fff}
.buy.can{animation:glow 1.4s ease-in-out infinite}
.mgr{background:linear-gradient(#ffd75e,#ffa51f);color:var(--navy);text-shadow:0 1px 0 rgba(255,255,255,.6);box-shadow:0 4px 0 var(--navy)}
.mgr.off{background:linear-gradient(#efe6cc,#d8c89a);box-shadow:0 4px 0 #9c8a55;border-color:#9c8a55}
.mgr.on{background:#d6f3dc;color:#1c7a2b;box-shadow:none;border-color:#1c7a2b;text-shadow:none;cursor:default;transform:none}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navy);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);border-radius:24px 24px 0 0;box-shadow:0 -4px 0 rgba(18,48,94,.2)}
.nav div{display:flex;width:100%;max-width:520px;padding:6px 8px}
.nav button{flex:1;background:none;padding:5px 0 6px;font-size:12px;font-family:var(--disp);font-weight:600;color:#9db8de;display:flex;flex-direction:column;align-items:center;gap:0;position:relative;border-radius:16px}
.nav button span{font-size:25px;line-height:1.15}
.nav button.on{color:var(--navy);background:linear-gradient(#ffd75e,#ffa51f)}
.nav i{position:absolute;top:2px;right:24%;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid #fff}

/* panels */
.pane{display:none}.pane.on{display:block}
h2{font-family:var(--disp);font-size:28px;font-weight:700;margin:18px 0 2px;color:var(--navy)}
.lead{color:var(--mut);font-size:14px;margin:0 0 10px;line-height:1.4;font-weight:700}
.box{background:linear-gradient(#ffffff,#e4f3ff);border:3px solid var(--navy);border-radius:22px;padding:14px;margin:12px 0;box-shadow:0 4px 0 var(--navy)}
.big{font-family:var(--disp);font-weight:700;font-size:32px;color:var(--navy);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--navy);border-radius:22px;padding:11px;margin:12px 0;box-shadow:0 4px 0 var(--navy)}
.row .e{font-size:30px;width:52px;height:52px;border-radius:16px;background:linear-gradient(#7ccaff,#d5f1ff);border:2.5px solid var(--navy);display:grid;place-items:center;flex:none}
.row .tx{flex:1;min-width:0}
.row b{display:block;font-family:var(--disp);font-size:17px;font-weight:600}
.row span{font-size:12.5px;color:var(--mut);line-height:1.3;display:block;font-weight:700}
.row.hot{background:linear-gradient(#fff4c4,#ffe07a)}
.row.hot span{color:#7a4d00}
.top{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;font-size:14px;background:#fff;border:2.5px solid var(--navy);margin:6px 0}
.top.me{background:linear-gradient(#fff4c4,#ffe07a)}
.top .rk{width:28px;font-family:var(--disp);font-weight:700;font-size:18px;color:var(--navy)}
.top .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}
.top .p{font-weight:800;color:#a15e00;white-space:nowrap}
.top .v{font-size:12px;color:var(--mut);width:64px;text-align:right}
.sw{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;font-size:14px;font-weight:800}
.sw button{width:52px;height:30px;border-radius:15px;background:#aebfd3;border:2.5px solid var(--navy);position:relative}
.sw button::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;border:2px solid var(--navy);transition:left .15s}
.sw button.on{background:var(--green)}.sw button.on::after{left:24px}

/* vip */
.vip{position:fixed;z-index:40;width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff1b0,var(--gold));border:3px solid var(--navy);display:none;place-items:center;font-size:36px;box-shadow:0 5px 0 var(--navy);animation:bob 1s ease-in-out infinite}
.vip.on{display:grid}
.vip svg{position:absolute;inset:-9px;width:94px;height:94px;transform:rotate(-90deg)}
.vip circle{fill:none;stroke:var(--green);stroke-width:4;stroke-linecap:round}
.vip small{position:absolute;bottom:-24px;font-size:12px;font-weight:800;color:var(--navy);white-space:nowrap;background:#fff;border:2px solid var(--navy);border-radius:99px;padding:0 7px}

/* modal, toast, floats */
.md{position:fixed;inset:0;z-index:60;background:rgba(18,48,94,.55);display:none;align-items:flex-end;justify-content:center}
.md.on{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;border:3px solid var(--navy);border-bottom:0;border-radius:30px 30px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));text-align:center;animation:up .25s ease-out}
.sheet h3{font-family:var(--disp);font-size:26px;font-weight:700;margin:6px 0}
.sheet p{color:var(--mut);margin:4px 0 14px;font-size:14.5px;line-height:1.4}
.sheet .big{color:#1c9a2c;margin:6px 0 14px}
.sheet .btn{width:100%;padding:14px;font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:16px;padding:10px 16px;font-size:14px;font-weight:800;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center;border:2px solid #fff}
.toast.on{opacity:1}
.fl{position:fixed;z-index:70;font-family:var(--disp);font-weight:700;font-size:22px;color:#fff;-webkit-text-stroke:3px var(--navy);paint-order:stroke fill;pointer-events:none;animation:fly .9s ease-out forwards}
.fl.gold{color:var(--gold);font-size:28px}
.load{position:fixed;inset:0;background:linear-gradient(#4fb3f7,#d6f1ff);z-index:90;display:grid;place-items:center;text-align:center;font-family:var(--disp);font-size:20px;color:var(--navy)}
.load div{font-size:56px}

@keyframes glow{0%,100%{box-shadow:0 4px 0 var(--navy),0 0 0 0 rgba(60,207,78,0)}50%{box-shadow:0 4px 0 var(--navy),0 0 0 6px rgba(60,207,78,.35)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes fly{from{transform:translateY(0);opacity:1}to{transform:translateY(-64px);opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes coin{0%,100%{transform:rotateY(0)}50%{transform:rotateY(180deg)}}
.cash .coin{animation:coin 3.2s ease-in-out infinite}
.goal{margin:10px 0 2px;background:#fff;border:3px solid var(--navy);border-radius:20px;padding:8px 10px;box-shadow:0 4px 0 var(--navy);display:flex;align-items:center;gap:9px;cursor:pointer}
.goal[hidden]{display:none}
.goal .gi{font-size:26px;flex:none}
.goal .gm{flex:1;min-width:0}
.goal .gt{font-family:var(--disp);font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal .gb{height:14px;border-radius:9px;background:#cadff2;border:2px solid var(--navy);margin-top:4px;overflow:hidden;position:relative}
.goal .gb i{position:absolute;inset:0;transform-origin:left;background:linear-gradient(#7bf585,#2dc43f);transition:transform .25s}
.goal.rdy{background:linear-gradient(#fffdf0,#fff3c4);animation:glow 1.4s ease-in-out infinite}
.card.flash{animation:glow .5s ease-in-out 3}
.cb{position:fixed;z-index:75;pointer-events:none;font-size:20px;animation:burst .8s ease-out forwards}
@keyframes burst{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(220deg);opacity:0}}
.pg{height:10px;border-radius:6px;background:#cadff2;border:2px solid var(--navy);margin-top:5px;overflow:hidden}
.pg i{display:block;height:100%;background:linear-gradient(#7bf585,#2dc43f)}
.row.done{opacity:.55}
.row .rw{font-size:12px;font-weight:800;color:#a15e00;margin-top:2px}
.chip.ev{cursor:pointer}
.chip.ev.on{background:var(--gold);color:var(--navy);animation:bob 1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.tuto{position:fixed;inset:0;z-index:9999;background:rgba(18,48,94,.72);display:flex;align-items:center;justify-content:center;padding:20px}
.tuto .tc{background:#fff;border:3px solid var(--navy);border-radius:24px;box-shadow:0 8px 0 var(--navy);max-width:360px;width:100%;padding:22px 20px 18px;text-align:center}
.tuto .te{font-size:54px;line-height:1}
.tuto h3{font-family:var(--disp);font-size:24px;margin:8px 0 6px;color:var(--navy)}
.tuto p{margin:0 0 14px;font-size:15px;line-height:1.4;color:var(--navy)}
.tuto .td{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.tuto .td i{width:9px;height:9px;border-radius:50%;background:#c9dcef}
.tuto .td i.on{background:#25b537}
.tuto .tb{display:flex;gap:10px;justify-content:center}
.tuto .tb .sk{background:#fff;color:var(--navy);box-shadow:0 4px 0 var(--navy);text-shadow:none}
</style>
</head>
<body>
<div class="load" id="load"><div><img src="logo.png" alt="Idle Estate" width="200" height="200" style="display:block;margin:0 auto;border-radius:44px;box-shadow:0 12px 36px rgba(17,58,40,.25);animation:bob 1.4s ease-in-out infinite"></div></div>

<div class="wrap">
  <div class="hd">
    <div class="cash"><svg class="coin" viewBox="0 0 32 32" width="34" height="34"><circle cx="16" cy="16" r="15" fill="#f4b73c" stroke="#d9951a" stroke-width="2"/><circle cx="16" cy="16" r="11" fill="none" stroke="#fff3c4" stroke-width="1.5"/><path d="M16 8.5 L8.5 15 H11 V23 H21 V15 H23.5 Z" fill="#fff3c4"/></svg><span id="cash">0</span></div>
    <div class="sub"><span class="chip" id="rate">$0/s</span><span class="chip" id="mult">x1</span><span class="chip gold" id="boost" hidden></span><span class="chip gold" id="bankc" hidden style="cursor:pointer"></span><span class="chip ev" id="evc"></span><span class="chip gold" id="goldc" hidden>👑 x1.5</span><span class="chip" id="invc" style="cursor:pointer">👥 +</span></div>
  </div>
  <div class="scene"><div class="sky" id="sky"></div></div>

  <section class="pane on" id="p-estate">
    <div class="goal" id="goal" hidden></div>
    <div id="banners"></div>
    <div class="seg" id="seg"></div>
    <div id="cards"></div>
  </section>

  <section class="pane" id="p-goals"></section>
  <section class="pane" id="p-shop"></section>
  <section class="pane" id="p-prest"></section>
  <section class="pane" id="p-top"></section>
</div>

<div class="vip" id="vip"><svg viewBox="0 0 84 84"><circle id="vipc" cx="42" cy="42" r="38" stroke-dasharray="238.8" stroke-dashoffset="0"/></svg>🤑<small id="vipt"></small></div>

<div class="nav"><div id="nav"></div></div>
<div class="md" id="md"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

const tgw = window.Telegram && Telegram.WebApp;

const L = {
 en: {

  names:['Studio','Loft','Villa','Apartment block','Residential tower','Hotel chain','Mall network','Business district','Resort island','Megacity'],
  pr:['month','month','month','month','month','month','month','month','month','month'],

function fmt(n) {
  if (!isFinite(n)) return '0';
  if (n < 0) n = 0;
  if (n < 1000) return n < 10 ? (Math.floor(n * 100) / 100).toString() : n < 100 ? (Math.floor(n * 10) / 10).toString() : Math.floor(n).toString();
  const e = Math.min(Math.floor(Math.log10(n) / 3), SUF.length - 1);
  if (e >= SUF.length - 1 && n >= 1e36) return n.toExponential(2).replace('+', '');
  const v = n / Math.pow(1000, e);
  return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : v.toFixed(0)) + SUF[e];
}
const K = 20000; // display scale: 1 game unit = $20,000, so a studio costs $80,000

const mult = l => { let m = 1; for (const k of S.ms) if (l >= k) m *= S.mb; return m; };
const evOn = n => { const s = n % 86400; return s >= 61200 && s < 64800; };
const curM = n => (1 + S.ib * S.inv) * (((S.startEnd > n ? 10 : 0) + (S.boostEnd > n ? S.bmult : 0) + (S.adEnd > n ? 2 : 0)) || 1) * (S.perm2 ? 2 : 1) * (evOn(n) ? 2 : 1) * (S.goldEnd > n ? 1.5 : 1);
const inc = (i, n) => S.lv[i] > 0 ? S.cfg[i].r * S.lv[i] * mult(S.lv[i]) * curM(n) : 0;
const gainInv = () => Math.max(0, Math.floor(10 * Math.sqrt(S.life_all / 2500)) - Math.floor(S.inv));
function rateNow() { const n = snow(); let g = 0; for (let i = 0; i < 10; i++) { const e = inc(i, n) / S.cfg[i].t; g += S.mg[i] ? e : e * 0.5; } return g; }
function cost(i, n) { const c0 = S.cfg[i].c * Math.pow(S.g, S.lv[i]); return c0 * (Math.pow(S.g, n) - 1) / (S.g - 1); }
function maxN(i) { const c0 = S.cfg[i].c * Math.pow(S.g, S.lv[i]); return Math.max(0, Math.min(1000, Math.floor(Math.log(1 + S.cash * (S.g - 1) / c0) / Math.log(S.g)))); }
function buyN(i) { return mode === 'max' ? Math.max(1, maxN(i)) : mode; }

function tick() {

  if (dt <= 0) return; if (dt > 60) dt = 60;
  const M = curM(n); let gain = 0;
  for (let i = 0; i < 10; i++) {
    if (S.lv[i] <= 0) continue;
    const per = S.cfg[i].r * S.lv[i] * mult(S.lv[i]) * M;
    if (S.mg[i]) gain += per / S.cfg[i].t * dt;
    else if (S.ts[i] > 0 && n >= S.ts[i] + S.cfg[i].t) { gain += per; S.ts[i] = -1; popOn(i, per); }

});
const achProg = id => {
  const m = /^p(\d)$/.exec(id); if (m) return [S.lv[+m[1]] > 0 ? 1 : 0, 1];
  const mgc = S.mg.filter(Boolean).length;
  return ({ mgr1: [mgc, 1], s10: [S.lv[0], 10], s25: [S.lv[0], 25], s50: [S.lv[0], 50], mgr5: [mgc, 5], mgr10: [mgc, 10], pr1: [S.prest, 1], pr5: [S.prest, 5], st7: [S.streak, 7], fr1: [S.ref_n, 1], fr5: [S.ref_n, 5] })[id] || [0, 1];
};
const achInfo = id => { const m = /^p(\d)$/.exec(id); return m ? [EM[+m[1]], L.names[+m[1]], L.achOwn] : (L.ach[id] || ['🏆', id, '']); };
const qReady = () => (S && S.q ? S.q.list.filter(x => !x.done && x.v >= x.t).length + (!S.q.all && S.q.list.length && S.q.list.every(x => x.done) ? 1 : 0) : 0);
const readyIds = () => (S && S.defs ? S.defs.filter(d => !S.ach.includes(d.id) && achProg(d.id)[0] >= achProg(d.id)[1]).map(d => d.id) : []);
function rewTxt(d) { return d.k === 'c' ? '🪙 +' + d.v + ' min' : '⚡ x2 ' + fmtT(d.v); }
let goalsKey = '';
function renderGoals(force) {
  const rd = readyIds();
  const key = [S.ach.length, rd.join(), S.ref_n, sndOn, S.q.list.map(x => x.v + (x.done ? 'd' : '')).join(), S.q.all].join('|') + (force ? Math.random() : '');
  if (!force && key === goalsKey) {
    // refresh progress bars only
    document.querySelectorAll('#p-goals .pg i').forEach(b => { const id = b.dataset.id; if (!id) return; const pr = achProg(id); b.style.width = Math.min(100, pr[0] / pr[1] * 100) + '%'; });
    return;
  }
  goalsKey = key;
  const order = [...S.defs.filter(d => rd.includes(d.id)), ...S.defs.filter(d => !rd.includes(d.id) && !S.ach.includes(d.id)), ...S.defs.filter(d => S.ach.includes(d.id))];
  let h = `<h2>${L.goals}</h2><h2 style="font-size:22px;margin-top:6px">${L.questsT}</h2><p class="lead">${L.questsS}</p>`;
  for (const q of S.q.list) {
    const d = L.q[q.id]; const ok = !q.done && q.v >= q.t;
    h += `<div class="row${q.done ? ' done' : ''}${ok ? ' hot' : ''}"><div class="e">${d[0]}</div><div class="tx"><b>${d[1].replace('{n}', q.t)}</b>${q.done ? '' : `<div class="pg"><i style="width:${Math.min(100, q.v / q.t * 100)}%"></i></div>`}<div class="rw">🪙 +${q.m} min${S.goldEnd > snow() ? ' x2 👑' : ''}</div></div>${q.done ? '<span class="chip" style="background:#d6f3dc;color:#1c7a2b">✅</span>' : ok ? `<button class="btn" data-q="${q.id}">${L.claim}</button>` : `<span class="chip" style="background:#e3edf7;color:var(--mut)">${q.v}/${q.t}</span>`}</div>`;
  }
  { const allDone = S.q.list.length && S.q.list.every(x => x.done); h += `<div class="row${allDone && !S.q.all ? ' hot' : ''}${S.q.all ? ' done' : ''}"><div class="e">🎁</div><div class="tx"><b>${L.chestT}</b><span>${L.chestS}${S.goldEnd > snow() ? ' (2h 👑)' : ''}</span></div>${S.q.all ? '<span class="chip" style="background:#d6f3dc;color:#1c7a2b">✅</span>' : allDone ? `<button class="btn" data-q="all">${L.claim}</button>` : '<span class="chip" style="background:#e3edf7;color:var(--mut)">🔒</span>'}</div>`; }
  h += `<div class="box"><b style="font-family:var(--disp);font-size:19px">👥 ${L.invT}</b><p class="lead" style="margin:4px 0 8px">${L.invS}</p>
   <div style="display:flex;align-items:center;gap:10px"><div style="flex:1"><span class="lead">${L.invCount}</span><div class="big" style="font-size:26px">${S.ref_n} / ${S.ref_cap}</div></div><button class="btn gold" id="shareBtn">${L.invBtn}</button></div><p class="lead" style="margin:8px 0 0">${L.invPct.replace('{a}', Math.round(S.ref_share * 100)).replace('{b}', Math.round(S.ref_com * 100))}</p>${S.ref_got > 0 ? `<p class="lead" style="margin:4px 0 0"><b>${L.invGot}: $${fm(S.ref_got)}</b></p>` : ''}</div>
   <h2 style="font-size:22px;margin-top:14px">${L.achT}</h2><p class="lead">${L.achS}</p>`;
  for (const d of order) {
    const [e, t, ds] = achInfo(d.id); const done = S.ach.includes(d.id), ok = rd.includes(d.id), pr = achProg(d.id);
    h += `<div class="row${done ? ' done' : ''}${ok ? ' hot' : ''}"><div class="e">${e}</div><div class="tx"><b>${esc(t)}</b><span>${esc(ds)}</span>${done ? '' : `<div class="pg"><i data-id="${d.id}" style="width:${Math.min(100, pr[0] / pr[1] * 100)}%"></i></div>`}<div class="rw">${rewTxt(d)}</div></div>${done ? '<span class="chip" style="background:#d6f3dc;color:#1c7a2b">✅</span>' : ok ? `<button class="btn" data-claim="${d.id}">${L.claim}</button>` : `<span class="chip" style="background:#e3edf7;color:var(--mut)">${Math.min(pr[0], pr[1])}/${pr[1]}</span>`}</div>`;
  }
  h += `<div class="sw"><span>🔊 ${L.snd}</span><button id="sndBtn" class="${sndOn ? 'on' : ''}"></button></div>`;
  const p = $('p-goals'); p.innerHTML = h;
  p.onclick = e => {
    const qb = e.target.closest('[data-q]');
    if (qb) {
      qb.disabled = true;
      call({ act: 'qclaim', id: qb.dataset.q }).then(r => {
        if (r && (r.qclaimed || r.qall)) { S.q = r.q; hap('ok'); snd('win'); const b = qb.getBoundingClientRect(); burst(b.left + b.width / 2, b.top + 10, 14); toast(L.rewarded + ' ' + (r.reward ? '+$' + fm(r.reward) : '⚡ x2')); }
        else call({ act: 'state' });
        renderGoals(true);
      });
      return;
    }
    const c = e.target.closest('[data-claim]');
    if (c) {
      const id = c.dataset.claim; c.disabled = true;
      call({ act: 'claim', id }).then(r => {
        if (r && r.claimed) { S.ach = r.ach; hap('ok'); snd('win'); const b = c.getBoundingClientRect(); burst(b.left + b.width / 2, b.top + 10, 14); toast(L.rewarded + ' ' + (r.reward ? '+$' + fm(r.reward) : '⚡ x2')); }
        else call({ act: 'state' });
        renderGoals(true);
      });
      return;
    }
    if (e.target.id === 'sndBtn') { sndOn = !sndOn; try { localStorage.setItem('ie_snd', sndOn ? '1' : '0'); } catch (x) {} if (sndOn) snd('win'); renderGoals(true); return; }
    if (e.target.id === 'shareBtn') {
      const link = 'https://t.me/Idleestatebot?start=ref_' + S.uid;
      const u = 'https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(L.shareTxt);
      try { if (tgw && tgw.openTelegramLink) tgw.openTelegramLink(u); else window.open(u, '_blank'); } catch (x) { window.open(u, '_blank'); }
    }
  };
}

// ---------- boot
async function boot() {
  if (!initData) { $('load').innerHTML = '<div><div>📱</div>' + L.openTg + '</div>'; return; }
  let r = await call({ act: 'state', first: true });
  if (!r || !r.ok) { $('load').querySelector('div').insertAdjacentHTML('beforeend', '<p style="font-size:14px;color:#5f8571">' + L.err + '</p>'); setTimeout(boot, 2500); return; }
  const showAway = () => {
    if (r.gap > 120 && r.away > 0.05) {
      const bk = S.bank > 0;
      const x2 = r.away_ok && S.shop && S.shop.away2;
      modal(`<div style="font-size:54px">🏠</div><h3>${L.away}</h3><div class="big">+$${fm(r.away)}</div><p>${L.awayS}</p><button class="btn" id="okAway">${L.collect}</button>` + (bk ? `<button class="btn" id="bkAway" style="margin-top:8px">${L.bankT} · +${Math.round(S.bank / 60)} min x2</button>` : '') + (x2 ? `<button class="btn gold" id="x2Away" style="margin-top:8px">⭐ ${S.shop.away2} · ${L.awayX} (+$${fm(r.away)})</button>` : ''));
      if (bk) $('bkAway').onclick = () => { S.bank = 0; hap('ok'); closeModal(); call({ act: 'usebonus' }); };
      $('okAway').onclick = () => { hap('ok'); closeModal(); };
      if (x2) $('x2Away').onclick = () => { closeModal(); buy('away2'); };
    }
  };
  showAway();
}
boot();
})();
</script>
</body>
</html>
