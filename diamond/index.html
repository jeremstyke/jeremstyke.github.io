<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tap the Diamond</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- 25 oct 2026 (23h08, Jeremy): Tap the Diamond is closed. Every player's gems were converted to $BATON on Pass The Baton (1 gem = 2 $BATON).
     The old game is kept in game_closed_backup.html. -->
<style>
:root { --bg: #14102e; --card: #1f1947; --ink: #f3f0ff; --mute: #b3acd9; --gold: #ffd43b; --blue: #2f8dff; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: radial-gradient(circle at 50% 0%, #2c2470, var(--bg) 70%); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.c { width: 100%; max-width: 380px; background: var(--card); border-radius: 24px; padding: 28px 22px 22px; text-align: center; display: flex; flex-direction: column; gap: 12px; }
.e { font-size: 56px; line-height: 1; }
h1 { margin: 0; font-size: 22px; }
p { margin: 0; color: var(--mute); }
a.b { display: block; text-decoration: none; padding: 14px; border-radius: 14px; font-weight: 800; color: #fff; background: var(--blue); }
a.b.g { background: var(--gold); color: #1a1033; }
small { color: var(--mute); }
</style>
</head>
<body>
<div class="c">
  <div class="e">💎</div>
  <h1 id="h"></h1>
  <p id="p"></p>
  <a class="b" id="bt" href="https://t.me/PassTheBatonBot/play?startapp=src_tdclose"></a>
  <a class="b g" id="mc" href="https://t.me/Memecointycoonbot?startapp=src_tdclose"></a>
  <small>by @jeremstyke</small>
</div>
<script>
(function () {
  var tw = window.Telegram && window.Telegram.WebApp;
  try { tw.ready(); tw.expand(); } catch (e) {}
  var lc = String((tw && tw.initDataUnsafe && tw.initDataUnsafe.user && tw.initDataUnsafe.user.language_code) || navigator.language || 'en').toLowerCase();
  var T = {
    en: ['Tap the Diamond is over', 'Thank you for playing! Your 💎 were turned into $BATON (1 💎 = 2 $BATON) on Pass The Baton, my game where you can trade them for USDT.', '🏃 Get my $BATON', '🚀 Play Meme Coin Tycoon'],
    fr: ['Tap the Diamond est terminé', 'Merci d’avoir joué ! Tes 💎 sont devenus des $BATON (1 💎 = 2 $BATON) sur Pass The Baton, mon jeu où tu peux les échanger contre des USDT.', '🏃 Récupérer mes $BATON', '🚀 Jouer à Meme Coin Tycoon'],
    es: ['Tap the Diamond ha terminado', '¡Gracias por jugar! Tus 💎 se convirtieron en $BATON (1 💎 = 2 $BATON) en Pass The Baton, mi juego donde puedes cambiarlos por USDT.', '🏃 Recibir mis $BATON', '🚀 Jugar a Meme Coin Tycoon'],
    pt: ['Tap the Diamond acabou', 'Obrigado por jogar! Seus 💎 viraram $BATON (1 💎 = 2 $BATON) no Pass The Baton, meu jogo onde você pode trocá-los por USDT.', '🏃 Pegar meus $BATON', '🚀 Jogar Meme Coin Tycoon'],
    ru: ['Tap the Diamond закрыт', 'Спасибо за игру! Твои 💎 превратились в $BATON (1 💎 = 2 $BATON) в Pass The Baton, моей игре, где их можно обменять на USDT.', '🏃 Забрать мои $BATON', '🚀 Играть в Meme Coin Tycoon'],
    id: ['Tap the Diamond telah berakhir', 'Terima kasih sudah bermain! 💎 kamu sudah diubah menjadi $BATON (1 💎 = 2 $BATON) di Pass The Baton, gameku tempat kamu bisa menukarnya dengan USDT.', '🏃 Ambil $BATON saya', '🚀 Main Meme Coin Tycoon']
  };
  var k = /^fr/.test(lc) ? 'fr' : /^es/.test(lc) ? 'es' : /^pt/.test(lc) ? 'pt' : /^(ru|uk|be|kk)/.test(lc) ? 'ru' : /^(id|ms)/.test(lc) ? 'id' : 'en';
  var t = T[k];
  document.getElementById('h').textContent = t[0]; document.getElementById('p').textContent = t[1];
  document.getElementById('bt').textContent = t[2]; document.getElementById('mc').textContent = t[3];
  ['bt', 'mc'].forEach(function (id) {
    var a = document.getElementById(id);
    a.onclick = function (e) { if (tw && tw.openTelegramLink) { e.preventDefault(); try { tw.openTelegramLink(a.href); tw.close(); } catch (er) { location.href = a.href; } } };
  });
})();
</script>
</body>
</html>
