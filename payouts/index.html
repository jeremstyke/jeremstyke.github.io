<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payout Proofs · Jeremstyke Games</title>
<meta name="description" content="Every payout sent to players of Jeremstyke Games (Meme Coin Tycoon, Daily Score, Pass The Baton), with the blockchain transaction for each one.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<!-- 24 oct 2026 (Jeremy): public payout proofs of all his apps (asked by Adsgram). Live data: Supabase RPC payout_proofs()
     (no Telegram id or name, a shortened wallet and the Tonviewer transaction). Transactions are matched on the blockchain by payout_tx_fill. -->
<style>
:root{--bg:#f4f6f3;--card:#fff;--fg:#14201a;--mut:#5d6b63;--line:#dfe5e0;--acc:#0a8f5a;--acc2:#0098ea;--chip:#e8f4ee;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0c120f;--card:#131c17;--fg:#e8f1ec;--mut:#8fa197;--line:#24302a;--acc:#3ddc97;--acc2:#4fb8ff;--chip:#17291f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 'Space Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:880px;margin:0 auto;padding-block:32px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.02em}.brand span{color:var(--acc)}
.lang{display:flex;gap:4px}.lang button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:8px;padding:4px 10px;cursor:pointer}.lang button.on{color:var(--fg);border-color:var(--acc)}
h1{font-size:clamp(30px,6vw,44px);line-height:1.1;margin:0;text-wrap:balance}
.lead{color:var(--mut);margin:-8px 0 0;max-width:62ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.st b{display:block;font-size:26px;font-variant-numeric:tabular-nums}.st small{color:var(--mut);font-size:13px}
.payer{background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.payer code{font:13px 'JetBrains Mono',monospace;word-break:break-all}
a{color:var(--acc2);text-decoration:none;font-weight:500}a:hover{text-decoration:underline}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.app{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.app h3{margin:0 0 4px;font-size:17px}.app p{margin:0;color:var(--mut);font-size:14px}
h2{font-size:20px;margin:8px 0 -6px}
.tw{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{text-align:left;font-weight:500;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:10px 14px;border-bottom:1px solid var(--line)}
td{padding:10px 14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.m{font-family:'JetBrains Mono',monospace;font-size:13px}
.pend{color:var(--mut);font-size:13px}
.more{align-self:center;font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:10px 18px;cursor:pointer}
.note{color:var(--mut);font-size:14px;max-width:70ch}
footer{color:var(--mut);font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="w">
  <div class="top"><div class="brand">Jeremstyke <span>Games</span></div><div class="lang"><button data-l="en">EN</button><button data-l="fr">FR</button></div></div>
  <h1 data-t="h1"></h1>
  <p class="lead" data-t="lead"></p>
  <div class="stats" id="stats"></div>
  <div class="payer" id="payer" hidden></div>
  <div class="apps" id="apps"></div>
  <h2 data-t="all"></h2>
  <div class="tw"><table><thead><tr><th data-t="c_date"></th><th data-t="c_app"></th><th data-t="c_amt"></th><th data-t="c_to"></th><th data-t="c_tx"></th></tr></thead><tbody id="rows"></tbody></table></div>
  <button class="more" id="more" hidden></button>
  <p class="note" data-t="note"></p>
  <footer>by <a href="https://t.me/jeremstyke">@jeremstyke</a> · <span data-t="q"></span> <a href="https://t.me/jeremstyke?direct">t.me/jeremstyke</a></footer>
</div>
<script>
const T = {
  en: { h1: 'Payout proofs', lead: 'Every payout sent to the players of my Telegram games, live from our database. Each line links to its transaction on the TON blockchain, so anyone can check it.',
    paid: 'paid to players', n: 'payouts', wallets: 'different wallets', ver: 'checked on the blockchain', payer: 'All payouts are sent from this wallet:', seeall: 'See every outgoing payment on Tonscan ↗',
    all: 'All payouts', c_date: 'Date', c_app: 'App', c_amt: 'Amount', c_to: 'To wallet', c_tx: 'Transaction', view: 'View ↗', pend: 'being checked', more: 'Show more',
    ap: (n, u, f, l) => n + ' payouts · $' + u + ' · from ' + f + ' to ' + l,
    note: 'Wallets are shortened and no player names are shown, to protect privacy. A payout marked "being checked" was just sent: its transaction link appears within a few minutes.',
    q: 'Questions:', err: 'Could not load the data, please refresh.' },
  fr: { h1: 'Preuves de paiement', lead: 'Tous les paiements envoyés aux joueurs de mes jeux Telegram, en direct depuis notre base. Chaque ligne renvoie à sa transaction sur la blockchain TON : tout le monde peut vérifier.',
    paid: 'payés aux joueurs', n: 'paiements', wallets: 'wallets différents', ver: 'vérifiés sur la blockchain', payer: 'Tous les paiements partent de ce wallet :', seeall: 'Voir tous les paiements sortants sur Tonscan ↗',
    all: 'Tous les paiements', c_date: 'Date', c_app: 'Jeu', c_amt: 'Montant', c_to: 'Wallet', c_tx: 'Transaction', view: 'Voir ↗', pend: 'en vérification', more: 'Voir plus',
    ap: (n, u, f, l) => n + ' paiements · ' + u + ' $ · du ' + f + ' au ' + l,
    note: 'Les wallets sont raccourcis et aucun nom de joueur n\'est affiché, pour protéger la vie privée. Un paiement « en vérification » vient d\'être envoyé : le lien de sa transaction apparaît en quelques minutes.',
    q: 'Questions :', err: 'Impossible de charger les données, recharge la page.' }
};
let L = /^fr/i.test(navigator.language || '') ? 'fr' : 'en', D = null, shown = 50;
const $ = (id) => document.getElementById(id);
// 25 oct 2026: Tonscan shows a transaction by its hash in base64url (we store it in hex)
const b64u = (h) => { try { return btoa(String(h).match(/../g).map((x) => String.fromCharCode(parseInt(x, 16))).join('')).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); } catch (e) { return h; } };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const day = (d) => new Date(d).toLocaleDateString(L === 'fr' ? 'fr-FR' : 'en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const tm = (d) => new Date(d).toLocaleString(L === 'fr' ? 'fr-FR' : 'en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const num = (x, d) => Number(x).toLocaleString(L === 'fr' ? 'fr-FR' : 'en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
function render() {
  const t = T[L];
  document.documentElement.lang = L;
  document.querySelectorAll('[data-t]').forEach((e) => { const v = t[e.dataset.t]; if (typeof v === 'string') e.textContent = v; });
  document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.l === L));
  if (!D) return;
  const s = D.total;
  $('stats').innerHTML = [[(L === 'fr' ? num(s.usd, 2) + ' $' : '$' + num(s.usd, 2)), t.paid + (s.ton ? ' (' + num(s.ton, 3) + ' TON)' : '')], [s.n, t.n], [s.wallets, t.wallets], [s.verified + ' / ' + s.n, t.ver]]
    .map(([a, b]) => '<div class="st"><b>' + esc(a) + '</b><small>' + esc(b) + '</small></div>').join('');
  const py = D.payers || [];
  $('payer').hidden = !py.length;
  $('payer').innerHTML = '<div>' + esc(t.payer) + '</div>' + py.map((a) => '<code>' + esc(a) + '</code><a href="https://tonscan.org/address/' + encodeURIComponent(a) + '" target="_blank" rel="noopener">' + esc(t.seeall) + '</a>').join('');
  $('apps').innerHTML = (D.apps || []).map((a) => '<div class="app"><h3>' + esc(a.app) + '</h3><p>' + esc(t.ap(a.n, num(a.usd, 2), day(a.first), day(a.last))) + '</p></div>').join('');
  const rows = (D.rows || []).slice(0, shown);
  $('rows').innerHTML = rows.map((r) => '<tr><td>' + esc(tm(r.at)) + '</td><td>' + esc(r.app) + '</td><td>' + esc(num(r.amt, r.cur === 'TON' ? 3 : 2) + ' ' + r.cur) + ' <span class="pend">($' + esc(num(r.usd, 2)) + ')</span></td><td class="m">' + esc(r.to) + '</td><td>'
    + (r.tx ? '<a href="https://tonscan.org/tx/' + encodeURIComponent(b64u(r.tx)) + '" target="_blank" rel="noopener">' + esc(t.view) + '</a>' : '<span class="pend">' + esc(t.pend) + '</span>') + '</td></tr>').join('');
  $('more').hidden = (D.rows || []).length <= shown; $('more').textContent = t.more;
}
document.querySelectorAll('.lang button').forEach((b) => b.onclick = () => { L = b.dataset.l; render(); });
$('more').onclick = () => { shown += 100; render(); };
render();
fetch('https://txvrlvcxfnylnrpdrxtt.supabase.co/rest/v1/rpc/payout_proofs', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: 'sb_publishable_7aA-njoU5fU2ialO0ExwQQ_REHjAEIe' }, body: '{}' })
  .then((r) => r.json()).then((j) => { D = j; render(); })
  .catch(() => { $('stats').innerHTML = '<div class="st"><small>' + esc(T[L].err) + '</small></div>'; });
</script>
</body>
</html>
