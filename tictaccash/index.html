*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}

#app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-left)) 100px}

.av img{width:100%;height:100%;object-fit:cover}

.coin{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7dffc9,#1fb57a);display:grid;place-items:center;font:800 13px Inter;color:#05301e;box-shadow:0 0 12px rgba(62,240,160,.5)}
.logo{text-align:center;margin:8px 0 4px}
.logo h1{font:700 40px/1 Fredoka,system-ui,sans-serif;margin:0;letter-spacing:.5px}
.logo h1 .x{color:var(--x);text-shadow:0 0 18px rgba(255,77,141,.7)}.logo h1 .o{color:var(--o);text-shadow:0 0 18px rgba(45,226,230,.7)}.logo h1 .c{color:var(--gold);text-shadow:0 0 18px rgba(255,210,74,.6)}
.logo p{margin:6px 0 0;color:var(--mut);font-size:14px}

.live i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.4s infinite}

.radar i{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(45,226,230,.5);animation:ring 2s linear infinite}
.radar i:nth-child(2){animation-delay:.66s}.radar i:nth-child(3){animation-delay:1.33s}

.radar .av{position:absolute;left:50%;top:50%;width:76px;height:76px;transform:translate(-50%,-50%);font-size:28px;box-shadow:0 0 30px rgba(255,77,141,.6)}

.pl{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 6px;border-radius:18px;background:var(--card);border:1px solid var(--line);transition:.25s;min-width:0}

  const cfg = S.cfg || {}; const st = (S.me && S.me.streak) || 0; const mult = st + 1 >= 5 ? cfg.streak5 : st + 1 >= 3 ? cfg.streak3 : 1;
  const ring = (side) => { const on = v.status === 'play' && v.turn === side; const p = on ? Math.max(0, v.left) / (v.mode === 'async' ? 86400 : 15) : 1; return '<svg class="ring" viewBox="0 0 62 62"><circle cx="31" cy="31" r="28" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="4"/><circle cx="31" cy="31" r="28" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-dasharray="' + (176 * p).toFixed(1) + ' 176"/></svg>'; };
  const oppName = v.opp ? (v.opp.ai ? '🤖 ' + L.bot : v.opp.name) : '…';
  const pcard = (side, name, photo, isMe) => '<div class="pl ' + (side === 'X' ? 'px' : 'po') + (v.status === 'play' && v.turn === side ? ' turn' : '') + '"><div class="tm">' + ring(side) + avatar(name, photo) + '</div><div class="nm">' + esc(isMe ? L.you : name) + '</div><div style="width:22px;height:22px">' + (side === 'X' ? X_SVG() : O_SVG()) + '</div></div>';
  $('#app').innerHTML = '<div class="players">' + pcard(me, user.first_name, user.photo_url, true) + '<div class="vs f">VS</div>' + pcard(opp, oppName, v.opp && v.opp.photo, false) + '</div>'
    + '<div class="prize">' + L.prize(usd((cfg.win || 0.002) * mult, 4), mult) + '</div>'
    + '<div class="board">' + b.map((c, i) => '<div class="cell' + (win.includes(i) ? ' win' : '') + (i === old ? ' old' : '') + '" data-c="' + (i + 1) + '">' + (c === 'X' ? X_SVG(before[i] !== 'X') : c === 'O' ? O_SVG(before[i] !== 'O') : '') + '</div>').join('') + '</div>'
    + '<div class="hint" style="color:' + (myTurn ? 'var(--' + (me === 'X' ? 'x' : 'o') + ')' : 'var(--mut)') + '">' + esc(v.status === 'play' ? (myTurn ? L.yourTurn : (v.mode === 'async' ? L.asyncTheir : L.theirTurn)) : '') + '</div>'
    + (v.mode === 'async' && v.status === 'play' ? '<button class="btn ghost f" data-k="aback" style="font-size:14px;padding:10px;max-width:200px;margin:18px auto 0">' + esc(L.back) + '</button>' : '')
    + (v.status === 'play' ? '<button class="btn ghost f" data-k="forfeit" style="font-size:14px;padding:10px;max-width:160px;margin:18px auto 0">' + esc(L.forfeit) + '</button>' : '');
  document.querySelectorAll('.cell').forEach((c) => { c.onclick = () => move(Number(c.dataset.c)); });
  const ab = $('[data-k="aback"]'); if (ab) ab.onclick = async () => { hap(); stopPoll(); G = null; await refresh(); draw(); };
  const ff = $('[data-k="forfeit"]'); if (ff) ff.onclick = async () => { hap('warning'); const r = await api('forfeit', { id: G.id }); render(r); };
  if (v.status === 'done' && !G.shown) { G.shown = true; stopPoll(); setTimeout(() => result(v), 650); }
}
async function move(cell) {
  const v = G && G.v; if (!v || v.status !== 'play' || v.turn !== v.me || v.board[cell - 1] !== '.' || G.busy) return;
  G.busy = true; hap();
  // the move shows at once, the server confirms
  const nb = v.board.split(''); nb[cell - 1] = v.me; render(Object.assign({}, v, { board: nb.join(''), turn: v.me === 'X' ? 'O' : 'X' }));
  const t0 = Date.now();
  const r = await api('move', { id: G.id, cell });
  // 29 oct 2026 (17h33, Jeremy): the bot answered at the same time as the player; it now "thinks" 0.7 to 1.3 s
  if (r && r.ok && v.mode === 'ai' && r.winner !== v.me) { const w = 1300 + Math.random() * 1200 - (Date.now() - t0);  /* 29 oct 2026 (23h52, Jeremy): the bot thinks 1.3 to 2.5 s */ if (w > 0) await new Promise((ok) => setTimeout(ok, w)); }
  G.busy = false; if (r && r.ok && G && G.v) render(r);
}
function waitFriend(v) {
  const link = 'https://t.me/' + BOT + '?startapp=g' + v.code;
  $('#app').innerHTML = '<div class="radar"><i></i><i></i><i></i>' + avatar(user.first_name, user.photo_url) + '</div><div class="center"><div class="h" style="font-size:20px">' + esc(L.waitFriend) + '</div><div class="copy" data-copy="' + esc(link) + '" style="margin:14px 0">🔗 ' + esc(link) + '</div>'
    + '<button class="btn play f" data-k="sharech" style="animation:none">' + esc(L.share) + '</button><button class="btn ghost f" data-k="leave" style="font-size:15px">' + esc(L.cancel) + '</button></div>';
  $('[data-copy]').onclick = () => copy(link);
  $('[data-k="sharech"]').onclick = () => openTg('https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(L.shareT));
  $('[data-k="leave"]').onclick = () => { stopPoll(); G = null; load(); };
}
function confetti(emojis) {
  for (let i = 0; i < 28; i++) { const s = document.createElement('div'); s.className = 'conf'; s.textContent = emojis[i % emojis.length]; s.style.left = Math.random() * 100 + 'vw'; s.style.animationDuration = 1.8 + Math.random() * 1.6 + 's'; s.style.animationDelay = Math.random() * .6 + 's'; document.body.appendChild(s); setTimeout(() => s.remove(), 4200); }
}
function result(v) {
  const won = v.winner === v.me, dr = v.winner === 'D';
  const pay = v.pay || {}; const amt = Number(pay.usd || 0);
  hap(won ? 'success' : dr ? 'warning' : 'error');
  if (won) confetti(['💸', '❌', '⭕', '✨', '🪙']);
  const d = document.createElement('div'); d.className = 'over';
  d.innerHTML = '<div class="res"><div style="font-size:56px">' + (won ? '🏆' : dr ? '🤝' : '😵') + '</div><div class="big f" style="color:' + (won ? 'var(--gold)' : dr ? 'var(--o)' : 'var(--x)') + '">' + esc(won ? L.win : dr ? L.drawT : L.lose) + '</div>'
    + (amt > 0 ? '<div class="earn f"><span class="coin">$</span>+<span id="cnt">0</span></div>' + (pay.mult > 1 ? '<div class="mut sm">🔥 x' + pay.mult + '</div>' : '') : (pay.why ? '<div class="mut sm" style="margin:10px 0">' + esc(L.noPay[pay.why] || '') + '</div>' : ''))
    + (amt > 0 ? '<button class="btn gold f" id="dbl" style="font-size:16px">' + esc(L.dbl(usd(amt, 4))) + '</button>' : '')
    + '<button class="btn play f" id="again">' + esc(L.again) + '</button><button class="btn ghost f" id="home" style="font-size:15px">' + esc(L.home) + '</button></div>';
  document.body.appendChild(d);
  // 29 oct 2026 (17h27, Jeremy): a rewarded video doubles the game's earnings (once per game); it replaces the next interstitial
  const db = d.querySelector('#dbl');
  if (db) db.onclick = async () => {
    hap(); db.disabled = true;
    const seen = await rewarded();
    if (!seen) { db.disabled = false; return toast(L.noVid); }
    skipAd = true;
    const r = await api('double', { id: v.id });
    if (r && r.ok) { hap('success'); confetti(['💸', '🪙', '✨']); const el = d.querySelector('#cnt'); if (el) el.textContent = usd(r.total, 4) + ' $'; db.remove(); toast(L.dblOk); } else db.disabled = false;
  };
  if (amt > 0) { const t0 = performance.now(); const step = (t) => { const p = Math.min(1, (t - t0) / 900); const el = d.querySelector('#cnt'); if (el) el.textContent = usd(amt * p, 4) + ' $'; if (p < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); }
  games++; const mode = v.mode;
  d.querySelector('#again').onclick = async () => { d.remove(); G = null; await maybeAd(mode); await refresh(); search(); };
  d.querySelector('#home').onclick = async () => { d.remove(); G = null; await maybeAd(mode); TAB = 'home'; load(); };
}
async function refresh() { const r = await api('state', { jfp: JFP }); if (r && r.ok) S = r; }
// 29 oct 2026 (17h21, Jeremy): no daily cap any more, so an ad after every game against the bot (ad_every_ai), and every ad_every games against players (Monetag)
let pvpGames = 0, skipAd = false;
async function loadMtg() {
  const fn = 'show_' + MTG;
  await (window.__mtgL || (window.__mtgL = new Promise((ok, ko) => { if (typeof window[fn] === 'function') return ok(); const s = document.createElement('script'); s.src = 'https://libtl.com/sdk.js'; s.setAttribute('data-zone', String(MTG)); s.setAttribute('data-sdk', fn); s.onerror = () => { window.__mtgL = null; ko(new Error('load')); }; document.head.appendChild(s); const t0 = Date.now(), iv = setInterval(() => { if (typeof window[fn] === 'function') { clearInterval(iv); ok(); } else if (Date.now() - t0 > 12000) { clearInterval(iv); window.__mtgL = null; ko(new Error('timeout')); } }, 100); }))); /* 29 oct 2026: the SDK's onload fires before show_<zone> exists, wait for the function itself */
  return window[fn];
}
// a rewarded video (Monetag rewarded interstitial): true when it was watched to the end
async function rewarded() {
  try { const f = await loadMtg(); if (!f) return false; await f({ ymid: String(user.id || '') }); return true; } catch (e) { return false; }
}
async function maybeAd(mode) {
  if (skipAd) { skipAd = false; return; }
  const c = (S && S.cfg) || {};
  if (mode === 'ai') { if (Number(c.ad_every_ai || 1) > 1 && games % Number(c.ad_every_ai) !== 0) return; }
  else { pvpGames++; if (pvpGames % Number(c.ad_every || 2) !== 0) return; }
  try {
    const fn = 'show_' + MTG;
    await (window.__mtgL || (window.__mtgL = new Promise((ok, ko) => { if (typeof window[fn] === 'function') return ok(); const s = document.createElement('script'); s.src = 'https://libtl.com/sdk.js'; s.setAttribute('data-zone', String(MTG)); s.setAttribute('data-sdk', fn); s.onerror = () => { window.__mtgL = null; ko(new Error('load')); }; document.head.appendChild(s); const t0 = Date.now(), iv = setInterval(() => { if (typeof window[fn] === 'function') { clearInterval(iv); ok(); } else if (Date.now() - t0 > 12000) { clearInterval(iv); window.__mtgL = null; ko(new Error('timeout')); } }, 100); }))); /* 29 oct 2026: the SDK's onload fires before show_<zone> exists, wait for the function itself */
    if (window[fn]) await Promise.race([window[fn]({ ymid: String(user.id || '') }), new Promise((ok) => setTimeout(ok, 30000))]);
  } catch (e) {}
}

function bind() {
  document.querySelectorAll('[data-copy]').forEach((d) => { d.onclick = () => copy(d.dataset.copy); });
  document.querySelectorAll('[data-var]').forEach((b) => { b.onclick = () => { hap(); VAR = b.dataset.var; try { localStorage.setItem('ttc_var', VAR); } catch (e) {} document.querySelectorAll('[data-var]').forEach((x) => x.classList.toggle('on', x === b)); }; });
  document.querySelectorAll('[data-k]').forEach((b) => { b.onclick = async () => {
    const k = b.dataset.k;
    if (k === 'faq') return faq();
    if (k === 'play') return search();
    if (k === 'async') return asyncFind();
    if (k === 'ag') { hap(); return openGame(Number(b.dataset.id)); }
    if (k === 'friend') { hap(); const r = await api('friend', { variant: VAR }); if (r && r.ok) openGame(r.game); return; }
    if (k === 'chest') { b.disabled = true; const r = await api('chest'); if (r && r.ok) { hap('success'); confetti(['🪙', '✨', '🎁']); toast(L.chestWin(usd(r.usd, 4))); await refresh(); draw(); } else b.disabled = false; return; }
    if (k === 'shareref') { const link = 'https://t.me/' + BOT + '?start=r' + S.uid; return openTg('https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(L.refT)); }
    if (k === 'savewal') { hap(); const r = await api('wallet', { wallet: $('#wal').value.trim() }); if (r && r.ok) { toast(L.saved); await refresh(); draw(); } else toast(L.err[r && r.error] || 'Error'); return; }
    if (k === 'withdraw') { hap(); b.disabled = true; const r = await api('withdraw'); if (r && r.ok) { hap('success'); toast('✅ ' + usd(r.usd) + ' $'); await refresh(); draw(); } else { b.disabled = false; toast(L.err[r && r.error] || 'Error'); } return; }
  }; });
}
document.querySelectorAll('nav button').forEach((b) => { b.onclick = () => { if (!S) return; hap(); TAB = b.dataset.t; draw(); }; });
load();
})();
