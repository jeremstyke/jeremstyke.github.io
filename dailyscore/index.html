<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Score has moved to dailyscoreapp.com</title>
<link rel="canonical" href="https://dailyscoreapp.com/">
<meta name="robots" content="noindex">
<script>
// Daily Score moved: keep the player signed in and keep invite links (league, referral, account link)
(function () {
  var p = new URLSearchParams(location.hash.slice(1));
  try {
    var t = localStorage.getItem('ds_token'); if (t && !p.get('t')) p.set('t', t);
    var lg = JSON.parse(localStorage.getItem('ds_lg') || 'null'); if (lg && lg.c && !p.get('lg')) { p.set('lg', lg.c); if (lg.r) p.set('r', lg.r); }
    var rf = localStorage.getItem('ds_ref'); if (rf && !p.get('ref')) p.set('ref', rf);
    var lk = localStorage.getItem('ds_lnk'); if (lk && !p.get('lnk')) p.set('lnk', lk);
  } catch (e) {}
  var h = p.toString();
  location.replace('https://dailyscoreapp.com/' + location.search + (h ? '#' + h : ''));
})();
</script>
<meta http-equiv="refresh" content="3;url=https://dailyscoreapp.com/">
</head><body style="background:#0b1a12;color:#f2f7f3;font-family:system-ui,sans-serif;text-align:center;padding:60px 20px">
<p>⚽ Daily Score has moved to <a style="color:#c6ff3d" href="https://dailyscoreapp.com/">dailyscoreapp.com</a></p>
</body></html>
