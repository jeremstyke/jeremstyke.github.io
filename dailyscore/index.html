    + `<div class="label" style="margin-top:12px">${esc(t('topScores'))}</div>` + d.top.map((x) => `<div class="bar"><div><b>${esc(x.score)}</b></div><div class="pct">${x.pct}%</div></div>`).join('')
    : `<p class="muted">${esc(t('nobody'))}</p>`;
  const ai = d.ai ? `<div class="ai"><div class="label" style="margin-bottom:4px">🤖 ${esc(t('aiPick'))}</div><div class="sc">${esc(st.match.home)} ${d.ai.home} - ${d.ai.away} ${esc(st.match.away)}</div><div style="font-size:14px;margin-top:4px">${esc(d.ai.reason)}</div></div>` : '';
  return `<div class="card"><div class="label">📊 ${esc(t('trendNote'))} · ${d.n || 0}</div>${bars}${ai}</div>`;
}
function lastCard() {
  const l = st.last;
  if (!l || l.home_goals == null) return '';
  return `<div class="card"><div class="label">${esc(t('yesterday'))}</div><div class="last"><span>${esc(l.home)} <b>${l.home_goals} - ${l.away_goals}</b> ${esc(l.away)}</span><span class="muted">${l.pick ? l.pick.home + '-' + l.pick.away + (l.pick.points != null ? ' · +' + l.pick.points : '') : esc(t('noPick'))}</span></div></div>`;
}
function rankingCard() {
  const r = rk || st.ranking, c = st.me.country;
  const per = [['day', 'pDay'], ['week', 'pWeek'], ['month', 'pMonth'], ['all', 'pAll']].map(([k, s]) => `<div class="tab ${period === k ? 'on' : ''}" data-period="${k}">${esc(t(s))}</div>`).join('');
  const rows = r.top && r.top.length ? r.top.map((x) => `<div class="row ${x.me ? 'me' : ''}"><div class="rk">${x.rank}</div><div>${provIcon(x.provider)} ${flag(x.country)} ${esc(x.name)}${badge(x.refs)}</div><div class="pts">${x.points} ${esc(t('pts'))}</div></div>`).join('') : `<p class="muted center">${esc(t('empty'))}</p>`;
  return `<div class="card"><div class="label">🏆 ${esc(t('ranking'))}${r.players ? ' · ' + r.players + ' ' + esc(t('players')) : ''}</div>
    <div class="tabs">${per}</div>
    <div class="tabs"><div class="tab ${tab === 'world' ? 'on' : ''}" data-tab="world">${esc(t('world'))}</div><div class="tab ${tab === 'country' ? 'on' : ''}" data-tab="country">${flag(c)} ${esc(countryName(c))}</div></div>
    <div id="rkl">${rows}</div>
    ${r.me ? `<div class="myrank">${esc(t('yourRank'))} : #${r.me.rank} · ${r.me.points} ${esc(t('pts'))}</div>` : ''}</div>`;
}
async function loadRanking() {
  try { rk = await api('ranking', { period, scope: tab }); render(); } catch (e) { toast(t('err')); }
}
function badgesCard() {
  const got = new Set(st.me.badges || []);
  return `<div class="card"><div class="label">🏅 ${esc(DSB_CARD[lang] || DSB_CARD.en)} · ${got.size}/${DSB.length}</div>
    <div class="bgrid">${DSB.map((b) => `<div class="bdg ${got.has(b[0]) ? 'on' : 'off'}" data-b="${b[0]}">${b[1]}</div>`).join('')}</div></div>`;
}
let leagueView = null, durSel = '7d';
const fmtDay = (d) => { try { return new Date(d + 'T12:00:00Z').toLocaleDateString(lang, { day: 'numeric', month: 'short' }); } catch (e) { return d; } };
const todayStr = () => new Date().toISOString().slice(0, 10);
function leaguesCard() {
  const ls = st.leagues || [];
  const rows = ls.length ? ls.map((x) => `<div class="lrow" data-lg="${x.id}"><div><b>${esc(x.name)}</b><div class="note" style="margin:2px 0 0;text-align:left">${x.members} ${esc(t('lgMembers'))} · ${x.end < todayStr() ? esc(t('lgEnded')) : esc(t('lgUntil')) + ' ' + esc(fmtDay(x.end))}</div></div><div class="pts">${x.rank ? '#' + x.rank : ''} ›</div></div>`).join('') : `<p class="muted" style="margin:0 0 4px">${esc(t('lgNone'))}</p>`;
  return `<div class="card"><div class="label">👥 ${esc(t('lgT'))}</div>${rows}
    <button class="btn go" id="lgc">➕ ${esc(t('lgCreate'))}</button><button class="btn ghost" id="lgj" style="margin-top:8px">🔑 ${esc(t('lgJoin'))}</button></div>`;
}
const backBar = () => `<div class="top"><div class="chip" id="bk" style="cursor:pointer">‹ ${esc(t('back'))}</div><div class="brand" style="font-size:18px">Daily <b>Score</b></div></div>`;
function createView() {
  document.getElementById('app').innerHTML = backBar() + `<div class="card"><div class="label">➕ ${esc(t('lgCreate'))}</div>
    <div class="label">${esc(t('lgName'))}</div><input class="inp" id="lgn" maxlength="30" placeholder="${esc(((st.me.name || 'Daily').split(' ')[0]).slice(0, 20))} FC">
    <div class="label">${esc(t('lgDur'))}</div>
    <div class="durs">${[['7d', 'd7'], ['30d', 'd30'], ['month', 'dMonth'], ['1y', 'd1y']].map(([k, s]) => `<div class="tab ${durSel === k ? 'on' : ''}" data-dur="${k}">${esc(t(s))}</div>`).join('')}</div>
    <button class="btn go" id="lgok">${esc(t('lgGo'))}</button></div>`;
  document.getElementById('bk').onclick = render;
  document.querySelectorAll('[data-dur]').forEach((x) => x.onclick = () => { durSel = x.dataset.dur; const v = document.getElementById('lgn').value; createView(); document.getElementById('lgn').value = v; });
  document.getElementById('lgok').onclick = async () => {
    haptic('medium');
    try { const el = document.getElementById('lgn'); const r = await api('league_create', { name: el.value.trim() || el.placeholder, dur: durSel }); st = await api('state'); openLeague(r.id); }
    catch (e) { toast(t('e_' + e.code) !== 'e_' + e.code ? t('e_' + e.code) : t('err')); }
  };
}
function joinView() {
  document.getElementById('app').innerHTML = backBar() + `<div class="card"><div class="label">🔑 ${esc(t('lgJoin'))}</div>
    <input class="inp" id="lgcode" maxlength="6" placeholder="ABC123" style="text-transform:uppercase;letter-spacing:4px;text-align:center;font-size:22px">
    <button class="btn go" id="lgjok">${esc(t('lgJoinGo'))}</button></div>`;
  document.getElementById('bk').onclick = render;
  document.getElementById('lgjok').onclick = () => doJoin(document.getElementById('lgcode').value, null);
}
async function doJoin(code, ref) {
  haptic('medium');
  try { const r = await api('league_join', { code, ref }); toast(t('lgJoined')); st = await api('state'); openLeague(r.id); }
  catch (e) { toast(t('e_' + e.code) !== 'e_' + e.code ? t('e_' + e.code) : t('err')); }
}
async function openLeague(id) {
  try { leagueView = await api('league_view', { id }); } catch (e) { toast(t('err')); return render(); }
  const L = leagueView.league, ended = L.end < todayStr();
  const rows = (leagueView.top || []).map((x) => `<div class="row ${x.me ? 'me' : ''}"><div class="rk">${x.rank}</div><div>${provIcon(x.provider)} ${flag(x.country)} ${esc(x.name)}${badge(x.refs)}</div><div class="pts">${x.points} ${esc(t('pts'))}</div></div>`).join('');
  document.getElementById('app').innerHTML = backBar() + `<div class="card"><div class="label">👥 ${esc(L.name)}</div>
    <div class="note" style="margin:0 0 10px">${esc(fmtDay(L.start))} → ${esc(fmtDay(L.end))}${ended ? ' · ' + esc(t('lgEnded')) : ''} · ${leagueView.players} ${esc(t('lgMembers'))}</div>
    ${rows}</div>
    ${ended ? '' : `<div class="card center"><div class="label" style="justify-content:center">${esc(t('lgCode'))}</div><div class="codebox">${esc(L.code)}</div>
    <button class="btn go" id="lgi">📣 ${esc(t('lgInvite'))}</button></div>`}
    <button class="btn ghost" id="lgl">${esc(t('lgLeave'))}</button>`;
  document.getElementById('bk').onclick = () => { leagueView = null; render(); };
  const inv = document.getElementById('lgi');
  if (inv) inv.onclick = () => {
    haptic('medium'); api('ev', { k: 'league_invite' }).catch(() => {});
    const link = IN_TG ? 'https://t.me/' + BOT + '?start=lg_' + L.code + '_' + st.me.id : 'https://jeremstyke.github.io/dailyscore/#lg=' + L.code + '&r=' + st.me.id;
    openLink('https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(t('lgShare').replace('{n}', L.name).replace('{c}', L.code)));
  };
  document.getElementById('lgl').onclick = async () => { haptic('medium'); try { await api('league_leave', { id: L.id }); st = await api('state'); leagueView = null; render(); } catch (e) { toast(t('err')); } };
}
function inviteCard() {
  const n = st.me.refs || 0;
  const next = [...BADGES].reverse().find(([k]) => n < k);
  const tpl = (s, v) => s.replace('{n}', v.n).replace('{b}', v.b).replace('{k}', v.k);
  return `<div class="card"><div class="label">🤝 ${esc(t('invT'))}${badge(n)}</div>
    <p style="margin:0 0 8px;font-size:14px">${esc(t('invText'))}</p>
    <div class="note" style="margin:0">${esc(tpl(t('invCount'), { n }))}${next ? ' · ' + esc(tpl(t('invNext'), { b: next[1], k: next[0] })) : ''}</div>
    <button class="btn go" id="invite">📣 ${esc(t('invBtn'))}</button></div>`;
}
function render() {
  if (!st.me.country) return setupView();
  lang = S[st.me.lang] ? st.me.lang : 'en'; applyLang();
  if (st.pick && !editing) { home = st.pick.home; away = st.pick.away; }
  document.getElementById('app').innerHTML = `
  <div class="top"><div class="brand">Daily <b>Score</b><span class="beta">BETA</span></div>
    <div class="chips"><div class="chip fire">🔥 ${st.me.streak || 0}</div><div class="chip">🏆 ${st.me.points}</div><div class="chip" id="set">⚙️</div></div></div>
  ${matchCard()}${trendCard()}${streakCard()}${leaguesCard()}${inviteCard()}${badgesCard()}${lastCard()}${rankingCard()}`;
  bind();
}
function bind() {
  document.querySelectorAll('[data-s]').forEach((b) => b.onclick = () => {
    haptic(); const s = b.dataset.s;
    if (s === 'h+') home = Math.min(20, home + 1); if (s === 'h-') home = Math.max(0, home - 1);
    if (s === 'a+') away = Math.min(20, away + 1); if (s === 'a-') away = Math.max(0, away - 1);
    document.getElementById('gh').textContent = home; document.getElementById('ga').textContent = away;
  });
  const lock = document.getElementById('lock');
  if (lock) lock.onclick = async () => {
    lock.disabled = true; haptic('medium');
    try { st = await api('pick', { home, away }); editing = false; try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {} toast(t('saved')); render(); }
    catch (e) { toast(e.code === 'started' ? t('errStarted') : t('err')); lock.disabled = false; if (e.code === 'started') load(); }
  };
  const edit = document.getElementById('edit'); if (edit) edit.onclick = () => { editing = true; render(); };
  const share = document.getElementById('share'); if (share) share.onclick = () => { api('ev', { k: 'share' }).catch(() => {}); openLink('https://t.me/share/url?url=' + encodeURIComponent('https://t.me/' + BOT + '?start=src_share') + '&text=' + encodeURIComponent(t('shareText'))); };
  const tr = document.getElementById('trend'); if (tr) tr.onclick = buyTrend;
  document.querySelectorAll('[data-lg]').forEach((x) => x.onclick = () => { haptic(); openLeague(Number(x.dataset.lg)); });
  const lgc = document.getElementById('lgc'); if (lgc) lgc.onclick = () => { haptic(); createView(); };
  const lgj = document.getElementById('lgj'); if (lgj) lgj.onclick = () => { haptic(); joinView(); };
  document.querySelectorAll('[data-b]').forEach((x) => x.onclick = () => { haptic(); const b = DSB.find((y) => y[0] === x.dataset.b); toast((x.classList.contains('on') ? '✅ ' : '🔒 ') + b[1] + ' ' + bLabel(b)); });
  const inv = document.getElementById('invite'); if (inv) inv.onclick = () => { haptic('medium'); api('ev', { k: 'invite' }).catch(() => {}); openLink('https://t.me/share/url?url=' + encodeURIComponent('https://t.me/' + BOT + '?start=ref_' + st.me.id) + '&text=' + encodeURIComponent(t('invShare'))); };
  document.querySelectorAll('[data-tab]').forEach((x) => x.onclick = () => { haptic(); tab = x.dataset.tab; loadRanking(); });
  document.querySelectorAll('[data-period]').forEach((x) => x.onclick = () => { haptic(); period = x.dataset.period; loadRanking(); });
  const set = document.getElementById('set'); if (set) set.onclick = () => { setupView(); };
}
async function loadTrend() { try { trendData = await api('trend'); render(); return true; } catch (e) { return false; } }
async function buyTrend() {
  haptic('medium');
  if (st.trendPaid && await loadTrend()) return;
  if (!IN_TG && !(st.me.freeTrends > 0)) { if (st.me.provider === 'gh') return startLink(); toast(t('buyOnTg')); openLink('https://t.me/' + BOT + '?start=src_web_trend'); return; }
  if (st.me.freeTrends > 0) { try { trendData = await api('trend_free'); st.me.freeTrends--; st.trendPaid = true; render(); return; } catch (e) {} }
  try {
    const r = await api('trend_invoice');
    if (!r.link) return toast(t('err'));
    tg.openInvoice(r.link, async (status) => {
      if (status !== 'paid') return;
      for (let i = 0; i < 6; i++) { if (await loadTrend()) return; await new Promise((ok) => setTimeout(ok, 1200)); }
      toast(t('err'));
    });
  } catch (e) { toast(t('err')); }
}
async function load() {
  if (!IN_TG && !TOKEN) return loginView();
  try {
    st = await api('state'); rk = null; if (st.trendPaid) loadTrend(); render(); if (period !== 'week' || tab !== 'world') loadRanking();
    let pend = null; try { pend = JSON.parse(localStorage.getItem('ds_lg') || 'null'); localStorage.removeItem('ds_lg'); } catch (e) {}
    if (pend && pend.c && st.me.country) doJoin(pend.c, pend.r);
  }
  catch (e) { document.getElementById('app').innerHTML = `<div class="card center"><p>${esc(t('err'))}</p><button class="btn go" onclick="load()">↻</button></div>`; }
}
setInterval(() => { const el = document.getElementById('cd'); if (el && st && st.match) { const ms = new Date(st.match.kickoff).getTime() - Date.now(); if (ms <= 0) load(); else el.textContent = countdown(ms); } }, 30000);
load();
if (!IN_TG) document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && TOKEN && st && st.me && st.me.provider === 'gh') load(); });
</script>
</body>
</html>
