<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Wallet Radar</title>
<!-- 17 oct 2026: Wallet Radar (@getwalletradarbot), by @jeremstyke. Connects a TON wallet in read-only mode (TON Connect), then hands the
     address to the bot. Opened from the bot's "Connect my wallet" button. Nothing here can move funds. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
<style>
:root{--bg:#080e1e;--card:#101a33;--cy:#2ee6d6;--tx:#eaf0fa;--mu:#8ea0bd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center}
img{width:120px;height:120px;border-radius:28px;box-shadow:0 0 50px rgba(46,230,214,.25)}
h1{margin:18px 0 6px;font-size:26px}p{margin:0 0 20px;color:var(--mu);font-size:15px;line-height:1.45;max-width:340px}
button{width:100%;max-width:340px;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
.pri{background:var(--cy);color:#06222a}.sec{background:var(--card);color:var(--tx)}
#msg{min-height:24px;margin-top:14px;font-weight:600;max-width:340px}
.lock{margin-top:22px;font-size:13px;color:var(--mu)}small{display:block;margin-top:26px;color:#5d6f8f;font-size:12px}
</style></head><body>
<img src="icon.png" alt="">
<h1>Wallet Radar</h1>
<p id="sub"></p>
<button class="pri" id="go"></button>
<button class="sec" id="back"></button>
<div id="msg"></div>
<div class="lock" id="lock"></div>
<small>by @jeremstyke</small>
<script>
const API = 'https://txvrlvcxfnylnrpdrxtt.supabase.co/functions/v1/wallet-radar';
const tw = window.Telegram && Telegram.WebApp; try { tw.ready(); tw.expand(); } catch (e) {}
const lc = String((tw && tw.initDataUnsafe && tw.initDataUnsafe.user && tw.initDataUnsafe.user.language_code) || navigator.language || 'en');
const L = /^fr/.test(lc) ? 'fr' : /^(id|ms)/.test(lc) ? 'id' : 'en';
const T = {
  en: { sub: 'Connect your TON wallet to follow it in the bot.', go: '🔗 Connect a wallet', more: '🔗 Connect another wallet', back: '↩️ Back to the bot', lock: '🔒 Read-only: Wallet Radar can never move your funds.', ok: '✅ Wallet added! Check the bot.', dup: 'ℹ️ This wallet is already in your list.', max: 'You reached 20 wallets.', err: 'Problem, please try again.', tg: 'Open this page from the bot.' },
  fr: { sub: 'Connecte ton portefeuille TON pour le suivre dans le bot.', go: '🔗 Connecter un portefeuille', more: '🔗 Connecter un autre portefeuille', back: '↩️ Retour au bot', lock: '🔒 Lecture seule : Wallet Radar ne peut jamais toucher à tes fonds.', ok: '✅ Portefeuille ajouté ! Regarde le bot.', dup: 'ℹ️ Ce portefeuille est déjà dans ta liste.', max: 'Tu as atteint 20 portefeuilles.', err: 'Problème, réessaie.', tg: 'Ouvre cette page depuis le bot.' },
  id: { sub: 'Hubungkan dompet TON-mu untuk memantaunya di bot.', go: '🔗 Hubungkan dompet', more: '🔗 Hubungkan dompet lain', back: '↩️ Kembali ke bot', lock: '🔒 Hanya baca: Wallet Radar tidak pernah bisa memindahkan danamu.', ok: '✅ Dompet ditambahkan! Cek bot.', dup: 'ℹ️ Dompet ini sudah ada di daftarmu.', max: 'Kamu sudah mencapai 20 dompet.', err: 'Ada masalah, coba lagi.', tg: 'Buka halaman ini dari bot.' },
}[L];
const $ = (i) => document.getElementById(i);
$('sub').textContent = T.sub; $('go').textContent = T.go; $('back').textContent = T.back; $('lock').textContent = T.lock;
$('back').onclick = () => { try { tw.close(); } catch (e) { location.href = 'https://t.me/getwalletradarbot'; } };
let busy = false;
const ui = new TON_CONNECT_UI.TonConnectUI({ manifestUrl: 'https://jeremstyke.github.io/wr/tonconnect-manifest.json' });
async function send(addr) {
  if (busy) return; busy = true; $('msg').textContent = '⏳';
  let r = null;
  try { r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'connect', initData: (tw && tw.initData) || '', addr }) }).then((x) => x.json()); } catch (e) {}
  $('msg').textContent = !(tw && tw.initData) ? T.tg : r && r.ok ? (r.dup ? T.dup : T.ok) : r && r.error === 'max' ? T.max : T.err;
  if (r && r.ok) { try { tw.HapticFeedback.notificationOccurred('success'); } catch (e) {} $('go').textContent = T.more; }
  try { await ui.disconnect(); } catch (e) {} // free the connection, so another wallet can be connected next
  busy = false;
}
ui.onStatusChange((w) => { if (w && w.account && w.account.address) send(w.account.address); });
$('go').onclick = async () => { $('msg').textContent = ''; try { if (ui.connected) await ui.disconnect(); } catch (e) {} try { await ui.openModal(); } catch (e) { $('msg').textContent = T.err; } };
</script>
</body></html>
