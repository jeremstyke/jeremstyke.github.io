<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MCT Duel</title>
<meta name="theme-color" content="#0D0B1A">
<!-- 22 oct 2026 (Jeremy): MCT Duel is closed (Meme Coin Tycoon refocused on buying, selling, coins and blockchains).
     Players who still arrive here (old notification, old link) are sent back to Meme Coin Tycoon.
     The old app is kept in old.html. by @jeremstyke -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0D0B1A;--card:#1a1433;--fg:#fff;--mute:#a79fc9;--gold:#ffd43b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.ic{font-size:56px;line-height:1}
h1{margin:0;font-size:24px;text-wrap:balance}
p{margin:0;max-width:340px;color:var(--mute);font-size:15px;line-height:1.45}
button{margin-top:8px;width:100%;max-width:340px;padding:15px;border:0;border-radius:16px;background:var(--gold);color:#1a0638;font-weight:800;font-size:17px;cursor:pointer}
small{color:var(--mute);font-size:12px;opacity:.7}
</style>
</head>
<body>
<main>
  <div class="ic">⚔️</div>
  <h1 id="h"></h1>
  <p id="p"></p>
  <button id="go" type="button"></button>
  <small>by @jeremstyke</small>
</main>
<script>
(function () {
  var TX = {
    en: ['Duels are over', 'MCT Duel is closed. If you had a duel waiting, your stake was given back. The fun continues in Meme Coin Tycoon: buy, sell and create your own coins.', '🚀 Play Meme Coin Tycoon'],
    fr: ['Les duels, c\'est fini', 'MCT Duel est fermé. Si tu avais un duel en attente, ta mise t\'a été rendue. Le jeu continue dans Meme Coin Tycoon : achète, vends et crée tes propres coins.', '🚀 Jouer à Meme Coin Tycoon'],
    es: ['Los duelos se acabaron', 'MCT Duel está cerrado. Si tenías un duelo pendiente, te devolvimos tu apuesta. La diversión sigue en Meme Coin Tycoon: compra, vende y crea tus propias monedas.', '🚀 Jugar a Meme Coin Tycoon'],
    id: ['Duel sudah berakhir', 'MCT Duel ditutup. Jika kamu punya duel yang menunggu, taruhanmu sudah dikembalikan. Keseruan berlanjut di Meme Coin Tycoon: beli, jual, dan buat koinmu sendiri.', '🚀 Main Meme Coin Tycoon'],
    ru: ['Дуэли закончились', 'MCT Duel закрыт. Если у тебя была дуэль в ожидании, ставка возвращена. Игра продолжается в Meme Coin Tycoon: покупай, продавай и создавай свои монеты.', '🚀 Играть в Meme Coin Tycoon'],
    ar: ['انتهت المبارزات', 'تم إغلاق MCT Duel. إذا كانت لديك مبارزة معلّقة، فقد أُعيد إليك رهانك. المتعة مستمرة في Meme Coin Tycoon: اشترِ وبِع وأنشئ عملاتك الخاصة.', '🚀 العب Meme Coin Tycoon'],
    fa: ['دوئل‌ها تمام شد', 'MCT Duel بسته شد. اگر دوئلی در انتظار داشتی، شرطت برگردانده شد. بازی در Meme Coin Tycoon ادامه دارد: بخر، بفروش و کوین خودت را بساز.', '🚀 بازی Meme Coin Tycoon']
  };
  var tw = window.Telegram && Telegram.WebApp;
  try { tw.ready(); tw.expand(); tw.setHeaderColor('#0D0B1A'); tw.setBackgroundColor('#0D0B1A'); } catch (e) {}
  var c = '';
  try { c = String((tw && tw.initDataUnsafe && tw.initDataUnsafe.user && tw.initDataUnsafe.user.language_code) || navigator.language || 'en').slice(0, 2).toLowerCase(); } catch (e) {}
  if (c === 'uk' || c === 'be' || c === 'kk') c = 'ru';
  if (c === 'ms') c = 'id';
  var L = TX[c] || TX.en;
  document.documentElement.lang = TX[c] ? c : 'en';
  if (c === 'ar' || c === 'fa') document.documentElement.dir = 'rtl';
  document.getElementById('h').textContent = L[0];
  document.getElementById('p').textContent = L[1];
  var b = document.getElementById('go'); b.textContent = L[2];
  var URL = 'https://t.me/Memecointycoonbot?startapp=src_duelend';
  b.onclick = function () {
    try { tw.HapticFeedback.impactOccurred('light'); } catch (e) {}
    try { tw.openTelegramLink(URL); setTimeout(function () { try { tw.close(); } catch (e) {} }, 400); } catch (e) { location.href = URL; }
  };
})();
</script>
</body>
</html>
