<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MCT Duel - Pump or Dump duels on Telegram</title>
<meta name="description" content="Challenge your friends on the same 5 charts. Pump or dump, 10 seconds per round, best score takes the pot. Same account as Meme Coin Tycoon. by @jeremstyke">
<meta property="og:title" content="MCT Duel - Pump or Dump duels">
<meta property="og:description" content="Read the chart, beat your friend. Free to play inside Telegram. by @jeremstyke">
<meta property="og:url" content="https://jeremstyke.github.io/mctduel/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0D0B1A">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<!-- 20 oct 2026 (Jeremy): MCT Duel, the second mini app of the Meme Coin Tycoon bot (t.me/Memecointycoonbot/Mctduel).
     Pump or dump duels: the same 5 charts for both players, best score takes the pot. Same account as Meme Coin Tycoon.
     Every answer is checked and timed in the base (edge function mct-duel), the page never knows the answer before the pick. by @jeremstyke -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D0B1A;--s1:#17142B;--s2:#1D1838;--ln:#2A2547;--ln2:#3A3462;--ink:#F4F1FF;--mu:#A39DC4;--mu2:#CFC9EE;--cy:#2EE6FF;--cyd:#139DB3;--cyb:#10303A;--or:#FF9A3C;--orb:#3A2410;--up:#3EE69A;--upd:#1E9E64;--upb:#123526;--dn:#FF5A6E;--dnd:#B32A3D;--dnb:#3A1218;--go:#FFD24A;--gob:#2B2410;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{min-height:100vh;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{cursor:default}
input{font:inherit;color:inherit}
.disp{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;letter-spacing:-.5px}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.scr{flex:1;display:flex;flex-direction:column;padding:16px 18px calc(96px + env(safe-area-inset-bottom));gap:14px;animation:in .28s ease both}
.scr.full{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:10px}
.lg{width:36px;height:36px;border-radius:11px;background:var(--s1);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center}
.chips{display:flex;gap:6px}
.chip{display:flex;align-items:center;gap:5px;padding:7px 11px;border-radius:999px;background:var(--s1);border:1px solid var(--ln);font-weight:700;font-size:14px;white-space:nowrap}
.chip i{font-style:normal;color:var(--up)}.chip.t i{color:var(--go)}
.card{border-radius:22px;background:var(--s1);border:1px solid var(--ln);padding:18px}
.hero{position:relative;overflow:hidden;padding:22px 20px 20px}
.hero svg.bgc{position:absolute;right:-12px;top:0;opacity:.32}
.kick{position:relative;font-size:12px;font-weight:700;color:var(--cy);text-transform:uppercase;letter-spacing:2px}
.hero h1{position:relative;margin:6px 0 6px;font-size:33px;line-height:1.04;white-space:pre-line}
.hero p{position:relative;margin:0 0 18px;font-size:14px;line-height:1.45;color:var(--mu)}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:54px;border-radius:16px;font-weight:800;font-size:17px;transition:transform .08s ease,filter .15s}
.btn:active{transform:translateY(3px);box-shadow:none!important}
.btn.p{background:var(--cy);color:var(--bg);box-shadow:0 4px 0 var(--cyd)}
.btn.g{background:var(--go);color:#2B2410;box-shadow:0 4px 0 #B8901A}
.btn.o{border:1.5px solid var(--ln2);color:var(--ink);min-height:50px;font-size:16px;font-weight:700}
.btn:disabled{filter:grayscale(.6) brightness(.7)}
.stack{display:flex;flex-direction:column;gap:10px;position:relative}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin-top:4px}
.sh h2{margin:0;font-size:16px;font-weight:800}.sh span{font-size:13px;color:var(--mu)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--s1);border:1px solid var(--ln);width:100%;text-align:left}
.row.hot{border-color:var(--or)}.row.mine{border-color:var(--cy)}
.av{flex:none;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;background:var(--cyb);color:var(--cy)}
.av img{width:100%;height:100%;object-fit:cover}
.av.o{background:var(--orb);color:var(--or)}.av.g{background:var(--upb);color:var(--up)}.av.b{background:#2a2547;color:var(--mu2)}
.who{flex:1;min-width:0}.who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who small{display:block;font-size:13px;color:var(--mu);margin-top:2px}
.pill{flex:none;height:38px;padding:0 15px;border-radius:12px;font-weight:800;font-size:14px;display:flex;align-items:center}
.pill.or{background:var(--or);color:var(--bg)}.pill.cy{background:var(--cy);color:var(--bg)}
.amt{flex:none;font-weight:800;font-size:15px}.amt.w{color:var(--up)}.amt.l{color:var(--dn)}
.note{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--s2);font-size:13px;color:var(--mu2);width:100%;text-align:left}
.empty{padding:22px;text-align:center;color:var(--mu);font-size:14px;border:1.5px dashed var(--ln);border-radius:var(--r)}
nav.tb{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:8px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #221E3D;background:rgba(15,12,31,.96);backdrop-filter:blur(10px)}
nav.tb[hidden],#cf[hidden]{display:none}
nav.tb button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:var(--mu);font-size:12px;font-weight:600}
nav.tb button.on{color:var(--cy);font-weight:800}
.hdr{display:flex;align-items:center;gap:12px}
.hdr h1{margin:0;font-size:24px}
.vs{display:flex;align-items:center;justify-content:space-between;padding:22px 16px}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:7px;width:118px;text-align:center}
.vs .big{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden;border:3px solid var(--cy);background:var(--cyb);color:var(--cy)}
.vs .big.o{border-color:var(--or);background:var(--orb);color:var(--or)}.vs .big.q{border-style:dashed;background:var(--s2)}
.vs .big img{width:100%;height:100%;object-fit:cover}
.vs .side b{font-size:15px;max-width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vs .side small{font-size:12px;color:var(--mu)}
.vs .x{font-size:30px;color:#6E6894}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--s1)}
.seg button{height:40px;border-radius:10px;color:var(--mu);font-weight:700;font-size:14px}
.seg button.on{background:var(--ln);color:var(--ink)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.st{height:52px;border-radius:14px;background:var(--s1);border:1.5px solid var(--ln);font-weight:700;font-size:15px}
.st.on{background:var(--cyb);border:2px solid var(--cy);color:var(--cy);font-weight:800}
.st:disabled{opacity:.4}
.lbl{margin:0;font-size:15px;font-weight:800}
.sum{display:flex;justify-content:space-between;font-size:14px;color:var(--mu)}.sum b{color:var(--up)}
.rules{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:18px;background:var(--s2)}
.rules div{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mu2)}
.find{display:flex;gap:8px}
.find input{flex:1;min-width:0;height:48px;border-radius:14px;border:1.5px solid var(--ln);background:var(--s1);padding:0 14px;outline:none;user-select:text;-webkit-user-select:text}
.find input:focus{border-color:var(--cy)}
.find button{height:48px;padding:0 16px;border-radius:14px;background:var(--ln);font-weight:700}
.warn{font-size:13px;color:var(--or);line-height:1.4}
/* play */
.ph{display:flex;align-items:center;justify-content:space-between}
.ph .pl{display:flex;align-items:center;gap:9px}.ph .pl.r{flex-direction:row-reverse;text-align:right}
.ph .av{width:40px;height:40px;border:2px solid var(--cy)}.ph .pl.r .av{border-color:var(--or)}
.ph small{display:block;font-size:12px;color:var(--mu);max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph .sc{font-size:23px;line-height:1}
.dots{display:flex;flex-direction:column;align-items:center;gap:6px}
.dots b{font-size:13px;color:var(--mu2)}
.dots div{display:flex;gap:5px}.dots i{width:20px;height:6px;border-radius:3px;background:var(--ln)}
.dots i.ok{background:var(--up)}.dots i.ko{background:var(--dn)}.dots i.cur{background:var(--cy);animation:pu 1s ease-in-out infinite}
@keyframes pu{50%{opacity:.45}}
.chart{padding:14px 14px 10px;display:flex;flex-direction:column;gap:8px;transition:border-color .2s,box-shadow .2s}
.chart.ok{border-color:var(--up);box-shadow:0 0 0 3px rgba(62,230,154,.18)}
.chart.ko{border-color:var(--dn);box-shadow:0 0 0 3px rgba(255,90,110,.18)}
.ch-h{display:flex;align-items:center;justify-content:space-between}
.coin{display:flex;align-items:center;gap:10px}
.ce{width:38px;height:38px;border-radius:12px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:20px}
.ch-h b{font-size:17px}.ch-h small{display:block;font-size:12px;color:var(--mu)}
.chg{text-align:right;font-weight:800;font-size:15px}
.chart svg{width:100%;height:auto;display:block}
.cnd{transform-box:fill-box;transform-origin:center bottom;animation:cg .35s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes cg{from{transform:scaleY(0);opacity:0}to{transform:none;opacity:1}}
.qbox{animation:qb 1.6s ease-in-out infinite}
@keyframes qb{50%{opacity:.55}}
.q{text-align:center;font-size:14px;color:var(--mu2);font-weight:600}
.tm{display:flex;align-items:center;justify-content:center;gap:10px;min-height:46px}
.tm span{font-size:14px;font-weight:600;color:var(--mu2)}
.res{font-size:22px;text-align:center;min-height:46px;display:flex;align-items:center;justify-content:center;gap:8px}
.res.ok{color:var(--up)}.res.ko{color:var(--dn)}
.pd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:auto}
.pd button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100px;border-radius:22px;transition:transform .08s}
.pd button:active{transform:translateY(4px);box-shadow:none!important}
.pd .u{background:var(--up);color:#06291A;box-shadow:0 5px 0 var(--upd)}
.pd .d{background:var(--dn);color:#33060E;box-shadow:0 5px 0 var(--dnd)}
.pd button:disabled{opacity:.35}
.pd b{font-size:23px;letter-spacing:.5px}
/* result */
.rs{align-items:center;text-align:center;position:relative}
.trophy{width:92px;height:92px;border-radius:28px;display:flex;align-items:center;justify-content:center;background:var(--gob);border:2px solid var(--go);margin-top:26px;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.trophy.l{background:var(--dnb);border-color:var(--dn)}.trophy.t{background:var(--s2);border-color:var(--mu)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.rs h1{margin:6px 0 0;font-size:44px;line-height:1}
.gain{font-size:30px}.gain.w{color:var(--up)}.gain.l{color:var(--dn)}
.duo{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.duo div{display:flex;flex-direction:column;align-items:center;gap:5px;padding:15px 8px;border-radius:20px;background:var(--s1);border:1px solid var(--ln)}
.duo div.m{background:var(--cyb);border:2px solid var(--cy)}
.duo b{font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.duo .disp{font-size:34px}.duo small{font-size:12px;color:var(--mu2)}
.rr{width:100%;padding:14px;border-radius:18px;background:var(--s1);border:1px solid var(--ln);display:flex;flex-direction:column;gap:8px}
.rr .l{display:grid;grid-template-columns:62px repeat(5,minmax(0,1fr));gap:6px;align-items:center;font-size:13px;font-weight:700;text-align:left}
.rr .l span.h{text-align:center;color:var(--mu);font-size:12px;font-weight:600}
.rr .l i{height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-style:normal}
.rr .l i.ok{background:var(--upb);color:var(--up)}.rr .l i.ko{background:var(--dnb);color:#FF8A99}
.rr .l b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cf{position:fixed;inset:0;pointer-events:none;z-index:50}
/* ranking */
.pod{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end;padding-top:6px}
.pod>div{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pod .av{width:56px;height:56px;border:3px solid #C9CEDA;font-size:20px;background:#23212F;color:var(--ink)}
.pod .p1 .av{width:66px;height:66px;border-color:var(--go);background:var(--gob);color:var(--go)}
.pod .p3 .av{border-color:#E0915A;background:#2E1D12}
.pod b.n{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .bar{width:100%;border-radius:14px 14px 0 0;background:var(--s2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pod .p1 .bar{height:112px;background:var(--gob)}.pod .p2 .bar{height:84px}.pod .p3 .bar{height:64px}
.pod .bar span{font-size:26px}.pod .p1 .bar span{color:var(--go);font-size:30px}.pod .p2 .bar span{color:#C9CEDA}.pod .p3 .bar span{color:#E0915A}
.pod .bar small{font-size:12px;color:var(--mu2)}
.rk{width:24px;font-weight:800;color:var(--mu)}
/* profile */
.pf{display:flex;align-items:center;gap:14px}
.pf .av{width:68px;height:68px;border:3px solid var(--cy);font-size:28px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.badges span{padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--s2);color:var(--mu2)}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat div,.stat2 div{padding:10px;border-radius:14px;background:#0F0C1F;text-align:center}
.stat .disp,.stat2 .disp{font-size:22px}.stat small,.stat2 small{display:block;font-size:12px;color:var(--mu);margin-top:2px}
.stat2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat2 div{text-align:left}.stat2 .disp{font-size:18px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;background:var(--s1);border:1px solid var(--ln)}
.sw{position:relative;width:48px;height:28px;border-radius:999px;background:var(--ln);transition:background .2s;flex:none}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--cy)}.sw.on::after{transform:translateX(20px)}
.lgs{display:flex;flex-wrap:wrap;gap:6px}
.lgs button{padding:7px 11px;border-radius:10px;background:var(--s2);font-weight:700;font-size:13px;color:var(--mu2)}
.lgs button.on{background:var(--cy);color:var(--bg)}
.foot{display:block;width:100%;text-align:center;font-size:12px;color:#6E6894;margin-top:6px;padding:8px 0}
.foot b{color:var(--cy);font-weight:700}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--ln);border-top-color:var(--cy);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;max-width:88vw;padding:12px 16px;border-radius:14px;background:#2A2547;color:var(--ink);font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:in .2s ease both;text-align:center}
.cnt{font-variant-numeric:tabular-nums}
[dir=rtl] .hero svg.bgc{right:auto;left:-12px;transform:scaleX(-1)}
/* 20 oct 2026 (Jeremy): landing page when the link is opened outside Telegram */
.lp{flex:1;width:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding:34px 18px 28px;text-align:center}
.lp .lg{width:104px;height:104px;margin:0 auto;border-radius:28px;box-shadow:0 0 0 1px var(--ln2),0 18px 50px rgba(46,230,255,.22);animation:in .4s ease both}
.lp h1{margin:0;font-size:36px;line-height:1.04;white-space:pre-line}
.lp .sub{margin:0 auto;max-width:360px;color:var(--mu2);line-height:1.5;font-size:15px}
.lp .demo{position:relative;height:118px;border-radius:22px;background:var(--s1);border:1px solid var(--ln);overflow:hidden}
.lp .demo .q{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:46px;height:70px;border-radius:12px;border:2px dashed var(--cy);color:var(--cy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;animation:lpq 1.6s ease-in-out infinite}
[dir=rtl] .lp .demo .q{right:auto;left:16px}
@keyframes lpq{50%{box-shadow:0 0 22px rgba(46,230,255,.45)}}
.lp .pd{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lp .pd a{text-decoration:none;padding:12px;border-radius:14px;font-weight:800;font-size:15px}
.lp .ft{display:flex;flex-direction:column;gap:10px;text-align:start}
.lp .ft div{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:18px;background:var(--s1);border:1px solid var(--ln)}
.lp .ft i{flex:none;width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:21px;background:var(--s2)}
.lp .ft b{display:block;font-size:15px;margin-bottom:2px}
.lp .ft small{color:var(--mu);font-size:13px;line-height:1.4}
.lp a.btn{text-decoration:none}
.lp .by{color:var(--mu);font-size:13px}
.lp .by a{color:var(--cy);text-decoration:none;font-weight:700}
.frs{display:flex;gap:10px;overflow-x:auto;margin:0 -2px;padding:2px 2px 6px;scrollbar-width:none}.frs::-webkit-scrollbar{display:none}
.fr{flex:none;width:86px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 6px 10px;border-radius:18px;background:var(--s1);border:1px solid var(--ln)}
.fr:active{transform:scale(.96)}.fr.off{opacity:.45}
.fr .av{width:48px;height:48px;border-radius:50%;overflow:hidden;background:var(--s2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;border:2px solid var(--ln2)}
.fr .av img{width:100%;height:100%;object-fit:cover}
.fr b{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr small{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--cy);font-weight:800}.fr small svg{width:12px;height:12px}
.mctc{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:20px;text-align:start;background:linear-gradient(135deg,#43127f,#2b0a57);border:1px solid rgba(255,212,59,.45);box-shadow:0 8px 24px rgba(67,18,127,.45);animation:in .4s ease both}
.mctc:active{transform:scale(.98)}
