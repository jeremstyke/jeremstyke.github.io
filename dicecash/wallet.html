<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>DiceCash Wallet</title>
<!-- 16 oct 2026 (Jeremy): DiceCash, by @jeremstyke. One tap to link the TON wallet (Wallet in Telegram, Tonkeeper...) with TON Connect.
     The address goes to the bot (Supabase function dc-bot, ?wallet=1), checked with the initData of Telegram. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
<style>
  :root { --bg1: #220c4a; --bg2: #1048c4; --gold: #ffcd32; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #fff; background: linear-gradient(150deg, var(--bg1), var(--bg2)); display: flex; align-items: center; justify-content: center; padding: 24px 16px; text-align: center; }
  .box { width: 100%; max-width: 380px; }
  .ico { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
  h1 { font-size: 24px; margin: 18px 0 8px; }
  p { margin: 0 0 22px; opacity: .85; line-height: 1.45; font-size: 15px; }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 16px; font-size: 17px; font-weight: 700; cursor: pointer; background: var(--gold); color: #3a2400; box-shadow: 0 6px 18px rgba(255, 190, 0, .35); }
  .btn:disabled { opacity: .6; }
  .st { margin-top: 16px; min-height: 22px; font-size: 14px; opacity: .9; }
  .ok { font-size: 54px; }
  #tc { display: none; }
</style>
</head>
<body>
<div class="box" id="box">
  <img class="ico" src="icon.png" alt="">
  <h1 id="t">Link your TON wallet</h1>
  <p id="d">One tap: choose Wallet in Telegram (or Tonkeeper) and confirm. That is where your DiceCash cash is sent every Monday.</p>
  <button class="btn" id="go">👛 Connect my wallet</button>
  <div class="st" id="st"></div>
  <div id="tc"></div>
</div>
<script>
(function () {
  var tw = window.Telegram && Telegram.WebApp;
  try { tw.ready(); tw.expand(); } catch (e) {}
  var fr = /^fr/.test(((tw && tw.initDataUnsafe && tw.initDataUnsafe.user && tw.initDataUnsafe.user.language_code) || navigator.language || ''));
  var T = fr ? {
    t: 'Relie ton portefeuille TON', d: 'Un seul geste : choisis Wallet dans Telegram (ou Tonkeeper) et confirme. C\'est là que ton cash DiceCash est envoyé chaque lundi.',
    go: '👛 Connecter mon portefeuille', saving: 'Enregistrement...', ok: 'Portefeuille enregistré !', okd: 'Tu seras payé dessus chaque lundi. Tu peux fermer cette page.', err: 'Oups, ça n\'a pas marché. Réessaie.', tg: 'Ouvre cette page depuis le bot DiceCash.'
  } : {
    t: 'Link your TON wallet', d: 'One tap: choose Wallet in Telegram (or Tonkeeper) and confirm. That is where your DiceCash cash is sent every Monday.',
    go: '👛 Connect my wallet', saving: 'Saving...', ok: 'Wallet saved!', okd: 'You will be paid there every Monday. You can close this page.', err: 'Oops, that did not work. Try again.', tg: 'Open this page from the DiceCash bot.'
  };
  document.getElementById('t').textContent = T.t;
  document.getElementById('d').textContent = T.d;
  var go = document.getElementById('go'), st = document.getElementById('st');
  go.textContent = T.go;
  if (!tw || !tw.initData) { st.textContent = T.tg; go.disabled = true; return; }

  var ui = new TON_CONNECT_UI.TonConnectUI({
    manifestUrl: 'https://jeremstyke.github.io/dicecash/tonconnect-manifest.json',
    buttonRootId: 'tc',
    actionsConfiguration: { twaReturnUrl: 'https://t.me/getdicecashbot' }
  });
  var sent = false;
  function save(raw) {
    if (sent) return; sent = true;
    st.textContent = T.saving; go.disabled = true;
    fetch('https://txvrlvcxfnylnrpdrxtt.supabase.co/functions/v1/dc-bot?wallet=1', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ init: tw.initData, addr: raw })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.ok) throw new Error('no');
      try { tw.HapticFeedback.notificationOccurred('success'); } catch (e) {}
      document.getElementById('box').innerHTML = '<div class="ok">✅</div><h1>' + T.ok + '</h1><p>' + T.okd + '</p>';
      setTimeout(function () { try { tw.close(); } catch (e) {} }, 1800);
    }).catch(function () { sent = false; st.textContent = T.err; go.disabled = false; });
  }
  ui.onStatusChange(function (w) { if (w && w.account && w.account.address) save(w.account.address); });
  go.onclick = function () {
    try { tw.HapticFeedback.impactOccurred('medium'); } catch (e) {}
    if (ui.wallet && ui.wallet.account) { sent = false; save(ui.wallet.account.address); return; }
    ui.openModal();
  };
})();
</script>
</body>
</html>
