<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rig Rush</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- 24 oct 2026: loaded early so the phone print goes with the first API call (anti multi-accounts) -->
<script src="https://jeremstyke.github.io/games.js" data-from="rr"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&family=JetBrains+Mono:wght@500&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}
body{margin:0}
[hidden]{display:none!important}

:root{--bg:#060a12;--fg:#eaf6ff;--mut:#8aa0b8;--neo:#39ff9f;--cy:#22d3ee;--pk:#ff4fd8;--gold:#ffc83d;--card:rgba(160,220,255,.06);--line:rgba(160,220,255,.12);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:'Nunito',system-ui,sans-serif;overflow:hidden;user-select:none}
#bgc{position:fixed;inset:0;z-index:0}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding-block:12px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:480px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lvl{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);padding:5px 12px 5px 5px;border-radius:99px;font-size:13px;font-weight:800;min-width:0}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--neo),var(--cy));display:grid;place-items:center;font-family:'Lilita One',sans-serif;font-size:14px;color:#03261a;flex:none}
.drop{display:flex;align-items:center;gap:6px;background:linear-gradient(90deg,rgba(255,200,61,.2),rgba(255,79,216,.15));border:1px solid rgba(255,200,61,.4);padding:7px 12px;border-radius:99px;font-size:12px;font-weight:800;color:var(--gold);animation:glow 3s ease-in-out infinite;flex:none}
@keyframes glow{50%{box-shadow:0 0 18px rgba(255,200,61,.4)}}
.bal{text-align:center;margin-top:12px}
.bal small{color:var(--mut);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.num{font-family:'Lilita One',sans-serif;font-size:clamp(40px,12vw,54px);line-height:1.1;color:var(--gold);text-shadow:0 3px 0 #a35a00,0 0 24px rgba(255,180,40,.4);font-variant-numeric:tabular-nums;display:flex;justify-content:center;align-items:center;gap:8px}
.num .dec{font-size:.45em;color:#ffe3a3;text-shadow:none;opacity:.85;align-self:flex-end;margin-bottom:.35em;margin-left:-6px}
.coin{width:.82em;height:.82em;flex:none}
.rate{display:inline-flex;gap:6px;align-items:center;font-size:14px;font-weight:800;color:var(--neo);font-family:'JetBrains Mono',monospace}
.rate b.x2{background:var(--pk);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;font-family:'Nunito';animation:pop .6s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}}
.stage{position:relative;flex:1;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mname{font-family:'Lilita One',sans-serif;font-size:18px;color:var(--cy);letter-spacing:.03em;text-shadow:0 0 12px rgba(34,211,238,.5);margin-bottom:4px}
.scene{width:min(92vw,380px);max-width:100%;aspect-ratio:320/220;position:relative}
.scene svg{width:100%;height:100%;overflow:visible}
/* machine animations */
.fan{transform-box:fill-box;transform-origin:center;animation:spin .5s linear infinite;animation-play-state:paused}
.on .fan{animation-play-state:running}
.boost .fan{animation-duration:.22s}
@keyframes spin{to{transform:rotate(360deg)}}
.led{opacity:.15}
.on .led{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}0%{opacity:1}}
.scr{fill:#05110c;transition:fill .4s}
.on .scr{fill:#062a1c}
.code{opacity:0;transition:opacity .4s}
.on .code{opacity:1}
.code g{animation:scroll 3s linear infinite}
.boost .code g{animation-duration:1.4s}
@keyframes scroll{to{transform:translateY(-60px)}}
.rgb{filter:saturate(.2) brightness(.5);transition:filter .4s}
.on .rgb{filter:none;animation:hue 4s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.glowp{opacity:0;transition:opacity .5s}
.on .glowp{opacity:1;animation:breath 2s ease-in-out infinite}
@keyframes breath{50%{opacity:.55}}
.off-txt{opacity:1}.on .off-txt{opacity:0}
#mach{transform-box:view-box;transform-origin:160px 190px}
.on #mach{animation:hum .18s linear infinite}
@keyframes hum{50%{transform:translateY(.4px)}}
.barw{width:min(70vw,260px);height:10px;border-radius:99px;background:rgba(160,220,255,.08);overflow:hidden;border:1px solid var(--line);margin-top:10px}
.barw i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--cy),var(--neo));box-shadow:0 0 12px rgba(57,255,159,.7);transition:width .5s linear}
.sess{text-align:center;font-weight:800;font-size:14px;color:var(--mut);margin:12px 0 10px}
.fx{position:fixed;pointer-events:none;z-index:5}
.btn{width:100%;border:0;border-radius:18px;padding:16px;font:400 20px 'Lilita One',sans-serif;letter-spacing:.02em;color:#03261a;cursor:pointer;position:relative;overflow:hidden;background:linear-gradient(180deg,#8dffc8,#39ff9f 55%,#14c47a);box-shadow:0 5px 0 #0b7a4b,0 12px 28px rgba(57,255,159,.3),inset 0 2px 0 rgba(255,255,255,.5);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0b7a4b,inset 0 2px 0 rgba(255,255,255,.5)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.8s infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.btn.claim{background:linear-gradient(180deg,#ffe08a,#ffc83d 55%,#f08c00);color:#3a1d00;box-shadow:0 5px 0 #a35200,0 12px 30px rgba(255,200,61,.4),inset 0 2px 0 rgba(255,255,255,.5);animation:bounce 1.1s infinite}
@keyframes bounce{50%{transform:translateY(-3px)}}
.btn.run{background:rgba(160,220,255,.07);box-shadow:inset 0 0 0 1px var(--line);color:var(--mut)}
.btn.run::after{display:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px;display:flex;gap:10px;align-items:center;cursor:pointer;transition:transform .12s,border-color .2s;min-width:0}
.mini:active{transform:scale(.96)}
.mini .ic{font-size:22px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.mini .t{font-weight:800;font-size:14px}
.mini .s{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.up .ic{background:linear-gradient(135deg,rgba(57,255,159,.3),rgba(34,211,238,.25))}
.up.can{border-color:var(--neo);animation:canup 1.6s infinite}
@keyframes canup{50%{box-shadow:0 0 16px rgba(57,255,159,.45)}}
.bo .ic{background:linear-gradient(135deg,rgba(255,79,216,.35),rgba(255,200,61,.25))}
.bo.on{border-color:var(--pk);box-shadow:0 0 18px rgba(255,79,216,.4)}
.nav{display:flex;justify-content:space-around;margin-top:12px;padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.nav button{background:none;border:0;color:var(--mut);font:800 11px 'Nunito',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 14px;border-radius:12px}
.nav button span{font-size:20px;transition:transform .2s}
.nav button.on{color:var(--fg)}
.nav button.on span{transform:translateY(-2px) scale(1.15);filter:drop-shadow(0 0 8px var(--neo))}
.page{flex:1;display:flex;flex-direction:column;min-height:0}
.page[hidden]{display:none!important}
.list{overflow:auto;flex:1;display:flex;flex-direction:column;gap:8px;margin-top:14px;padding-bottom:8px}
h2{margin:16px 0 4px;font:400 28px 'Lilita One',sans-serif;color:var(--neo);text-wrap:balance}
.sub{color:var(--mut);font-size:14px;line-height:1.45;margin:0;font-weight:700}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;animation:in .4s both}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.it .r{font-weight:800;width:26px;color:var(--mut);text-align:center}
.it .n{flex:1;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .p{color:var(--gold);font-weight:800;font-size:14px}
.it.me{border-color:var(--neo);background:rgba(57,255,159,.08)}
.it.lock{opacity:.45}
.it.cur{border-color:var(--cy);background:rgba(34,211,238,.1)}
.medal{font-size:20px}
.big{font:400 36px 'Lilita One',sans-serif;color:var(--gold);margin:10px 0;text-shadow:0 3px 0 #a35a00}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-150%);background:#0f1a2a;border:1px solid var(--line);padding:10px 16px;border-radius:14px;font-weight:800;font-size:14px;z-index:9;transition:transform .35s cubic-bezier(.2,1.4,.4,1);white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:700}
.demo-x{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:calc(56px + env(safe-area-inset-top,0px));font-size:10px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 7px;z-index:3;cursor:pointer;font-weight:800}
.flash{position:fixed;inset:0;background:#fff;pointer-events:none;z-index:7;opacity:0}

.cover{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;text-align:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.cover[hidden]{display:none!important}
/* 24 oct 2026 (Jeremy): Matrix style */
#bgc{display:none} /* 24 oct 2026 (Jeremy, 3h28): no more Matrix rain */
body{background:radial-gradient(120% 70% at 50% 40%,#0c2a1f 0%,#07130f 45%,#04070c 100%) fixed}
.brand{text-align:center;margin-top:8px;font:400 34px/1 'Russo One',sans-serif;font-style:italic;letter-spacing:.03em;transform:skewX(-8deg)}
.brand .a{background:linear-gradient(180deg,#fff 0%,#d8e1ea 42%,#6f7f8f 52%,#f2f6fa 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #0d2a1b) drop-shadow(0 0 10px rgba(255,255,255,.15))}
.brand .b{color:#39ff9f;text-shadow:0 0 10px rgba(57,255,159,.9),0 0 28px rgba(57,255,159,.45)}
.num{color:#eafff3;text-shadow:0 0 18px rgba(57,255,159,.55),0 2px 0 #0b3d26}
.num .dec{color:#9dffcf}
.coin{filter:drop-shadow(0 0 8px rgba(57,255,159,.8))}
.scene::before{content:"";position:absolute;inset:6% 2% -4%;border-radius:50%;background:radial-gradient(closest-side,rgba(57,255,159,.22),transparent 75%);opacity:.35;transition:opacity .5s;pointer-events:none}
.scene.on::before{opacity:1;animation:breath 2.2s ease-in-out infinite}
.mini,.lvl,.it,.stat{border-color:rgba(57,255,159,.18)}
.btn{box-shadow:0 5px 0 #0b7a4b,0 0 26px rgba(57,255,159,.35),inset 0 2px 0 rgba(255,255,255,.5)}
.stage{min-height:0;justify-content:flex-end;overflow:hidden} /* 24 oct 2026 (Jeremy, 3h33): on a real phone the machine went over the texts */
.scene{width:min(92vw,380px,max(150px,calc((100vh - 470px) * 1.45)))}
@media (max-height:780px){.brand{font-size:28px;margin-top:4px}.bal{margin-top:6px}.num{font-size:42px}.mname{font-size:16px}.sess{margin:8px 0 8px}.btn{padding:13px}.row{margin-top:8px}.nav{margin-top:8px}}
.ph{font:400 16px 'Russo One',sans-serif;color:var(--cy);letter-spacing:.06em;text-transform:uppercase;margin:6px 2px 0}
.lv{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}.lv i{width:7px;height:7px;border-radius:2px;background:rgba(57,255,159,.15)}.lv i.f{background:var(--neo);box-shadow:0 0 6px var(--neo)}
.it.can{border-color:var(--neo);box-shadow:0 0 14px rgba(57,255,159,.25)}
.it .n .lv{display:flex;margin:4px 0 2px}
.faq{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}.faq summary{font-weight:800;font-size:15px;cursor:pointer;list-style:none}.faq summary::-webkit-details-marker{display:none}.faq summary::before{content:'▸ ';color:var(--neo)}.faq[open] summary::before{content:'▾ '}.faq p{margin:8px 0 0;color:var(--mut);font-weight:700;font-size:14px;line-height:1.5}.it .n.w{white-space:normal}
.tr{display:flex;gap:8px;align-items:center;flex:none}
.bell{position:relative;width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;cursor:pointer}
.bell b{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--pk);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 10px var(--pk);animation:ring 1.6s infinite}
.bell b[hidden]{display:none!important}
@keyframes ring{0%,100%{transform:scale(1)}10%{transform:scale(1.25)}20%{transform:scale(1)}}
/* 24 oct 2026: the row now holds Upgrade + the free chest */
.stk{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:800;color:#ffb36b;background:rgba(255,122,61,.12);border:1px solid rgba(255,140,61,.4);cursor:pointer}
.mini.ch.can{border-color:var(--gold);box-shadow:0 0 16px rgba(255,200,61,.35)}
.mini.ch.can .ic{animation:bounce 1.1s infinite}
.mini.ch.can .s{color:var(--gold)}
/* 24 oct 2026: +10 % for following @jeremstyke */
.subc{display:block;text-align:center;margin-top:10px;padding:10px 12px;border-radius:14px;font-weight:800;font-size:14px;color:#cfe9ff;background:linear-gradient(90deg,rgba(34,158,217,.22),rgba(34,211,238,.12));border:1px solid rgba(80,180,255,.5);cursor:pointer}
.subc b{color:#fff}
.stk.sb{color:#8fd3ff;background:rgba(34,158,217,.14);border-color:rgba(80,180,255,.45);margin-left:6px}
.sheet{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;backdrop-filter:blur(4px)}
.sheet[hidden]{display:none!important}
.sheet>div{width:100%;max-width:480px;margin:0 auto;max-height:75vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#0f1a2a,#060a12);border-radius:24px 24px 0 0;border-top:1px solid var(--line);padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes up{from{transform:translateY(100%)}}
.nt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px;line-height:1.4}
.nt small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
/* 24 oct 2026 (Jeremy): opened outside Telegram (Adsgram review, web): a landing page with the game explained and a Telegram button */
.land{position:fixed;inset:0;z-index:60;overflow-y:auto;-webkit-overflow-scrolling:touch;user-select:text;background:radial-gradient(120% 70% at 50% 0%,rgba(57,255,159,.13),transparent 60%),radial-gradient(90% 60% at 100% 100%,rgba(255,79,216,.1),transparent 60%),var(--bg)}
.land .in{max-width:560px;margin:0 auto;padding-block:28px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.land .brand{font-size:46px;margin:0}
.land .tag{text-align:center;color:var(--mut);font-weight:800;font-size:17px;line-height:1.45;margin:-8px auto 0;max-width:30em;text-wrap:balance}
.land .tag b{color:var(--fg)}
.land .show{border-radius:26px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(34,211,238,.07),rgba(57,255,159,.04));padding:18px 14px 14px;display:flex;flex-direction:column;align-items:center}
.land .show .scene{width:min(86vw,360px)}
.land .lm{font-family:'Lilita One',sans-serif;color:var(--cy);font-size:18px;text-shadow:0 0 12px rgba(34,211,238,.5);min-height:24px;transition:opacity .3s}
.land .lr{font-family:'JetBrains Mono',monospace;color:var(--neo);font-size:14px;font-weight:500}
.land .cta{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;font:800 18px 'Nunito',sans-serif;color:#03261a;background:linear-gradient(180deg,#5dffb4,#22d38a);border-radius:18px;padding:17px;box-shadow:0 6px 0 #0d7a4c,0 0 30px rgba(57,255,159,.35);transition:transform .1s}
.land .cta:active{transform:translateY(3px);box-shadow:0 3px 0 #0d7a4c}
.land .cta svg{width:24px;height:24px;flex:none}
.land .sm{text-align:center;color:var(--mut);font-size:13px;margin-top:-12px}
.land h2{font-family:'Lilita One',sans-serif;font-weight:400;font-size:22px;margin:6px 0 0;color:var(--gold)}
.land .st{display:grid;gap:10px}
.land .s{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.land .s i{font-style:normal;font-size:26px;line-height:1;flex:none;width:32px;text-align:center}
.land .s b{display:block;font-size:16px;margin-bottom:2px}
.land .s span{color:var(--mut);font-size:14px;line-height:1.45}
.land .ft{text-align:center;color:var(--mut);font-size:13px;line-height:1.7}
.land .ft a{color:var(--cy);font-weight:800;text-decoration:none}
</style>
</head>
<body>
<canvas id="bgc"></canvas>
<div class="app" id="app">
  <div class="top">
    <div class="lvl"><div class="av" id="lvlN">1</div><div id="lvlT" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></div></div>
    <div class="tr"><div class="bell" id="faqB">❓</div><div class="bell" id="bell">🔔<b id="bdg" hidden>0</b></div><div class="drop" id="dropChip">🪂 AIRDROP</div></div>
  </div>

  <div class="page" id="pg-mine">
    <div class="brand"><span class="a">RIG</span> <span class="b">RUSH</span></div>
    <div class="bal"><small data-t="coins"></small>
      <div class="num"><svg class="coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="#06261a" stroke="#39ff9f" stroke-width="1.6"/><circle cx="12" cy="12" r="7.6" fill="none" stroke="#39ff9f" stroke-width=".8" opacity=".6"/><text x="12.4" y="16.2" text-anchor="middle" font-size="11" font-style="italic" font-family="Russo One,sans-serif" fill="#7dffc0">R</text></svg><span id="num">0</span><span class="dec" id="dec"></span></div>
      <div class="rate" id="rate"></div>
      <div><span class="stk" id="stk" hidden></span><span class="stk sb" id="sbc" hidden></span></div>
    </div>
    <div class="stage" id="stage">
      <div class="mname" id="mname"></div>
      <div class="scene" id="scene"><svg viewBox="0 0 320 220" id="svg"></svg></div>
      <div class="barw"><i id="bar"></i></div>
    </div>
    <div class="sess" id="sess"></div>
    <button class="btn" id="main"></button>
    <div class="subc" id="subB" hidden></div>
    <div class="row">
      <div class="mini up" id="upB"><div class="ic">🛠️</div><div style="min-width:0"><div class="t" data-t="upgrade"></div><div class="s" id="upS"></div></div></div>
      <div class="mini ch" id="chB"><div class="ic">🎁</div><div style="min-width:0"><div class="t" id="chT"></div><div class="s" id="chS"></div></div></div>
      <div class="mini bo" id="boB" hidden><div class="ic">🎬</div><div style="min-width:0"><div class="t">Boost x2</div><div class="s" id="boS"></div></div></div>
    </div>
  </div>

  <div class="page" id="pg-up" hidden>
    <h2 data-t="mach_h"></h2>
    <p class="sub" data-t="mach_p"></p>
    <div class="list" id="upl"></div>
  </div>

  <div class="page" id="pg-fr" hidden>
    <h2 data-t="fr_h"></h2>

 en:[['How do I mine?','Tap "Turn on the machine". It mines for 4 hours (more with the battery), even when the app is closed. Then come back, collect your RIGZ and start again.'],['How do I mine faster?','Upgrade your components, then buy the next machine. To get the next machine, every unlocked component must be at its maximum.'],['Why is a component locked?','New components unlock with better machines, and a component cannot go above your machine level + 1.'],['What are RIGZ for?','You spend them on upgrades. Everything you earned counts for the airdrop, even what you spent, so upgrading never costs you places.'],['What is the airdrop?','RIGZ are in-game points with no cash value. An airdrop is planned for miners based on their RIGZ, with no guaranteed date or amount.'],['How do friends work?','Share your link: you both get +1 RIGZ, then you get 10 % of everything they mine, forever.'],['Will I be told when my machine is full?','Yes, the bot sends you a message when your session is over.']],
 fr:[['Comment miner ?','Appuie sur « Allumer la machine ». Elle mine pendant 4 heures (plus avec la batterie), même appli fermée. Reviens ensuite récupérer tes RIGZ et relance.'],['Comment miner plus vite ?','Améliore tes composants, puis achète la machine suivante. Pour l\'acheter, tous tes composants débloqués doivent être au maximum.'],['Pourquoi un composant est verrouillé ?','Les nouveaux composants se débloquent avec de meilleures machines, et un composant ne peut pas dépasser le niveau de ta machine + 1.'],['À quoi servent les RIGZ ?','Tu les dépenses en améliorations. Tout ce que tu as gagné compte pour l\'airdrop, même ce que tu as dépensé : améliorer ne te fait jamais perdre de places.'],['C\'est quoi l\'airdrop ?','Les RIGZ sont des points de jeu, sans valeur en argent. Un airdrop est prévu pour les mineurs selon leurs RIGZ, sans date ni montant garantis.'],['Comment marchent les amis ?','Partage ton lien : vous gagnez chacun +1 RIGZ, puis tu touches 10 % de tout ce qu\'il mine, pour toujours.'],['Je suis prévenu quand ma machine est pleine ?','Oui, le bot t\'envoie un message à la fin de ta session.']],
 es:[['¿Cómo mino?','Toca "Encender la máquina". Mina durante 4 horas (más con la batería), incluso con la app cerrada. Luego vuelve, recoge tus RIGZ y empieza de nuevo.'],['¿Cómo mino más rápido?','Mejora tus componentes y luego compra la siguiente máquina. Para comprarla, todos los componentes desbloqueados deben estar al máximo.'],['¿Por qué un componente está bloqueado?','Los nuevos componentes se desbloquean con mejores máquinas, y un componente no puede superar el nivel de tu máquina + 1.'],['¿Para qué sirven los RIGZ?','Los gastas en mejoras. Todo lo que ganaste cuenta para el airdrop, incluso lo gastado: mejorar nunca te hace perder puestos.'],['¿Qué es el airdrop?','Los RIGZ son puntos del juego, sin valor en dinero. Se prevé un airdrop para los mineros según sus RIGZ, sin fecha ni monto garantizados.'],['¿Cómo funcionan los amigos?','Comparte tu enlace: ambos ganan +1 RIGZ y luego recibes el 10 % de todo lo que mine, para siempre.'],['¿Me avisan cuando mi máquina está llena?','Sí, el bot te envía un mensaje al terminar tu sesión.']],
 pt:[['Como eu minero?','Toque em "Ligar a máquina". Ela minera por 4 horas (mais com a bateria), mesmo com o app fechado. Depois volte, colete seus RIGZ e recomece.'],['Como minerar mais rápido?','Melhore seus componentes e depois compre a próxima máquina. Para comprá-la, todos os componentes desbloqueados devem estar no máximo.'],['Por que um componente está bloqueado?','Novos componentes desbloqueiam com máquinas melhores, e um componente não pode passar do nível da sua máquina + 1.'],['Para que servem os RIGZ?','Você os gasta em melhorias. Tudo o que você ganhou conta para o airdrop, até o que gastou: melhorar nunca faz perder posições.'],['O que é o airdrop?','Os RIGZ são pontos do jogo, sem valor em dinheiro. Um airdrop está previsto para os mineradores conforme seus RIGZ, sem data nem valor garantidos.'],['Como funcionam os amigos?','Compartilhe seu link: vocês dois ganham +1 RIGZ e depois você recebe 10 % de tudo o que ele minerar, para sempre.'],['Sou avisado quando a máquina enche?','Sim, o bot te manda uma mensagem no fim da sessão.']],
 ru:[['Как майнить?','Нажми «Включить машину». Она майнит 4 часа (дольше с батареей), даже если приложение закрыто. Потом вернись, забери RIGZ и запусти снова.'],['Как майнить быстрее?','Улучшай компоненты, затем покупай следующую машину. Для покупки все открытые компоненты должны быть на максимуме.'],['Почему компонент закрыт?','Новые компоненты открываются с лучшими машинами, а компонент не может быть выше уровня машины + 1.'],['Зачем нужны RIGZ?','Ты тратишь их на улучшения. Всё заработанное идёт в airdrop, даже потраченное: улучшения не отнимают места.'],['Что такое airdrop?','RIGZ - это игровые очки, они не имеют денежной стоимости. Для майнеров планируется airdrop по их RIGZ, без гарантированной даты и суммы.'],['Как работают друзья?','Поделись ссылкой: вы оба получите +1 RIGZ, а потом ты будешь получать 10 % от всего, что он намайнит, навсегда.'],['Мне сообщат, когда машина заполнится?','Да, бот пришлёт сообщение в конце сессии.']],
 uk:[['Як майнити?','Натисни «Увімкнути машину». Вона майнить 4 години (довше з батареєю), навіть якщо застосунок закрито. Потім повернись, забери RIGZ і запусти знову.'],['Як майнити швидше?','Покращуй компоненти, потім купуй наступну машину. Для покупки всі відкриті компоненти мають бути на максимумі.'],['Чому компонент закрито?','Нові компоненти відкриваються з кращими машинами, а компонент не може бути вищим за рівень машини + 1.'],['Навіщо RIGZ?','Ти витрачаєш їх на покращення. Усе зароблене йде в airdrop, навіть витрачене: покращення не забирають місця.'],['Що таке airdrop?','RIGZ - це ігрові очки, вони не мають грошової вартості. Для майнерів планується airdrop за їхніми RIGZ, без гарантованої дати й суми.'],['Як працюють друзі?','Поділись посиланням: ви обидва отримаєте +1 RIGZ, а потім ти отримуватимеш 10 % від усього, що він намайнить, назавжди.'],['Мене повідомлять, коли машина заповниться?','Так, бот надішле повідомлення наприкінці сесії.']],
 tr:[['Nasıl kazarım?','"Makineyi çalıştır"a dokun. Uygulama kapalıyken bile 4 saat (bataryayla daha uzun) kazar. Sonra gel, RIGZ\'lerini topla ve yeniden başlat.'],['Nasıl daha hızlı kazarım?','Bileşenlerini yükselt, sonra sonraki makineyi al. Almak için açık tüm bileşenler maksimumda olmalı.'],['Bir bileşen neden kilitli?','Yeni bileşenler daha iyi makinelerle açılır ve bir bileşen makine seviyesi + 1\'i geçemez.'],['RIGZ ne işe yarar?','Yükseltmelere harcarsın. Kazandığın her şey airdrop\'a sayılır, harcadıkların bile: yükseltmek sıra kaybettirmez.'],['Airdrop nedir?','RIGZ, para değeri olmayan oyun puanlarıdır. Madenciler için RIGZ\'lerine göre bir airdrop planlanıyor, tarih ve miktar garanti değildir.'],['Arkadaşlar nasıl çalışır?','Linkini paylaş: ikiniz de +1 RIGZ kazanırsınız, sonra kazdığı her şeyin %10\'u sonsuza dek senin.'],['Makinem dolunca haber alır mıyım?','Evet, oturum bitince bot sana mesaj atar.']],
