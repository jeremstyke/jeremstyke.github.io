<!-- sayapp bgnwsimd v1 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Nova Tap</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07071a;--card:#12122b;--card2:#1a1a3a;--line:rgba(255,255,255,.07);--main:#7c5cff;--main2:#a78bfa;--acc:#00e5c3;--gold:#ffc857;--txt:#f3f2ff;--mut:#8f8fb5;--red:#ff5d7a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(500px 360px at 80% -5%,rgba(124,92,255,.35),transparent 70%),radial-gradient(420px 320px at 0% 55%,rgba(0,229,195,.12),transparent 70%);pointer-events:none}
#app{position:relative;height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
header{padding:calc(var(--sa-top,0px) + 8px) 20px 8px;text-align:center}
.who{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--mut)}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600;color:var(--txt)}
.bal{margin-top:10px;display:flex;justify-content:center;align-items:center;gap:10px;font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.bal .gem{font-size:34px;filter:drop-shadow(0 0 12px var(--acc));color:var(--acc)}
.sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-top:4px;font-weight:600}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 16px calc(96px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.tab{display:none;animation:fade .25s ease}.tab.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05)}
.lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:6px 4px 10px}
h2{font-size:20px;font-weight:800;margin-bottom:4px}
p.s{font-size:14px;color:var(--mut);line-height:1.45}
.bar{height:8px;background:rgba(255,255,255,.07);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--main),var(--acc));border-radius:9px;transition:width .25s ease}
.lg{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:8px;font-weight:600}
.stage{position:relative;display:flex;justify-content:center;align-items:center;height:290px;margin:4px 0}
.coin{position:relative;width:236px;height:236px;border-radius:50%;border:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;
background:radial-gradient(circle at 32% 28%,#d9ccff 0,#9a7bff 30%,#5b3ee0 68%,#3a22a8 100%);
box-shadow:0 0 0 10px rgba(124,92,255,.12),0 0 70px rgba(124,92,255,.55),inset 0 -14px 30px rgba(20,0,90,.5),inset 0 10px 20px rgba(255,255,255,.25);
transition:transform .12s ease;display:flex;align-items:center;justify-content:center}
.coin.turbo{background:radial-gradient(circle at 32% 28%,#fff1c7 0,#ffc857 32%,#ff8a3d 70%,#c4491a 100%);box-shadow:0 0 0 10px rgba(255,200,87,.15),0 0 80px rgba(255,160,60,.65),inset 0 -14px 30px rgba(120,30,0,.45),inset 0 10px 20px rgba(255,255,255,.3)}
.coin svg{width:110px;height:110px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));pointer-events:none}
.coin.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ring{position:absolute;width:236px;height:236px;border-radius:50%;border:2px solid rgba(167,139,250,.5);animation:ring 2.4s infinite;pointer-events:none}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.35);opacity:0}}
.fl{position:fixed;z-index:50;font-weight:800;font-size:26px;color:#fff;text-shadow:0 0 12px var(--main),0 2px 6px rgba(0,0,0,.5);pointer-events:none;animation:fl .9s ease-out forwards}
@keyframes fl{from{opacity:1;transform:translate(-50%,0) scale(.8)}to{opacity:0;transform:translate(-50%,-110px) scale(1.2)}}
.row{display:flex;align-items:center;gap:12px}
.btn{border:0;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;color:#fff;padding:12px 18px;border-radius:14px;background:linear-gradient(135deg,var(--main),#5b3ee0);box-shadow:0 6px 18px rgba(124,92,255,.4);transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.95)}
.btn.acc{background:linear-gradient(135deg,var(--acc),#00a98f);color:#04221d;box-shadow:0 6px 18px rgba(0,229,195,.3)}
.btn.gold{background:linear-gradient(135deg,#ffd77a,#ff9f43);color:#3a1d00;box-shadow:0 6px 18px rgba(255,170,60,.35)}
.btn.off{background:rgba(255,255,255,.06);color:var(--mut);box-shadow:none;pointer-events:none}
.btn.big{width:100%;padding:15px;font-size:15px}
.ico{width:46px;height:46px;border-radius:14px;background:rgba(124,92,255,.15);display:flex;align-items:center;justify-content:center;font-size:23px;flex:none}
.grow{flex:1;min-width:0}
.t{font-weight:700;font-size:15px}
.d{font-size:12.5px;color:var(--mut);margin-top:2px}
.item{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:10px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px}
.item .bar{margin-top:8px;height:6px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0}
.day{aspect-ratio:1/1.25;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--mut);font-weight:600;gap:2px}
.day b{font-size:11px;color:var(--txt)}
.day.done{background:linear-gradient(160deg,rgba(0,229,195,.25),rgba(0,229,195,.08));border-color:rgba(0,229,195,.4)}
.day.now{background:linear-gradient(160deg,rgba(255,200,87,.3),rgba(255,200,87,.08));border-color:var(--gold);animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.rk{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;margin-bottom:8px;background:var(--card);border:1px solid var(--line)}
.rk.me{border-color:var(--main);background:linear-gradient(90deg,rgba(124,92,255,.25),var(--card))}
.rk .n{width:28px;text-align:center;font-weight:800;color:var(--mut)}
.rk .v{font-weight:800;color:var(--acc)}
.sk{height:52px;border-radius:16px;margin-bottom:8px;background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;padding:30px 10px;color:var(--mut);font-size:14px}
.empty div{font-size:40px;margin-bottom:8px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;gap:4px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(7,7,26,.92) 30%);backdrop-filter:blur(8px)}
nav button{flex:1;position:relative;border:0;background:var(--card);color:var(--mut);font-family:inherit;font-size:11px;font-weight:700;padding:9px 0;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border:1px solid var(--line);transition:transform .15s,color .15s}
nav button span{font-size:20px}
nav button:active{transform:scale(.94)}
nav button.on{color:#fff;background:linear-gradient(160deg,rgba(124,92,255,.5),rgba(124,92,255,.15));border-color:rgba(124,92,255,.6);box-shadow:0 0 18px rgba(124,92,255,.35)}
nav .dot{position:absolute;top:6px;right:22%;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);display:none}
#toast{position:fixed;left:50%;top:calc(var(--sa-top,0px) + 60px);transform:translate(-50%,-20px);background:#1d1d42;border:1px solid var(--main);padding:12px 18px;border-radius:16px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;font-size:11px;color:var(--mut);opacity:.6;margin:16px 0 4px}
.pt{font-size:11px;color:var(--mut);text-align:center;margin-top:6px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="who"><span id="uname">Player</span><span class="chip" id="league">🥉 Bronze</span></div>
    <div class="bal"><span class="gem">✦</span><span id="bal">0</span></div>
    <div class="sub">Nova points</div>
  </header>
  <main>
    <section class="tab on" id="t-tap">
      <div class="card" style="padding:14px">
        <div class="lg"><span id="lgName">Bronze</span><span id="lgNext">0 / 5,000</span></div>
        <div class="bar"><i id="lgBar"></i></div>
      </div>
      <div class="stage"><div class="ring"></div><button class="coin" id="coin" aria-label="Tap"><svg viewBox="0 0 100 100"><path d="M50 8l11 27 29 3-22 20 7 29-25-15-25 15 7-29L10 38l29-3z" fill="#fff" fill-opacity=".92"/></svg></button></div>
      <div class="card" style="padding:14px">
        <div class="lg"><span>⚡ Energy</span><span id="enTxt">1000 / 1000</span></div>
        <div class="bar"><i id="enBar" style="width:100%"></i></div>
      </div>
      <button class="btn gold big" id="turboBtn">🚀 Turbo x3</button>
      <div class="pt" id="perTap"></div>
    </section>

    <section class="tab" id="t-boost">
      <div class="lab">Upgrade your power</div>
      <div id="boosts"></div>
    </section>

    <section class="tab" id="t-earn">
      <div class="lab">Daily reward</div>
      <div class="card" id="daily"></div>
      <div class="lab">Tasks</div>
      <div id="tasks"></div>
    </section>

    <section class="tab" id="t-rank">
      <div class="card" style="background:linear-gradient(135deg,rgba(124,92,255,.45),rgba(0,229,195,.15))">
        <h2>Invite friends 🎁</h2>
        <p class="s">Share Nova Tap with your friends and unlock big bonus tasks.</p>
        <div class="row" style="margin-top:14px"><button class="btn acc grow" id="invite">Invite a friend</button><div class="chip">👥 <span id="shares">0</span> sent</div></div>
      </div>
      <div class="lab">Leaderboard</div>
      <div id="board"></div>
    </section>
    <div class="foot">Made with SayApp · Points have no cash value</div>
  </main>
  <nav id="nav">
    <button data-tab="tap" class="on"><span>👆</span>Tap</button>
    <button data-tab="boost"><span>🚀</span>Boosts</button>
    <button data-tab="earn"><span>🎁</span>Earn<i class="dot" id="dot"></i></button>
    <button data-tab="rank"><span>🏆</span>Ranks</button>
  </nav>
</div>
<div id="toast"></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://jeremstyke.github.io/sayapp/sdk.js" data-app="bgnwsimd" data-full="1"></script>
<script>
window.addEventListener('load',function(){
var $=function(s){return document.querySelector(s)};
var LEAGUES=[['Bronze','🥉',0],['Silver','🥈',5000],['Gold','🥇',25000],['Platinum','💠',100000],['Diamond','💎',500000]];
var BOOSTS=[
 {id:'multi',ico:'👆',name:'Multitap',desc:'+1 point per tap',base:200},
 {id:'tank',ico:'🔋',name:'Energy tank',desc:'+500 max energy',base:150},
 {id:'regen',ico:'⚡',name:'Recharge speed',desc:'+1 energy per second',base:300},
 {id:'miner',ico:'🤖',name:'Auto miner',desc:'+100 points per hour, even offline',base:500}];
var DAILY=[100,200,300,500,800,1200,2000];
var TASKS=[
 {id:'t1',ico:'👆',title:'Warm up',desc:'Tap 100 times',goal:100,rw:500,p:function(){return S.taps}},
 {id:'t2',ico:'🔥',title:'On a roll',desc:'Tap 2,000 times',goal:2000,rw:3000,p:function(){return S.taps}},
 {id:'t3',ico:'💰',title:'First thousand',desc:'Earn 1,000 points in total',goal:1000,rw:1000,p:function(){return S.total}},
 {id:'t4',ico:'🛠️',title:'Upgrader',desc:'Buy 3 boost levels',goal:3,rw:2500,p:function(){return S.bought}},
 {id:'t5',ico:'📅',title:'Loyal player',desc:'Claim 3 daily rewards',goal:3,rw:2000,p:function(){return S.dcount}},
 {id:'t6',ico:'👥',title:'Bring a friend',desc:'Invite 1 friend',goal:1,rw:5000,p:function(){return S.shares}},
 {id:'t7',ico:'🎉',title:'Squad goals',desc:'Invite 3 friends',goal:3,rw:20000,p:function(){return S.shares}}];
var S={points:0,total:0,taps:0,energy:1000,lv:{multi:0,tank:0,regen:0,miner:0},bought:0,streak:0,lastDaily:'',dcount:0,claimed:{},shares:0,turbo:{day:'',used:0},last:0,frac:0};
var dirty=false,turboUntil=0,shown=0,target=0,raf=0,lastHap=0;

function fmt(n){return Math.floor(n).toLocaleString('en')}
function today(){return new Date().toISOString().slice(0,10)}
function yest(){return new Date(Date.now()-864e5).toISOString().slice(0,10)}
function power(){return 1+S.lv.multi}
function maxE(){return 1000+500*S.lv.tank}
function regen(){return 1+S.lv.regen}
function hourly(){return 100*S.lv.miner}
function cost(b){return Math.round(b.base*Math.pow(1.7,S.lv[b.id]))}
function streakEff(){return (S.lastDaily===today()||S.lastDaily===yest())?S.streak:0}
function hap(t){try{SayApp.haptic(t)}catch(e){}}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('on')},2400)}

/* animated balance */
function setBal(){target=S.points;if(!raf)raf=requestAnimationFrame(stepBal)}
function stepBal(){var d=target-shown;if(Math.abs(d)<1){shown=target;raf=0}else{shown+=d*0.25;raf=requestAnimationFrame(stepBal)}
 $('#bal').textContent=fmt(shown);if(!raf)$('#bal').textContent=fmt(target)}

function league(){var i=0;for(var k=0;k<LEAGUES.length;k++)if(S.total>=LEAGUES[k][2])i=k;return i}
function renderLeague(){
 var i=league(),L=LEAGUES[i],N=LEAGUES[i+1];
 $('#league').textContent=L[1]+' '+L[0];$('#lgName').textContent=L[1]+' '+L[0]+' league';
 if(N){$('#lgNext').textContent=fmt(S.total)+' / '+fmt(N[2]);$('#lgBar').style.width=Math.min(100,(S.total-L[2])/(N[2]-L[2])*100)+'%'}
 else{$('#lgNext').textContent='Max league';$('#lgBar').style.width='100%'}
}
function renderEnergy(){
 $('#enTxt').textContent=Math.floor(S.energy)+' / '+maxE();
 $('#enBar').style.width=(S.energy/maxE()*100)+'%';
 $('#perTap').textContent='+'+power()+' per tap · +'+regen()+' energy/sec'+(hourly()?' · '+fmt(hourly())+'/h auto':'');
}
function renderTurbo(){
 var t=S.turbo;if(t.day!==today()){t.day=today();t.used=0}
 var left=3-t.used,b=$('#turboBtn'),act=Date.now()<turboUntil;
 $('#coin').classList.toggle('turbo',act);
 if(act){b.textContent='🔥 Turbo active · '+Math.ceil((turboUntil-Date.now())/1000)+'s';b.classList.add('off')}
 else if(left>0){b.textContent='🚀 Turbo x3 for 20s · '+left+' left today';b.classList.remove('off')}
 else{b.textContent='🚀 Turbo back tomorrow';b.classList.add('off')}
}
function refreshAll(){setBal();renderLeague();renderEnergy();renderTurbo();renderBoosts();renderEarn();$('#shares').textContent=S.shares}

/* effects */
function floatNum(x,y,txt){
 var e=document.createElement('div');e.className='fl';e.textContent=txt;
 e.style.left=(x+(Math.random()*40-20))+'px';e.style.top=(y-30)+'px';document.body.appendChild(e);
 setTimeout(function(){e.remove()},900)}
function burst(x,y){
 var c=['#7c5cff','#00e5c3','#ffc857','#ff5d7a','#fff'];
 for(var i=0;i<18;i++){var p=document.createElement('i');
  p.style.cssText='position:fixed;z-index:60;pointer-events:none;width:8px;height:8px;border-radius:2px;left:'+x+'px;top:'+y+'px;background:'+c[i%5];
  document.body.appendChild(p);var a=Math.random()*6.28,d=60+Math.random()*90;
  p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+Math.cos(a)*d+'px,'+(Math.sin(a)*d+40)+'px) rotate(360deg)',opacity:0}],{duration:800,easing:'ease-out'}).onfinish=function(){this.effect.target.remove()}}
}

/* tapping */
var coin=$('#coin');
coin.addEventListener('pointerdown',function(e){
 e.preventDefault();
 if(S.energy<1){coin.classList.remove('shake');void coin.offsetWidth;coin.classList.add('shake');
  if(Date.now()-lastHap>400){hap('error');lastHap=Date.now();toast('Out of energy, recharging...')}return}
 var p=power()*(Date.now()<turboUntil?3:1);
 S.energy-=1;S.points+=p;S.total+=p;S.taps++;dirty=true;
 var r=coin.getBoundingClientRect(),dx=(e.clientX-r.left-r.width/2)/(r.width/2),dy=(e.clientY-r.top-r.height/2)/(r.height/2);
 coin.style.transform='perspective(500px) rotateX('+(-dy*14)+'deg) rotateY('+(dx*14)+'deg) scale(.95)';
 setTimeout(function(){coin.style.transform=''},110);
 floatNum(e.clientX,e.clientY,'+'+p);hap('tap');
 setBal();renderEnergy();renderLeague();
});
coin.addEventListener('contextmenu',function(e){e.preventDefault()});
$('#turboBtn').onclick=function(){
 var t=S.turbo;if(t.day!==today()){t.day=today();t.used=0}
 if(Date.now()<turboUntil||t.used>=3)return;
 t.used++;turboUntil=Date.now()+20000;dirty=true;hap('ok');toast('Turbo on! Every tap counts x3');renderTurbo()};

/* boosts */
function renderBoosts(){
 $('#boosts').innerHTML=BOOSTS.map(function(b){
  var lv=S.lv[b.id],c=cost(b),max=lv>=20,can=S.points>=c&&!max;
  return '<div class="item"><div class="ico">'+b.ico+'</div><div class="grow"><div class="t">'+b.name+' <span style="color:var(--acc);font-size:12px">Lv '+lv+'</span></div><div class="d">'+b.desc+'</div><div class="bar"><i style="width:'+(lv/20*100)+'%"></i></div></div>'
  +'<button class="btn '+(can?'':'off')+'" data-buy="'+b.id+'">'+(max?'MAX':'✦ '+fmt(c))+'</button></div>'}).join('');
}
$('#boosts').onclick=function(e){
 var id=e.target.getAttribute('data-buy');if(!id)return;
 var b=BOOSTS.filter(function(x){return x.id===id})[0],c=cost(b);
 if(S.points<c||S.lv[id]>=20){hap('error');return}
 S.points-=c;S.lv[id]++;S.bought++;dirty=true;
 if(id==='tank'||id==='regen'){}
 hap('ok');var r=e.target.getBoundingClientRect();burst(r.left+r.width/2,r.top);
 toast(b.name+' upgraded to level '+S.lv[id]);refreshAll();save(true)};

/* daily + tasks */
function claimable(){
 var n=0;if(S.lastDaily!==today())n++;
 TASKS.forEach(function(t){if(!S.claimed[t.id]&&t.p()>=t.goal)n++});return n}
function renderEarn(){
 var n=streakEff(),ct=S.lastDaily===today(),done=ct?((n-1)%7)+1:n%7,now=ct?-1:n%7,h='';
 for(var i=0;i<7;i++)h+='<div class="day '+(i<done?'done':i===now?'now':'')+'"><span>Day '+(i+1)+'</span><span>'+(i<done?'✅':'🎁')+'</span><b>'+DAILY[i]+'</b></div>';
 $('#daily').innerHTML='<div class="row"><div class="grow"><h2>🔥 '+n+' day streak</h2><p class="s">Come back every day, miss one and the streak resets.</p></div></div><div class="days">'+h+'</div>'
  +(ct?'<button class="btn big off">Come back tomorrow</button>':'<button class="btn gold big" id="dBtn">Claim ✦ '+DAILY[n%7]+'</button>');
 var db=$('#dBtn');if(db)db.onclick=function(ev){
  var n2=streakEff(),rw=DAILY[n2%7];S.points+=rw;S.total+=rw;S.streak=n2+1;S.lastDaily=today();S.dcount++;dirty=true;
  hap('ok');burst(ev.clientX,ev.clientY);toast('+'+rw+' points. See you tomorrow!');refreshAll();save(true)};
 $('#tasks').innerHTML=TASKS.map(function(t){
  var p=Math.min(t.p(),t.goal),ok=p>=t.goal,cl=S.claimed[t.id];
  return '<div class="item"><div class="ico">'+t.ico+'</div><div class="grow"><div class="t">'+t.title+'</div><div class="d">'+t.desc+' · '+fmt(p)+'/'+fmt(t.goal)+'</div><div class="bar"><i style="width:'+(p/t.goal*100)+'%"></i></div></div>'
  +'<button class="btn '+(cl?'off':ok?'acc':'off')+'" data-task="'+t.id+'">'+(cl?'Done ✓':ok?'Claim ✦ '+fmt(t.rw):'✦ '+fmt(t.rw))+'</button></div>'}).join('');
 var d=$('#dot');d.style.display=claimable()?'block':'none';
}
$('#tasks').onclick=function(e){
 var id=e.target.getAttribute('data-task');if(!id)return;
 var t=TASKS.filter(function(x){return x.id===id})[0];
 if(S.claimed[id]||t.p()<t.goal){hap('error');return}
 S.claimed[id]=1;S.points+=t.rw;S.total+=t.rw;dirty=true;hap('ok');
 var r=e.target.getBoundingClientRect();burst(r.left+r.width/2,r.top);toast('Task complete! +'+fmt(t.rw)+' points');refreshAll();save(true)};

/* ranks + invite */
$('#invite').onclick=function(){
 var link=location.href.split('#')[0],txt='I am tapping Nova points in Nova Tap. Join me and climb the leaderboard! 🚀';
 var url='https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(txt);
 try{if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.openTelegramLink)Telegram.WebApp.openTelegramLink(url);else window.open(url,'_blank')}catch(e){}
 S.shares++;dirty=true;hap('ok');toast('Invite sent! Check your tasks');refreshAll();save(true)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
async function loadBoard(){
 var b=$('#board');b.innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>';
 await save(true);var list=[];
 try{list=await SayApp.top('score',20)||[]}catch(e){list=[]}
 if(!list.length){b.innerHTML='<div class="empty"><div>🏆</div>No players yet. Keep tapping and take the first spot!</div>';return}
 var medals=['🥇','🥈','🥉'];
 b.innerHTML=list.map(function(r,i){return '<div class="rk '+(r.me?'me':'')+'"><div class="n">'+(medals[i]||(i+1))+'</div><div class="grow t">'+esc(r.name||'Player')+(r.me?' (you)':'')+'</div><div class="v">✦ '+fmt(r.value)+'</div></div>'}).join('')}

/* tabs */
$('#nav').onclick=function(e){
 var b=e.target.closest('button');if(!b)return;var t=b.getAttribute('data-tab');
 document.querySelectorAll('nav button').forEach(function(x){x.classList.toggle('on',x===b)});
 document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x.id==='t-'+t)});
 hap('tap');$('main').scrollTop=0;
 if(t==='rank')loadBoard();if(t==='boost')renderBoosts();if(t==='earn')renderEarn()};

/* save + loop */
async function save(force){
 if(!dirty&&!force)return;dirty=false;S.last=Date.now();
 try{await SayApp.set('state',S);await SayApp.set('score',Math.floor(S.total))}catch(e){}}
setInterval(function(){save(false)},5000);
document.addEventListener('visibilitychange',function(){if(document.hidden)save(true)});
var tick=0;
setInterval(function(){
 tick++;var mx=maxE();
 if(S.energy<mx){S.energy=Math.min(mx,S.energy+regen());dirty=true}
 var h=hourly();if(h){S.frac+=h/3600;if(S.frac>=1){var g=Math.floor(S.frac);S.frac-=g;S.points+=g;S.total+=g;dirty=true}}
 setBal();renderEnergy();renderLeague();renderTurbo();
 if(tick%3===0){var d=$('#dot');d.style.display=claimable()?'block':'none';if($('#t-boost').classList.contains('on'))renderBoosts()}
},1000);

/* init */
(async function(){
 try{$('#uname').textContent='Hi, '+(SayApp.user&&SayApp.user.first_name||'Player')}catch(e){}
 try{var saved=await SayApp.get('state');
  if(saved&&typeof saved==='object'){for(var k in saved)S[k]=saved[k];S.lv=Object.assign({multi:0,tank:0,regen:0,miner:0},S.lv||{});S.claimed=S.claimed||{};S.turbo=S.turbo||{day:'',used:0}}}catch(e){}
 if(S.last){var secs=Math.min(10800,(Date.now()-S.last)/1000);
  S.energy=Math.min(maxE(),S.energy+secs*regen());
  var gain=Math.floor(secs/3600*hourly());
  if(gain>0){S.points+=gain;S.total+=gain;dirty=true;setTimeout(function(){toast('🤖 Your miner earned +'+fmt(gain)+' while you were away')},600)}}
 shown=S.points;$('#bal').textContent=fmt(shown);refreshAll();
})();
});
</script>
</body>
