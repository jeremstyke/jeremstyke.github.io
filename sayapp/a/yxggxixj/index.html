<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zap Rush</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --y:#ffcc00;--y2:#ff9d00;--v:#8b5cff;--bg:#0a0a10;--c1:#14141d;--c2:#1d1d2b;--tx:#f6f4ec;--mu:#8d8a9c;--bad:#ff4d6d;
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;overflow-x:hidden}
body{background:radial-gradient(600px 400px at 85% -5%,rgba(255,204,0,.18),transparent 60%),radial-gradient(500px 400px at -10% 40%,rgba(139,92,255,.16),transparent 60%),var(--bg);background-attachment:fixed}
.app{max-width:430px;margin:0 auto;padding:calc(16px + var(--st)) 16px calc(24px + var(--sb));min-height:100%;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
h1{font-size:30px;font-weight:900;letter-spacing:-.02em;line-height:1}
h1 span{background:linear-gradient(120deg,var(--y),var(--y2));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{display:flex;align-items:center;gap:8px;background:var(--c1);border:1px solid rgba(255,255,255,.07);border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.pill b{color:var(--y)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--c1);border-radius:18px;padding:4px;position:relative;border:1px solid rgba(255,255,255,.06)}
.tabs i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:14px;background:linear-gradient(135deg,var(--y),var(--y2));box-shadow:0 6px 20px rgba(255,170,0,.35);transition:transform .25s cubic-bezier(.3,.8,.3,1)}
.tabs.r i{transform:translateX(100%)}
.tabs button{position:relative;z-index:1;background:none;border:0;color:var(--mu);font:700 15px 'Outfit',sans-serif;padding:12px;cursor:pointer;transition:color .2s,transform .15s}
.tabs button.on{color:#1a1200}
.tabs button:active{transform:scale(.96)}
.view{display:none;flex-direction:column;gap:16px;animation:in .3s ease}
.view.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hud{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px}
.card{background:linear-gradient(160deg,var(--c2),var(--c1));border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05)}
.card .v{font-size:30px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.card.main .v{color:var(--y);text-shadow:0 0 24px rgba(255,204,0,.45)}
.card .v.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.18)}}
.bar{height:8px;border-radius:8px;background:var(--c1);overflow:hidden;border:1px solid rgba(255,255,255,.05)}
.bar div{height:100%;width:100%;transform-origin:left;background:linear-gradient(90deg,var(--y2),var(--y));box-shadow:0 0 14px var(--y);transform:scaleX(1)}
.arena{position:relative;height:min(52vh,400px);min-height:340px;border-radius:24px;overflow:hidden;border:1px solid rgba(255,204,0,.2);background:radial-gradient(circle at 50% 40%,rgba(255,204,0,.08),transparent 65%),linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/32px 32px,#0f0f18;box-shadow:0 16px 40px rgba(0,0,0,.5),0 0 40px rgba(255,204,0,.06);touch-action:manipulation}
.arena.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.arena.flash::after{content:"";position:absolute;inset:0;background:rgba(255,77,109,.28);animation:fl .35s forwards;pointer-events:none}
@keyframes fl{to{opacity:0}}
.t{position:absolute;width:64px;height:64px;border:0;border-radius:50%;font-size:30px;display:grid;place-items:center;cursor:pointer;animation:pop .22s cubic-bezier(.3,1.6,.5,1);transition:transform .15s,opacity .2s}
.t.z{background:radial-gradient(circle at 35% 30%,#fff3a6,var(--y) 55%,var(--y2));box-shadow:0 0 26px rgba(255,204,0,.65),0 6px 14px rgba(0,0,0,.4)}
.t.g{background:radial-gradient(circle at 35% 30%,#e2d4ff,var(--v) 60%,#5a2ee0);box-shadow:0 0 30px rgba(139,92,255,.8),0 6px 14px rgba(0,0,0,.4)}
.t.b{background:radial-gradient(circle at 35% 30%,#ff9fb2,var(--bad) 60%,#a0153a);box-shadow:0 0 24px rgba(255,77,109,.6),0 6px 14px rgba(0,0,0,.4)}
.t::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,255,255,.55);animation:ring var(--life) linear forwards}
.t:active{transform:scale(.88)}
.t.out{opacity:0;transform:scale(.4)}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(.55);opacity:0}}
.fl{position:absolute;font-weight:900;font-size:24px;pointer-events:none;animation:up .8s ease-out forwards;text-shadow:0 2px 12px rgba(0,0,0,.6);z-index:3}
@keyframes up{from{transform:translateY(0) scale(.7);opacity:1}to{transform:translateY(-60px) scale(1.2);opacity:0}}
.pt{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:2}
.ov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:rgba(10,10,16,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .25s}
.ov.hide{opacity:0;pointer-events:none}
.ov .big{font-size:64px;font-weight:900;color:var(--y);text-shadow:0 0 40px rgba(255,204,0,.6);line-height:1}
.ov h2{font-size:26px;font-weight:900}
.ov p{color:var(--mu);font-size:15px;line-height:1.5;max-width:280px}
.legend{display:flex;gap:12px;font-size:13px;color:var(--mu);font-weight:600;flex-wrap:wrap;justify-content:center}
.badge{background:linear-gradient(135deg,var(--v),#c06bff);padding:6px 14px;border-radius:999px;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 0 24px rgba(139,92,255,.6);animation:bump .6s .2s}
.btn{border:0;cursor:pointer;font:800 18px 'Outfit',sans-serif;color:#1a1200;padding:16px 36px;border-radius:18px;background:linear-gradient(135deg,var(--y),var(--y2));box-shadow:0 10px 30px rgba(255,170,0,.4),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .15s;animation:glow 2s infinite}
.btn:active{transform:scale(.95)}
.btn.sec{background:var(--c2);color:var(--tx);box-shadow:none;border:1px solid rgba(255,255,255,.1);font-size:15px;padding:12px 24px;animation:none}
@keyframes glow{50%{box-shadow:0 10px 44px rgba(255,190,0,.65),inset 0 1px 0 rgba(255,255,255,.5)}}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:linear-gradient(160deg,var(--c2),var(--c1));border:1px solid rgba(255,255,255,.06);animation:in .35s both}
.row.me{border-color:rgba(255,204,0,.6);box-shadow:0 0 24px rgba(255,204,0,.2)}
.rk{width:28px;text-align:center;font-weight:800;color:var(--mu);font-size:16px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#1a1200;background:linear-gradient(135deg,var(--y),var(--y2))}
.nm{flex:1;font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-weight:900;font-size:20px;color:var(--y);font-variant-numeric:tabular-nums}
.sk{height:66px;border-radius:18px;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c1));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:40px 16px;color:var(--mu);line-height:1.6}
.empty div{font-size:48px;margin-bottom:8px}
footer{margin-top:auto;text-align:center;font-size:12px;color:var(--mu);opacity:.6;padding-top:8px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><div class="lbl" id="hello">Bienvenue</div><h1>Zap<span>Rush</span> ⚡</h1></div>
    <div class="pill">🏆 <b id="best">0</b></div>
  </header>
  <div class="tabs" id="tabs"><i></i><button class="on" data-v="play">Jouer</button><button data-v="rank">Classement</button></div>

  <section class="view on" id="v-play">
    <div class="hud">
      <div class="card main"><div class="lbl">Score</div><div class="v" id="score">0</div></div>
      <div class="card"><div class="lbl">Combo</div><div class="v" id="combo">x1</div></div>
      <div class="card"><div class="lbl">Temps</div><div class="v" id="time">30</div></div>
    </div>
    <div class="bar"><div id="bar"></div></div>
    <div class="arena" id="arena">
      <div class="ov" id="ov"></div>
    </div>
    <div class="lbl" style="text-align:center">Les 5 touches d'affilée augmentent ton combo</div>
  </section>

  <section class="view" id="v-rank">
    <div class="lbl">Top 20 des meilleurs scores</div>
    <div class="list" id="list"></div>
  </section>

  <footer>Made with SayApp</footer>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://jeremstyke.github.io/sayapp/sdk.js" data-app="yxggxixj"></script>
<script>
window.addEventListener('load', async function(){
  var $ = function(s){return document.querySelector(s)};
  try{ Telegram.WebApp.ready(); Telegram.WebApp.expand(); }catch(e){}
  var DUR = 30;
  var best = 0, games = 0, playing = false, score = 0, combo = 0, endAt = 0;
  var tickId = null, spawnId = null;
  var arena = $('#arena'), ov = $('#ov');
  var hap = function(k){ try{ SayApp.haptic(k); }catch(e){} };
  var esc = function(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
  var user = (window.SayApp && SayApp.user) || {};
  $('#hello').textContent = 'Salut, ' + (user.first_name || 'champion');

  try{
    var b = await SayApp.get('best'); var g = await SayApp.get('games');
    best = Number(b) || 0; games = Number(g) || 0;
  }catch(e){}
  $('#best').textContent = best;

  function countTo(el, to, ms){
    var t0 = performance.now();
    (function f(n){
      var p = Math.min(1, (n - t0) / ms);
      el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
      if(p < 1) requestAnimationFrame(f);
    })(t0);
  }
  function bump(el){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  var mult = function(){ return 1 + Math.min(3, Math.floor(combo / 5)); };
  function hud(){
    $('#score').textContent = score;
    $('#combo').textContent = 'x' + mult();
  }

  function showOverlay(mode){
    if(mode === 'start'){
      ov.innerHTML = '<div style="font-size:56px">⚡</div><h2>Prêt à zapper ?</h2><p>Tape un maximum d\'éclairs en 30 secondes. Fuis les bombes !</p>' +
        '<div class="legend"><span>⚡ +1</span><span>💎 +5</span><span>💣 -5</span></div><button class="btn" id="go">Jouer</button>';
    }else{
      var rec = mode === 'record';
      ov.innerHTML = (rec ? '<div class="badge">Nouveau record</div>' : '<div class="lbl">Temps écoulé</div>') +
        '<div class="big" id="fin">0</div><p>' + (rec ? 'Incroyable, tu t\'es dépassé !' : (score >= best * 0.8 && best ? 'Tout près de ton record de ' + best + ' !' : 'Ton record est de ' + best + '. Tu peux faire mieux !')) + '</p>' +
        '<button class="btn" id="go">Rejouer</button><button class="btn sec" id="lb">Voir le classement</button>';
      countTo($('#fin'), score, 800);
      var lb = $('#lb'); if(lb) lb.onclick = function(){ hap('tap'); setTab('rank'); };
    }
    ov.classList.remove('hide');
    $('#go').onclick = function(){ hap('tap'); start(); };
  }

  function float(x, y, txt, color){
    var f = document.createElement('div');
    f.className = 'fl'; f.textContent = txt; f.style.color = color;
    f.style.left = Math.max(8, x - 10) + 'px'; f.style.top = y + 'px';
    arena.appendChild(f); setTimeout(function(){ f.remove(); }, 850);
  }
  function burst(x, y, color){
    for(var i = 0; i < 10; i++){
      var p = document.createElement('span'); p.className = 'pt';
      p.style.cssText = 'left:' + x + 'px;top:' + y + 'px;background:' + color + ';box-shadow:0 0 8px ' + color;
      arena.appendChild(p);
      var a = Math.random() * 6.28, d = 40 + Math.random() * 50;
      var an = p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate(' + Math.cos(a) * d + 'px,' + Math.sin(a) * d + 'px) scale(0)',opacity:0}], {duration:500 + Math.random() * 200, easing:'cubic-bezier(.2,.8,.3,1)'});
      an.onfinish = (function(el){ return function(){ el.remove(); }; })(p);
    }
  }

  function spawn(){
    if(!playing) return;
    var el_ = DUR - Math.max(0, (endAt - performance.now()) / 1000);
    var r = Math.random(), kind = r < 0.68 ? 'z' : r < 0.78 ? 'g' : 'b';
    var w = arena.clientWidth, h = arena.clientHeight;
    var life = Math.max(750, 1600 - el_ * 25);
    var t = document.createElement('button');
    t.className = 't ' + kind; t.style.setProperty('--life', life + 'ms');
    t.textContent = kind === 'z' ? '⚡' : kind === 'g' ? '💎' : '💣';
    var x = 8 + Math.random() * (w - 80), y = 8 + Math.random() * (h - 80);
    t.style.left = x + 'px'; t.style.top = y + 'px';
    var done = false;
    t.addEventListener('pointerdown', function(ev){
      ev.preventDefault();
      if(done || !playing) return; done = true;
      var cx = x + 32, cy = y + 32;
      if(kind === 'b'){
        score = Math.max(0, score - 5); combo = 0; hap('error');
        float(cx, y, '-5', '#ff4d6d'); burst(cx, cy, '#ff4d6d');
        arena.classList.remove('shake', 'flash'); void arena.offsetWidth; arena.classList.add('shake', 'flash');
      }else{
        combo++;
        var pts = (kind === 'g' ? 5 : 1) * mult();
        score += pts; hap(kind === 'g' ? 'ok' : 'tap');
        float(cx, y, '+' + pts, kind === 'g' ? '#c9b3ff' : '#ffcc00');
        burst(cx, cy, kind === 'g' ? '#8b5cff' : '#ffcc00');
        if(combo % 5 === 0) bump($('#combo'));
      }
      bump($('#score')); hud(); t.remove();
    });
    arena.appendChild(t);
    setTimeout(function(){
      if(done) return; done = true; t.classList.add('out');
      setTimeout(function(){ t.remove(); }, 200);
    }, life);
    spawnId = setTimeout(spawn, Math.max(300, 700 - el_ * 14) * (0.7 + Math.random() * 0.6));
  }

  function start(){
    clearTimeout(spawnId); clearInterval(tickId);
    arena.querySelectorAll('.t,.fl,.pt').forEach(function(n){ n.remove(); });
    score = 0; combo = 0; playing = true; hud();
    endAt = performance.now() + DUR * 1000;
    ov.classList.add('hide');
    tickId = setInterval(function(){
      var left = Math.max(0, (endAt - performance.now()) / 1000);
      $('#time').textContent = Math.ceil(left);
      $('#bar').style.transform = 'scaleX(' + (left / DUR) + ')';
      if(left <= 0) end();
    }, 80);
    spawn();
  }

  async function end(){
    playing = false; clearInterval(tickId); clearTimeout(spawnId);
    $('#time').textContent = '0'; $('#bar').style.transform = 'scaleX(0)';
    arena.querySelectorAll('.t').forEach(function(n){ n.remove(); });
    var rec = score > best;
    games++;
    if(rec){ best = score; $('#best').textContent = best; hap('ok'); bump($('#best')); }
    showOverlay(rec ? 'record' : 'over');
    try{
      if(rec) await SayApp.set('best', best);
      await SayApp.set('games', games);
    }catch(e){}
  }

  async function loadRank(){
    var list = $('#list');
    list.innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>';
    var data = [];
    try{ data = await SayApp.top('best', 20) || []; }catch(e){}
    if(!data.length){
      list.innerHTML = '<div class="empty"><div>🏁</div>Personne n\'est encore au classement.<br>Lance une partie et prends la première place !</div>';
      return;
    }
    var medals = ['🥇', '🥈', '🥉'];
    list.innerHTML = data.map(function(r, i){
      var nm = r.name || 'Joueur';
      return '<div class="row' + (r.me ? ' me' : '') + '" style="animation-delay:' + (i * 40) + 'ms"><div class="rk">' + (medals[i] || (i + 1)) +
        '</div><div class="av">' + esc(nm.charAt(0).toUpperCase()) + '</div><div class="nm">' + esc(nm) + (r.me ? ' (toi)' : '') +
        '</div><div class="sc">' + esc(String(r.value)) + '</div></div>';
    }).join('');
  }

  function setTab(v){
    if(playing) return;
    document.querySelectorAll('#tabs button').forEach(function(b){ b.classList.toggle('on', b.dataset.v === v); });
    $('#tabs').classList.toggle('r', v === 'rank');
    $('#v-play').classList.toggle('on', v === 'play');
    $('#v-rank').classList.toggle('on', v === 'rank');
    if(v === 'rank') loadRank();
  }
  document.querySelectorAll('#tabs button').forEach(function(b){
    b.onclick = function(){ hap('tap'); setTab(b.dataset.v); };
  });

  hud();
  showOverlay('start');
});
</script>
</body>
</html>
