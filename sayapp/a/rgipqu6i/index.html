<!-- sayapp rgipqu6i v1 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Meme Mogul</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090d;--card:#111620;--card2:#171e2b;--line:#222b3a;--g:#21f08a;--r:#ff4d6d;--v:#8b5cf6;--t:#eef2f8;--m:#7d8aa3;--f:'Space Grotesk',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{background:var(--bg);color:var(--t);font-family:var(--f);overflow-x:hidden}
body{min-height:100vh;background:radial-gradient(600px 300px at 80% -50px,rgba(139,92,246,.25),transparent),radial-gradient(500px 300px at 0 0,rgba(33,240,138,.12),transparent),var(--bg)}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;transition:transform .15s,opacity .2s}
button:active{transform:scale(.96)}
header{padding:calc(var(--sa-top,0px) + 8px) 20px 8px}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--m);font-weight:500}
#nw{font-size:42px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
#pl{font-size:14px;font-weight:500;margin-top:2px}
.up{color:var(--g)}.dn{color:var(--r)}
main{padding:8px 16px calc(110px + env(safe-area-inset-bottom))}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.row .em{width:44px;height:44px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-size:24px;border:1px solid var(--line);flex:none}
.row .mid{flex:1;min-width:0}
.row b{font-size:16px;display:block}
.row small{color:var(--m);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.row .r{text-align:right;font-size:15px;font-weight:700}
.row .r small{font-weight:500}
svg.sp{width:64px;height:30px;flex:none}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;background:rgba(17,22,32,.92);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;padding:6px;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.tabs button{flex:1;padding:9px 0;border-radius:18px;font-size:11px;color:var(--m);font-weight:500;letter-spacing:.04em}
.tabs button span{display:block;font-size:20px;margin-bottom:1px}
.tabs button.on{background:linear-gradient(135deg,rgba(33,240,138,.18),rgba(139,92,246,.22));color:var(--t)}
h2{font-size:22px;margin:6px 4px 12px;letter-spacing:-.01em}
.btn{width:100%;padding:15px;border-radius:16px;font-weight:700;font-size:16px;background:linear-gradient(135deg,var(--g),#12c46b);color:#032012;box-shadow:0 6px 24px rgba(33,240,138,.35)}
.btn.sell{background:linear-gradient(135deg,#ff6b88,var(--r));color:#fff;box-shadow:0 6px 24px rgba(255,77,109,.35)}
.btn.vio{background:linear-gradient(135deg,var(--v),#c24df0);color:#fff;box-shadow:0 6px 24px rgba(139,92,246,.4)}
.btn:disabled{opacity:.35;box-shadow:none}
.mini{padding:9px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:700}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.sheetbg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:28px 28px 0 0;border-top:1px solid var(--line);padding:18px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:11;max-height:92vh;overflow:auto}
.sheet.on{transform:none}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin:12px 0}
.seg button{flex:1;padding:10px;border-radius:11px;font-weight:700;font-size:14px;color:var(--m)}
.seg button.buy.on{background:var(--g);color:#032012}.seg button.sell.on{background:var(--r);color:#fff}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chips button{flex:1;padding:10px 0;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:700;color:var(--m)}
.chips button.on{border-color:var(--v);color:var(--t);background:rgba(139,92,246,.2)}
input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--t);font-family:inherit;font-size:16px;margin:6px 0 12px;outline:0}
input:focus{border-color:var(--v)}
.emo{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:6px 0 14px}
.emo button{aspect-ratio:1;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-size:24px}
.emo button.on{border-color:var(--g);background:rgba(33,240,138,.12)}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.empty{text-align:center;color:var(--m);padding:28px 12px;font-size:14px;line-height:1.5}
.empty i{display:block;font-style:normal;font-size:40px;margin-bottom:8px}
.rank{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.rank.me{border-color:var(--g);box-shadow:0 0 18px rgba(33,240,138,.25)}
.rank .n{width:30px;font-size:18px;font-weight:700;text-align:center;color:var(--m)}
.rank .nm{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .v{font-weight:700}
.sk{height:52px;border-radius:16px;margin-bottom:8px;background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.fl{position:fixed;font-weight:700;font-size:20px;pointer-events:none;z-index:50;animation:fl 1.1s ease-out forwards;text-shadow:0 2px 12px rgba(0,0,0,.6)}
@keyframes fl{to{transform:translateY(-80px);opacity:0}}
.toast{position:fixed;top:calc(var(--sa-top,0px) + 56px);left:50%;transform:translate(-50%,-20px);background:var(--card2);border:1px solid var(--v);padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;transition:.3s;z-index:60;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;color:var(--m);font-size:11px;margin-top:18px;line-height:1.6;opacity:.8}
.pg{animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
</style>
</head>
<body>
<header>
  <div class="lbl">Net worth</div>
  <div id="nw">$10,000</div>
  <div id="pl" class="up">+$0 all time</div>
</header>
<main id="main"></main>
<nav class="tabs" id="tabs">
  <button data-t="market"><span>📈</span>Market</button>
  <button data-t="port"><span>💼</span>Wallet</button>
  <button data-t="launch"><span>🚀</span>Launch</button>
  <button data-t="rank"><span>🏆</span>Ranks</button>
</nav>
<div class="sheetbg" id="bg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://jeremstyke.github.io/sayapp/sdk.js" data-app="rgipqu6i" data-full="1"></script>
<script>
window.addEventListener('load',async()=>{
const $=id=>document.getElementById(id);
const START=10000;
const EMO=['🐸','🦍','🐙','🍄','🔥','💎','🦄','🧀','👽','🐢','🥑','🤡'];
const base=[
 {id:'woof',tk:'WOOF',em:'🐶',name:'Woofcoin',p:0.0421,vol:.035},
 {id:'meow',tk:'MEOW',em:'😼',name:'Meowney',p:0.813,vol:.045},
 {id:'frogz',tk:'FROGZ',em:'🐸',name:'Frogzilla',p:0.00231,vol:.06},
 {id:'pizza',tk:'PIZZA',em:'🍕',name:'Pizza Party',p:12.4,vol:.025},
 {id:'moony',tk:'MOONY',em:'🚀',name:'Moonshot',p:0.155,vol:.08}];
let s={cash:START,hold:{},coins:null};
try{const d=await SayApp.get('save');if(d&&typeof d.cash==='number')s=d}catch(e){}
function mkHist(p){const h=[p];for(let i=0;i<40;i++)h.unshift(h[0]/(1+(Math.random()-.5)*.08));return h}
if(!s.coins||!s.coins.length)s.coins=base.map(c=>({...c,b:c.p,hype:0,h:mkHist(c.p)}));
let coins=s.coins,tab='market',cur=null,mode='buy',pct=.5,pick=0,dirty=true,shown=0,lastShill=0;
const tg=window.Telegram&&Telegram.WebApp;try{tg&&tg.ready()}catch(e){}

const fp=p=>p>=100?p.toFixed(1):p>=1?p.toFixed(2):p>=.01?p.toFixed(4):p.toFixed(6);
const fm=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:0});
const fm2=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:2});
const chg=c=>c.p/c.h[0]-1;
const nw=()=>s.cash+coins.reduce((a,c)=>a+(s.hold[c.id]?s.hold[c.id].q*c.p:0),0);
const pc=x=>(x>=0?'+':'')+(x*100).toFixed(1)+'%';
const cl=x=>x>=0?'up':'dn';

function spark(c,cls){
  const h=c.h,mn=Math.min(...h),mx=Math.max(...h),rg=(mx-mn)||1,up=chg(c)>=0,col=up?'#21f08a':'#ff4d6d';
  const pts=h.map((v,i)=>(i/(h.length-1)*100).toFixed(1)+','+(Math.round((1-(v-mn)/rg)*90+5))).join(' ');
  return `<svg class="${cls||'sp'}" viewBox="0 0 100 100" preserveAspectRatio="none"><polygon points="0,100 ${pts} 100,100" fill="${col}" opacity=".13"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function float(e,t,good){
  const x=(e&&e.clientX)||innerWidth/2,y=(e&&e.clientY)||innerHeight/2,d=document.createElement('div');
  d.className='fl';d.textContent=t;d.style.cssText=`left:${x-40}px;top:${y-20}px;color:${good?'#21f08a':'#ff4d6d'}`;
  document.body.appendChild(d);setTimeout(()=>d.remove(),1100);
}
function confetti(){
  for(let i=0;i<22;i++){const d=document.createElement('div');d.className='fl';d.textContent=['💰','🚀','💎','✨'][i%4];
    d.style.cssText=`left:${20+Math.random()*60}%;top:${50+Math.random()*10}%;font-size:${16+Math.random()*14}px;animation-duration:${.9+Math.random()*.8}s`;
    document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
}
function anim(v){
  const e=$('nw'),from=shown,t0=performance.now();shown=v;
  (function f(t){const k=Math.min(1,(t-t0)/400);e.textContent=fm(from+(v-from)*k);if(k<1)requestAnimationFrame(f)})(t0);
}
function head(){
  const n=nw(),p=n-START;anim(n);
  const e=$('pl');e.className=cl(p);e.textContent=(p>=0?'+':'')+fm(p)+' all time ('+pc(p/START)+')';
}

/* market simulation */
function tick(){
  coins.forEach(c=>{
    let r=(Math.random()-.5)*2*c.vol+c.hype*.03+(c.own?-.003:(c.b-c.p)/c.b*.004);
    c.hype*=.92;
    if(Math.random()<.012){const d=Math.random()<.5?1:-1;c.hype+=d*(.6+Math.random()*.8);
      if(!c.own||d>0)toast((d>0?'🚀 ':'🩸 ')+c.tk+(d>0?' is pumping!':' is dumping!'))}
    c.p=Math.max(1e-6,c.p*(1+r));c.h.push(c.p);if(c.h.length>41)c.h.shift();
  });
  dirty=true;head();
  if(tab==='market')renderMarket();else if(tab==='port')renderPort();
  if(cur)renderSheet();
}

/* views */
function renderMarket(){
  $('main').innerHTML=(tab==='market'&&$('main').dataset.v!=='market'?'<h2>Hot coins 🔥</h2>':'<h2>Hot coins 🔥</h2>')+
  `<div>${coins.map(c=>{const x=chg(c),hd=s.hold[c.id];
   return `<div class="card" style="padding:10px 12px"><button class="row" data-open="${c.id}"><div class="em">${c.em}</div><div class="mid"><b>$${c.tk}</b><small>${hd?'Holding '+fm(hd.q*c.p):c.name}</small></div>${spark(c)}<div class="r">$${fp(c.p)}<small class="${cl(x)}">${pc(x)}</small></div></button></div>`}).join('')}</div>
   <div class="foot">Virtual cash, no real value. Prices are simulated.<br>Made with SayApp</div>`;
}
function renderPort(){
  const hs=coins.filter(c=>s.hold[c.id]&&s.hold[c.id].q>0);
  $('main').innerHTML=`<h2>Your wallet</h2>
  <div class="card"><div class="lbl">Cash</div><div class="big">${fm2(s.cash)}</div></div>
  ${hs.length?hs.map(c=>{const h=s.hold[c.id],v=h.q*c.p,pl=v-h.cost;
   return `<div class="card" style="padding:10px 12px"><button class="row" data-open="${c.id}"><div class="em">${c.em}</div><div class="mid"><b>$${c.tk}</b><small>${h.q.toLocaleString('en-US',{maximumFractionDigits:2})} coins</small></div><div class="r">${fm2(v)}<small class="${cl(pl)}">${pl>=0?'+':''}${fm2(pl)}</small></div></button></div>`}).join('')
   :'<div class="empty"><i>🫥</i>No coins yet.<br>Head to the market and ape into something.</div>'}
  ${nw()<100?'<button class="btn vio" data-act="rescue">🆘 Rekt? Get $1,000 rescue</button>':''}
  <div class="foot">Virtual cash, no real value.<br>Made with SayApp</div>`;
}
function renderLaunch(){
  const mine=coins.filter(c=>c.own);
  $('main').innerHTML=`<h2>Launch your coin 🚀</h2>
  <div class="card"><div class="lbl">Coin name</div><input id="cn" maxlength="14" placeholder="e.g. Doge Wizard">
  <div class="lbl">Ticker</div><input id="ct" maxlength="5" placeholder="WIZ" style="text-transform:uppercase">
  <div class="lbl">Mascot</div><div class="emo">${EMO.map((e,i)=>`<button data-pick="${i}" class="${i===pick?'on':''}">${e}</button>`).join('')}</div>
  <button class="btn vio" data-act="launch">Launch for $250</button>
  <div class="foot" style="margin-top:10px">You get 100,000 coins at $0.01. Shill to pump it, but hype always fades. Max 3 coins.</div></div>
  <h2 style="font-size:18px">Your coins</h2>
  ${mine.length?mine.map(c=>`<div class="card" style="padding:10px 12px"><button class="row" data-open="${c.id}"><div class="em">${c.em}</div><div class="mid"><b>$${c.tk}</b><small>${c.name}</small></div>${spark(c)}<div class="r">$${fp(c.p)}<small class="${cl(chg(c))}">${pc(chg(c))}</small></div></button></div>`).join('')
  :'<div class="empty"><i>🧪</i>You have not launched anything yet.</div>'}
  <div class="foot">Made with SayApp</div>`;
}
async function renderRank(){
  $('main').innerHTML='<h2>Richest traders 🏆</h2><div id="rk">'+'<div class="sk"></div>'.repeat(5)+'</div><div class="foot">Virtual cash, no real value.<br>Made with SayApp</div>';
  let list=[];
  try{await SayApp.set('networth',Math.round(nw()));list=await SayApp.top('networth',20)}catch(e){}
  if(tab!=='rank')return;
  const medal=['🥇','🥈','🥉'];
  $('rk').innerHTML=list&&list.length?list.map((u,i)=>`<div class="rank ${u.me?'me':''}"><div class="n">${medal[i]||i+1}</div><div class="nm">${esc(u.name||'Anon')}${u.me?' (you)':''}</div><div class="v">${fm(u.value)}</div></div>`).join('')
   :'<div class="empty"><i>🏝️</i>Nobody on the board yet.<br>Make some trades and be the first!</div>';
}
function esc(t){return String(t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function show(t){
  tab=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  ({market:renderMarket,port:renderPort,launch:renderLaunch,rank:renderRank})[t]();
  $('main').classList.remove('pg');void $('main').offsetWidth;$('main').classList.add('pg');
}

/* trade sheet */
function amt(c){
  const h=s.hold[c.id];
  if(mode==='buy')return{usd:pct>=1?s.cash:s.cash*pct,ok:s.cash>=1};
  const q=h?h.q*pct:0;return{usd:q*c.p,ok:!!h&&h.q>0,q};
}
function renderSheet(){
  const c=coins.find(x=>x.id===cur);if(!c)return;
  const h=s.hold[c.id],a=amt(c),x=chg(c);
  $('sheet').innerHTML=`<div class="row"><div class="em">${c.em}</div><div class="mid"><b style="font-size:18px">$${c.tk}</b><small>${c.name}${h?' · you hold '+fm2(h.q*c.p):''}</small></div><div class="r"><div class="big" style="font-size:22px">$${fp(c.p)}</div><small class="${cl(x)}">${pc(x)}</small></div></div>
  <div style="margin:14px 0 0">${spark(c,'sp big-chart').replace('class="sp big-chart"','style="width:100%;height:110px"')}</div>
  <div class="seg"><button class="buy ${mode==='buy'?'on':''}" data-mode="buy">Buy</button><button class="sell ${mode==='sell'?'on':''}" data-mode="sell">Sell</button></div>
  <div class="chips">${[.25,.5,.75,1].map(v=>`<button data-pct="${v}" class="${pct===v?'on':''}">${v===1?'MAX':v*100+'%'}</button>`).join('')}</div>
  <button class="btn ${mode==='sell'?'sell':''}" data-act="trade" ${a.ok&&a.usd>=1?'':'disabled'}>${mode==='buy'?'Buy':'Sell'} ${fm2(a.usd)}</button>
  ${c.own?`<button class="btn vio" style="margin-top:10px" data-act="shill">📣 Shill for $20</button>`:''}
  <div class="foot" style="margin-top:10px">Cash: ${fm2(s.cash)}</div>`;
}
function openSheet(id){cur=id;mode='buy';pct=.5;renderSheet();$('bg').classList.add('on');$('sheet').classList.add('on')}
function closeSheet(){cur=null;$('bg').classList.remove('on');$('sheet').classList.remove('on')}

function trade(e){
  const c=coins.find(x=>x.id===cur),a=amt(c);if(!a.ok||a.usd<1)return;
  if(mode==='buy'){
    const h=s.hold[c.id]||(s.hold[c.id]={q:0,cost:0});
    h.q+=a.usd/c.p;h.cost+=a.usd;s.cash-=a.usd;
    float(e,'-'+fm(a.usd),true);SayApp.haptic('tap');
  }else{
    const h=s.hold[c.id],q=pct>=1?h.q:a.q,fr=q/h.q,cost=h.cost*fr,pl=q*c.p-cost;
    s.cash+=q*c.p;h.q-=q;h.cost-=cost;if(h.q<1e-9)delete s.hold[c.id];
    float(e,(pl>=0?'+':'')+fm(pl),pl>=0);
    if(pl>0){SayApp.haptic('ok');if(pl>500)confetti()}else SayApp.haptic('error');
  }
  dirty=true;head();renderSheet();if(tab==='market')renderMarket();if(tab==='port')renderPort();
}
function launch(e){
  const n=($('cn').value||'').trim(),t=($('ct').value||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(n.length<2||t.length<2)return toast('Pick a name and a ticker (2+ letters)');
  if(coins.some(c=>c.tk===t))return toast('That ticker already exists');
  if(coins.filter(c=>c.own).length>=3)return toast('Max 3 coins launched');
  if(s.cash<250)return toast('You need $250 cash to launch');
  s.cash-=250;
  const c={id:'u'+Date.now(),tk:t,em:EMO[pick],name:n,p:.01,b:.01,vol:.07,hype:1,own:1,h:mkHist(.01)};
  coins.push(c);s.hold[c.id]={q:100000,cost:250};
  dirty=true;head();SayApp.haptic('ok');confetti();toast('🚀 $'+t+' is live!');renderLaunch();
}
function shill(e){
  const c=coins.find(x=>x.id===cur);
  if(Date.now()-lastShill<6000)return toast('Cooldown, let the hype breathe');
  if(s.cash<20)return toast('Not enough cash');
  s.cash-=20;lastShill=Date.now();c.hype+=.6+Math.random()*.4;
  float(e,'📣 hype!',true);SayApp.haptic('tap');dirty=true;head();renderSheet();
}

/* events */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  const d=t.dataset;
  if(d.t)return show(d.t);
  if(d.open)return openSheet(d.open);
  if(d.mode){mode=d.mode;SayApp.haptic('tap');return renderSheet()}
  if(d.pct){pct=+d.pct;return renderSheet()}
  if(d.pick){pick=+d.pick;document.querySelectorAll('.emo button').forEach((b,i)=>b.classList.toggle('on',i===pick));return}
  if(d.act==='trade')return trade(e);
  if(d.act==='launch')return launch(e);
  if(d.act==='shill')return shill(e);
  if(d.act==='rescue'){s.cash+=1000;dirty=true;head();toast('Back in the game 💪');renderPort()}
});
$('bg').addEventListener('click',closeSheet);

/* save */
async function save(){
  if(!dirty)return;dirty=false;
