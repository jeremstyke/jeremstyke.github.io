  window.scrollTo(0,0);
}
async function loadRank(){
  const list=$('#rankList');list.innerHTML='<div class="sk"></div>'.repeat(5);
  $('#meBest').textContent=best;$('#meGames').textContent=games;$('#meFruits').textContent=totalFruits;
  let rows=[];try{rows=(await SA.top('best',20))||[]}catch(e){}
  if(!rows.length){list.innerHTML=`<div class="empty"><div class="eb">🏁</div><b>${T('emptyT')}</b><p>${T('emptyP')}</p><button class="btn" data-act="goplay">${T('playNow')}</button></div>`;return}
  list.innerHTML=rows.map((r,i)=>{const n=r.name||T('player');return `<div class="row${r.me?' me':''}" style="animation-delay:${i*40}ms"><div class="pos">${i<3?['🥇','🥈','🥉'][i]:i+1}</div><div class="av">${esc(n.charAt(0).toUpperCase())}</div><div class="nm">${esc(n)}${r.me?`<span class="you">${T('you')}</span>`:''}</div><div class="vl">${Number(r.value)||0}</div></div>`}).join('');
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;hap('tap');
  if(act==='start')startGame();else if(act==='resume')resume();else if(act==='continue')continueGame(a);
  else if(act==='rank')showTab('rank');else if(act==='goplay'){showTab('play');if(!running&&!busy)startGame()}
  else if(act==='skin')pickSkin(a.dataset.id);
});
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{hap('tap');showTab(b.dataset.tab)}));
$('#pauseBtn').addEventListener('click',()=>{hap('tap');pause()});
$('#wallsBtn').addEventListener('click',()=>{
  if(running||busy){toast(T('tEnd'));return}
  walls=!walls;updWalls();hap('tap');toast(walls?T('tWallsOn'):T('tWallsOff'));
  try{SA.set('walls',walls)}catch(e){}
});
const D={l:[-1,0],r:[1,0],u:[0,-1],d:[0,1]};
document.querySelectorAll('.pad button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();const v=D[b.dataset.d];setDir(v[0],v[1])}));
document.addEventListener('keydown',e=>{
  const k={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',a:'l',q:'l',d:'r',w:'u',z:'u',s:'d'}[e.key];
  if(k){e.preventDefault();setDir(...D[k])}
  else if(e.key===' '){e.preventDefault();if(running&&!paused)pause();else if(paused)resume();else if(!busy)startGame()}
});
let sx=0,sy=0;const bw=$('#boardWrap');
bw.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});
bw.addEventListener('touchmove',e=>{
  e.preventDefault();const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;
  if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1);
  sx=t.clientX;sy=t.clientY;
},{passive:false});
document.addEventListener('touchmove',e=>{if((running||busy)&&$('#play').classList.contains('active'))e.preventDefault()},{passive:false});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
window.addEventListener('resize',()=>{if($('#play').classList.contains('active'))resize()});

document.querySelectorAll('#langSw button').forEach(b=>b.addEventListener('click',()=>{
  if(b.dataset.l===lang)return;lang=b.dataset.l;hap('tap');applyLang();
  try{Promise.resolve(SA.set('lang',lang)).catch(()=>{})}catch(e){}
}));
resize();spawnSnake(4);placeFruit(true);updWalls();showOverlay('start');requestAnimationFrame(loop);
uname=(SA.user&&SA.user.first_name)||'';applyLang();
try{
  best=Number(await SA.get('best'))||0;
  const st=await SA.get('stats');if(st){games=st.games||0;totalFruits=st.fruits||0}
  walls=!!(await SA.get('walls'));
  const sl=await SA.get('lang');if(sl==='fr'||sl==='en')lang=sl;
  const sv=await SA.get('skin');if(sv)skin=sv;
  const ow=await SA.get('owned');if(Array.isArray(ow))owned=ow;
}catch(e){}
try{if(SA.purchases){const ps=await SA.purchases();(ps||[]).forEach(p=>{const id=String(p.item||'').replace('skin_','');if(SKINS.some(s=>s.id===id)&&!owned.includes(id))owned.push(id)})}}catch(e){}
if(!has(SK()))skin='classic';knownUnl=SKINS.filter(s=>s.need&&has(s)).map(s=>s.id);
$('#bestV').textContent=best;if(!running&&!busy)updWalls();applyLang();
});
</script>
</body>
</html>
