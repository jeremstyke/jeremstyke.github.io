<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pile Céleste</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--main:#7C5CFF;--main2:#A88BFF;--accent:#FFB547;--cyan:#3EE6D6;--bg:#0B0A17;--bg2:#141228;--card:#1A1833;--line:rgba(255,255,255,.08);--txt:#F4F2FF;--mut:#9B97C2;--r:20px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Sora',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
body{background:radial-gradient(120% 60% at 50% -10%,#2a1f63 0%,transparent 60%),var(--bg)}
.app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
header{padding:calc(var(--sa-top,0px) + 8px) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--main),var(--cyan));display:grid;place-items:center;box-shadow:0 6px 20px rgba(124,92,255,.5)}
.brand h1{font-size:19px;font-weight:800;letter-spacing:-.3px}
.brand small{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:1.6px;font-weight:600}
.chip{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:rgba(255,181,71,.12);border:1px solid rgba(255,181,71,.3);color:var(--accent);font-weight:700;font-size:14px}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;padding:8px 16px 16px;overflow-y:auto;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .25s,transform .25s}
.view.on{opacity:1;transform:none;pointer-events:auto}
#vGame{display:flex;flex-direction:column;gap:12px;overflow:hidden}
.stage{position:relative;flex:1;border-radius:24px;overflow:hidden;background:#0f0d22;box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 0 0 1px var(--line);touch-action:manipulation;cursor:pointer;user-select:none}
canvas{display:block;width:100%;height:100%}
.score{position:absolute;top:18px;left:0;right:0;text-align:center;font-size:56px;font-weight:800;text-shadow:0 4px 30px rgba(124,92,255,.8);pointer-events:none;transition:transform .15s}
.score.pop{transform:scale(1.2)}
.combo{position:absolute;top:86px;left:0;right:0;text-align:center;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase;opacity:0;transition:opacity .2s;pointer-events:none}
.combo.on{opacity:1}
.float{position:absolute;font-weight:800;font-size:18px;color:var(--cyan);pointer-events:none;animation:fl .9s ease-out forwards;text-shadow:0 0 12px rgba(62,230,214,.8);white-space:nowrap}
@keyframes fl{from{opacity:1;transform:translate(-50%,0) scale(.8)}to{opacity:0;transform:translate(-50%,-60px) scale(1.15)}}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(11,10,23,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .25s}
.overlay.hide{opacity:0;pointer-events:none}
.panel{width:100%;max-width:320px;background:linear-gradient(180deg,#221d46,#17142f);border:1px solid var(--line);border-radius:24px;padding:24px 20px;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.5);animation:pin .3s ease}
@keyframes pin{from{transform:scale(.9);opacity:0}}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:1.8px;color:var(--mut);font-weight:600}
.panel h2{font-size:24px;font-weight:800;margin:6px 0 4px}
.panel p{color:var(--mut);font-size:15px;line-height:1.45}
.big{font-size:64px;font-weight:800;background:linear-gradient(135deg,#fff,var(--main2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.rec{display:inline-block;margin:6px 0;padding:6px 12px;border-radius:999px;background:linear-gradient(135deg,var(--accent),#ff7a59);color:#1b1030;font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:16px;font:700 16px 'Sora',sans-serif;color:#fff;background:linear-gradient(135deg,var(--main),#5B3DF0);box-shadow:0 10px 28px rgba(124,92,255,.5),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .15s;cursor:pointer;margin-top:12px}
.btn:active{transform:scale(.96)}
.btn.ghost{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--line)}
.btn.gold{background:linear-gradient(135deg,var(--accent),#ff8a4c);color:#1b1030;box-shadow:0 10px 28px rgba(255,160,70,.4)}
.daily{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.daily .ic{font-size:24px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(62,230,214,.12)}
.daily b{font-size:15px}.daily span{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.daily .ok{margin-left:auto;font-size:12px;font-weight:700;color:var(--cyan);white-space:nowrap}
.sec{font-size:22px;font-weight:800;margin:4px 0 4px}
.sub{color:var(--mut);font-size:14px;margin-bottom:16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--card);margin-bottom:8px;border:1px solid var(--line);animation:pin .3s ease both}
.row.me{border-color:var(--main);background:linear-gradient(90deg,rgba(124,92,255,.2),var(--card))}
.rk{width:32px;text-align:center;font-weight:800;color:var(--mut)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff}
.nm{flex:1;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vl{font-weight:800;color:var(--accent)}
.sk{height:62px;border-radius:16px;margin-bottom:8px;background:linear-gradient(90deg,var(--card),#24204a,var(--card));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:40px 16px;color:var(--mut)}.empty div{font-size:48px;margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.stat b{display:block;font-size:28px;font-weight:800;margin-top:6px}
.hero{padding:20px;border-radius:24px;background:linear-gradient(135deg,#3b2a8f,#1d1846);border:1px solid var(--line);margin-bottom:12px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(var(--cyan),transparent 70%);opacity:.35}
.hero h3{font-size:20px;font-weight:800;margin-top:4px}
.hero p{font-size:14px;color:#cfc8ff;margin-top:4px}
nav{display:flex;gap:6px;padding:8px 16px calc(8px + env(safe-area-inset-bottom));background:rgba(11,10,23,.85);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
nav button{flex:1;border:0;background:none;color:var(--mut);font:600 12px 'Sora',sans-serif;padding:8px 0;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .2s;cursor:pointer}
nav button .e{font-size:20px;transition:transform .2s}
nav button.on{color:#fff;background:rgba(124,92,255,.16)}
nav button.on .e{transform:translateY(-2px) scale(1.1)}
nav button:active{transform:scale(.94)}
.foot{text-align:center;font-size:11px;color:#5d5a85;padding:12px 0 4px}
#conf{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.cf{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:cf 1.6s ease-in forwards}
@keyframes cf{to{transform:translate(var(--dx),110vh) rotate(720deg);opacity:.7}}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);background:#2a2552;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:all .25s;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="5" y="15" width="14" height="5" rx="1.5" fill="#fff"/><rect x="7" y="9.5" width="11" height="5" rx="1.5" fill="#fff" opacity=".8"/><rect x="8" y="4" width="8" height="5" rx="1.5" fill="#fff" opacity=".6"/></svg></div>
  <div><h1>Pile Céleste</h1><small>Empile jusqu'aux étoiles</small></div></div>
  <div class="chip">🏆 <span id="hBest">0</span></div>
</header>
<main>
  <section class="view on" id="vGame">
    <div class="daily"><div class="ic">🎯</div><div><b id="dTitle">Défi du jour</b><span id="dSub">Chargement...</span></div><div class="ok" id="dOk"></div></div>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="score" id="score">0</div>
      <div class="combo" id="combo">Parfait x2</div>
      <div class="overlay" id="ov"><div class="panel" id="panel"></div></div>
    </div>
  </section>
  <section class="view" id="vTop">
    <div class="sec">Classement</div>
    <div class="sub">Les plus hautes tours de tous les joueurs</div>
    <div id="list"></div>
    <div class="foot">Made with SayApp</div>
  </section>
  <section class="view" id="vMe">
    <div class="hero"><div class="lbl" style="color:#cfc8ff">Mon profil</div><h3 id="pName">Joueur</h3><p id="pRank">Lance ta première partie pour entrer dans la course.</p></div>
    <div class="grid">
      <div class="stat"><div class="lbl">Record</div><b id="sBest">0</b></div>
      <div class="stat"><div class="lbl">Parties</div><b id="sGames">0</b></div>
      <div class="stat"><div class="lbl">Parfaits</div><b id="sPerf">0</b></div>
      <div class="stat"><div class="lbl">Série 🔥</div><b id="sStreak">0</b></div>
    </div>
    <button class="btn gold" id="shareBtn">📣 Défier mes amis</button>
    <div class="foot">Made with SayApp</div>
  </section>
</main>
<nav>
  <button class="on" data-v="vGame"><span class="e">🧱</span>Jouer</button>
  <button data-v="vTop"><span class="e">🏆</span>Classement</button>
  <button data-v="vMe"><span class="e">👤</span>Profil</button>
</nav>
</div>
<div id="conf"></div>
<div class="toast" id="toast"></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://jeremstyke.github.io/sayapp/sdk.js" data-app="ajh9uahz" data-full="1"></script>
<script>
window.addEventListener('load',async()=>{
const $=id=>document.getElementById(id);
const tg=window.Telegram&&Telegram.WebApp;try{tg&&tg.ready();tg&&tg.expand()}catch(e){}
const S=window.SayApp||{get:async()=>null,set:async()=>{},top:async()=>[],haptic:()=>{},user:null};
const hap=t=>{try{S.haptic(t)}catch(e){}};
let stats={best:0,games:0,perfects:0,streak:0,lastDay:'',dDay:'',dDone:false};
const today=new Date().toISOString().slice(0,10);
const dSeed=[...today].reduce((a,c)=>a+c.charCodeAt(0)*7,0);
const target=12+(dSeed%9)*2;

function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
function count(el,to){const from=+el.textContent||0,t0=performance.now();const f=n=>{const p=Math.min(1,(n-t0)/600);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function confetti(){const c=$('conf'),cols=['#7C5CFF','#3EE6D6','#FFB547','#ff6b9a','#fff'];for(let i=0;i<60;i++){const d=document.createElement('div');d.className='cf';d.style.left=Math.random()*100+'%';d.style.background=cols[i%5];d.style.setProperty('--dx',(Math.random()*160-80)+'px');d.style.animationDelay=Math.random()*.4+'s';c.appendChild(d);setTimeout(()=>d.remove(),2200)}}

function renderDaily(){
  const done=stats.dDay===today&&stats.dDone;
  $('dTitle').textContent='Défi du jour : '+target+' blocs';
  $('dSub').textContent=done?'Bravo, défi réussi ! Reviens demain.':'Atteins '+target+' pour garder ta série 🔥 '+stats.streak;
  $('dOk').textContent=done?'✓ Réussi':'';
}
function renderMe(){
  $('pName').textContent=(S.user&&S.user.first_name)||'Joueur';
  count($('hBest'),stats.best);count($('sBest'),stats.best);count($('sGames'),stats.games);count($('sPerf'),stats.perfects);count($('sStreak'),stats.streak);
  $('pRank').textContent=stats.best?('Ta tour la plus haute : '+stats.best+' blocs. Qui fera mieux ?'):'Lance ta première partie pour entrer dans la course.';
}
try{const s=await S.get('stats');if(s&&typeof s==='object')Object.assign(stats,s)}catch(e){}
renderDaily();renderMe();

// Tabs
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  hap('tap');document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===b.dataset.v));
  if(b.dataset.v==='vTop')loadTop();if(b.dataset.v==='vMe')renderMe();if(b.dataset.v==='vGame')resize();
});

async function loadTop(){
  const L=$('list');L.innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  let r=[];try{r=await S.top('best',30)||[]}catch(e){}
  if(!r.length){L.innerHTML='<div class="empty"><div>🏗️</div>Personne n\'a encore construit de tour.<br>Sois le premier au sommet !</div>';return}
  const med=['🥇','🥈','🥉'];
  L.innerHTML=r.map((p,i)=>{const nm=String(p.name||'Joueur').replace(/[<>&]/g,'');const h=(nm.charCodeAt(0)*37)%360;
    return `<div class="row ${p.me?'me':''}" style="animation-delay:${i*40}ms"><div class="rk">${med[i]||i+1}</div><div class="av" style="background:linear-gradient(135deg,hsl(${h},70%,55%),hsl(${h+50},70%,45%))">${nm[0].toUpperCase()}</div><div class="nm">${nm}${p.me?' (toi)':''}</div><div class="vl">${p.value} 🧱</div></div>`}).join('');
}

function share(score){
  const txt=score?`J'ai empilé ${score} blocs sur Pile Céleste 🧱✨ Tu crois pouvoir me battre ?`:`Viens jouer à Pile Céleste 🧱✨ Mon record : ${stats.best} blocs. Tu relèves le défi ?`;
  hap('ok');
  try{if(tg&&tg.openTelegramLink){tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent('🧱 Pile Céleste')+'&text='+encodeURIComponent(txt));return}}catch(e){}
  if(navigator.share)navigator.share({text:txt}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(txt);toast('Message copié, envoie-le à tes amis !')}
}
$('shareBtn').onclick=()=>share(0);

// Game
const cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage');
let W=300,H=400,BH=24,stack=[],cur=null,falls=[],parts=[],cam=0,camT=0,score=0,combo=0,speed=0,state='ready',baseHue=250,lastT=0,perfCount=0,shake=0;
function resize(){const r=stage.getBoundingClientRect();if(!r.width)return;const d=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);BH=Math.max(18,Math.round(H/17));if(state!=='play')reset()}
window.addEventListener('resize',resize);
function reset(){const w=W*0.56;baseHue=200+Math.random()*120;stack=[{x:(W-w)/2,w,h:baseHue}];score=0;combo=0;perfCount=0;speed=W*0.42;falls=[];parts=[];cam=camT=0;spawn();$('score').textContent='0';$('combo').classList.remove('on')}
function spawn(){const t=stack[stack.length-1],l=stack.length%2===1;cur={x:l?-t.w*0.4:W-t.w*0.6,w:t.w,h:baseHue+stack.length*6,d:l?1:-1}}
const sy=i=>H-BH*2-(i+1)*BH+cam;
function burst(x,y,hue){for(let i=0;i<22;i++)parts.push({x,y,vx:(Math.random()-.5)*260,vy:-Math.random()*240-40,l:1,h:hue})}
function floatTxt(t,x,y){const e=document.createElement('div');e.className='float';e.textContent=t;e.style.left=x+'px';e.style.top=y+'px';stage.appendChild(e);setTimeout(()=>e.remove(),900)}
function drop(){
  if(state!=='play')return;
  const t=stack[stack.length-1],diff=cur.x-t.x,tol=Math.max(3,W*0.012),lvl=stack.length,y=sy(lvl);
  if(Math.abs(diff)<=tol){
    cur.x=t.x;combo++;perfCount++;
    if(combo>=3&&cur.w<W*0.56){const g=Math.min(W*0.03,W*0.56-cur.w);cur.w+=g;cur.x-=g/2}
    burst(cur.x+cur.w/2,y+BH/2,cur.h);hap('ok');
    floatTxt(combo>1?'Parfait x'+combo:'Parfait !',cur.x+cur.w/2,y-10);
    $('combo').textContent=combo>=3?'🔥 Combo x'+combo+' - le bloc grandit':'Parfait x'+combo;$('combo').classList.add('on');
  }else{
    const ov=cur.w-Math.abs(diff);
    if(ov<=0){falls.push({x:cur.x,w:cur.w,y,h:cur.h,vy:0,r:0,vr:cur.d*2});cur=null;return over()}
    if(diff>0)falls.push({x:t.x+t.w,w:diff,y,h:cur.h,vy:0,r:0,vr:2});
    else falls.push({x:cur.x,w:-diff,y,h:cur.h,vy:0,r:0,vr:-2});
    cur.x=Math.max(cur.x,t.x);cur.w=ov;combo=0;$('combo').classList.remove('on');hap('tap');shake=4;
  }
  stack.push({x:cur.x,w:cur.w,h:cur.h});score++;
  const se=$('score');se.textContent=score;se.classList.add('pop');setTimeout(()=>se.classList.remove('pop'),150);
  speed=Math.min(W*1.25,speed*1.035);
  camT=Math.max(0,(stack.length+3)*BH-H*0.55);
  spawn();
}
async function over(){
  state='over';hap('error');shake=10;
  const rec=score>stats.best&&score>0;
  stats.games++;stats.perfects+=perfCount;
  if(rec)stats.best=score;
  let daily=false;
  if(score>=target&&!(stats.dDay===today&&stats.dDone)){
    const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    stats.streak=stats.lastDay===y?stats.streak+1:1;stats.lastDay=today;stats.dDay=today;stats.dDone=true;daily=true;
  }
  setTimeout(()=>{
    showPanel('over',rec,daily);if(rec||daily){confetti();hap('ok')}
    renderDaily();renderMe();
  },650);
  try{await S.set('stats',stats);if(rec)await S.set('best',stats.best)}catch(e){}
}
function showPanel(kind,rec,daily){
  const P=$('panel');
  if(kind==='ready'){
    P.innerHTML=`<div class="lbl">Prêt à grimper ?</div><h2>Touche pour empiler</h2><p>Lâche chaque bloc pile sur le précédent. 3 parfaits d'affilée et ton bloc grandit !</p><button class="btn" id="go">▶ Jouer</button>`;
  }else{
    const msg=score<5?'Échauffement terminé, retente !':score<15?'Belle tour, tu peux aller plus haut.':score<30?'Impressionnant, tes amis vont transpirer.':'Légendaire. Tu touches les étoiles !';
    P.innerHTML=`<div class="lbl">Tour effondrée</div><div class="big">${score}</div>${rec?'<div class="rec">🏆 Nouveau record</div>':''}${daily?'<div class="rec" style="background:linear-gradient(135deg,#3EE6D6,#7C5CFF);color:#fff">🎯 Défi du jour réussi</div>':''}<p>${msg}<br>Record : ${stats.best} blocs</p><button class="btn" id="go">↻ Rejouer</button><button class="btn gold" id="sh">📣 Défier mes amis</button>`;
    $('sh').onclick=e=>{e.stopPropagation();share(score)};
  }
  $('go').onclick=e=>{e.stopPropagation();start()};
  $('ov').classList.remove('hide');
}
function start(){hap('tap');reset();state='play';$('ov').classList.add('hide')}
stage.addEventListener('pointerdown',e=>{if(state==='play'){e.preventDefault();drop()}});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();state==='play'?drop():start()}});

function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function block(x,y,w,h){const g=ctx.createLinearGradient(0,y,0,y+BH);g.addColorStop(0,`hsl(${h%360},85%,66%)`);g.addColorStop(1,`hsl(${(h+20)%360},75%,48%)`);ctx.fillStyle=g;rr(x,y,w,BH-2,5);ctx.fill();ctx.fillStyle='rgba(255,255,255,.28)';ctx.fillRect(x+4,y+2,Math.max(0,w-8),2)}
function frame(t){
  const dt=Math.min(.033,(t-(lastT||t))/1000);lastT=t;
  if(state==='play'&&cur){cur.x+=cur.d*speed*dt;const t0=stack[stack.length-1];const mn=t0.x-cur.w*0.9,mx=t0.x+t0.w*0.9;if(cur.x>mx){cur.x=mx;cur.d=-1}if(cur.x<mn){cur.x=mn;cur.d=1}}
  cam+=(camT-cam)*Math.min(1,dt*6);
  const hh=baseHue+score*6,sk=shake>0?(Math.random()-.5)*shake:0;shake=Math.max(0,shake-dt*30);
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,`hsl(${(hh+40)%360},55%,${Math.min(22,10+score*.25)}%)`);bg.addColorStop(1,`hsl(${hh%360},45%,8%)`);ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.5)';for(let i=0;i<40;i++){const sx=(i*97.3)%W,syy=((i*53.7+cam*.3)%H);ctx.globalAlpha=.15+(i%5)*.1;ctx.fillRect(sx,syy,1.6,1.6)}ctx.globalAlpha=1;
  ctx.save();ctx.translate(sk,0);
  ctx.fillStyle='rgba(255,255,255,.05)';ctx.fillRect(0,H-BH*2+cam,W,BH*2+H);
  ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=12;ctx.shadowOffsetY=4;
  stack.forEach((b,i)=>{const y=sy(i);if(y>-BH&&y<H+BH)block(b.x,y,b.w,b.h)});
  if(cur){ctx.shadowColor=`hsla(${cur.h%360},90%,60%,.7)`;ctx.shadowBlur=20;block(cur.x,sy(stack.length),cur.w,cur.h)}
  ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  falls=falls.filter(f=>{f.vy+=1400*dt;f.y+=f.vy*dt;f.r+=f.vr*dt;ctx.save();ctx.translate(f.x+f.w/2,f.y+BH/2);ctx.rotate(f.r*.3);ctx.globalAlpha=.85;block(-f.w/2,-BH/2,f.w,f.h);ctx.restore();return f.y<H+200});
  parts=parts.filter(p=>{p.vy+=500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt*1.4;ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=`hsl(${p.h%360},95%,70%)`;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();return p.l>0});
  ctx.globalAlpha=1;ctx.restore();
  requestAnimationFrame(frame);
}
resize();reset();showPanel('ready');requestAnimationFrame(frame);
});
</script>
