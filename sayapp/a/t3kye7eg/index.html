<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Omidmis</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--main:#22c55e;--main-d:#16a34a;--main-dd:#166534;--accent:#f59e0b;--bg:#f3faf5;--card:#fff;--ink:#0f2417;--mute:#6b8274;--line:#e3efe7;--sh:0 1px 2px rgba(15,36,23,.05),0 8px 24px rgba(22,101,52,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow-x:hidden}
body{background:radial-gradient(600px 380px at 50% -80px,#d3f5de,transparent 70%),var(--bg);user-select:none;-webkit-user-select:none}
#app{max-width:440px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 96px);position:relative}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{font-weight:800;font-size:22px;letter-spacing:-.5px}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--mute);letter-spacing:1.4px;text-transform:uppercase;margin-top:2px}
.chip{background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center}
.label{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute)}
.card{background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:16px;border:1px solid var(--line)}
.tab{display:none;animation:fade .3s ease}.tab.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.balance{text-align:center;margin:8px 0 16px}
.balance .num{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1.1;background:linear-gradient(180deg,var(--main-d),var(--main-dd));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.lvl{margin-bottom:8px}
.lvl .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700;font-size:15px}
.lvl .row span:last-child{font-size:12px;color:var(--mute);font-weight:600}
.bar{height:10px;background:#e8f4ec;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--main),#86efac);transition:width .3s ease}
.stage{position:relative;height:300px;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.glow{position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(34,197,94,.35),transparent 65%);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.8}}
.coin{position:relative;width:216px;height:216px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 32% 25%,#bbf7d0,#4ade80 35%,var(--main-d) 80%);box-shadow:0 0 0 10px rgba(255,255,255,.7),0 0 0 11px #cdeed8,0 24px 40px rgba(22,163,74,.38),inset 0 -10px 20px rgba(22,101,52,.35),inset 0 6px 12px rgba(255,255,255,.6);transition:transform .12s ease;display:flex;align-items:center;justify-content:center;outline:0}
.coin:active,.coin.p{transform:scale(.94)}
.coin .in{width:156px;height:156px;border-radius:50%;border:3px dashed rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-size:84px;font-weight:800;color:#fff;text-shadow:0 4px 10px rgba(22,101,52,.45);pointer-events:none}
.fl{position:absolute;pointer-events:none;font-weight:800;font-size:28px;color:var(--main-dd);text-shadow:0 2px 0 #fff;animation:up .9s ease-out forwards;z-index:5}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
.pt{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:4}
.energy{display:flex;align-items:center;gap:12px}
.energy .bar{flex:1;height:14px}
.energy .bar i{background:linear-gradient(90deg,var(--accent),#fde68a)}
.energy b{font-size:15px;font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
.btn{width:100%;border:0;border-radius:16px;padding:14px;font:700 15px 'Outfit',system-ui;color:#fff;background:linear-gradient(135deg,var(--main),var(--main-d));box-shadow:0 8px 18px rgba(34,197,94,.35);cursor:pointer;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97)}.btn[disabled]{opacity:.45;box-shadow:none}
.btn.alt{background:#fff;color:var(--main-dd);border:1.5px solid var(--main);box-shadow:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.stat b{display:block;font-size:22px;margin-top:4px}
h2{font-size:28px;font-weight:800;letter-spacing:-.8px;margin-bottom:4px}
.sub{color:var(--mute);font-size:15px;margin-bottom:16px}
.task{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.task .ic{width:48px;height:48px;border-radius:16px;background:#e8f8ee;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.task .tx{flex:1;min-width:0}.task .tx b{display:block;font-size:15px}
.task .tx small{color:var(--mute);font-size:13px}
.task .bar{height:6px;margin-top:8px}
.task button{width:auto;padding:10px 14px;font-size:13px;border-radius:14px;flex:none}
.done{color:var(--main-d);font-weight:700;font-size:13px;flex:none}
.rowl{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-weight:600}
.rowl:last-child{border:0}
.rowl .rk{width:32px;height:32px;border-radius:50%;background:#eef6f1;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:none}
.rowl .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowl.me{background:#e8f8ee;margin:0 -8px;padding:12px 8px;border-radius:14px;border:0}
.empty{text-align:center;padding:32px 8px;color:var(--mute)}.empty div{font-size:44px;margin-bottom:8px}
.skel{height:48px;border-radius:14px;margin-bottom:8px;background:linear-gradient(90deg,#eaf4ee,#f6fbf8,#eaf4ee);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 28px);width:calc(100% - 32px);max-width:408px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 32px rgba(22,101,52,.18);display:flex;padding:6px;z-index:20}
nav button{flex:1;border:0;background:none;border-radius:18px;padding:10px 0;font:600 12px 'Outfit',system-ui;color:var(--mute);cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}
nav button.on{background:linear-gradient(135deg,var(--main),var(--main-d));color:#fff;box-shadow:0 6px 14px rgba(34,197,94,.35)}
nav button:active{transform:scale(.95)}
footer{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 6px);text-align:center;font-size:10px;color:#9bb3a5;letter-spacing:.5px;pointer-events:none;z-index:10}
.note{text-align:center;font-size:11px;color:#9bb3a5;margin-top:16px}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translate(-50%,-80px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-weight:600;font-size:14px;z-index:50;transition:transform .3s ease;max-width:90%;text-align:center}
#toast.s{transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="brand">Omidmis<small>Tap to earn</small></div>
    <div class="chip">🔥 <span id="streak">0</span> day streak</div>
  </div>

  <section class="tab on" id="t-play">
    <div class="balance"><div class="label">Your points</div><div class="num" id="bal">0</div></div>
    <div class="card lvl">
      <div class="row"><span id="lvName">Seed</span><span id="lvInfo"></span></div>
      <div class="bar"><i id="lvBar"></i></div>
    </div>
    <div class="stage" id="stage">
      <div class="glow"></div>
      <button class="coin" id="coin" aria-label="Tap"><div class="in">O</div></button>
    </div>
    <div class="card">
      <div class="energy"><span style="font-size:22px">⚡</span><div class="bar"><i id="enBar"></i></div><b id="enTx">0 / 0</b></div>
    </div>
    <div class="stats">
      <div class="card stat"><div class="label">Per tap</div><b id="power">+1</b></div>
      <div class="card stat"><div class="label">Total earned</div><b id="total">0</b></div>
    </div>
    <button class="btn alt" id="refill">⚡ Refill energy (watch video)</button>
    <div class="note">Points have no cash value</div>
  </section>

  <section class="tab" id="t-tasks">
    <h2>Daily tasks</h2>
    <div class="sub">Complete them today and claim your bonus points. They reset every day.</div>
    <div id="taskList"></div>
  </section>

  <section class="tab" id="t-top">
    <h2>Leaderboard</h2>
    <div class="sub">The best tappers right now.</div>
    <div class="card" id="topList"></div>
  </section>
</div>

<nav>
  <button class="on" data-t="play"><span>👆</span>Play</button>
  <button data-t="tasks"><span>✅</span>Tasks</button>
  <button data-t="top"><span>🏆</span>Top</button>
</nav>
<footer>Made with SayApp</footer>
<div id="toast"></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://jeremstyke.github.io/sayapp/sdk.js" data-app="t3kye7eg"></script>
<script>
window.addEventListener('load', async function(){
  try{ Telegram.WebApp.ready(); Telegram.WebApp.expand(); }catch(e){}
  var $=function(id){return document.getElementById(id)};
  var LV=[{n:'Seed',t:0},{n:'Sprout',t:500},{n:'Bud',t:2000},{n:'Bloom',t:5000},{n:'Grove',t:12000},{n:'Forest',t:30000},{n:'Legend',t:75000}];
  var today=function(){return new Date().toISOString().slice(0,10)};
  var S={points:0,total:0,energy:500,ts:Date.now(),tapsToday:0,earnedToday:0,day:today(),claimed:{},streak:0,lastCheck:''};
  var dirty=false, shown=0, hap=function(k){try{SayApp.haptic(k)}catch(e){}};
  var fmt=function(n){return Math.floor(n).toLocaleString('en-US')};
  function lvl(){var i=0;for(var k=0;k<LV.length;k++)if(S.total>=LV[k].t)i=k;return i}
  function maxEn(){return 500+lvl()*150}
  function power(){return lvl()+1}
  function toast(m){var t=$('toast');t.textContent=m;t.classList.add('s');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('s')},2400)}

  try{
    var saved=await SayApp.get('state');
    if(saved&&typeof saved==='object'){
      Object.assign(S,saved);
      var gain=Math.floor((Date.now()-(S.ts||Date.now()))/1000);
      S.energy=Math.min(maxEn(),(S.energy||0)+Math.max(0,gain));
    }
  }catch(e){}
  if(S.day!==today()){
    var y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    if(S.lastCheck!==y&&S.lastCheck!==today())S.streak=0;
    S.day=today();S.tapsToday=0;S.earnedToday=0;S.claimed={};
  }
  shown=S.points;

  function countTo(){
    var d=S.points-shown;
    if(Math.abs(d)<1){shown=S.points}else{shown+=d*0.25}
    $('bal').textContent=fmt(shown);
    if(shown!==S.points)requestAnimationFrame(countTo);
  }
  function render(){
    var i=lvl(),cur=LV[i],nx=LV[i+1];
    $('lvName').textContent='Level '+(i+1)+' - '+cur.n;
    $('lvInfo').textContent=nx?fmt(S.total-cur.t)+' / '+fmt(nx.t-cur.t):'Max level';
    $('lvBar').style.width=(nx?Math.min(100,(S.total-cur.t)/(nx.t-cur.t)*100):100)+'%';
    $('enBar').style.width=(S.energy/maxEn()*100)+'%';
    $('enTx').textContent=Math.floor(S.energy)+' / '+maxEn();
    $('power').textContent='+'+power();
    $('total').textContent=fmt(S.total);
    $('streak').textContent=S.streak;
    countTo();
  }
  function add(n,tap){
    var before=lvl();
    S.points+=n;S.total+=n;if(tap)S.earnedToday+=n;
    dirty=true;
    if(lvl()>before){toast('🎉 Level up! You are now '+LV[lvl()].n);hap('ok');confetti();S.energy=maxEn()}
  }
  function floatAt(x,y,txt){
    var st=$('stage'),r=st.getBoundingClientRect(),e=document.createElement('div');
    e.className='fl';e.textContent=txt;e.style.left=(x-r.left-14)+'px';e.style.top=(y-r.top-30)+'px';
    st.appendChild(e);setTimeout(function(){e.remove()},900);
    for(var k=0;k<5;k++){
      var p=document.createElement('div');p.className='pt';
      p.style.left=(x-r.left)+'px';p.style.top=(y-r.top)+'px';
      p.style.background=k%2?'#86efac':'#fbbf24';
      st.appendChild(p);
      var a=Math.random()*6.28,d=40+Math.random()*40;
      p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+Math.cos(a)*d+'px,'+Math.sin(a)*d+'px) scale(0)',opacity:0}],{duration:600,easing:'ease-out'});
      (function(q){setTimeout(function(){q.remove()},600)})(p);
    }
  }
  function confetti(){
    var cols=['#22c55e','#f59e0b','#86efac','#fde68a','#16a34a'];
    for(var k=0;k<40;k++){
      var p=document.createElement('div');p.className='pt';
      p.style.cssText+='position:fixed;left:50%;top:40%;background:'+cols[k%5]+';border-radius:2px';
      document.body.appendChild(p);
      var a=Math.random()*6.28,d=80+Math.random()*180;
      p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+Math.cos(a)*d+'px,'+(Math.sin(a)*d+120)+'px) rotate(540deg)',opacity:0}],{duration:1100,easing:'cubic-bezier(.2,.8,.3,1)'});
      (function(q){setTimeout(function(){q.remove()},1100)})(p);
    }
  }

  var coin=$('coin');
  coin.addEventListener('pointerdown',function(e){
    e.preventDefault();
    coin.classList.add('p');setTimeout(function(){coin.classList.remove('p')},110);
    var pw=power();
    if(S.energy<1){hap('error');toast('Out of energy. Wait a bit or refill ⚡');return}
    S.energy-=1;S.tapsToday++;
    add(pw,true);hap('tap');
    floatAt(e.clientX,e.clientY,'+'+pw);
    render();
  });
  coin.addEventListener('contextmenu',function(e){e.preventDefault()});

  setInterval(function(){
    var m=maxEn();
    if(S.energy<m){S.energy=Math.min(m,S.energy+1+Math.floor(lvl()/2));render()}
  },1000);

  $('refill').onclick=async function(){
    var b=this;b.disabled=true;
    var ok=false;try{ok=await SayApp.ad()}catch(e){}
    if(ok){S.energy=maxEn();dirty=true;hap('ok');toast('⚡ Energy fully refilled!');render()}
    else toast('No video available right now');
    b.disabled=false;
  };

  var TASKS=[
    {id:'tap',ic:'👆',t:'Tap 100 times',r:200,p:function(){return S.tapsToday},g:100},
    {id:'earn',ic:'💰',t:'Earn 1,000 points by tapping',r:300,p:function(){return S.earnedToday},g:1000},
    {id:'check',ic:'📅',t:'Daily check-in',r:100,p:function(){return 1},g:1},
    {id:'video',ic:'🎬',t:'Watch a short video',r:400,p:function(){return 1},g:1}
  ];
  function renderTasks(){
    var h='';
    TASKS.forEach(function(k){
      var v=Math.min(k.p(),k.g),done=S.claimed[k.id],ready=v>=k.g;
      var reward=k.id==='check'?k.r+Math.min(S.streak,10)*20:k.r;
      h+='<div class="card task"><div class="ic">'+k.ic+'</div><div class="tx"><b>'+k.t+'</b><small>+'+fmt(reward)+' points'+(k.g>1?' · '+fmt(v)+' / '+fmt(k.g):'')+'</small>'+(k.g>1?'<div class="bar"><i style="width:'+(v/k.g*100)+'%"></i></div>':'')+'</div>'+
        (done?'<span class="done">✓ Claimed</span>':'<button class="btn" data-id="'+k.id+'"'+(ready?'':' disabled')+'>'+(k.id==='video'?'Watch':'Claim')+'</button>')+'</div>';
    });
    $('taskList').innerHTML=h;
    $('taskList').querySelectorAll('button').forEach(function(b){b.onclick=function(){claim(b.dataset.id,b)}});
  }
  async function claim(id,b){
    if(S.claimed[id])return;
    var k=TASKS.filter(function(x){return x.id===id})[0],reward=k.r;
    if(id==='video'){
      b.disabled=true;var ok=false;try{ok=await SayApp.ad()}catch(e){}
      if(!ok){toast('No video available right now');b.disabled=false;return}
    }
    if(id==='check'){
      var y=new Date(Date.now()-864e5).toISOString().slice(0,10);
      S.streak=(S.lastCheck===y)?S.streak+1:Math.max(1,S.streak||1);
      if(S.lastCheck===today())S.streak=S.streak||1;
      S.lastCheck=today();reward=k.r+Math.min(S.streak,10)*20;
    }
    S.claimed[id]=1;add(reward,false);hap('ok');confetti();
    toast('+'+fmt(reward)+' points claimed!');
    render();renderTasks();save();
  }

  async function save(){
    if(!dirty)return;dirty=false;S.ts=Date.now();
    try{await SayApp.set('state',S);await SayApp.set('points',S.total)}catch(e){dirty=true}
  }
  setInterval(save,5000);
  document.addEventListener('visibilitychange',function(){if(document.hidden)save()});

  async function loadTop(){
    var box=$('topList');
    box.innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
    dirty=true;await save();
    var list=[];try{list=await SayApp.top('points',10)}catch(e){}
    if(!list||!list.length){box.innerHTML='<div class="empty"><div>🏆</div>No players yet.<br>Start tapping to take the first place!</div>';return}
    var medals=['🥇','🥈','🥉'];
    box.innerHTML=list.map(function(r,i){
      return '<div class="rowl'+(r.me?' me':'')+'"><div class="rk">'+(medals[i]||(i+1))+'</div><div class="nm">'+String(r.name||'Player').replace(/[<>&]/g,'')+(r.me?' (you)':'')+'</div><div>'+fmt(r.value)+'</div></div>';
    }).join('');
  }

  document.querySelectorAll('nav button').forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll('nav button').forEach(function(x){x.classList.remove('on')});
      document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});
      b.classList.add('on');$('t-'+b.dataset.t).classList.add('on');hap('tap');
      if(b.dataset.t==='tasks')renderTasks();
      if(b.dataset.t==='top')loadTop();
    };
  });

  render();renderTasks();dirty=true;
});
</script>
</body>
</html>
