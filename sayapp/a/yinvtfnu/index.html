<!-- sayapp yinvtfnu v1 -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Coin Tap</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%}
body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#111);display:flex;flex-direction:column;overflow:hidden}
header{padding:14px 16px 6px;text-align:center}
.hello{font-size:13px;color:var(--tg-theme-hint-color,#888)}
.score{font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.score small{font-size:22px}
.rate{font-size:13px;color:var(--tg-theme-hint-color,#888);margin-top:2px}
main{flex:1;overflow-y:auto;padding:8px 16px 16px;position:relative}
.tab{display:none;animation:fade .25s}
.tab.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#play{text-align:center}
.coinwrap{position:relative;height:300px;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.coin{width:230px;height:230px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff6b0,#ffd43b 40%,#f59f00 78%,#d9480f);box-shadow:0 12px 30px rgba(245,159,0,.45),inset 0 -10px 20px rgba(0,0,0,.18),inset 0 8px 16px rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;transition:transform .08s;cursor:pointer;position:relative}
.coin::before{content:"";position:absolute;inset:18px;border-radius:50%;border:5px solid rgba(180,90,0,.35)}
.coin span{font-size:110px;color:rgba(180,90,0,.55);text-shadow:0 2px 0 rgba(255,255,255,.5);pointer-events:none}
.coin.hit{transform:scale(.92)}
.float{position:absolute;font-weight:800;font-size:26px;color:#f59f00;pointer-events:none;animation:up .9s ease-out forwards;text-shadow:0 1px 2px rgba(0,0,0,.25);z-index:5}
.float.crit{color:#e8590c;font-size:34px}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-90px)}}
.tip{color:var(--tg-theme-hint-color,#888);font-size:14px}
.card{background:var(--tg-theme-secondary-bg-color,#f2f2f2);border-radius:18px;padding:14px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.card .ic{font-size:32px;width:48px;height:48px;border-radius:14px;background:var(--tg-theme-bg-color,#fff);display:flex;align-items:center;justify-content:center;flex:none}
.card .tx{flex:1;min-width:0}
.card b{display:block;font-size:16px}
.card small{color:var(--tg-theme-hint-color,#888);font-size:13px}
button.buy,button.big{border:0;border-radius:14px;background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff);font-weight:700;font-size:15px;padding:12px 14px;min-height:48px;cursor:pointer}
button.buy{min-width:84px}
button:disabled{opacity:.4}
button.big{width:100%;font-size:17px;min-height:56px;margin-top:10px}
h2{margin:6px 0 12px;font-size:20px}
.days{display:flex;gap:6px;justify-content:space-between;margin:14px 0}
.day{flex:1;aspect-ratio:1;border-radius:12px;background:var(--tg-theme-secondary-bg-color,#f2f2f2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--tg-theme-hint-color,#888)}
.day.done{background:#ffd43b;color:#7a4300;font-weight:700}
.day i{font-style:normal;font-size:18px}
.row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;margin-bottom:6px;background:var(--tg-theme-secondary-bg-color,#f2f2f2)}
.row.me{outline:2px solid var(--tg-theme-button-color,#2481cc)}
.row .rk{width:30px;text-align:center;font-weight:800;font-size:18px}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .vl{font-weight:700}
nav{display:flex;background:var(--tg-theme-secondary-bg-color,#f2f2f2);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;color:var(--tg-theme-hint-color,#888);font-size:11px;padding:6px 0;min-height:52px;border-radius:12px;cursor:pointer}
nav button i{display:block;font-style:normal;font-size:22px}
nav button.on{color:var(--tg-theme-button-color,#2481cc);font-weight:700}
nav button .dot{display:none;color:#e03131}
footer{text-align:center;font-size:10px;color:var(--tg-theme-hint-color,#888);opacity:.7;padding:2px 0 0}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-80px);background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff);padding:12px 18px;border-radius:14px;font-weight:600;transition:transform .3s;z-index:20;max-width:90%;text-align:center}
.toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<header>
  <div class="hello" id="hello">Bienvenue</div>
  <div class="score"><span id="pts">0</span> <small>🪙</small></div>
  <div class="rate" id="rate"></div>
</header>
<main>
  <section class="tab on" id="play">
    <div class="coinwrap" id="cw"><div class="coin" id="coin"><span>★</span></div></div>
    <div class="tip">Tape sur la pièce pour gagner des points !</div>
  </section>
  <section class="tab" id="shop">
    <h2>🛠️ Améliorations</h2>
    <div id="shoplist"></div>
  </section>
  <section class="tab" id="daily">
    <h2>🎁 Récompense du jour</h2>
    <div class="card" style="display:block;text-align:center">
      <div style="font-size:54px">🎁</div>
      <b id="dtitle" style="font-size:18px"></b>
      <small id="dsub"></small>
      <div class="days" id="days"></div>
      <button class="big" id="claim">Récupérer</button>
    </div>
  </section>
  <section class="tab" id="top">
    <h2>🏆 Classement</h2>
    <div id="toplist"><div class="tip">Chargement...</div></div>
  </section>
</main>
<footer>Made with SayApp</footer>
<nav>
  <button class="on" data-t="play"><i>🪙</i>Jouer</button>
  <button data-t="shop"><i>🛠️</i>Boutique</button>
  <button data-t="daily"><i>🎁</i>Cadeau <span class="dot" id="dot">●</span></button>
  <button data-t="top"><i>🏆</i>Top</button>
</nav>
<div class="toast" id="toast"></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://jeremstyke.github.io/sayapp/sdk.js" data-app="yinvtfnu"></script>
<script>
window.addEventListener('load', async function () {
  try { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };
  var S = { p: 0, t: 0, tap: 0, auto: 0, crit: 0, daily: '', streak: 0, seen: 0 };
  var dirty = false, tab = 'play', lastHaptic = 0;
  var fmt = function (n) { return Math.floor(n).toLocaleString('fr-FR'); };
  var hap = function (k) { try { SayApp.haptic(k); } catch (e) {} };

  var UP = [
    { k: 'tap', ic: '👆', name: 'Doigt en or', desc: function (l) { return '+1 point par tap (actuel : ' + (1 + l) + ')'; }, cost: function (l) { return Math.round(15 * Math.pow(1.55, l)); }, max: 999 },
    { k: 'auto', ic: '⛏️', name: 'Mineur automatique', desc: function (l) { return '+1 point par seconde (actuel : ' + l + '/s)'; }, cost: function (l) { return Math.round(60 * Math.pow(1.6, l)); }, max: 999 },
    { k: 'crit', ic: '🍀', name: 'Coup de chance', desc: function (l) { return 'Chance de tap x5 : ' + (l * 5) + '%'; }, cost: function (l) { return Math.round(100 * Math.pow(1.8, l)); }, max: 10 }
  ];

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dkey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return dkey(new Date()); }
  function yesterday() { return dkey(new Date(Date.now() - 864e5)); }

  function toast(m) {
    var t = $('toast'); t.textContent = m; t.classList.add('show');
    clearTimeout(toast.h); toast.h = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  // load
  try {
    var saved = await SayApp.get('state');
    if (saved && typeof saved === 'object') for (var k in S) if (saved[k] !== undefined) S[k] = saved[k];
  } catch (e) {}
  var name = '';
  try { name = SayApp.user && SayApp.user.first_name || ''; } catch (e) {}
  $('hello').textContent = name ? 'Salut ' + name + ' 👋' : 'Bienvenue';

  // offline gains (max 1h)
  if (S.seen && S.auto > 0) {
    var secs = Math.min(3600, Math.floor((Date.now() - S.seen) / 1000));
    if (secs > 10) {
      var gain = secs * S.auto;
      S.p += gain; S.t += gain; dirty = true;
      setTimeout(function () { toast('⛏️ Tes mineurs ont gagné ' + fmt(gain) + ' points !'); }, 500);
    }
  }

  async function save() {
    dirty = false; S.seen = Date.now();
    try { await SayApp.set('state', S); await SayApp.set('score', Math.floor(S.t)); } catch (e) {}
  }

  function renderHead() {
    $('pts').textContent = fmt(S.p);
    $('rate').textContent = '+' + (1 + S.tap) + ' par tap  ·  +' + S.auto + ' par seconde';
  }

  function renderShop() {
    var h = '';
    UP.forEach(function (u) {
      var l = S[u.k], c = u.cost(l), maxed = l >= u.max;
      h += '<div class="card"><div class="ic">' + u.ic + '</div><div class="tx"><b>' + u.name + ' <small>niv. ' + l + '</small></b><small>' + u.desc(l) + '</small></div>' +
        '<button class="buy" data-k="' + u.k + '"' + ((maxed || S.p < c) ? ' disabled' : '') + '>' + (maxed ? 'MAX' : fmt(c) + ' 🪙') + '</button></div>';
    });
    $('shoplist').innerHTML = h;
  }

  $('shoplist').addEventListener('click', function (e) {
    var b = e.target.closest('button.buy'); if (!b) return;
    var u = UP.filter(function (x) { return x.k === b.dataset.k; })[0];
    var c = u.cost(S[u.k]);
    if (S.p < c || S[u.k] >= u.max) { hap('error'); return; }
    S.p -= c; S[u.k]++; hap('ok'); toast(u.ic + ' ' + u.name + ' niveau ' + S[u.k] + ' !');
    renderHead(); renderShop(); save();
  });

  function renderDaily() {
    var can = S.daily !== today();
    var next = can ? (S.daily === yesterday() ? S.streak + 1 : 1) : S.streak;
    var shown = ((next - 1) % 7) + 1;
    var h = '';
    for (var i = 1; i <= 7; i++) {
      var done = can ? i < shown : i <= shown;
      h += '<div class="day' + (done ? ' done' : '') + '"><i>' + (done ? '✅' : '🪙') + '</i>J' + i + '</div>';
    }
    $('days').innerHTML = h;
    var reward = 200 * shown;
    if (can) {
      $('dtitle').textContent = 'Jour ' + shown + ' : +' + fmt(reward) + ' points';
      $('dsub').textContent = 'Reviens chaque jour pour un plus gros cadeau !';
    } else {
      $('dtitle').textContent = 'Déjà récupéré aujourd\'hui ✅';
      $('dsub').textContent = 'Série en cours : ' + S.streak + ' jour' + (S.streak > 1 ? 's' : '') + '. Reviens demain !';
    }
    $('claim').disabled = !can;
    $('claim').textContent = can ? 'Récupérer +' + fmt(reward) + ' 🪙' : 'Reviens demain';
    $('dot').style.display = can ? 'inline' : 'none';
  }

  $('claim').addEventListener('click', function () {
    if (S.daily === today()) return;
    var streak = S.daily === yesterday() ? S.streak + 1 : 1;
    var shown = ((streak - 1) % 7) + 1;
    var reward = 200 * shown;
    S.streak = streak; S.daily = today(); S.p += reward; S.t += reward;
    hap('ok'); toast('🎁 +' + fmt(reward) + ' points !');
    renderHead(); renderDaily(); save();
  });

  async function renderTop() {
    var box = $('toplist');
    if (dirty) await save();
    try {
      var list = await SayApp.top('score', 20);
      if (!list || !list.length) { box.innerHTML = '<div class="tip">Personne pour l\'instant. Sois le premier !</div>'; return; }
      box.innerHTML = '';
      list.forEach(function (r, i) {
        var d = document.createElement('div'); d.className = 'row' + (r.me ? ' me' : '');
        var rk = document.createElement('div'); rk.className = 'rk'; rk.textContent = ['🥇', '🥈', '🥉'][i] || (i + 1);
        var nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = (r.name || 'Joueur') + (r.me ? ' (toi)' : '');
        var vl = document.createElement('div'); vl.className = 'vl'; vl.textContent = fmt(r.value) + ' 🪙';
        d.appendChild(rk); d.appendChild(nm); d.appendChild(vl); box.appendChild(d);
      });
    } catch (e) { box.innerHTML = '<div class="tip">Classement indisponible pour le moment.</div>'; }
  }

  // tabs
  document.querySelectorAll('nav button').forEach(function (b) {
    b.addEventListener('click', function () {
      tab = b.dataset.t; hap('tap');
      document.querySelectorAll('nav button').forEach(function (x) { x.classList.toggle('on', x === b); });
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('on', x.id === tab); });
      if (tab === 'shop') renderShop();
      if (tab === 'daily') renderDaily();
      if (tab === 'top') renderTop();
    });
  });

  // tapping
  var coin = $('coin'), cw = $('cw');
  function tapAt(x, y) {
    var crit = Math.random() < S.crit * 0.05;
    var gain = (1 + S.tap) * (crit ? 5 : 1);
    S.p += gain; S.t += gain; dirty = true;
    $('pts').textContent = fmt(S.p);
    coin.classList.add('hit'); setTimeout(function () { coin.classList.remove('hit'); }, 70);
    var f = document.createElement('div'); f.className = 'float' + (crit ? ' crit' : '');
    f.textContent = '+' + fmt(gain) + (crit ? '!' : '');
    var r = cw.getBoundingClientRect();
    f.style.left = (x - r.left - 14 + (Math.random() * 30 - 15)) + 'px';
    f.style.top = (y - r.top - 30) + 'px';
    cw.appendChild(f); setTimeout(function () { f.remove(); }, 900);
    var now = Date.now();
    if (crit) hap('ok'); else if (now - lastHaptic > 90) { hap('tap'); lastHaptic = now; }
  }
  coin.addEventListener('pointerdown', function (e) { e.preventDefault(); tapAt(e.clientX, e.clientY); });

  // auto mining
  setInterval(function () {
    if (S.auto > 0) {
      S.p += S.auto; S.t += S.auto; dirty = true;
      renderHead();
      if (tab === 'shop') renderShop();
    }
  }, 1000);
  setInterval(function () { if (dirty) save(); }, 3000);
  document.addEventListener('visibilitychange', function () { if (document.hidden && dirty) save(); });

  // shop affordability while tapping
  setInterval(function () { if (tab === 'shop') renderShop(); }, 1500);

  renderHead(); renderDaily();
  if (S.daily !== today()) setTimeout(function () { toast('🎁 Ta récompense du jour t\'attend !'); }, 1800);
  save();
});
</script>
</body>
</html>
