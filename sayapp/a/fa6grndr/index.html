<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#F5EDE1;--paper:#FFFBF5;--brown:#6B442C;--espresso:#2B1B12;--mocha:#8A5A3B;--caramel:#C8925A;--sage:#8FA88A;--sage-d:#5F7D5A;--sage-l:#E3EBDD;--muted:#8C7a6B;--line:rgba(43,27,18,.08);
--sh:0 1px 2px rgba(43,27,18,.06),0 8px 24px rgba(43,27,18,.08);--sh2:0 2px 4px rgba(43,27,18,.08),0 18px 40px rgba(43,27,18,.16);
--serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'Outfit',-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--cream);color:var(--espresso);font-family:var(--sans);font-size:15px;overflow-x:hidden}
body{background:radial-gradient(120% 60% at 100% 0%,#EADCC6 0%,transparent 60%),radial-gradient(90% 50% at 0% 100%,#E4EADF 0%,transparent 60%),var(--cream);min-height:100vh}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.tap{transition:transform .18s ease,opacity .18s}.tap:active{transform:scale(.95)}
header{padding:calc(var(--sa-top,0px) + 8px) 20px 8px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,var(--brown),var(--espresso));display:grid;place-items:center;box-shadow:0 6px 18px rgba(107,68,44,.35)}
.brand h1{font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:-.3px;line-height:1.1}
.brand p{font-size:13px;color:var(--muted)}
.lang{margin-left:auto;display:flex;background:var(--paper);border-radius:99px;padding:3px;box-shadow:var(--sh)}
.lang button{font-size:12px;font-weight:600;padding:6px 10px;border-radius:99px;color:var(--muted);transition:.2s}
.lang button.on{background:var(--sage-d);color:#fff}
main{padding:8px 20px calc(110px + env(safe-area-inset-bottom))}
.page{display:none;animation:fade .3s ease}.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.label{font-size:11px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin:20px 0 10px}
h2{font-family:var(--serif);font-size:28px;font-weight:700;letter-spacing:-.4px;margin-top:8px}
.hero{margin-top:8px;border-radius:24px;padding:20px;background:linear-gradient(135deg,#7A4E33,#3A2418);color:#F8EBDC;position:relative;overflow:hidden;box-shadow:var(--sh2)}
.hero h3{font-family:var(--serif);font-size:22px;line-height:1.2;max-width:70%}
.hero p{font-size:13px;opacity:.8;margin-top:6px;max-width:65%}
.hero .em{position:absolute;right:-6px;bottom:-14px;font-size:96px;transform:rotate(-12deg);filter:drop-shadow(0 10px 20px rgba(0,0,0,.35))}
.hero:after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;right:-50px;top:-70px;background:radial-gradient(circle,rgba(200,146,90,.45),transparent 70%)}
.cats{display:flex;gap:8px;overflow-x:auto;margin:16px -20px 0;padding:4px 20px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cat{flex:none;padding:10px 16px;border-radius:99px;background:var(--paper);font-weight:600;font-size:14px;box-shadow:var(--sh);transition:.2s;color:var(--brown)}
.cat.on{background:var(--brown);color:#fff;box-shadow:0 6px 16px rgba(107,68,44,.35)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.card{background:var(--paper);border-radius:20px;padding:8px;box-shadow:var(--sh);text-align:left;display:flex;flex-direction:column;animation:fade .35s ease both}
.art{height:112px;border-radius:14px;display:grid;place-items:center;position:relative;overflow:hidden}
.art span{font-size:52px;filter:drop-shadow(0 8px 10px rgba(43,27,18,.25));transition:transform .3s}
.card:active .art span{transform:scale(1.1) rotate(-6deg)}
.art:before{content:'';position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.35);top:-30px;left:-30px}
.card h4{font-family:var(--serif);font-size:16px;font-weight:500;margin:10px 6px 2px;line-height:1.2}
.card p{font-size:12px;color:var(--muted);margin:0 6px;line-height:1.35;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .row{display:flex;align-items:center;justify-content:space-between;margin:10px 6px 4px}
.price{font-weight:700;font-size:15px;color:var(--brown)}
.plus{width:32px;height:32px;border-radius:11px;background:var(--sage-d);color:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 4px 12px rgba(95,125,90,.4)}
.scrim{position:fixed;inset:0;background:rgba(43,27,18,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--paper);border-radius:28px 28px 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom));z-index:21;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.3,1);box-shadow:var(--sh2);max-height:90vh;overflow-y:auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet .art{height:160px;border-radius:20px}.sheet .art span{font-size:80px}
.sheet h3{font-family:var(--serif);font-size:26px;margin-top:16px}
.sheet .desc{color:var(--muted);margin-top:4px;line-height:1.45}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 14px;border-radius:14px;background:var(--cream);font-weight:500;font-size:14px;border:1.5px solid transparent;transition:.18s}
.chip small{color:var(--muted);margin-left:4px}
.chip.on{border-color:var(--sage-d);background:var(--sage-l);color:var(--sage-d)}
.foot{display:flex;gap:12px;align-items:center;margin-top:24px}
.step{display:flex;align-items:center;background:var(--cream);border-radius:16px;padding:4px}
.step button{width:36px;height:36px;border-radius:12px;font-size:20px;font-weight:600;color:var(--brown)}
.step b{min-width:24px;text-align:center}
.cta{flex:1;height:52px;border-radius:18px;background:linear-gradient(135deg,var(--mocha),var(--espresso));color:#FFF3E6;font-weight:600;font-size:16px;box-shadow:0 10px 24px rgba(107,68,44,.38);display:flex;align-items:center;justify-content:center;gap:8px}
.cta:disabled{opacity:.45;box-shadow:none}
.line{display:flex;gap:12px;align-items:center;background:var(--paper);border-radius:20px;padding:10px;box-shadow:var(--sh);margin-bottom:10px;animation:fade .3s ease both}
.line .art{width:60px;height:60px;flex:none;border-radius:14px}.line .art span{font-size:30px}
.line .info{flex:1;min-width:0}.line h4{font-family:var(--serif);font-weight:500;font-size:16px}
.line small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.line .price{font-size:14px;margin-top:4px;display:block}
.line .step{padding:2px}.line .step button{width:30px;height:30px}
.empty{text-align:center;padding:48px 20px;background:var(--paper);border-radius:24px;box-shadow:var(--sh);margin-top:16px}
.empty .big{font-size:64px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.empty h3{font-family:var(--serif);font-size:22px;margin-top:8px}.empty p{color:var(--muted);margin:6px 0 20px}
.empty .cta{display:inline-flex;padding:0 28px;flex:none}
.slots{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:4px 20px 8px;scrollbar-width:none}.slots::-webkit-scrollbar{display:none}
.slot{flex:none;padding:12px 16px;border-radius:14px;background:var(--paper);box-shadow:var(--sh);font-weight:600;transition:.18s}
.slot.on{background:var(--sage-d);color:#fff;box-shadow:0 6px 16px rgba(95,125,90,.4)}
.input{width:100%;height:52px;border-radius:16px;border:1.5px solid var(--line);background:var(--paper);padding:0 16px;font:500 16px var(--sans);color:var(--espresso);outline:none;transition:.2s}
.input:focus{border-color:var(--sage)}
.sum{background:var(--paper);border-radius:20px;padding:16px;box-shadow:var(--sh);margin-top:16px}
.sum div{display:flex;justify-content:space-between;padding:4px 0;color:var(--muted)}
.sum .tot{color:var(--espresso);font-weight:700;font-size:20px;border-top:1px dashed var(--line);margin-top:8px;padding-top:12px}
.sum .free{color:var(--sage-d);font-weight:600}
.note{background:var(--sage-l);color:var(--sage-d);border-radius:16px;padding:12px 14px;font-size:14px;font-weight:500;margin-top:12px}
.loy{border-radius:24px;padding:24px 20px;background:linear-gradient(140deg,#7A4E33 0%,#3A2418 100%);color:#F8EBDC;box-shadow:var(--sh2);position:relative;overflow:hidden;margin-top:16px}

.loy h3{font-family:var(--serif);font-size:22px;position:relative}.loy .sub{opacity:.75;font-size:13px;position:relative}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:20px;position:relative}
.st{aspect-ratio:1;border-radius:50%;border:1.5px dashed rgba(248,235,220,.35);display:grid;place-items:center;font-size:22px}
.st.on{border:0;background:radial-gradient(circle at 30% 30%,#E6B67E,var(--caramel));box-shadow:0 4px 12px rgba(0,0,0,.3);animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.st.gift{border-color:var(--sage);background:rgba(143,168,138,.18)}
@keyframes pop{from{transform:scale(0)}}
.prog{margin-top:20px;font-weight:600;position:relative}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.12);margin-top:8px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--sage),#C9DBC2);transition:width .6s ease}
.how{background:var(--paper);border-radius:20px;box-shadow:var(--sh);padding:8px 16px}
.how div{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.how div:last-child{border:0}

.box{background:var(--paper);border-radius:20px;box-shadow:var(--sh);padding:16px}
.hr{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.hr:last-child{border:0}
.hr.today{color:var(--sage-d);font-weight:700}
.status{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;margin-top:12px}
.status i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.3}}
.map{height:130px;border-radius:16px;background:linear-gradient(135deg,#E8DECF,#DCE5D6);position:relative;overflow:hidden;margin-bottom:12px}
.map .pin{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:34px;animation:float 2.4s ease-in-out infinite}
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:496px;margin:0 auto;height:68px;background:rgba(43,27,18,.94);backdrop-filter:blur(14px);border-radius:24px;display:flex;padding:6px;box-shadow:0 14px 34px rgba(43,27,18,.35);z-index:10}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:rgba(248,235,220,.5);font-size:11px;font-weight:600;border-radius:18px;position:relative;transition:.2s}
.tab svg{width:22px;height:22px}
.tab.on{color:#FFF3E6;background:rgba(255,255,255,.08)}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--sage);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.badge.on{transform:scale(1)}.bump{animation:bump .4s ease}
@keyframes bump{40%{transform:scale(1.35)}}
.fly{position:fixed;z-index:50;font-size:40px;pointer-events:none}
.toast{position:fixed;left:50%;top:calc(var(--sa-top,0px) + 16px);transform:translate(-50%,-80px);background:var(--espresso);color:#FFF3E6;padding:12px 18px;border-radius:14px;font-weight:500;z-index:60;transition:transform .3s;box-shadow:var(--sh2);white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.done{position:fixed;inset:0;z-index:40;background:var(--cream);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden}
.done.on{display:flex;animation:fade .3s}
.check{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--sage),var(--sage-d));display:grid;place-items:center;box-shadow:0 14px 36px rgba(95,125,90,.45);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.done h2{margin-top:24px}.done p{color:var(--muted);margin:8px 0 24px;max-width:300px;line-height:1.5}
.ticket{background:var(--paper);border-radius:20px;padding:16px 24px;box-shadow:var(--sh);margin-bottom:24px;font-weight:600}
.ticket b{font-family:var(--serif);font-size:30px;display:block;color:var(--brown)}
.conf{position:absolute;width:8px;height:12px;border-radius:2px;top:-20px}
footer{text-align:center;font-size:11px;color:var(--muted);opacity:.7;margin-top:32px;letter-spacing:.5px}
</style>
</head>

{id:'cin',c:2,e:'🌀',p:3.2,o:'',n:['Cinnamon Roll','Roulé à la cannelle'],d:['Soft brioche swirl with cream cheese glaze.','Brioche moelleuse, glaçage au fromage frais.']},
{id:'muf',c:2,e:'🫐',p:2.9,o:'',n:['Blueberry Muffin','Muffin myrtille'],d:['Bursting with wild blueberries and lemon zest.','Plein de myrtilles sauvages et zeste de citron.']},
{id:'avo',c:3,e:'🥑',p:8.5,o:'',n:['Avocado Toast','Toast avocat'],d:['Sourdough, smashed avocado, feta, chili flakes.','Pain au levain, avocat écrasé, feta, piment.']},
{id:'gra',c:3,e:'🥣',p:6.9,o:'',n:['Granola Bowl','Bol granola'],d:['House granola, Greek yogurt, seasonal fruit.','Granola maison, yaourt grec, fruits de saison.']},
{id:'pan',c:3,e:'🥞',p:7.5,o:'',n:['Pancake Stack','Pancakes'],d:['Three fluffy pancakes, maple syrup, berries.','Trois pancakes moelleux, sirop d\'érable, baies.']},
{id:'bag',c:3,e:'🥯',p:6.2,o:'',n:['Egg & Cheese Bagel','Bagel œuf fromage'],d:['Soft scrambled egg, aged cheddar, chives.','Œuf brouillé, cheddar affiné, ciboulette.']}];
const SZ=[0,.5,.9],MK=[0,.4,.4];
const HOURS=[[540,960],[450,1140],[450,1140],[450,1140],[450,1140],[450,1140],[510,1080]];
const ICONS={menu:'<path d="M5 8h12v5a6 6 0 0 1-12 0V8zM17 9h1.5a2.5 2.5 0 0 1 0 5H17M8 2.5v2.5M11 2.5v2.5M14 2.5v2.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>',cart:'<path d="M5 8h14l-1.3 11.2a2 2 0 0 1-2 1.8H8.3a2 2 0 0 1-2-1.8L5 8zM9 8V6a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>',card:'<rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="1.8" fill="none"/><circle cx="8" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="16" cy="12" r="1.6" stroke="currentColor" stroke-width="1.4" fill="none"/>',about:'<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z" stroke="currentColor" stroke-width="1.8" fill="none"/><circle cx="12" cy="9.5" r="2.5" stroke="currentColor" stroke-width="1.8" fill="none"/>'};
let L='en',tab='menu',cat=0,cart=[],stamps=0,orders=0,slot=null,cname=(SA.user&&SA.user.first_name)||'',sel=null,busy=false;
const $=id=>document.getElementById(id),t=k=>T[L][k],ix=()=>L==='fr'?1:0;
const fmt=n=>L==='fr'?n.toFixed(2).replace('.',',')+' €':'€'+n.toFixed(2);
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const dayIx=()=>new Date().getDay(),nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
function toast(s){const e=$('toast');e.textContent=s;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800)}
function animNum(el,to){const from=el._v||0,st=performance.now();el._v=to;const f=n=>{const k=Math.min(1,(n-st)/350),v=from+(to-from)*(1-Math.pow(1-k,3));el.textContent=fmt(v);if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function slots(){const[o,c]=HOURS[dayIx()];let s=Math.max(o,Math.ceil((nowMin()+15)/15)*15);const a=[];for(;s<=c-15;s+=15)a.push(hm(s));return a}
function renderHeader(){const h=new Date().getHours();$('hello').textContent=t(h<12?'morning':h<18?'afternoon':'evening')+(cname?', '+cname:'');
$('heroT').textContent=t('heroT');$('heroS').textContent=t('heroS');document.documentElement.lang=L;
document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L))}
function renderTabs(){$('tabbar').innerHTML=['menu','cart','card','about'].map(k=>`<button class="tab tap ${tab===k?'on':''}" data-t="${k}"><svg viewBox="0 0 24 24">${ICONS[k]}</svg>${t(k)}${k==='cart'?'<span class="badge" id="badge"></span>':''}</button>`).join('');updateBadge(false)}
function updateBadge(b){const n=cart.reduce((s,l)=>s+l.q,0),e=$('badge');if(!e)return;e.textContent=n;e.classList.toggle('on',n>0);if(b){e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump')}}
function renderMenu(){$('cats').innerHTML=t('cats').map((c,i)=>`<button class="cat tap ${i===cat?'on':''}" data-c="${i}">${['☕','🍵','🥐','🍳'][i]} ${c}</button>`).join('');
$('grid').innerHTML=M.filter(m=>m.c===cat).map((m,i)=>`<button class="card tap" data-i="${m.id}" style="animation-delay:${i*50}ms"><div class="art" style="background:${G[m.c]}"><span>${m.e}</span></div><h4>${m.n[ix()]}</h4><p>${m.d[ix()]}</p><div class="row"><span class="price">${fmt(m.p)}</span><span class="plus">+</span></div></button>`).join('')}
function openSheet(id){const m=M.find(x=>x.id===id);sel={m,s:m.o.includes('s')?1:-1,k:m.o.includes('m')?0:-1,q:1};renderSheet();$('scrim').classList.add('on');$('sheet').classList.add('on');hap('tap')}
function closeSheet(){$('scrim').classList.remove('on');$('sheet').classList.remove('on')}
const unit=x=>x.m.p+(x.s>=0?SZ[x.s]:0)+(x.k>=0?MK[x.k]:0);
function renderSheet(){const x=sel,m=x.m;let h=`<div class="grab"></div><div class="art" style="background:${G[m.c]}"><span>${m.e}</span></div><h3>${m.n[ix()]}</h3><p class="desc">${m.d[ix()]}</p>`;
if(x.s>=0)h+=`<div class="label">${t('size')}</div><div class="chips">${t('sizes').map((s,i)=>`<button class="chip tap ${x.s===i?'on':''}" data-s="${i}">${s}${SZ[i]?`<small>+${fmt(SZ[i])}</small>`:''}</button>`).join('')}</div>`;
if(x.k>=0)h+=`<div class="label">${t('milk')}</div><div class="chips">${t('milks').map((s,i)=>`<button class="chip tap ${x.k===i?'on':''}" data-k="${i}">${s}${MK[i]?`<small>+${fmt(MK[i])}</small>`:''}</button>`).join('')}</div>`;
h+=`<div class="foot"><div class="step"><button class="tap" data-q="-1">−</button><b>${x.q}</b><button class="tap" data-q="1">+</button></div><button class="cta tap" id="addBtn">${t('add')} · ${fmt(unit(x)*x.q)}</button></div>`;$('sheet').innerHTML=h}
function addToCart(){const x=sel,key=[x.m.id,x.s,x.k].join('|'),ex=cart.find(l=>l.key===key);
if(ex)ex.q+=x.q;else cart.push({key,id:x.m.id,s:x.s,k:x.k,q:x.q,u:unit(x)});
const b=$('addBtn').getBoundingClientRect(),tg=document.querySelector('[data-t="cart"]').getBoundingClientRect(),f=document.createElement('div');
f.className='fly';f.textContent=x.m.e;f.style.left=(b.left+b.width/2-20)+'px';f.style.top=(b.top-10)+'px';document.body.appendChild(f);
const dx=tg.left+tg.width/2-(b.left+b.width/2),dy=tg.top-b.top;
f.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${dx*.4}px,${dy*.3-120}px) scale(1.2)`,opacity:1,offset:.45},{transform:`translate(${dx}px,${dy}px) scale(.3)`,opacity:.6}],{duration:700,easing:'cubic-bezier(.5,0,.6,1)'}).onfinish=()=>{f.remove();updateBadge(true)};
hap('ok');closeSheet();setTimeout(()=>toast('✓ '+t('added')),250)}
function calc(){const sub=cart.reduce((s,l)=>s+l.u*l.q,0),cof=cart.filter(l=>M.find(m=>m.id===l.id).c===0);let free=0;
if(stamps>=9&&cof.length)free=Math.min(...cof.map(l=>l.u));return{sub,free,total:Math.max(0,sub-free)}}
function opts(l){const a=[];if(l.s>=0)a.push(t('sizes')[l.s]);if(l.k>=0)a.push(t('milks')[l.k]);return a.join(' · ')}
function renderCart(){const p=$('p-cart');
if(!cart.length){p.innerHTML=`<h2>${t('yourOrder')}</h2><div class="empty"><div class="big">🥐</div><h3>${t('emptyT')}</h3><p>${t('emptyS')}</p><button class="cta tap" data-t="menu">${t('browse')}</button></div>`;return}
const sl=slots();if(slot&&!sl.includes(slot))slot=null;const c=calc();
let h=`<h2>${t('yourOrder')}</h2><div class="label">${cart.reduce((s,l)=>s+l.q,0)} ${t('items')}</div>`;
h+=cart.map((l,i)=>{const m=M.find(x=>x.id===l.id);return`<div class="line"><div class="art" style="background:${G[m.c]}"><span>${m.e}</span></div><div class="info"><h4>${m.n[ix()]}</h4>${opts(l)?`<small>${opts(l)}</small>`:''}<span class="price">${fmt(l.u*l.q)}</span></div><div class="step"><button class="tap" data-lq="${i}" data-d="-1">−</button><b>${l.q}</b><button class="tap" data-lq="${i}" data-d="1">+</button></div></div>`}).join('');
if(stamps>=9)h+=`<div class="note">${c.free?t('freeHint'):t('freeAdd')}</div>`;
h+=`<div class="label">${t('pickup')}</div>`;
h+=sl.length?`<div class="slots">${sl.map(s=>`<button class="slot tap ${slot===s?'on':''}" data-sl="${s}">${s}</button>`).join('')}</div>`:`<div class="box"><b>🌙 ${t('closedT')}</b><p style="color:var(--muted);margin-top:4px">${t('closedS')}</p></div>`;
h+=`<div class="label">${t('name')}</div><input class="input" id="nm" maxlength="40" placeholder="${t('namePh')}" value="${cname.replace(/"/g,'&quot;')}">`;
h+=`<div class="sum"><div><span>${t('subtotal')}</span><span>${fmt(c.sub)}</span></div>${c.free?`<div class="free"><span>${t('free')}</span><span>−${fmt(c.free)}</span></div>`:''}<div class="tot"><span>${t('total')}</span><span id="tot"></span></div></div>`;
h+=`<div class="foot"><button class="cta tap" id="placeBtn" ${sl.length?'':'disabled'}>${t('place')}</button></div>`;
p.innerHTML=h;const te=$('tot');te._v=c.total;te.textContent=fmt(c.total);$('nm').oninput=e=>cname=e.target.value}
function updTotal(){const te=$('tot');if(te)animNum(te,calc().total)}
function renderCard(){const n=Math.min(stamps,9);let s='';for(let i=0;i<10;i++)s+=i<9?`<div class="st ${i<n?'on':''}" style="animation-delay:${i*60}ms">${i<n?'☕':''}</div>`:`<div class="st gift ${n>=9?'on':''}">🎁</div>`;
$('p-card').innerHTML=`<h2>${t('loyT')}</h2><div class="loy"><h3>Bloom Club</h3><div class="sub">${t('loyS')}</div><div class="stamps">${s}</div><div class="prog">${n>=9?t('freeNext'):t('left')(9-n)}</div><div class="bar"><i style="width:${n/9*100}%"></i></div></div><div class="label">${t('how')}</div><div class="how"><div><span>🧾</span>${t('how1')}</div><div><span>☕</span>${t('how2')}</div><div><span>🎁</span>${t('how3')}</div></div>`}
function renderAbout(){const d=dayIx(),[o,c]=HOURS[d],m=nowMin(),open=m>=o&&m<c;
const rows=[1,2,3,4,5,6,0].map((k,i)=>`<div class="hr ${k===d?'today':''}"><span>${t('days')[i]}</span><span>${hm(HOURS[k][0])} - ${hm(HOURS[k][1])}</span></div>`).join('');
$('p-about').innerHTML=`<h2>Café Bloom</h2><p style="color:var(--muted);margin-top:6px;line-height:1.5">${t('story')}</p><span class="status" style="background:${open?'var(--sage-l)':'#F3E1D6'};color:${open?'var(--sage-d)':'#A0522D'}"><i></i>${open?t('openNow'):t('closedNow')}</span>
<div class="label">${t('hours')}</div><div class="box">${rows}</div>
<div class="label">${t('address')}</div><div class="box"><div class="map"><svg width="100%" height="100%" viewBox="0 0 300 130" preserveAspectRatio="none"><path d="M0 40 H300 M0 95 H300 M70 0 V130 M190 0 V130 M240 0 L120 130" stroke="#fff" stroke-width="9" fill="none" opacity=".8"/><circle cx="40" cy="20" r="14" fill="#B9CCB2"/><circle cx="270" cy="115" r="18" fill="#B9CCB2"/></svg><div class="pin">📍</div></div>
<b>12 Rue des Lilas</b><p style="color:var(--muted)">69002 Lyon, France</p><p style="margin-top:10px">☎️ +33 4 78 00 12 34</p></div>`}
function renderAll(){renderHeader();renderTabs();renderMenu();renderCart();renderCard();renderAbout()}
function go(k){tab=k;document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='p-'+k));if(k==='cart')renderCart();if(k==='card')renderCard();if(k==='about')renderAbout();renderTabs();window.scrollTo({top:0,behavior:'smooth'});hap('tap')}
async function place(){if(busy)return;cname=($('nm').value||'').trim();
if(!slot){hap('error');toast(t('needTime'));return}if(!cname){hap('error');toast(t('needName'));$('nm').focus();return}
busy=true;const btn=$('placeBtn');btn.disabled=true;btn.textContent='…';const c=calc(),num='B'+(100+Math.floor(Math.random()*900));
const data={type:'order',order:num,customer:cname,pickup:slot+' (today)',items:cart.map(l=>{const m=M.find(x=>x.id===l.id);return{item:m.n[0],options:[l.s>=0?T.en.sizes[l.s]:'',l.k>=0?T.en.milks[l.k]+' milk':''].filter(Boolean).join(', '),qty:l.q,price:+(l.u*l.q).toFixed(2)}}),subtotal:+c.sub.toFixed(2),freeCoffee:c.free?+c.free.toFixed(2):0,total:+c.total.toFixed(2),telegramId:SA.user&&SA.user.id};
try{await SA.submit(data)}catch(e){busy=false;btn.disabled=false;btn.textContent=t('place');hap('error');toast(t('err'));return}
stamps=c.free?0:Math.min(stamps+1,9);orders++;try{await SA.set('bloom',{stamps,orders,name:cname,lang:L})}catch(e){}
hap('ok');const time=slot;cart=[];slot=null;busy=false;updateBadge(false);showDone(num,time,!!c.free)}
function showDone(num,time,wasFree){const d=$('done');
d.innerHTML=`<div class="check"><svg width="48" height="48" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h2>${t('sentT')}</h2><p>${t('sentS')(cname)} <b>${time}</b>.</p><div class="ticket">${t('order')}<b>#${num}</b><span style="color:var(--sage-d);font-size:13px">${wasFree?t('free'):'☕ '+t('stampAdd')}</span></div><button class="cta tap" id="backBtn" style="flex:none;padding:0 32px">${t('back')}</button>`;
d.classList.add('on');const cols=['#C8925A','#8FA88A','#6B442C','#E6B67E','#5F7D5A'];
for(let i=0;i<40;i++){const p=document.createElement('div');p.className='conf';p.style.left=Math.random()*100+'%';p.style.background=cols[i%5];d.appendChild(p);
p.animate([{transform:'translateY(0) rotate(0)',opacity:1},{transform:`translate(${(Math.random()-.5)*120}px,${innerHeight+40}px) rotate(${Math.random()*720}deg)`,opacity:.8}],{duration:1600+Math.random()*1400,delay:Math.random()*400,easing:'cubic-bezier(.3,.6,.6,1)',fill:'forwards'})}
$('backBtn').onclick=()=>{d.classList.remove('on');renderCart();go('menu')}}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;const ds=el.dataset;
if(ds.l){if(L!==ds.l){L=ds.l;renderAll();if(sel&&$('sheet').classList.contains('on'))renderSheet();SA.set('bloom',{stamps,orders,name:cname,lang:L}).catch(()=>{})}hap('tap');return}
if(ds.t){go(ds.t);return}
if(ds.c){cat=+ds.c;renderMenu();hap('tap');return}
if(ds.i){openSheet(ds.i);return}
if(ds.s){sel.s=+ds.s;renderSheet();hap('tap');return}
if(ds.k){sel.k=+ds.k;renderSheet();hap('tap');return}
if(ds.q){sel.q=Math.max(1,Math.min(20,sel.q+ +ds.q));renderSheet();hap('tap');return}
if(el.id==='addBtn'){addToCart();return}
if(ds.lq!==undefined){const l=cart[+ds.lq];l.q+= +ds.d;hap('tap');if(l.q<=0){cart.splice(+ds.lq,1);renderCart()}else{el.parentNode.querySelector('b').textContent=l.q;el.closest('.line').querySelector('.price').textContent=fmt(l.u*l.q);const c=calc();if(c.free||stamps>=9)renderCart();else{const s=document.querySelector('.sum span:nth-child(2)');if(s)s.textContent=fmt(c.sub);document.querySelector('#p-cart .label').textContent=cart.reduce((a,x)=>a+x.q,0)+' '+t('items');updTotal()}}updateBadge(true);return}
if(ds.sl){slot=ds.sl;document.querySelectorAll('.slot').forEach(s=>s.classList.toggle('on',s.dataset.sl===slot));hap('tap');return}
if(el.id==='placeBtn'){place()}});
$('scrim').onclick=closeSheet;
(async()=>{let lc='';try{lc=(SA.user&&SA.user.language_code)||Telegram.WebApp.initDataUnsafe.user.language_code||''}catch(e){}
L=String(lc).startsWith('fr')?'fr':'en';renderAll();
try{const s=await SA.get('bloom');if(s){stamps=s.stamps||0;orders=s.orders||0;if(s.name&&!cname)cname=s.name;if(s.lang)L=s.lang;renderAll()}}catch(e){}})();
});
</script>
