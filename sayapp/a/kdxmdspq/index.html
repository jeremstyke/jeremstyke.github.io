<!-- sayapp kdxmdspq v1 -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Méga Tirage</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0919;--bg2:#13112b;--card:#1a1740;--line:rgba(255,255,255,.08);--main:#7c5cff;--main2:#b06bff;--acc:#ffc83d;--acc2:#ff8a3d;--txt:#f4f2ff;--mut:#9a96c4;--ok:#3de0a0;--bad:#ff5a7a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Outfit',system-ui,-apple-system,sans-serif;background:radial-gradient(900px 500px at 50% -10%,#2a1f6b 0%,transparent 60%),var(--bg);color:var(--txt);font-size:15px;overflow-x:hidden;user-select:none;-webkit-user-select:none}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:calc(var(--sa-top,0px) + 8px) 16px calc(96px + env(safe-area-inset-bottom));position:relative}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 0 16px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--mut);font-weight:600}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,#fff,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,200,61,.12);border:1px solid rgba(255,200,61,.3);color:var(--acc);padding:8px 12px;border-radius:99px;font-weight:700}
.card{background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:0 2px 4px rgba(0,0,0,.3),0 16px 40px rgba(0,0,0,.35)}
.hero{text-align:center;position:relative;overflow:hidden;background:radial-gradient(300px 200px at 50% 0,rgba(124,92,255,.45),transparent 70%),linear-gradient(160deg,var(--card),var(--bg2))}
.big{font-size:72px;line-height:1;font-weight:800;letter-spacing:-.04em;background:linear-gradient(180deg,#fff2c2,var(--acc) 60%,var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(255,200,61,.35))}
.emo{font-size:56px;display:inline-block;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px) rotate(6deg)}}
h2{font-size:22px;font-weight:700;margin:8px 0}
p.sub{color:var(--mut);line-height:1.5}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:18px;padding:16px;font:700 16px 'Outfit',sans-serif;color:#fff;background:linear-gradient(135deg,var(--main),var(--main2));box-shadow:0 8px 24px rgba(124,92,255,.45),inset 0 1px 0 rgba(255,255,255,.25);cursor:pointer;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn.gold{color:#2a1a00;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 24px rgba(255,170,61,.4),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.sm{width:auto;padding:10px 16px;font-size:14px;border-radius:14px}
.btn[disabled]{opacity:.45;box-shadow:none;pointer-events:none}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.cd div{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:12px 0;text-align:center}
.cd b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.cd span{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut)}
.task{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:rgba(124,92,255,.18);flex:none}
.task .t{flex:1;min-width:0}
.task b{display:block;font-weight:600}
.task small{color:var(--mut);font-size:13px}
.bar{height:6px;background:rgba(255,255,255,.08);border-radius:9px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--main),var(--acc));border-radius:9px;transition:width .4s}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 16px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--bg) 60%,transparent);z-index:20}
nav div{display:flex;width:100%;max-width:448px;background:rgba(26,23,64,.92);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:6px;gap:4px}
nav button{flex:1;border:0;background:none;color:var(--mut);font:600 12px 'Outfit',sans-serif;padding:8px 0;border-radius:16px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}
nav button.on{color:#fff;background:linear-gradient(135deg,var(--main),var(--main2));box-shadow:0 4px 16px rgba(124,92,255,.5)}
.view{display:none;animation:in .3s}.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
#arena{position:relative;height:380px;border-radius:24px;overflow:hidden;background:radial-gradient(300px 300px at 50% 100%,rgba(124,92,255,.35),transparent),#0e0c26;border:1px solid var(--line);touch-action:manipulation}
.hud{display:flex;justify-content:space-between;margin-bottom:12px}
.hud div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 16px;text-align:center;min-width:92px}
.hud b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.st{position:absolute;top:-60px;font-size:42px;animation:fall linear forwards;cursor:pointer;filter:drop-shadow(0 0 10px rgba(255,200,61,.6));will-change:transform}
@keyframes fall{to{transform:translateY(460px) rotate(120deg)}}
.pop{position:absolute;font-weight:800;color:var(--acc);pointer-events:none;animation:up .7s forwards;font-size:20px}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:24px;background:rgba(10,9,25,.82);backdrop-filter:blur(4px);z-index:5}
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;margin-bottom:8px;background:rgba(255,255,255,.04);border:1px solid var(--line);animation:in .3s backwards}
.row.me{background:rgba(124,92,255,.2);border-color:var(--main)}
.rk{width:32px;text-align:center;font-weight:800;font-size:18px;color:var(--mut)}
.row .n{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v{font-weight:800;color:var(--acc)}
.sk{height:56px;border-radius:18px;margin-bottom:8px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:40px 16px;color:var(--mut)}.empty div{font-size:48px;margin-bottom:8px}
.toast{position:fixed;left:50%;top:calc(var(--sa-top,0px) + 64px);transform:translate(-50%,-20px);background:#fff;color:#14112e;padding:12px 18px;border-radius:99px;font-weight:700;opacity:0;transition:all .25s;z-index:50;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}
.cf{position:fixed;width:9px;height:14px;z-index:60;pointer-events:none;border-radius:2px}
footer{text-align:center;color:var(--mut);font-size:11px;opacity:.6;padding:16px 0}
.shake{animation:sk2 .25s}@keyframes sk2{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><div class="lbl">Concours de la chaîne</div><h1>Méga Tirage</h1></div>
    <div class="chip">🎟️ <span id="hdT">0</span></div>
  </header>

  <section class="view on" id="v-home"></section>

  <section class="view" id="v-game">
    <div class="hud"><div><span class="lbl">Score</span><b id="gS">0</b></div><div><span class="lbl">Temps</span><b id="gT">20</b></div><div><span class="lbl">Record</span><b id="gB">0</b></div></div>
    <div id="arena">
      <div id="ov"></div>
    </div>
    <p class="sub" style="text-align:center;margin-top:12px;font-size:13px">⭐ = +1 point &nbsp; 💣 = -3 points</p>
  </section>

  <section class="view" id="v-top">
    <div class="card" style="padding:16px"><div class="lbl">Classement</div><h2 style="margin:4px 0 0">Les plus gros stocks de tickets</h2><p class="sub" style="font-size:13px;margin-top:4px">Plus tu as de tickets, plus tu as de chances d'être tiré au sort.</p></div>
    <div id="board"></div>
  </section>
  <footer>Made with SayApp</footer>
</div>

<nav><div>
  <button class="on" data-t="home"><span>🎁</span>Concours</button>
  <button data-t="game"><span>⭐</span>Jeu</button>
  <button data-t="top"><span>🏆</span>Classement</button>
</div></nav>
<div class="toast" id="toast"></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://jeremstyke.github.io/sayapp/sdk.js" data-app="kdxmdspq" data-full="1"></script>
<script>
window.addEventListener('load', async function(){
  // Colle ici le lien de ton mini app, ex: https://t.me/ton_bot/app
  var BOT_LINK = '';
  var PRIZE = 'Lot mystère annoncé sur la chaîne';
  var MAX_SHARES = 5;
  var $ = function(s){return document.querySelector(s)};
  var tg = window.Telegram && Telegram.WebApp;
  try{ tg && tg.ready(); tg && tg.expand(); }catch(e){}
  var user = (window.SayApp && SayApp.user) || {id:0,first_name:'Toi'};
  var S = {reg:false,t:0,shares:0,daily:'',gameDay:'',best:0,ref:''};
  var shown = 0, tab = 'home', saveT = null;
  var today = function(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};

  try{ var v = await SayApp.get('state'); if(v && typeof v==='object') S = Object.assign(S,v); }catch(e){}
  var sp = '';
  try{ sp = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || ''; }catch(e){}
  if(!S.reg && !S.ref && /^r\d+$/.test(sp) && sp !== 'r'+user.id) S.ref = sp.slice(1);

  function save(now){
    clearTimeout(saveT);
    var run = function(){ try{ SayApp.set('state',S); SayApp.set('tickets',S.t); }catch(e){} };
    if(now) run(); else saveT = setTimeout(run,2000);
  }
  function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('on')},2200)}
  function hap(k){try{SayApp.haptic(k)}catch(e){}}
  function confetti(){
    var cols=['#ffc83d','#7c5cff','#ff8a3d','#b06bff','#3de0a0'];
    for(var i=0;i<36;i++){
      var d=document.createElement('div');d.className='cf';
      d.style.background=cols[i%5];d.style.left=(30+Math.random()*40)+'vw';d.style.top='35vh';
      document.body.appendChild(d);
      var x=(Math.random()-.5)*360,y=-120+Math.random()*420;
      d.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+x+'px,'+y+'px) rotate('+(Math.random()*720)+'deg)',opacity:0}],{duration:1200+Math.random()*600,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=(function(el){return function(){el.remove()}})(d);
    }
  }
  function countUp(el,from,to){
    if(!el) return; var st=performance.now(),dur=600;
    (function f(n){var p=Math.min(1,(n-st)/dur);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(st);
  }
  function addT(n){
    if(n<=0) return;
    S.t += n; hap('ok'); confetti(); toast('+'+n+' ticket'+(n>1?'s':'')+' 🎟️');
    save(); refreshT();
  }
  function refreshT(){
    countUp($('#hdT'),shown,S.t); countUp($('#tk'),shown,S.t); shown = S.t;
  }

  // ---------- Accueil ----------
  function nextDraw(){
    var d=new Date();d.setHours(20,0,0,0);d.setDate(d.getDate()+((7-d.getDay())%7));
    if(d<=new Date()) d.setDate(d.getDate()+7); return d;
  }
  function tick(){
    var el=$('#cd'); if(!el) return;
    var s=Math.max(0,Math.floor((nextDraw()-new Date())/1000));
    var p=function(n){return String(n).padStart(2,'0')};
    el.innerHTML='<div><b>'+Math.floor(s/86400)+'</b><span>jours</span></div><div><b>'+p(Math.floor(s%86400/3600))+'</b><span>heures</span></div><div><b>'+p(Math.floor(s%3600/60))+'</b><span>min</span></div><div><b>'+p(s%60)+'</b><span>sec</span></div>';
  }
  function renderHome(){
    var h=$('#v-home');
    if(!S.reg){
      h.innerHTML='<div class="card hero"><div class="emo">🎁</div><div class="lbl" style="margin-top:8px">Grand tirage au sort</div><h2>Gagne le lot de la chaîne</h2><p class="sub">'+PRIZE+'. Inscris-toi, récolte des tickets et invite tes amis : chaque ticket est une chance de gagner.</p></div>'+
      '<div class="card"><div class="task"><div class="ico">📝</div><div class="t"><b>1 ticket offert</b><small>dès ton inscription</small></div></div>'+
      '<div class="task"><div class="ico">👯</div><div class="t"><b>Invite tes amis</b><small>+1 ticket par invitation envoyée</small></div></div>'+
      '<div class="task"><div class="ico">⭐</div><div class="t"><b>Joue chaque jour</b><small>jusqu\'à 3 tickets par partie bonus</small></div></div></div>'+
      (S.ref?'<p class="sub" style="text-align:center;margin-bottom:12px">🎉 Un ami t\'invite : +2 tickets de bienvenue !</p>':'')+
      '<button class="btn gold" id="reg">Je participe 🎟️</button>';
      $('#reg').onclick=register; return;
    }
    var left=MAX_SHARES-S.shares, dailyDone=S.daily===today(), gameDone=S.gameDay===today();
    h.innerHTML='<div class="card hero"><div class="lbl">Tes tickets</div><div class="big" id="tk">'+shown+'</div><p class="sub" style="margin-top:4px">'+PRIZE+' 🎁</p></div>'+
    '<div class="card"><div class="lbl">Tirage au sort dans</div><div class="cd" id="cd"></div></div>'+
    '<div class="card"><div class="lbl" style="margin-bottom:8px">Gagne des tickets</div>'+
    '<div class="task"><div class="ico">📅</div><div class="t"><b>Bonus du jour</b><small>'+(dailyDone?'Reviens demain !':'+1 ticket, une fois par jour')+'</small></div><button class="btn gold sm" id="bDaily" '+(dailyDone?'disabled':'')+'>'+(dailyDone?'Fait ✓':'Prendre')+'</button></div>'+
    '<div class="task"><div class="ico">⭐</div><div class="t"><b>Partie bonus</b><small>'+(gameDone?'Bonus pris, reviens demain':'Jusqu\'à +3 tickets aujourd\'hui')+'</small></div><button class="btn sm" id="bGame">Jouer</button></div>'+
    '<div class="task"><div class="ico">👯</div><div class="t"><b>Invite tes amis</b><small>+1 ticket par invitation (max '+MAX_SHARES+')</small><div class="bar"><i style="width:'+(S.shares/MAX_SHARES*100)+'%"></i></div></div><button class="btn sm" id="bShare" '+(left<=0?'':'')+'>Inviter</button></div></div>'+
    '<p class="sub" style="font-size:12px;text-align:center">Chaque ami qui rejoint avec ton lien reçoit 2 tickets. Les invitations sont vérifiées par l\'organisateur avant le tirage.</p>';
    $('#bDaily').onclick=function(){S.daily=today();addT(1);renderHome()};
    $('#bGame').onclick=function(){go('game')};
    $('#bShare').onclick=share;
    tick();
  }
  async function register(){
    var b=$('#reg'); b.disabled=true;
    S.reg=true; S.t=1+(S.ref?2:0);
    try{ await SayApp.submit({type:'inscription',nom:user.first_name,id:user.id,parrain:S.ref||'aucun'}); }catch(e){}
    save(true); confetti(); hap('ok'); toast('Inscription validée ! 🎉');
    shown=0; renderHome(); refreshT();
  }
  function share(){
    var link=(BOT_LINK||location.href.split('#')[0].split('?')[0]);
    link+= (BOT_LINK? (link.indexOf('?')>-1?'&':'?')+'startapp=r'+user.id : '');
    var text='🎁 Participe au grand tirage au sort de ma chaîne et tente de gagner le lot ! Utilise mon lien pour recevoir 2 tickets offerts.';
    var url='https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(text);
    try{ tg.openTelegramLink(url); }catch(e){ window.open(url,'_blank'); }
    if(S.shares<MAX_SHARES){ S.shares++; setTimeout(function(){addT(1);renderHome()},800); }
    else toast('Invitation envoyée 👍');
  }

  // ---------- Jeu ----------
  var g=null, arena=$('#arena'), ov=$('#ov');
  $('#gB').textContent=S.best;
  function showOv(html){ov.innerHTML=html;ov.style.display='flex'}
  function intro(){
    var can=S.reg&&S.gameDay!==today();
    showOv('<div class="emo">⭐</div><h2>Pluie d\'étoiles</h2><p class="sub">Attrape un maximum d\'étoiles en 20 secondes. Évite les bombes !</p>'+
      '<p class="sub" style="font-size:13px">'+(!S.reg?'Inscris-toi d\'abord pour gagner des tickets.':can?'10 pts = 1 ticket, 20 pts = 2, 30 pts = 3':'Bonus du jour déjà pris : mode entraînement')+'</p>'+
      '<button class="btn gold" id="go" style="margin-top:8px">'+(S.reg?'C\'est parti !':'S\'inscrire')+'</button>');
    $('#go').onclick=function(){S.reg?startGame():go('home')};
  }
  function startGame(){
    arena.querySelectorAll('.st,.pop').forEach(function(e){e.remove()});
    ov.style.display='none';
    g={score:0,time:20,on:true};
    $('#gS').textContent=0;$('#gT').textContent=20;
    g.sp=setTimeout(function loop(){
      if(!g||!g.on) return; spawn();
      g.sp=setTimeout(loop,Math.max(260,620-(20-g.time)*18));
    },200);
    g.tm=setInterval(function(){
      g.time--;$('#gT').textContent=g.time; if(g.time<=0) endGame();
    },1000);
  }
  function spawn(){
    var bomb=Math.random()<.2, e=document.createElement('div');
    e.className='st'; e.textContent=bomb?'💣':'⭐';
    if(bomb) e.style.filter='drop-shadow(0 0 10px rgba(255,90,122,.7))';
    e.style.left=(4+Math.random()*80)+'%';
    e.style.animationDuration=(2.6-(20-g.time)*.06)+'s';
    e.addEventListener('pointerdown',function(ev){
      ev.preventDefault(); if(!g||!g.on||e.dead) return; e.dead=true;
      var r=arena.getBoundingClientRect(), p=document.createElement('div');
      p.className='pop'; p.style.left=(ev.clientX-r.left-8)+'px'; p.style.top=(ev.clientY-r.top-20)+'px';
      if(bomb){g.score=Math.max(0,g.score-3);p.textContent='-3';p.style.color='#ff5a7a';hap('error');arena.classList.remove('shake');void arena.offsetWidth;arena.classList.add('shake')}
      else{g.score++;p.textContent='+1';hap('tap')}
      arena.appendChild(p);setTimeout(function(){p.remove()},700);
      e.remove(); $('#gS').textContent=g.score;
    });
    e.addEventListener('animationend',function(){e.remove()});
    arena.appendChild(e);
  }
  function stopGame(){ if(g){g.on=false;clearTimeout(g.sp);clearInterval(g.tm)} }
  function endGame(){
    stopGame(); var sc=g.score;
    arena.querySelectorAll('.st').forEach(function(e){e.remove()});
    var first=S.gameDay!==today(), gain=sc>=30?3:sc>=20?2:sc>=10?1:0, rec=sc>S.best;
    if(rec){S.best=sc;$('#gB').textContent=sc}
    if(first){S.gameDay=today()}
    var msg=first?(gain?'Tu gagnes <b style="color:var(--acc)">+'+gain+' 🎟️</b>':'Il faut 10 points pour gagner un ticket.'):'Mode entraînement, pas de ticket.';
    showOv('<div class="lbl">Partie terminée</div><div class="big" style="font-size:64px">'+sc+'</div><p class="sub">'+(rec?'🔥 Nouveau record ! ':'')+msg+'</p><button class="btn" id="again" style="margin-top:8px">Rejouer</button>');
    $('#again').onclick=function(){startGame()};
    if(first&&gain) addT(gain); else save();
    g=null;
  }

  // ---------- Classement ----------
  async function loadBoard(){
    var b=$('#board'); b.innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>';
    save(true);
    var list=[]; try{ list=await SayApp.top('tickets',30)||[]; }catch(e){}
    if(!list.length){ b.innerHTML='<div class="empty"><div>🏆</div>Personne n\'est encore au classement.<br>Sois le premier à récolter des tickets !</div>'; return; }
    var med=['🥇','🥈','🥉'], esc=function(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})};
    b.innerHTML=list.map(function(r,i){
      return '<div class="row'+(r.me?' me':'')+'" style="animation-delay:'+(i*30)+'ms"><div class="rk">'+(med[i]||(i+1))+'</div><div class="n">'+esc(r.name||'Anonyme')+(r.me?' (toi)':'')+'</div><div class="v">'+r.value+' 🎟️</div></div>';
    }).join('');
  }

  // ---------- Navigation ----------
  function go(t){
    if(tab==='game'&&t!=='game'){stopGame();g=null}
    tab=t;
    document.querySelectorAll('.view').forEach(function(v){v.classList.toggle('on',v.id==='v-'+t)});
    document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});
    hap('tap');
    if(t==='home') renderHome();
    if(t==='game') intro();
    if(t==='top') loadBoard();
    window.scrollTo(0,0);
  }
  document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){go(b.dataset.t)}});
  setInterval(tick,1000);
  window.addEventListener('pagehide',function(){save(true)});
  document.addEventListener('visibilitychange',function(){if(document.hidden)save(true)});

  renderHome(); refreshT();
});
</script>
</body>
</html>
