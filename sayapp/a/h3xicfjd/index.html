<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dawnly</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --main:#FF8A3D;--accent:#FFC857;--pink:#FF5E7E;
  --bg:#0E0A18;--bg2:#171127;--card:#1D1630;--line:rgba(255,255,255,.07);
  --txt:#F6F1FF;--mut:#A79CC2;--ok:#4ADE9B;
  --r:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;overflow-x:hidden}
body{min-height:100vh;background:radial-gradient(120% 60% at 50% -10%,rgba(255,138,61,.28),transparent 60%),radial-gradient(80% 40% at 100% 30%,rgba(255,94,126,.12),transparent 70%),var(--bg)}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{position:sticky;top:0;z-index:20;padding:calc(var(--sa-top,0px) + 8px) 16px 8px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(var(--bg) 70%,transparent)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.3px}
.logo i{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--main) 60%,var(--pink));box-shadow:0 4px 16px rgba(255,138,61,.5);display:grid;place-items:center;font-style:normal;font-size:16px}
.langbtn{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;transition:transform .15s}
.langbtn:active{transform:scale(.94)}
.langmenu{position:absolute;right:16px;top:calc(var(--sa-top,0px) + 54px);background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.5);opacity:0;transform:translateY(-6px) scale(.97);pointer-events:none;transition:.2s}
.langmenu.open{opacity:1;transform:none;pointer-events:auto}
.langmenu button{display:flex;gap:10px;width:160px;padding:10px 12px;border-radius:10px;font-size:14px;text-align:left}
.langmenu button.on{background:rgba(255,138,61,.15);color:var(--accent)}
main{padding:8px 16px calc(100px + env(safe-area-inset-bottom))}
.view{display:none;animation:fade .3s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lbl{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut);font-weight:600;margin-bottom:8px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.04) inset}
.hero{position:relative;overflow:hidden;padding:24px 20px;min-height:200px}
.sun{position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#FFE7A0,var(--accent) 35%,var(--main) 65%,transparent 72%);filter:blur(1px);animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.08);opacity:.85}}
.hero h1{position:relative;font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.6px;max-width:80%}
.hero h1 span{background:linear-gradient(90deg,var(--accent),var(--main),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{position:relative;color:var(--mut);margin-top:8px;font-size:14px}
.stats{position:relative;display:flex;gap:8px;margin-top:20px}
.stat{flex:1;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px;font-weight:800}
.stat small{font-size:11px;color:var(--mut);letter-spacing:.6px;text-transform:uppercase}
.quote{font-size:16px;line-height:1.55;font-weight:500}
.quote:before{content:"“";display:block;font-size:44px;line-height:.6;color:var(--main);height:20px}
.moods{display:flex;justify-content:space-between;gap:6px}
.mood{flex:1;aspect-ratio:1;max-width:60px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:26px;transition:transform .15s,background .2s,box-shadow .2s}
.mood:active{transform:scale(.88)}
.mood.on{background:rgba(255,138,61,.18);border-color:var(--main);box-shadow:0 0 0 3px rgba(255,138,61,.15),0 6px 18px rgba(255,138,61,.3);transform:translateY(-3px)}
.moodmsg{margin-top:12px;color:var(--mut);font-size:14px;min-height:20px}
.btn{width:100%;padding:16px;border-radius:16px;font-weight:700;font-size:15px;background:linear-gradient(135deg,var(--accent),var(--main) 55%,var(--pink));color:#1a0d05;box-shadow:0 10px 26px rgba(255,138,61,.4);transition:transform .15s}
.btn:active{transform:scale(.97)}
.prog{height:10px;border-radius:10px;background:rgba(255,255,255,.06);overflow:hidden;margin:12px 0 4px}
.prog i{display:block;height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,var(--accent),var(--main),var(--pink));box-shadow:0 0 12px var(--main);transition:width .4s cubic-bezier(.2,.8,.2,1)}
.row{display:flex;justify-content:space-between;align-items:baseline}
.row h2{font-size:22px;font-weight:800;letter-spacing:-.4px}
.habit{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;text-align:left;transition:transform .15s,background .25s,border-color .25s}
.habit:active{transform:scale(.97)}
.habit .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:rgba(255,255,255,.05);flex-shrink:0}
.habit .tx{flex:1;min-width:0}
.habit .tx b{display:block;font-size:15px;font-weight:600}
.habit .tx small{color:var(--mut);font-size:12.5px}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.18);display:grid;place-items:center;flex-shrink:0;transition:.25s}
.chk svg{opacity:0;transform:scale(.4);transition:.25s}
.habit.done{background:linear-gradient(90deg,rgba(74,222,155,.1),rgba(74,222,155,.02)),var(--card);border-color:rgba(74,222,155,.35)}
.habit.done .chk{background:var(--ok);border-color:var(--ok);box-shadow:0 0 14px rgba(74,222,155,.5)}
.habit.done .chk svg{opacity:1;transform:none}
.habit.done .tx b{color:#CFF7E3}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(255,200,87,.12);color:var(--accent);font-size:12px;font-weight:700}
.lb{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.lb:last-child{border:0}
.lb .rk{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px;background:rgba(255,255,255,.05)}
.lb:nth-child(1) .rk{background:linear-gradient(135deg,var(--accent),var(--main));color:#1a0d05}
.lb:nth-child(2) .rk{background:#cfd3e0;color:#222}
.lb:nth-child(3) .rk{background:#d89a6a;color:#2a1405}
.lb .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb.me{background:rgba(255,138,61,.08);border-radius:12px}
.lb .vl{font-weight:800;color:var(--accent)}
.empty{text-align:center;padding:28px 8px;color:var(--mut)}
.empty div{font-size:40px;margin-bottom:8px}
.sk{height:44px;border-radius:12px;margin-bottom:8px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:4px;padding:6px;border-radius:22px;background:rgba(23,17,39,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:30}
nav button{flex:1;padding:10px 4px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--mut);transition:.2s}
nav button span{font-size:20px;transition:transform .2s}
nav button.on{color:var(--txt);background:linear-gradient(135deg,rgba(255,200,87,.16),rgba(255,94,126,.12))}
nav button.on span{transform:translateY(-2px) scale(1.1)}
.float{position:fixed;pointer-events:none;font-weight:800;color:var(--accent);font-size:18px;text-shadow:0 0 12px rgba(255,138,61,.7);animation:up .9s ease-out forwards;z-index:50}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.conf{position:fixed;top:-12px;width:8px;height:12px;border-radius:2px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;left:50%;top:calc(var(--sa-top,0px) + 70px);transform:translate(-50%,-20px);opacity:0;background:var(--bg2);border:1px solid rgba(255,200,87,.4);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:70;transition:.3s;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;color:var(--mut);opacity:.55;font-size:11px;margin-top:8px}
</style>
</head>
<body>
<header>
  <div class="logo"><i>🌅</i>Dawnly</div>
  <button class="langbtn" id="langBtn"><span id="langFlag">🇬🇧</span><span id="langCode">EN</span> ▾</button>
  <div class="langmenu" id="langMenu"></div>
</header>

<main>
  <section class="view on" id="v-today">
    <div class="card hero">
      <div class="sun"></div>
      <div class="lbl" id="dateLbl"></div>
      <h1 id="greet"></h1>
      <p id="sub"></p>
      <div class="stats">
        <div class="stat"><b id="sStreak">0</b><small data-t="streak"></small></div>
        <div class="stat"><b id="sSuns">0</b><small data-t="suns"></small></div>
        <div class="stat"><b id="sDone">0/5</b><small data-t="today"></small></div>
      </div>
    </div>
    <div class="card">
      <div class="lbl" data-t="feel"></div>
      <div class="moods" id="moods"></div>
      <div class="moodmsg" id="moodMsg"></div>
    </div>
    <div class="card">
      <div class="lbl" data-t="thought"></div>
      <div class="quote" id="quote"></div>
    </div>
    <button class="btn" id="wishBtn" data-t="wish"></button>
  </section>

  <section class="view" id="v-ritual">
    <div class="card">
      <div class="row"><h2 data-t="ritual"></h2><span class="badge" id="rBadge"></span></div>
      <div class="prog"><i id="prog"></i></div>
      <div style="color:var(--mut);font-size:13px" id="rHint"></div>
    </div>
    <div id="habits"></div>
  </section>

  <section class="view" id="v-board">
    <div class="card">
      <div class="lbl" data-t="boardLbl"></div>
      <div class="row" style="margin-bottom:8px"><h2 data-t="board"></h2><span class="badge">☀️ <span data-t="suns"></span></span></div>
      <div id="lbList"></div>
    </div>
    <footer data-t="noCash"></footer>
  </section>
  <footer>Made with SayApp</footer>
</main>

<nav>
  <button class="on" data-v="today"><span>🌞</span><em data-t="tToday" style="font-style:normal"></em></button>
  <button data-v="ritual"><span>✅</span><em data-t="tRitual" style="font-style:normal"></em></button>
  <button data-v="board"><span>🏆</span><em data-t="tBoard" style="font-style:normal"></em></button>
</nav>
<div class="toast" id="toast"></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://jeremstyke.github.io/sayapp/sdk.js" data-app="h3xicfjd" data-full="1"></script>
<script>
window.addEventListener('load', async () => {
const D = {
  en:{flag:'🇬🇧',name:'English',
    morning:'Good morning',afternoon:'Good afternoon',evening:'Good evening',friend:'friend',
    subM:'A fresh day just started. Make it count.',subA:'Still time to win the day.',subE:'Rest well, tomorrow is a new sunrise.',
    streak:'Streak',suns:'Suns',today:'Today',feel:'How do you feel?',thought:'Morning thought',
    wish:'☀️ Send a good morning wish',wishText:'Good morning bro! Wishing you a bright day full of energy ☀️',
    ritual:'Morning ritual',left:'{n} left for today',allDone:'Ritual complete. Streak saved! 🔥',days:'days',
    boardLbl:'Early risers',board:'Leaderboard',empty:'No early risers yet. Be the first!',you:'You',
    noCash:'Suns are just for fun and have no cash value.',tToday:'Today',tRitual:'Ritual',tBoard:'Ranking',
    done:'Ritual complete! +50 bonus ☀️',moodSaved:'Mood saved',
    moodsMsg:['Rough start? Drink some water and breathe slowly.','A calm morning is a strong morning.','Nice, keep that steady vibe.','Great energy, use it well!','You are on fire today! 🔥'],
    habits:[['💧','Drink a glass of water','Wake up your body'],['🧘','Stretch for 5 minutes','Loosen up neck and back'],['🌤️','Get some sunlight','Open the window or step outside'],['📝','Write 3 goals for today','Small and clear'],['📵','15 min without phone','Own your first minutes']],
    quotes:['Every morning you have two choices: keep sleeping with your dreams, or wake up and chase them.','Small steps every morning build big lives.','Win the morning, win the day.','The sun does not rise for those who stay in bed with excuses.','Today is a blank page. Write something good on it.','Your future is created by what you do today, not tomorrow.','Discipline is choosing what you want most over what you want now.']},
  hi:{flag:'🇮🇳',name:'हिन्दी',
    morning:'सुप्रभात',afternoon:'शुभ दोपहर',evening:'शुभ संध्या',friend:'दोस्त',
    subM:'नया दिन शुरू हुआ है। इसे खास बनाओ।',subA:'दिन जीतने का अभी भी समय है।',subE:'अच्छा आराम करो, कल नया सवेरा है।',
    streak:'स्ट्रीक',suns:'सूरज',today:'आज',feel:'आप कैसा महसूस कर रहे हैं?',thought:'सुबह का विचार',
    wish:'☀️ सुप्रभात शुभकामना भेजें',wishText:'सुप्रभात भाई! आपका दिन ऊर्जा और खुशियों से भरा हो ☀️',
    ritual:'सुबह की दिनचर्या',left:'आज {n} बाकी',allDone:'दिनचर्या पूरी। स्ट्रीक सुरक्षित! 🔥',days:'दिन',
    boardLbl:'जल्दी उठने वाले',board:'लीडरबोर्ड',empty:'अभी कोई नहीं। पहले बनो!',you:'आप',
    noCash:'सूरज सिर्फ मज़े के लिए हैं, इनका कोई नकद मूल्य नहीं है।',tToday:'आज',tRitual:'दिनचर्या',tBoard:'रैंकिंग',
    done:'दिनचर्या पूरी! +50 बोनस ☀️',moodSaved:'मूड सेव हुआ',
    moodsMsg:['मुश्किल शुरुआत? पानी पियो और धीरे सांस लो।','शांत सुबह, मज़बूत सुबह।','बढ़िया, यही लय बनाए रखो।','शानदार ऊर्जा, इसका सही उपयोग करो!','आज तो आप छा गए! 🔥'],
    habits:[['💧','एक गिलास पानी पिएं','शरीर को जगाएं'],['🧘','5 मिनट स्ट्रेच करें','गर्दन और पीठ ढीली करें'],['🌤️','थोड़ी धूप लें','खिड़की खोलें या बाहर जाएं'],['📝','आज के 3 लक्ष्य लिखें','छोटे और साफ'],['📵','15 मिनट फोन नहीं','पहले पल अपने नाम करें']],
    quotes:['हर सुबह दो विकल्प हैं: सपनों के साथ सोते रहो, या उठकर उन्हें पूरा करो।','हर सुबह के छोटे कदम बड़ी ज़िंदगी बनाते हैं।','सुबह जीतो, दिन जीतो।','बहानों के साथ बिस्तर में रहने वालों के लिए सूरज नहीं उगता।','आज एक कोरा पन्ना है। उस पर कुछ अच्छा लिखो।','आपका भविष्य आज के कामों से बनता है, कल से नहीं।','अनुशासन यानी जो सबसे ज़्यादा चाहिए उसे अभी की चाह से ऊपर रखना।']}
};
const MOODS=['😫','😐','🙂','😄','🤩'];
const tg=window.Telegram&&Telegram.WebApp;
try{tg&&tg.ready();tg&&tg.expand();}catch(e){}
const S=window.SayApp||{user:null,get:async()=>null,set:async()=>{},top:async()=>[],haptic:()=>{}};
const user=S.user||(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)||{};
let code=((tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.language_code)||'en').slice(0,2);
let lang=D[code]?code:'en';
const t=k=>(D[lang][k]!==undefined?D[lang][k]:D.en[k]);
const $=id=>document.getElementById(id);
const dk=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const today=dk(), yest=dk(new Date(Date.now()-864e5));

let st={date:today,done:[],streak:0,last:'',mood:-1,suns:0,bonus:''};
try{const s=await S.get('dawnly');if(s&&typeof s==='object')st=Object.assign(st,s);const l=await S.get('lang');if(l&&D[l])lang=l;}catch(e){}
if(st.date!==today){st.date=today;st.done=[];st.mood=-1;}
if(st.last!==today&&st.last!==yest)st.streak=0;

let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{S.set('dawnly',st).catch(()=>{});S.set('suns',st.suns).catch(()=>{});},1500);}

let shownSuns=st.suns;
function animNum(el,from,to){const t0=performance.now();const step=n=>{const p=Math.min(1,(n-t0)/400);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step);}

function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2000);}
function floatAt(x,y,txt){const f=document.createElement('div');f.className='float';f.textContent=txt;f.style.left=(x-14)+'px';f.style.top=(y-20)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),900);}
function confetti(){const c=['#FFC857','#FF8A3D','#FF5E7E','#4ADE9B','#fff'];for(let i=0;i<60;i++){const p=document.createElement('div');p.className='conf';p.style.left=Math.random()*100+'vw';p.style.background=c[i%c.length];p.style.animationDuration=(1.6+Math.random()*1.6)+'s';p.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(p);setTimeout(()=>p.remove(),3800);}}

function renderStatic(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  $('langFlag').textContent=D[lang].flag;$('langCode').textContent=lang.toUpperCase();
  $('langMenu').innerHTML=Object.keys(D).map(k=>`<button data-l="${k}" class="${k===lang?'on':''}">${D[k].flag} ${D[k].name}</button>`).join('');
  const h=new Date().getHours();
  const g=h<12?'morning':h<17?'afternoon':'evening';
  const nm=(user.first_name||t('friend')).replace(/[<>&]/g,'');
  $('greet').innerHTML=`${t(g)},<br><span>${nm}</span> ${h<12?'☀️':h<17?'🌤️':'🌙'}`;
  $('sub').textContent=t(g==='morning'?'subM':g==='afternoon'?'subA':'subE');
  try{$('dateLbl').textContent=new Date().toLocaleDateString(lang==='hi'?'hi-IN':'en-US',{weekday:'long',day:'numeric',month:'long'});}catch(e){$('dateLbl').textContent=today;}
  const q=t('quotes');const dn=Math.floor(Date.now()/864e5);$('quote').textContent=q[dn%q.length];
  $('moods').innerHTML=MOODS.map((m,i)=>`<button class="mood${st.mood===i?' on':''}" data-m="${i}">${m}</button>`).join('');
  $('moodMsg').textContent=st.mood>=0?t('moodsMsg')[st.mood]:'';
  renderHabits();renderStats();
}
function renderHabits(){
  $('habits').innerHTML=t('habits').map((h,i)=>`<button class="habit${st.done.includes(i)?' done':''}" data-h="${i}"><div class="ic">${h[0]}</div><div class="tx"><b>${h[1]}</b><small>${h[2]}</small></div><div class="chk"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0E0A18" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg></div></button>`).join('');
}
function renderStats(){
  const n=st.done.length,tot=t('habits').length;
  $('sStreak').textContent=st.streak;
  if(shownSuns!==st.suns){animNum($('sSuns'),shownSuns,st.suns);shownSuns=st.suns;}else $('sSuns').textContent=st.suns;
  $('sDone').textContent=n+'/'+tot;
  $('prog').style.width=(n/tot*100)+'%';
  $('rBadge').textContent='🔥 '+st.streak+' '+t('days');
  $('rHint').textContent=n>=tot?t('allDone'):t('left').replace('{n}',tot-n);
}

$('habits').addEventListener('click',e=>{
  const b=e.target.closest('.habit');if(!b)return;
  const i=+b.dataset.h,idx=st.done.indexOf(i);
  if(idx>=0){st.done.splice(idx,1);st.suns=Math.max(0,st.suns-10);S.haptic('tap');}
  else{st.done.push(i);st.suns+=10;S.haptic('ok');floatAt(e.clientX||innerWidth/2,e.clientY||300,'+10 ☀️');}
  b.classList.toggle('done');
  if(st.done.length===t('habits').length&&st.bonus!==today){
    st.bonus=today;st.suns+=50;
    if(st.last!==today){st.streak=st.last===yest?st.streak+1:1;st.last=today;}
    confetti();toast(t('done'));S.haptic('ok');
  }
  renderStats();save();
});
$('moods').addEventListener('click',e=>{
  const b=e.target.closest('.mood');if(!b)return;
  st.mood=+b.dataset.m;S.haptic('tap');
  document.querySelectorAll('.mood').forEach(m=>m.classList.toggle('on',+m.dataset.m===st.mood));
  $('moodMsg').textContent=t('moodsMsg')[st.mood];save();
});
$('wishBtn').onclick=()=>{
  S.haptic('tap');
  const url='https://t.me/share/url?url='+encodeURIComponent(' ')+'&text='+encodeURIComponent(t('wishText'));
  try{if(tg&&tg.openTelegramLink)tg.openTelegramLink(url);else window.open(url,'_blank');}catch(e){window.open(url,'_blank');}
};
$('langBtn').onclick=e=>{e.stopPropagation();$('langMenu').classList.toggle('open');S.haptic('tap');};
$('langMenu').addEventListener('click',e=>{
  const b=e.target.closest('[data-l]');if(!b)return;
  lang=b.dataset.l;S.set('lang',lang).catch(()=>{});$('langMenu').classList.remove('open');renderStatic();
  if($('v-board').classList.contains('on'))loadBoard();
});
document.addEventListener('click',e=>{if(!e.target.closest('#langMenu'))$('langMenu').classList.remove('open');});

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  S.haptic('tap');
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+b.dataset.v));
  window.scrollTo({top:0,behavior:'smooth'});
  if(b.dataset.v==='board')loadBoard();
});

async function loadBoard(){
  const L=$('lbList');L.innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  clearTimeout(saveT);try{await S.set('suns',st.suns);await S.set('dawnly',st);}catch(e){}
  let rows=[];try{rows=(await S.top('suns',10))||[];}catch(e){}
  rows=rows.filter(r=>r&&r.value>0);
  if(!rows.length){L.innerHTML=`<div class="empty"><div>🌄</div>${t('empty')}</div>`;return;}
  L.innerHTML=rows.map((r,i)=>`<div class="lb${r.me?' me':''}"><div class="rk">${i+1}</div><div class="nm">${String(r.me?t('you'):(r.name||'?')).replace(/[<>&]/g,'')}</div><div class="vl">${r.value} ☀️</div></div>`).join('');
}

renderStatic();
});
</script>
</body>
</html>
