  if(hasShield){ctx.strokeStyle=`rgba(255,255,255,${.5+.4*Math.sin(now/120)})`;ctx.lineWidth=cs*.06;ctx.beginPath();ctx.arc(h.x,h.y,cs*.62,0,7);ctx.stroke()}
  const ex=-dir.y,ey=dir.x;ctx.fillStyle='#05060f';[1,-1].forEach(s=>{ctx.beginPath();ctx.arc(h.x+dir.x*cs*.14+ex*s*cs*.17,h.y+dir.y*cs*.14+ey*s*cs*.17,cs*.08,0,7);ctx.fill()});
  parts=parts.filter(p=>(p.life-=.025*dt)>0);parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.95;p.vy*=.95;ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life+.5,0,7);ctx.fill()});
  floats=floats.filter(f=>(f.life-=.02*dt)>0);ctx.textAlign='center';ctx.textBaseline='middle';floats.forEach(f=>{f.y-=cs*.03*dt;ctx.globalAlpha=Math.min(1,f.life*1.5);ctx.font=`700 ${cs*.7}px 'Space Grotesk',sans-serif`;ctx.fillStyle=f.color;ctx.shadowBlur=cs*.5;ctx.shadowColor=f.color;ctx.fillText(f.text,f.x,f.y);ctx.shadowBlur=0});
  ctx.globalAlpha=1;
  if(flash>0){ctx.fillStyle=`rgba(255,43,214,${flash*.25})`;ctx.fillRect(0,0,W,W);flash=Math.max(0,flash-.04*dt)}
}
function loop(now){requestAnimationFrame(loop);if(state==='play'){if(now-lastTick>1000)lastTick=now-interval;if(now-lastTick>=interval){lastTick+=interval;step()}}render(now)}
const DIRS={U:{x:0,y:-1},D:{x:0,y:1},L:{x:-1,y:0},R:{x:1,y:0}};
function turn(c){if(state!=='play')return;const d=DIRS[c],l=queue.length?queue[queue.length-1]:dir;if((d.x===-l.x&&d.y===-l.y)||(d.x===l.x&&d.y===l.y))return;if(queue.length<3)queue.push(d)}
let sx=null,sy=null;
window.addEventListener('touchstart',e=>{const p=e.touches[0];sx=p.clientX;sy=p.clientY},{passive:true});
window.addEventListener('touchmove',e=>{if(state!=='play'||sx===null)return;e.preventDefault();const p=e.touches[0],dx=p.clientX-sx,dy=p.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>22){turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'));sx=p.clientX;sy=p.clientY}},{passive:false});
window.addEventListener('touchend',()=>{sx=null});
window.addEventListener('keydown',e=>{const m={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R',w:'U',s:'D',a:'L',d:'R',z:'U',q:'L'}[e.key];if(m){e.preventDefault();turn(m)}else if((e.key===' '||e.key==='Enter')&&state!=='play'){e.preventDefault();play()}});
function play(){reset();$('start').classList.add('hide');$('over').classList.add('hide');sfx.start();hap('tap');state='play';lastTick=performance.now()}
function countUp(el,to){const t0=performance.now();const f=n=>{const k=Math.min(1,(n-t0)/600);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function showOver(){
  const nb=score>best;if(nb){best=score;$('bs').textContent=best;$('bs2').textContent=best}
  $('nb').classList.toggle('on',nb&&score>0);countUp($('fs'),score);countUp($('fb'),best);
  $('over').classList.remove('hide');$('over').scrollTop=0;
  const lb=$('lb');lb.innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  try{if(nb)await S.set('best',best)}catch(e){}
  try{const list=(await S.top('best',20))||[];
    if(!list.length){lb.innerHTML=`<div class="empty">🐍 ${t('empty')}</div>`;return}
    const med=['🥇','🥈','🥉'];let me=false;
    lb.innerHTML=list.map((r,i)=>{if(r.me)me=true;return `<div class="row${r.me?' me':''}" style="animation-delay:${i*30}ms"><span class="rk">${med[i]||i+1}</span><span class="nm">${esc(r.name||t('player'))}${r.me?' ('+t('you')+')':''}</span><span class="sc">${Math.round(r.value)||0}</span></div>`}).join('')+(me?'':`<div class="empty" style="padding:12px 8px 8px">${t('notop')}</div>`);
  }catch(e){lb.innerHTML=`<div class="empty">${t('err')}</div>`}
}
$('playBtn').onclick=play;$('againBtn').onclick=play;
$('sndBtn').onclick=()=>{sound=!sound;$('sndBtn').textContent=sound?'🔊':'🔇';hap('tap');if(sound)sfx.start();savePrefs()};
$('langBtn').onclick=()=>{lang=lang==='en'?'fr':'en';applyLang();hap('tap');savePrefs()};
window.addEventListener('resize',resize);
window.addEventListener('load',async()=>{
  try{const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();tg.disableVerticalSwipes&&tg.disableVerticalSwipes();tg.setHeaderColor&&tg.setHeaderColor('#05060f');tg.setBackgroundColor&&tg.setBackgroundColor('#05060f')}}catch(e){}
  const lc=((S.user&&S.user.language_code)||(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.user&&Telegram.WebApp.initDataUnsafe.user.language_code)||navigator.language||'en').toLowerCase();
  lang=lc.startsWith('fr')?'fr':'en';
  applyLang();resize();reset();requestAnimationFrame(loop);
  try{const p=await S.get('prefs');if(p){if(p.lang==='en'||p.lang==='fr')lang=p.lang;if(typeof p.sound==='boolean')sound=p.sound}}catch(e){}
  try{best=Number(await S.get('best'))||0}catch(e){}
  applyLang();$('sndBtn').textContent=sound?'🔊':'🔇';$('bs').textContent=best;countUp($('bs2'),best);
});
</script>
