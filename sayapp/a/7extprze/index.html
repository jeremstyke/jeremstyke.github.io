<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sad-App</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080f;--bg2:#0d0f1c;--card:#121527;--card2:#181c33;--line:rgba(255,255,255,.07);--main:#6c5cff;--main2:#8f7dff;--accent:#ff4f9a;--gold:#ffc94d;--ok:#3ee0a1;--text:#eef0ff;--mute:#8a8fb0;--r:20px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;overflow-x:hidden;user-select:none;-webkit-user-select:none}
body{min-height:100vh;background:radial-gradient(120% 60% at 50% -10%,rgba(108,92,255,.25),transparent 60%),radial-gradient(80% 40% at 100% 100%,rgba(255,79,154,.12),transparent 60%),var(--bg)}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sa-top,0px) + 8px) 16px 8px;background:linear-gradient(var(--bg) 70%,transparent)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,var(--main),var(--accent));box-shadow:0 6px 20px rgba(108,92,255,.45)}
.brand h1{font-size:20px;font-weight:800;letter-spacing:-.3px}
.lang{appearance:none;-webkit-appearance:none;background:var(--card);color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:600 12px 'Outfit',sans-serif;letter-spacing:1px;outline:none}
main{padding:0 16px calc(96px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto}
.screen{display:none;animation:fade .3s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.label{font-size:11px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--mute)}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)}
.score{text-align:center;margin-top:8px}
.score .num{font-size:44px;font-weight:800;letter-spacing:-1px;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
.score .num span.d{font-size:30px;filter:drop-shadow(0 0 12px rgba(108,170,255,.7))}
.mood{color:var(--mute);margin-top:2px;font-size:15px}
.lvl{margin-top:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lvl b{font-size:16px}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--main),var(--accent));box-shadow:0 0 12px rgba(255,79,154,.6);transition:width .3s ease}
.bar.e i{background:linear-gradient(90deg,#ffb84d,var(--gold));box-shadow:0 0 12px rgba(255,201,77,.6)}
.orbwrap{position:relative;display:grid;place-items:center;margin:24px 0 16px;height:280px}
.orbwrap::before{content:"";position:absolute;width:290px;height:290px;border-radius:50%;background:conic-gradient(from 0deg,var(--main),var(--accent),var(--main));filter:blur(28px);opacity:.45;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.orb{position:relative;width:250px;height:250px;border-radius:50%;display:grid;place-items:center;font-size:120px;cursor:pointer;touch-action:none;background:radial-gradient(circle at 35% 28%,#a99cff,var(--main) 45%,#2b1f8f 100%);box-shadow:0 20px 60px rgba(108,92,255,.55),inset 0 -14px 40px rgba(0,0,0,.35),inset 0 8px 24px rgba(255,255,255,.25);transition:transform .12s ease;filter:hue-rotate(var(--h,0deg))}
.orb.p{transform:scale(.94)}
.orb.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.orb em{font-style:normal;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3));pointer-events:none;transition:transform .2s}
.fl{position:fixed;z-index:50;pointer-events:none;font-weight:800;font-size:26px;color:#fff;text-shadow:0 0 12px var(--accent),0 2px 0 rgba(0,0,0,.3)}
.pt{position:fixed;z-index:49;width:8px;height:8px;border-radius:50%;pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.stat .v{font-size:20px;font-weight:700;margin-top:6px}
.btn{border:0;border-radius:14px;padding:12px 16px;font:700 15px 'Outfit',sans-serif;color:#fff;background:linear-gradient(135deg,var(--main),var(--accent));box-shadow:0 8px 22px rgba(255,79,154,.35);transition:transform .15s,opacity .2s;cursor:pointer;white-space:nowrap}
.btn:active{transform:scale(.95)}
.btn.off{background:var(--card2);color:var(--mute);box-shadow:none;border:1px solid var(--line)}
.btn.done{background:rgba(62,224,161,.12);color:var(--ok);box-shadow:none}
.up{display:flex;align-items:center;gap:12px;margin-top:12px}
.ic{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:22px;background:rgba(108,92,255,.16);border:1px solid rgba(108,92,255,.3)}
.grow{flex:1;min-width:0}
.grow b{display:block;font-size:16px}
.grow small{color:var(--mute);font-size:13px}
h2{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:8px 0 4px}
.sub{color:var(--mute);margin-bottom:16px}
.streak{display:flex;align-items:center;gap:14px;margin-bottom:12px;background:linear-gradient(135deg,rgba(255,79,154,.18),rgba(108,92,255,.18))}
.streak .big{font-size:36px}
.task{margin-bottom:12px}
.task .bar{height:6px;margin-top:12px}
.rw{color:var(--gold);font-weight:700;font-size:13px}
.lb{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.lb:last-child{border:0}
.rk{width:30px;font-weight:800;color:var(--mute);text-align:center}
.lb.me{background:rgba(108,92,255,.14)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:linear-gradient(135deg,var(--main),var(--accent))}
.lb .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lb .s{font-weight:700}
.sk{height:60px;border-radius:12px;margin:8px 0;background:linear-gradient(90deg,var(--card) 0%,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:32px 16px;color:var(--mute)}
.empty div{font-size:48px;margin-bottom:8px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;display:flex;gap:4px;padding:6px;border-radius:22px;background:rgba(18,21,39,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.5);width:calc(100% - 32px);max-width:420px}
nav button{flex:1;border:0;background:none;color:var(--mute);font:600 12px 'Outfit',sans-serif;padding:8px 4px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .2s;cursor:pointer}
nav button span{font-size:20px;transition:transform .2s}
nav button.on{color:#fff;background:linear-gradient(135deg,rgba(108,92,255,.35),rgba(255,79,154,.25))}
nav button.on span{transform:scale(1.15)}
.toast{position:fixed;left:50%;top:calc(var(--sa-top,0px) + 64px);transform:translate(-50%,-20px);opacity:0;z-index:60;padding:10px 18px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:all .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;color:var(--mute);opacity:.5;font-size:11px;margin-top:24px}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100;transition:opacity .3s}
.loading div{font-size:56px;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
</style>
</head>
<body>
<div class="loading" id="ld"><div>😢</div></div>
<header>
  <div class="brand"><div class="logo">💧</div><h1>Sad-App</h1></div>
  <select class="lang" id="lang"><option value="en">EN</option><option value="fr">FR</option><option value="es">ES</option><option value="pt">PT</option></select>
</header>
<main>
  <section class="screen on" id="s-tap">

    <div class="card lvl">

  <section class="screen" id="s-tasks">
    <h2 data-i="daily"></h2>
    <p class="sub"><span data-i="resetIn"></span> <b id="rst"></b></p>
    <div class="card streak"><div class="big">🔥</div><div class="grow"><span class="label" data-i="streak"></span><b id="stk" style="font-size:22px"></b></div></div>

  <section class="screen" id="s-top">
    <h2 data-i="leaderTitle"></h2>
    <p class="sub" data-i="leaderSub"></p>
    <div class="card" style="padding:0;overflow:hidden" id="lb"></div>
  </section>
  <footer>Made with SayApp</footer>
</main>
<nav>
  <button class="on" data-t="tap"><span>💧</span><b data-i="tap"></b></button>
  <button data-t="tasks"><span>✅</span><b data-i="tasks"></b></button>
  <button data-t="top"><span>🏆</span><b data-i="top"></b></button>
</nav>
<div class="toast" id="toast"></div>

<script>
window.addEventListener('load',function(){

en:{drops:'Drops',tap:'Tap',tasks:'Tasks',top:'Top',level:'Level',next:'next at',energy:'Energy',power:'Tap power',perTap:'drops per tap',upgrade:'Boost',notEnough:'Not enough drops',noEnergy:'Out of energy, rest a little',levelUp:'Level up! Level',daily:'Daily tasks',resetIn:'New tasks in',streak:'Check-in streak',days:'days',claim:'Claim',claimed:'Done',go:'Go',t_checkin:'Daily check-in',d_checkin:'Come back every day, rewards grow',t_tap100:'Warm up',d_tap100:'Tap 100 times today',t_tap1000:'Tap marathon',d_tap1000:'Tap 1,000 times today',t_boost:'Power up',d_boost:'Buy 1 tap boost today',leaderTitle:'Leaderboard',leaderSub:'Top cheerers of the week',you:'You',empty:'No players yet. Be the first!',moods:['So sad...','A bit better','Feeling okay','Pretty happy!','Pure joy!']},

es:{drops:'Gotas',tap:'Tocar',tasks:'Tareas',top:'Top',level:'Nivel',next:'siguiente en',energy:'Energía',power:'Poder',perTap:'gotas por toque',upgrade:'Mejorar',notEnough:'No tienes suficientes gotas',noEnergy:'Sin energía, descansa un poco',levelUp:'¡Subiste! Nivel',daily:'Tareas diarias',resetIn:'Nuevas tareas en',streak:'Racha diaria',days:'días',claim:'Reclamar',claimed:'Hecho',go:'Ir',t_checkin:'Registro diario',d_checkin:'Vuelve cada día, la recompensa crece',t_tap100:'Calentamiento',d_tap100:'Toca 100 veces hoy',t_tap1000:'Maratón',d_tap1000:'Toca 1.000 veces hoy',t_boost:'Potencia',d_boost:'Compra 1 mejora hoy',leaderTitle:'Clasificación',leaderSub:'Los que más animan',you:'Tú',empty:'Aún no hay jugadores. ¡Sé el primero!',moods:['Muy triste...','Un poco mejor','Bien','¡Bastante feliz!','¡Pura alegría!']},
pt:{drops:'Gotas',tap:'Tocar',tasks:'Tarefas',top:'Top',level:'Nível',next:'próximo em',energy:'Energia',power:'Força',perTap:'gotas por toque',upgrade:'Melhorar',notEnough:'Gotas insuficientes',noEnergy:'Sem energia, descanse um pouco',levelUp:'Subiu! Nível',daily:'Tarefas diárias',resetIn:'Novas tarefas em',streak:'Sequência diária',days:'dias',claim:'Resgatar',claimed:'Feito',go:'Ir',t_checkin:'Check-in diário',d_checkin:'Volte todo dia, o prêmio cresce',t_tap100:'Aquecimento',d_tap100:'Toque 100 vezes hoje',t_tap1000:'Maratona',d_tap1000:'Toque 1.000 vezes hoje',t_boost:'Potência',d_boost:'Compre 1 melhoria hoje',leaderTitle:'Ranking',leaderSub:'Quem mais anima',you:'Você',empty:'Nenhum jogador ainda. Seja o primeiro!',moods:['Tão triste...','Um pouco melhor','Tudo bem','Bem feliz!','Pura alegria!']}
};
const FACES=['😢','😟','🙁','😐','🙂','😊','😄','😁','🤩','🥳'];
const SA=window.SayApp||{get:async()=>null,set:async()=>{},top:async()=>[],haptic:()=>{},user:{}};
const $=id=>document.getElementById(id);
let L='en',S,dirty=false,shown=0,tab='tap';
const t=k=>(D[L]&&D[L][k]!=null)?D[L][k]:D.en[k];
const fmt=n=>Math.floor(n).toLocaleString(L==='en'?'en-US':L);
const dstr=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const today=()=>dstr(new Date());
const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return dstr(d)};
const lvlOf=x=>Math.floor(Math.sqrt(x/100))+1;
const maxE=()=>500+(lvlOf(S.total)-1)*100;
const cost=()=>Math.floor(200*Math.pow(1.8,S.power-1));
const hap=k=>{try{SA.haptic(k)}catch(e){}};
const nextStreak=()=>S.lastCheck===yesterday()?S.streak+1:(S.lastCheck===today()?S.streak:1);
const TASKS=[
 {id:'checkin',icon:'📅',goal:1,prog:()=>1,rew:()=>100+50*Math.min(nextStreak(),7)},
 {id:'tap100',icon:'👆',goal:100,prog:()=>S.taps,rew:()=>300},
 {id:'tap1000',icon:'🔥',goal:1000,prog:()=>S.taps,rew:()=>1500},
 {id:'boost',icon:'⚡',goal:1,prog:()=>S.ups,rew:()=>500}
];
function rollDay(){if(S.day!==today()){S.day=today();S.taps=0;S.ups=0;S.claimed=[];dirty=true}}
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),1800)}
function applyLang(){document.documentElement.lang=L;$('lang').value=L;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));renderAll()}
function renderTap(){
 const lv=lvlOf(S.total),a=100*Math.pow(lv-1,2),b=100*lv*lv;
 $('lv').textContent=t('level')+' '+lv;
 $('lvn').textContent=t('next')+' '+fmt(b);
 $('lvb').style.width=Math.min(100,(S.total-a)/(b-a)*100)+'%';
 $('face').textContent=FACES[Math.min(lv-1,9)];
 $('orb').style.setProperty('--h',Math.min(lv-1,9)*-18+'deg');
 $('mood').textContent=t('moods')[Math.min(Math.floor((lv-1)/2),4)];
 renderEnergy();
 $('pw').textContent='x'+S.power;
 $('pwd').textContent='+'+S.power+' '+t('perTap');
 const c=cost(),ub=$('upb');ub.textContent='💧 '+fmt(c);ub.className='btn'+(S.score>=c?'':' off');
}
function renderEnergy(){const m=maxE();$('en').textContent=Math.floor(S.energy)+' / '+m;$('enb').style.width=(S.energy/m*100)+'%'}
function renderTasks(){
 $('stk').textContent=S.streak+' '+t('days');
 $('tasks').innerHTML=TASKS.map(k=>{
  const p=Math.min(k.prog(),k.goal),done=S.claimed.includes(k.id),ready=p>=k.goal;
  return '<div class="card task"><div class="up" style="margin:0"><div class="ic">'+k.icon+'</div><div class="grow"><b>'+t('t_'+k.id)+'</b><small>'+t('d_'+k.id)+'</small><div class="rw">+'+fmt(k.rew())+' 💧</div></div><button class="btn '+(done?'done':ready?'':'off')+'" data-c="'+k.id+'">'+(done?'✓ '+t('claimed'):ready?t('claim'):t('go'))+'</button></div>'+(k.goal>1?'<div class="bar"><i style="width:'+(p/k.goal*100)+'%"></i></div>':'')+'</div>';
 }).join('');
}
function renderAll(){renderTap();renderTasks()}
function animNum(){shown+=(S.score-shown)*0.2;if(Math.abs(S.score-shown)<0.5)shown=S.score;$('sc').textContent=fmt(shown);requestAnimationFrame(animNum)}
function floatAt(x,y,txt){
 const f=document.createElement('div');f.className='fl';f.textContent=txt;f.style.left=(x-20)+'px';f.style.top=(y-30)+'px';document.body.appendChild(f);
 f.animate([{transform:'translateY(0) scale(.8)',opacity:1},{transform:'translateY(-90px) scale(1.2)',opacity:0}],{duration:800,easing:'ease-out'}).onfinish=()=>f.remove();
 for(let i=0;i<6;i++){const p=document.createElement('div');p.className='pt';p.style.background=i%2?'var(--accent)':'#9fd0ff';p.style.left=x+'px';p.style.top=y+'px';document.body.appendChild(p);
  const a=Math.random()*Math.PI*2,r=40+Math.random()*50;
  p.animate([{transform:'translate(0,0)',opacity:1},{transform:'translate('+Math.cos(a)*r+'px,'+Math.sin(a)*r+'px) scale(.2)',opacity:0}],{duration:600,easing:'ease-out'}).onfinish=()=>p.remove()}
}
function confetti(){
 const cols=['#6c5cff','#ff4f9a','#ffc94d','#3ee0a1','#9fd0ff'];
 for(let i=0;i<40;i++){const c=document.createElement('div');c.className='pt';c.style.borderRadius='2px';c.style.width='8px';c.style.height='12px';c.style.background=cols[i%5];c.style.left=(innerWidth/2)+'px';c.style.top=(innerHeight/2.5)+'px';document.body.appendChild(c);
  const dx=(Math.random()-.5)*innerWidth,dy=-100-Math.random()*250;
  c.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px) rotate(360deg)',opacity:1,offset:.5},{transform:'translate('+dx*1.2+'px,'+(dy+500)+'px) rotate(720deg)',opacity:0}],{duration:1400+Math.random()*600,easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish=()=>c.remove()}
}
const orb=$('orb');
orb.addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(S.energy<1){orb.classList.remove('shake');void orb.offsetWidth;orb.classList.add('shake');hap('error');toast(t('noEnergy'));return}
 const before=lvlOf(S.total),g=Math.min(S.power,Math.floor(S.energy));
 S.energy-=g;S.score+=g;S.total+=g;S.taps++;dirty=true;
 orb.classList.add('p');setTimeout(()=>orb.classList.remove('p'),110);
 floatAt(e.clientX,e.clientY,'+'+g);hap('tap');
 const after=lvlOf(S.total);
 if(after>before){confetti();hap('ok');toast('🎉 '+t('levelUp')+' '+after)}
 renderTap();
 if(S.taps===100||S.taps===1000)renderTasks();
});
orb.addEventListener('contextmenu',e=>e.preventDefault());
$('upb').onclick=()=>{
 const c=cost();
 if(S.score<c){hap('error');toast(t('notEnough'));return}
 S.score-=c;S.power++;S.ups++;dirty=true;hap('ok');
 const r=$('upb').getBoundingClientRect();floatAt(r.left+r.width/2,r.top,'⚡x'+S.power);
 renderAll();
};
$('tasks').onclick=e=>{
 const b=e.target.closest('[data-c]');if(!b)return;
 const k=TASKS.find(x=>x.id===b.dataset.c);
 if(S.claimed.includes(k.id))return;
 if(k.prog()<k.goal){hap('tap');if(k.id!=='checkin')go('tap');return}
 const r=k.rew();
 if(k.id==='checkin'){S.streak=nextStreak();S.lastCheck=today()}
 S.claimed.push(k.id);S.score+=r;S.total+=r;dirty=true;
 confetti();hap('ok');toast('+'+fmt(r)+' 💧');renderAll();save();
};
function go(n){
 tab=n;document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id==='s-'+n));
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===n));
 if(n==='tasks')renderTasks();if(n==='top')loadTop();hap('tap');
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
async function loadTop(){
 const el=$('lb');el.innerHTML='<div style="padding:8px 16px"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>';
 await save(true);
 let list=[];try{list=await SA.top('score',20)||[]}catch(e){}
 if(!list.length){el.innerHTML='<div class="empty"><div>🏆</div>'+t('empty')+'</div>';return}
 const med=['🥇','🥈','🥉'];
 el.innerHTML=list.map((p,i)=>{const nm=p.me?t('you'):(p.name||'Player');return '<div class="lb'+(p.me?' me':'')+'"><div class="rk">'+(med[i]||i+1)+'</div><div class="av">'+esc(nm.charAt(0).toUpperCase())+'</div><div class="n">'+esc(nm)+'</div><div class="s">'+fmt(p.value||0)+' 💧</div></div>'}).join('');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function save(force){
 if(!dirty&&!force)return;dirty=false;S.ts=Date.now();
 try{await SA.set('state',S);await SA.set('score',Math.floor(S.total))}catch(e){dirty=true}
}
$('lang').onchange=e=>{L=e.target.value;applyLang();try{SA.set('lang',L)}catch(x){}};
function tick(){
 rollDay();
 const m=maxE();if(S.energy<m){S.energy=Math.min(m,S.energy+3);if(tab==='tap')renderEnergy()}
 const n=new Date(),mid=new Date(n);mid.setHours(24,0,0,0);const s=Math.floor((mid-n)/1000);
 $('rst').textContent=[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(v=>String(v).padStart(2,'0')).join(':');
 if(tab==='tap'){const c=cost();$('upb').className='btn'+(S.score>=c?'':' off')}
}
async function init(){
 let saved=null,sl=null;
 try{saved=await SA.get('state')}catch(e){}
 try{sl=await SA.get('lang')}catch(e){}
 S=Object.assign({score:0,total:0,power:1,energy:500,ts:Date.now(),day:today(),taps:0,ups:0,claimed:[],streak:0,lastCheck:''},saved||{});
 S.energy=Math.min(maxE(),S.energy+Math.max(0,(Date.now()-S.ts)/1000*3));
 if(S.lastCheck&&S.lastCheck!==today()&&S.lastCheck!==yesterday())S.streak=0;
 rollDay();
 let tg='';try{tg=(window.Telegram.WebApp.initDataUnsafe.user.language_code||'').slice(0,2)}catch(e){}
 L=D[sl]?sl:(D[tg]?tg:'en');
 try{window.Telegram.WebApp.ready();window.Telegram.WebApp.expand()}catch(e){}
 shown=S.score;applyLang();animNum();tick();
 setInterval(tick,1000);setInterval(()=>save(),4000);
 document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
 const ld=$('ld');ld.style.opacity=0;setTimeout(()=>ld.remove(),300);
}
init();
});
</script>
</body>
</html>
