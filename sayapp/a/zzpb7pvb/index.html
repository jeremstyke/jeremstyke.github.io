  function countTo(el, to) { var from = Number(el.getAttribute('data-v') || 0), t0 = performance.now(); el.setAttribute('data-v', to); (function step(t) { var k = Math.min(1, (t - t0) / 700), v = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3))); el.textContent = fmt(v); if (k < 1) requestAnimationFrame(step); })(t0); }
  function share(url, txt) { var u = 'https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(txt); try { tw.openTelegramLink(u); } catch (e) { location.href = u; } }

  ['lBal:bal', 'lStreak:streak', 'lPass:pass', 'lInv:inv', 'lHow:how', 'lHome:home', 'lWk:wk', 'lRank:rank', 'lInvT:invT', 'iT:iT', 'iP:iP', 'iShare:share', 'iCopy:copy', 'lTop:topT', 'noCash:noCash',
    'wkLbl:wkLbl', 'wkT:wkT', 'wkP:wkP', 'wkEndsL:wkEnds', 'wkPtsL:wkPtsL', 'wkRkL:wkRkL', 'lPrize:lPrize', 'lWkTop:lWkTop', 'wkNote:wkNote'].forEach(function (p) { var k = p.split(':'); $(k[0]).textContent = T[k[1]]; });
  $('prizes').innerHTML = T.prizes.map(function (r) { return '<div class="rule"><i>' + r[0] + '</i><div><b>' + esc(r[1]) + '</b>' + esc(r[2]) + '</div></div>'; }).join('');

  /* ---------- weekly contest (score = balance gained since Monday 00:00 UTC) ---------- */
  function weekId() { return Math.floor((Date.now() + skew - MON) / WEEK); }
  function wkLeft() { var n = Date.now() + skew; return Math.max(0, ((Math.floor((n - MON) / WEEK) + 1) * WEEK + MON - n) / 1000); }
  function wkScore() { return WK && S ? Math.max(0, S.bal - WK.base) : 0; }
  function tierOf(rk, p) { if (!rk || !p) return 3; return rk === 1 ? 0 : rk <= 3 ? 1 : rk <= 10 ? 2 : 3; }
  function paintWk() {
    var p = wkScore(), t = T.tiers[tierOf(myRank, p)];
    $('wkPts').textContent = fmt(p); $('wkRk').textContent = myRank ? '#' + myRank : '-'; $('wkTi').textContent = t[0]; $('wkTn').textContent = t[1];
  }
  function wkSync(force) {
    if (!S) return;
    var w = weekId();
    if (!WK) {
      if (wkBusy) return; wkBusy = true;
      Promise.resolve(SayApp.get('wkb')).then(function (v) {
        if (!v || typeof v.w !== 'number' || v.w !== weekId()) { v = { w: weekId(), base: S.bal }; SayApp.set('wkb', v); }
        WK = v; wkBusy = false; wkSync(true);
      }).catch(function () { wkBusy = false; });
      return;
    }
    if (WK.w !== w) { WK = { w: w, base: S.bal }; SayApp.set('wkb', WK); wkSaved = -1; myRank = 0; }
    var p = wkScore();
    if (p !== wkSaved && (force || Date.now() - wkLast > 5000)) { wkSaved = p; wkLast = Date.now(); SayApp.set('wk' + w, p); }
    paintWk();
  }
  setInterval(function () { wkSync(false); }, 6000);
  function loadWk() {
    var key = 'wk' + weekId(), p = wkScore(), pre = Promise.resolve();
    $('wkList').innerHTML = '<div class="row skel"><em>1</em><span>…</span></div><div class="row skel"><em>2</em><span>…</span></div><div class="row skel"><em>3</em><span>…</span></div>';
    if (WK && S) { wkSaved = p; wkLast = Date.now(); pre = Promise.resolve(SayApp.set(key, p)); }
    pre.catch(function () {}).then(function () { return SayApp.top(key, 20); }).then(function (l) {
      l = (l || []).filter(function (x) { return x && Number(x.value) > 0; }); myRank = 0;
      var html = l.map(function (x, i) {
        if (x.me) myRank = i + 1;
        return '<div class="row' + (x.me ? ' me' : '') + '"><em>' + (i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1) + '</em><span>' + esc(x.name) + (x.me ? ' (' + esc(T.you) + ')' : '') + '</span><b>' + fmt(x.value) + '</b></div>';
      }).join('');
      if (!myRank && p > 0 && l.length) html += '<div class="row me"><em>…</em><span>' + esc(T.you) + '</span><b>' + fmt(p) + '</b></div>';
      $('wkList').innerHTML = html || '<div class="empty">' + esc(T.wkEmpty) + '</div>';
      paintWk();
    }).catch(function () { $('wkList').innerHTML = '<div class="empty">' + esc(T.err) + '</div>'; });
  }

  function bonusFor(st) { return 100 * Math.min((S && S.streak ? S.streak : 0) + 1, 7); }
  function paint() {
    if (!S) return;
    countTo($('bal'), S.bal); $('rank').textContent = '#' + S.rank + ' / ' + fmt(S.players);
    $('sStreak').textContent = S.streak; $('sPass').textContent = fmt(S.passes); $('sInv').textContent = fmt(S.invited);
    var r2 = T.r2(S.rate, S.maxh);
    $('rules').innerHTML = [['📅', T.r1], ['💰', r2], ['⏳', T.r3], ['🤝', T.r4]].map(function (r) { return '<div class="rule"><i>' + r[0] + '</i><div><b>' + esc(r[1][0]) + '</b>' + esc(r[1][1]) + '</div></div>'; }).join('');
    var hold = !!S.hold_since, acts = $('acts');
    $('hero').classList.toggle('idle', !hold);
    if (hold) {
      $('hT').textContent = T.holdT; $('hP').textContent = T.holdP(S.rate); $('earn').hidden = false;
      acts.innerHTML = '<button class="cta" id="aLink">' + esc(T.pLink) + '</button><button class="ghost" id="aRand">' + esc(T.pRand) + '</button>';
      $('aLink').onclick = function () { act('pass_link'); }; $('aRand').onclick = function () { act('pass_random'); };
    } else if (S.can_take) {
      var b = bonusFor(); $('hT').textContent = T.takeT; $('hP').textContent = T.takeP(b); $('earn').hidden = true;
      acts.innerHTML = '<button class="cta" id="aTake">' + esc(T.take(b)) + '</button>'; $('aTake').onclick = function () { act('take'); };
    } else {
      $('hT').textContent = T.waitT; $('hP').textContent = T.waitP; $('earn').hidden = true;
      acts.innerHTML = '<button class="cta" id="aInv">' + esc(T.share) + '</button>'; $('aInv').onclick = function () { share(S.invite, T.invTxt(NAME)); };
    }
    tick();
  }
  function tick() {
    var wl = wkLeft(), dd = Math.floor(wl / 86400);
    $('wkCd').textContent = (dd ? dd + (fr ? ' j ' : 'd ') : '') + String(Math.floor(wl % 86400 / 3600)).padStart(2, '0') + ':' + String(Math.floor(wl % 3600 / 60)).padStart(2, '0') + ':' + String(Math.floor(wl % 60)).padStart(2, '0');
    if (!S) return;
    var now = Date.now() + skew, arc = $('arc'), C = 553;
    if (S.hold_since) {
      var el = (now - new Date(S.hold_since).getTime()) / 1000, max = S.maxh * 3600, left = Math.max(0, max - el);
      if (left <= 0) { load(); return; }
      var h = Math.floor(left / 3600), m = Math.floor(left % 3600 / 60), s = Math.floor(left % 60);
      $('tm').textContent = (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); $('tmL').textContent = T.left;
      arc.style.strokeDashoffset = String(C * (1 - left / max));
      $('earn').textContent = '⚡ ' + T.live(fmt(Math.floor(Math.min(el / 3600, S.maxh) * S.rate)));
    } else {
      var d = new Date(now), mid = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() + 1), l2 = Math.max(0, (mid - now) / 1000);
      if (S.can_take) { $('tm').textContent = '4:00:00'; $('tmL').textContent = ''; arc.style.strokeDashoffset = '0'; }
      else { $('tm').textContent = Math.floor(l2 / 3600) + ':' + String(Math.floor(l2 % 3600 / 60)).padStart(2, '0') + ':' + String(Math.floor(l2 % 60)).padStart(2, '0'); $('tmL').textContent = T.next; arc.style.strokeDashoffset = String(C); }
    }
  }
  setInterval(tick, 1000);
  function apply(r) {
    if (!r || !r.ok) { toast(T.err); return false; }
    var prev = S ? S.bal : null; S = r; skew = new Date(r.now).getTime() - Date.now();
    $('invLink').textContent = r.invite;
    if (r.msg === 'welcome') toast(T.welcome); else if (r.msg === 'invited') toast(T.invited); else if (r.msg === 'got') { toast(T.got); SayApp.haptic('ok'); } else if (r.msg === 'taken') toast(T.taken); else if (r.msg === 'dropped') toast(T.dropped);
    if (prev !== null && r.bal > prev) floatUp('+' + fmt(r.bal - prev));
    paint(); wkSync(false); return true;
  }
  function load(arg) { return SayApp.game('state', arg ? { arg: arg } : {}).then(apply); }
  function act(a) {
    if (busy) return; busy = true; SayApp.haptic('tap');
    SayApp.game(a).then(function (r) {
      busy = false;
      if (r && r.ok && r.err) { SayApp.haptic('error'); if (r.err === 'nobody') toast(T.nobody); apply(r); return; }
      if (!apply(r)) return;
      SayApp.haptic('ok');
      if (a === 'take') toast(T.took(r.bonus));
      if (a === 'pass_random') toast(T.passed(r.earn));
      if (a === 'pass_link' && r.link) { toast(T.passed(r.earn)); share(r.link, T.shareTxt(NAME)); }
    });
  }
  function tab(w) {
    ['Home', 'Wk', 'Top', 'Inv'].forEach(function (k) { $('v' + k).hidden = k !== w; $('t' + k).classList.toggle('on', k === w); });
    window.scrollTo(0, 0); SayApp.haptic('tap');
    if (w === 'Wk') loadWk();
    if (w === 'Top') SayApp.game('top').then(function (r) {
      if (!r || !r.ok) return; apply(r);
      $('topList').innerHTML = (r.top || []).map(function (p, i) { return '<div class="row' + (p.me ? ' me' : '') + '"><em>' + (i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1) + '</em><span>' + esc(p.name) + (p.me ? ' (' + esc(T.you) + ')' : '') + '</span><b>' + fmt(p.bal) + '</b></div>'; }).join('');
    });
  }
  $('tHome').onclick = function () { tab('Home'); }; $('tWk').onclick = function () { tab('Wk'); }; $('tTop').onclick = function () { tab('Top'); }; $('tInv').onclick = function () { tab('Inv'); };
  $('iShare').onclick = function () { if (S) share(S.invite, T.invTxt(NAME)); };
  $('iCopy').onclick = function () { if (!S) return; try { navigator.clipboard.writeText(S.invite).then(function () { toast(T.copied); }); } catch (e) { toast(S.invite); } };
  var j = (new URLSearchParams(location.search).get('j') || '').toLowerCase();
  load(/^[br][a-z0-9]{1,16}$/.test(j) ? j : null);
});
</script>
</body>
