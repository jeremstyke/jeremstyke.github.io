<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Slotwise</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--main:#5B6CFF;--main2:#8A5BFF;--acc:#2EE6A8;--bg:#0A0D16;--s1:#111626;--s2:#171D30;--s3:#20273E;--line:rgba(255,255,255,.07);--tx:#EEF1FA;--mu:#8C94AD;--warn:#FFB547;--r:20px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;overflow-x:hidden}
body{background:radial-gradient(600px 300px at 90% -5%,rgba(91,108,255,.22),transparent 70%),radial-gradient(500px 260px at -10% 20%,rgba(46,230,168,.08),transparent 70%),var(--bg);min-height:100vh}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;background:none}
.app{max-width:460px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header{padding-top:calc(var(--sa-top,0px) + 8px);padding-bottom:8px;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 75%,transparent)}
.brand{display:flex;align-items:center;gap:12px;padding:8px 0 16px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--main),var(--main2));display:grid;place-items:center;box-shadow:0 8px 24px rgba(91,108,255,.45)}
.brand h1{font-size:20px;font-weight:800;letter-spacing:-.4px}
.brand p{font-size:12px;color:var(--mu)}
.hi{margin-left:auto;font-size:12px;color:var(--mu);text-align:right}
.hi b{display:block;color:var(--tx);font-size:14px}
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px;position:relative}
.seg button{flex:1;padding:10px;font-weight:600;font-size:14px;color:var(--mu);border-radius:10px;position:relative;z-index:1;transition:color .2s}
.seg button.on{color:#fff}
.seg .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:10px;background:linear-gradient(135deg,var(--main),var(--main2));box-shadow:0 6px 18px rgba(91,108,255,.4);transition:transform .25s cubic-bezier(.3,.8,.3,1)}
.lbl{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--mu);margin:24px 0 12px}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.kpi.big{grid-column:span 2;background:linear-gradient(135deg,rgba(91,108,255,.25),rgba(138,91,255,.12)),var(--s1);border-color:rgba(91,108,255,.3)}
.kpi small{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mu);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-top:6px}
.kpi.big .v{font-size:32px}
.kpi .d{font-size:12px;color:var(--acc);margin-top:4px;font-weight:600}
.chart{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:16px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--acc),rgba(46,230,168,.25));transform-origin:bottom;animation:grow .6s cubic-bezier(.3,.8,.3,1) both}
.chart span{font-size:10px;color:var(--mu)}
@keyframes grow{from{transform:scaleY(0)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mu);transition:all .2s}
.chip.on{background:rgba(91,108,255,.16);border-color:var(--main);color:#fff}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 10px 30px rgba(0,0,0,.22);transition:transform .15s}
.card:active,.tap:active{transform:scale(.97)}
.row{display:flex;align-items:center;gap:12px}
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}
.ttl{font-weight:700;font-size:16px}
.sub{font-size:13px;color:var(--mu);margin-top:2px}
.ring{margin-left:auto;width:48px;height:48px;flex:none;position:relative}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:12px;padding:5px 10px;border-radius:8px;background:var(--s3);color:#C9CFE3;font-weight:500}
.tag.g{background:rgba(46,230,168,.12);color:var(--acc)}
.list .it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border:0}
.st{margin-left:auto;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,181,71,.14);color:var(--warn)}
.st.ok{background:rgba(46,230,168,.14);color:var(--acc)}
.empty{text-align:center;padding:24px 8px;color:var(--mu);font-size:14px}
.empty div{font-size:34px;margin-bottom:8px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mu);margin-bottom:8px}
.field input,.field select,.field textarea,.sheet textarea{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--tx);font:inherit;font-size:15px;outline:none;transition:border .2s}
.field input:focus,.field select:focus,textarea:focus{border-color:var(--main)}
textarea{resize:none;height:90px}
.btn{width:100%;padding:16px;border-radius:16px;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--main),var(--main2));box-shadow:0 10px 28px rgba(91,108,255,.42);transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5}
nav{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:center;padding:8px 16px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
nav .in{display:flex;width:100%;max-width:428px;background:rgba(17,22,38,.92);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:20px;padding:6px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:14px;font-size:11px;font-weight:600;color:var(--mu);transition:all .2s}
nav button.on{color:#fff;background:rgba(91,108,255,.16)}
nav button.on svg{stroke:var(--acc)}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ov{position:fixed;inset:0;background:rgba(3,5,10,.6);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:460px;margin:0 auto;background:var(--s1);border-radius:24px 24px 0 0;border:1px solid var(--line);padding:12px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.3,.8,.3,1);max-height:88vh;overflow-y:auto}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--s3);margin:0 auto 16px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stats3 div{background:var(--s2);border-radius:14px;padding:12px;text-align:center}
.stats3 b{display:block;font-size:16px}
.stats3 span{font-size:11px;color:var(--mu)}
.desc{font-size:14px;color:#C9CFE3;line-height:1.5}
.toast{position:fixed;left:50%;top:calc(var(--sa-top,0px) + 16px);transform:translate(-50%,-140%);background:var(--s2);border:1px solid rgba(46,230,168,.35);color:var(--tx);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:40;transition:transform .3s;box-shadow:0 12px 30px rgba(0,0,0,.4);white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.cf{position:fixed;width:8px;height:12px;border-radius:2px;z-index:50;pointer-events:none}
.skel{height:70px;border-radius:var(--r);background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:12px}
@keyframes sh{to{background-position:-200% 0}}
.foot{text-align:center;font-size:11px;color:#4D5570;margin-top:32px}
.lb .it b{font-weight:700}
.rank{width:26px;height:26px;border-radius:8px;background:var(--s3);display:grid;place-items:center;font-size:12px;font-weight:800}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="4" width="8" height="7" rx="2"/><rect x="13" y="13" width="8" height="7" rx="2"/><path d="M11 7.5h3a3 3 0 0 1 3 3V13"/></svg></div>
    <div><h1>Slotwise</h1><p>Ad slots in games and mini apps</p></div>
    <div class="hi">Welcome<b id="uname">there</b></div>
  </div>
  <div class="seg" id="seg"><div class="pill" id="pill"></div><button class="on" data-r="adv">I advertise</button><button data-r="pub">I publish</button></div>
</header>

<section class="view on" id="v-home">
  <div class="lbl">Overview</div>
  <div class="kpis">
    <div class="kpi big"><small id="k1l">Daily reach available</small><div class="v" id="k1">0</div><div class="d" id="k1d">+12.4% this week</div>
      <div class="chart" id="chart"></div></div>
    <div class="kpi"><small>Requests sent</small><div class="v" id="k2">0</div><div class="d" id="k2d">Reviewed in 24h</div></div>
    <div class="kpi"><small>Best match</small><div class="v" id="k3">0%</div><div class="d">For your niche</div></div>
  </div>
  <div class="lbl">Your niche</div>
  <div class="chips" id="niches"></div>
  <div class="lbl">Recent activity</div>
  <div class="card list" id="acts"></div>
  <div class="lbl">Most active matchers</div>
  <div class="card list lb" id="lb"><div class="skel" style="margin:0"></div></div>
</section>

<section class="view" id="v-match">
  <div class="lbl" id="mlbl">Ad slots for you</div>
  <div class="chips" id="fmts"></div>
  <div style="height:12px"></div>
  <div id="items"></div>
</section>

<section class="view" id="v-new">
  <div class="lbl" id="nlbl">New campaign</div>
  <div class="card" id="form"></div>
  <div class="lbl">Your listings</div>
  <div class="card list" id="mine"></div>
</section>

<div class="foot">Made with SayApp</div>
</div>

<nav><div class="in">
  <button class="on" data-v="home"><svg viewBox="0 0 24 24"><path d="M3 13h4v8H3zM10 8h4v13h-4zM17 3h4v18h-4z"/></svg>Dashboard</button>
  <button data-v="match"><svg viewBox="0 0 24 24"><circle cx="8" cy="12" r="5"/><circle cx="16" cy="12" r="5"/></svg>Match</button>
  <button data-v="new"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>Create</button>
</div></nav>

<div class="ov" id="ov"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://jeremstyke.github.io/sayapp/sdk.js" data-app="3h4dt4kb" data-full="1"></script>
<script>
window.addEventListener('load', async function(){
const $=s=>document.querySelector(s);
const NICHES=['Gaming','Finance','Fitness','Education','Shopping','Lifestyle'];
const FORMATS=['All','Rewarded video','Banner','Interstitial','Native card','Playable'];
const GR=['linear-gradient(135deg,#5B6CFF,#8A5BFF)','linear-gradient(135deg,#2EE6A8,#1A9E8F)','linear-gradient(135deg,#FF7A59,#FF3D7F)','linear-gradient(135deg,#FFB547,#FF7A2F)','linear-gradient(135deg,#38BDF8,#5B6CFF)','linear-gradient(135deg,#C084FC,#FF5FA2)'];
const PUBS=[
 {id:'p1',name:'Pixel Racers',emoji:'🏎️',cat:'Gaming',format:'Rewarded video',dau:42000,price:'$3.20 CPM',geo:'US, UK, CA',age:'18-34',desc:'Arcade racing mini app. Players watch a short video to unlock a turbo boost between laps. Average session 11 minutes.'},
 {id:'p2',name:'Word Garden',emoji:'🌱',cat:'Education',format:'Native card',dau:18500,price:'$2.10 CPM',geo:'EU, US',age:'25-44',desc:'Daily word puzzle with a loyal audience. A native card appears on the results screen after each solved grid.'},
 {id:'p3',name:'Budget Buddy',emoji:'💳',cat:'Finance',format:'Banner',dau:9800,price:'$4.50 CPM',geo:'DE, FR, NL',age:'25-45',desc:'Personal expense tracker bot. Bottom banner on the monthly summary screen, high-intent users.'},
 {id:'p4',name:'Squat Streak',emoji:'🏋️',cat:'Fitness',format:'Interstitial',dau:12600,price:'$2.80 CPM',geo:'US, BR, MX',age:'18-30',desc:'Workout challenge mini app. Interstitial between training sets, capped at one per 3 minutes.'},
 {id:'p5',name:'Merge Kitchen',emoji:'🍳',cat:'Lifestyle',format:'Playable',dau:27300,price:'$3.90 CPM',geo:'Global',age:'18-40',desc:'Casual merge game with cooking themes. Playable ads shown in the bonus chest, great for app installs.'},
 {id:'p6',name:'Deal Hunter',emoji:'🛍️',cat:'Shopping',format:'Native card',dau:15200,price:'$3.40 CPM',geo:'US, UK',age:'20-45',desc:'Price drop alerts bot. Sponsored deal cards blend into the daily feed of offers.'},
 {id:'p7',name:'Tower Tactics',emoji:'🏰',cat:'Gaming',format:'Interstitial',dau:35800,price:'$2.95 CPM',geo:'EU, TR, ID',age:'16-34',desc:'Tower defense game. Interstitial after each lost wave, very high completion rate.'}
];
const CAMPS=[
 {id:'c1',name:'FitPulse launch',emoji:'❤️',cat:'Fitness',format:'Rewarded video',budget:1200,price:'$1,200 budget',geo:'US, CA',age:'18-35',desc:'New heart rate tracking app looking for fitness and casual game placements. 15 second video, CPI goal $0.90.'},
 {id:'c2',name:'Lingo Leap',emoji:'🗣️',cat:'Education',format:'Native card',budget:800,price:'$800 budget',geo:'EU',age:'18-40',desc:'Language learning app promoting a 7 day free trial. Native cards with a custom illustration.'},
 {id:'c3',name:'Galaxy Clash',emoji:'🚀',cat:'Gaming',format:'Playable',budget:3500,price:'$3,500 budget',geo:'Global',age:'16-30',desc:'Space strategy game seeking gamers. Playable demo ad, 30 seconds, rewarded placement preferred.'},
 {id:'c4',name:'Nordwave Bank',emoji:'🏦',cat:'Finance',format:'Banner',budget:2000,price:'$2,000 budget',geo:'DE, AT, CH',age:'25-50',desc:'Digital bank account campaign. Static banners, brand safe placements only.'},
 {id:'c5',name:'Sneak Peek Store',emoji:'👟',cat:'Shopping',format:'Interstitial',budget:950,price:'$950 budget',geo:'US, UK',age:'18-34',desc:'Online sneaker store spring sale. Interstitial with a discount code, 2 weeks flight.'},
 {id:'c6',name:'Zen Minutes',emoji:'🧘',cat:'Lifestyle',format:'Rewarded video',budget:600,price:'$600 budget',geo:'Global',age:'22-45',desc:'Meditation app looking for calm, puzzle or wellness audiences.'}
];
const S={role:'adv',niche:'Gaming',reqs:[],listings:[],fmt:'All'};
const name=(SayApp.user&&SayApp.user.first_name)||'there';
$('#uname').textContent=name;
let saveT;
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(()=>{SayApp.set('state',{role:S.role,niche:S.niche,reqs:S.reqs.slice(0,30),listings:S.listings.slice(0,20)}).catch(()=>{});SayApp.set('matches',S.reqs.length).catch(()=>{})},1200)}
function hap(t){try{SayApp.haptic(t)}catch(e){}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
function fmtN(n){return n>=1000?(n/1000).toFixed(n>=10000?0:1)+'K':String(Math.round(n))}
function anim(el,to,fn){const from=el._v||0;el._v=to;const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/600),e=1-Math.pow(1-p,3);el.textContent=fn(from+(to-from)*e);if(p<1)requestAnimationFrame(f)})(t0)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%997;return h}
function score(it){const h=hash(it.id+S.niche);return it.cat===S.niche?90+h%9:58+h%27}
function pool(){return S.role==='adv'?PUBS:CAMPS}
function ring(v){const c=2*Math.PI*20,col=v>=85?'#2EE6A8':v>=70?'#5B6CFF':'#FFB547';return `<div class="ring"><svg width="48" height="48" viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" stroke="#20273E" stroke-width="4" fill="none"/><circle cx="24" cy="24" r="20" stroke="${col}" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-v/100)}" transform="rotate(-90 24 24)"/></svg><b>${v}%</b></div>`}
function sent(id){return S.reqs.some(r=>r.id===id)}
function ago(t){const m=Math.floor((Date.now()-t)/60000);return m<1?'just now':m<60?m+' min ago':m<1440?Math.floor(m/60)+' h ago':Math.floor(m/1440)+' d ago'}

function renderHome(){
  const adv=S.role==='adv';
  $('#k1l').textContent=adv?'Daily reach available':'Advertiser budgets open';
  const tot=adv?PUBS.reduce((a,p)=>a+p.dau,0):CAMPS.reduce((a,c)=>a+c.budget,0);
  anim($('#k1'),tot,v=>adv?fmtN(v)+' players':'$'+Math.round(v).toLocaleString('en-US'));
  $('#k1d').textContent=adv?'+12.4% vs last week, '+PUBS.length+' publishers':'+8.1% vs last week, '+CAMPS.length+' campaigns';
  const mine=S.reqs.filter(r=>r.role===S.role).length;
  anim($('#k2'),mine,v=>Math.round(v));
  anim($('#k3'),Math.max(...pool().map(score)),v=>Math.round(v)+'%');
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],base=adv?[62,70,66,78,85,96,90]:[40,55,48,60,72,66,80];
  $('#chart').innerHTML=days.map((d,i)=>`<div><i style="height:${base[i]}%;animation-delay:${i*50}ms"></i><span>${d}</span></div>`).join('');
  $('#niches').innerHTML=NICHES.map(n=>`<button class="chip tap ${n===S.niche?'on':''}" data-n="${n}">${n}</button>`).join('');
  const a=S.reqs.slice(0,5);
  $('#acts').innerHTML=a.length?a.map(r=>`<div class="it"><div class="ico" style="width:38px;height:38px;font-size:18px;background:var(--s3)">${r.emoji}</div><div><div class="ttl" style="font-size:15px">${esc(r.name)}</div><div class="sub">${r.role==='adv'?'Slot request':'Campaign pitch'} · ${ago(r.at)}</div></div><span class="st">Pending</span></div>`).join(''):`<div class="empty"><div>🤝</div>No match requests yet.<br>Open Match to find your first partner.</div>`;
}
async function renderLb(){
  try{const t=await SayApp.top('matches',5);
    $('#lb').innerHTML=t&&t.length?t.map((x,i)=>`<div class="it"><div class="rank">${i+1}</div><b>${esc(x.name)}${x.me?' (you)':''}</b><span class="st ok">${x.value} matches</span></div>`).join(''):`<div class="empty"><div>🏆</div>Be the first to send a match request.</div>`;
  }catch(e){$('#lb').innerHTML=`<div class="empty"><div>🏆</div>Leaderboard is warming up.</div>`}
}
function renderMatch(){
  const adv=S.role==='adv';
  $('#mlbl').textContent=adv?'Ad slots in games and mini apps':'Advertisers looking for slots';
  $('#fmts').innerHTML=FORMATS.map(f=>`<button class="chip tap ${f===S.fmt?'on':''}" data-f="${f}">${f}</button>`).join('');
  const list=pool().filter(i=>S.fmt==='All'||i.format===S.fmt).sort((a,b)=>score(b)-score(a));
  $('#items').innerHTML=list.length?list.map(it=>{const gi=hash(it.id)%GR.length;return `<div class="card" data-id="${it.id}"><div class="row"><div class="ico" style="background:${GR[gi]}">${it.emoji}</div><div style="min-width:0"><div class="ttl">${it.name}</div><div class="sub">${it.cat} · ${it.format}</div></div>${ring(score(it))}</div><div class="tags"><span class="tag g">${adv?fmtN(it.dau)+' DAU':it.price}</span><span class="tag">${adv?it.price:'Age '+it.age}</span><span class="tag">${it.geo}</span>${sent(it.id)?'<span class="tag" style="color:var(--warn)">Requested</span>':''}</div></div>`}).join(''):`<div class="card empty"><div>🔍</div>No ${S.fmt.toLowerCase()} offers right now.<br>Try another format.</div>`;
}
function renderForm(){
  const adv=S.role==='adv';
  $('#nlbl').textContent=adv?'New campaign':'List an ad slot';
  const opts=a=>a.map(x=>`<option${x===S.niche?' selected':''}>${x}</option>`).join('');
  $('#form').innerHTML=adv?`
  <div class="field"><label>Campaign name</label><input id="f1" maxlength="40" placeholder="Summer launch of my app"></div>
  <div class="field"><label>Product category</label><select id="f2">${opts(NICHES)}</select></div>
  <div class="field"><label>Preferred format</label><select id="f3">${FORMATS.slice(1).map(x=>`<option>${x}</option>`).join('')}</select></div>
  <div class="field"><label>Total budget (USD)</label><input id="f4" type="number" min="50" placeholder="1000"></div>
  <div class="field"><label>Target audience</label><input id="f5" maxlength="60" placeholder="18-34, US and UK, casual gamers"></div>
  <button class="btn" id="fsend">Publish campaign</button>`:`
  <div class="field"><label>Game or mini app name</label><input id="f1" maxlength="40" placeholder="My puzzle game"></div>
  <div class="field"><label>Category</label><select id="f2">${opts(NICHES)}</select></div>
  <div class="field"><label>Ad format offered</label><select id="f3">${FORMATS.slice(1).map(x=>`<option>${x}</option>`).join('')}</select></div>
  <div class="field"><label>Daily active users</label><input id="f4" type="number" min="10" placeholder="5000"></div>
  <div class="field"><label>Bot or link</label><input id="f5" maxlength="60" placeholder="@mygame_bot"></div>
  <button class="btn" id="fsend">List my slot</button>`;
  $('#fsend').onclick=sendForm;
  const m=S.listings.filter(l=>l.role===S.role);
  $('#mine').innerHTML=m.length?m.map(l=>`<div class="it"><div class="ico" style="width:38px;height:38px;font-size:18px;background:var(--s3)">${adv?'📣':'🎮'}</div><div style="min-width:0"><div class="ttl" style="font-size:15px">${esc(l.name)}</div><div class="sub">${esc(l.cat)} · ${esc(l.format)} · ${adv?'$'+l.num:fmtN(l.num)+' DAU'}</div></div><span class="st">In review</span></div>`).join(''):`<div class="empty"><div>${adv?'📣':'🎮'}</div>${adv?'No campaigns yet. Publishers will see yours here once approved.':'No slots listed yet. Advertisers will find yours once approved.'}</div>`;
}
async function sendForm(){
  const v=id=>($(id).value||'').trim(),n=v('#f1'),num=parseInt(v('#f4'),10);
  if(n.length<2||!num||num<1){hap('error');toast('Please fill in the name and number');return}
  const b=$('#fsend');b.disabled=true;b.textContent='Sending...';
  const l={role:S.role,name:n,cat:v('#f2'),format:v('#f3'),num:num,extra:v('#f5'),at:Date.now()};
  try{await SayApp.submit({type:S.role==='adv'?'new_campaign':'new_slot',...l})}catch(e){}
  S.listings.unshift(l);saveSoon();hap('ok');burst(innerWidth/2,innerHeight/2);
  toast(S.role==='adv'?'Campaign sent for review ✓':'Slot listed for review ✓');renderForm();
}
function openSheet(id){
  const it=pool().find(x=>x.id===id);if(!it)return;const adv=S.role==='adv',gi=hash(it.id)%GR.length,done=sent(id);
  $('#sheet').innerHTML=`<div class="grab"></div><div class="row"><div class="ico" style="background:${GR[gi]};width:56px;height:56px;font-size:28px">${it.emoji}</div><div><div class="ttl" style="font-size:20px">${it.name}</div><div class="sub">${it.cat} · ${it.format}</div></div>${ring(score(it))}</div>
  <div class="stats3"><div><b>${adv?fmtN(it.dau):it.price.split(' ')[0]}</b><span>${adv?'Daily users':'Budget'}</span></div><div><b>${adv?it.price.split(' ')[0]:it.age}</b><span>${adv?'CPM':'Age'}</span></div><div><b style="font-size:13px;line-height:19px">${it.geo}</b><span>Geo</span></div></div>
  <p class="desc">${it.desc}</p>
  <div class="field" style="margin-top:16px"><label>${adv?'Message to the publisher':'Pitch to the advertiser'}</label><textarea id="msg" maxlength="300" placeholder="${adv?'Hi, I would like to run a 2 week campaign in your game...':'Hi, my game has a matching audience and a free slot...'}"></textarea></div>
  <button class="btn" id="go" ${done?'disabled':''}>${done?'Request already sent':'Send match request'}</button>`;
  $('#ov').classList.add('on');$('#sheet').classList.add('on');hap('tap');
  if(!done)$('#go').onclick=async e=>{
    const b=e.currentTarget;b.disabled=true;b.textContent='Sending...';
    try{await SayApp.submit({type:'match_request',from_role:S.role==='adv'?'advertiser':'publisher',target:it.name,format:it.format,niche:S.niche,match:score(it)+'%',message:$('#msg').value.trim()})}catch(err){}
    S.reqs.unshift({id:it.id,name:it.name,emoji:it.emoji,role:S.role,at:Date.now()});saveSoon();hap('ok');
    const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top);
    b.textContent='Request sent ✓';toast('Match request sent ✓');setTimeout(()=>{closeSheet();renderMatch();renderHome()},700);setTimeout(renderLb,2500);
  };
}
function closeSheet(){$('#ov').classList.remove('on');$('#sheet').classList.remove('on')}
function burst(x,y){const cols=['#5B6CFF','#2EE6A8','#8A5BFF','#FFB547','#fff'];for(let i=0;i<26;i++){const d=document.createElement('div');d.className='cf';d.style.left=x+'px';d.style.top=y+'px';d.style.background=cols[i%5];document.body.appendChild(d);const a=Math.random()*Math.PI*2,s=80+Math.random()*140;d.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*s}px,${Math.sin(a)*s+120}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:900+Math.random()*400,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>d.remove()}}
function setRole(r){S.role=r;S.fmt='All';document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.r===r));$('#pill').style.transform=r==='pub'?'translateX(100%)':'none';renderAll()}
function renderAll(){renderHome();renderMatch();renderForm()}

$('#seg').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.r!==S.role){hap('tap');setRole(b.dataset.r);saveSoon()}};
$('#niches').onclick=e=>{const b=e.target.closest('[data-n]');if(!b)return;S.niche=b.dataset.n;hap('tap');renderHome();renderMatch();saveSoon()};
$('#fmts').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;S.fmt=b.dataset.f;hap('tap');renderMatch()};
$('#items').onclick=e=>{const c=e.target.closest('[data-id]');if(c)openSheet(c.dataset.id)};
$('#ov').onclick=closeSheet;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{hap('tap');document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+b.dataset.v));scrollTo({top:0,behavior:'smooth'});if(b.dataset.v==='home')renderHome()});

$('#items').innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
try{const d=await SayApp.get('state');if(d&&typeof d==='object'){S.role=d.role==='pub'?'pub':'adv';if(NICHES.includes(d.niche))S.niche=d.niche;S.reqs=Array.isArray(d.reqs)?d.reqs:[];S.listings=Array.isArray(d.listings)?d.listings:[]}}catch(e){}
setRole(S.role);renderLb();
});
</script>
</body>
</html>
