<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Letmine</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#22c55e;--g2:#16a34a;--gd:#14532d;--acc:#f59e0b;--bg:#f4faf6;--ink:#0f2417;--mut:#5f7467;--card:#fff;--line:#e3efe7;--sh:0 1px 2px rgba(15,36,23,.06),0 8px 24px rgba(15,36,23,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:hidden}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:14px;background:linear-gradient(145deg,#4ade80,var(--g2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;box-shadow:0 6px 16px rgba(34,197,94,.4)}
.brand h1{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1}
.brand small{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1.4px;margin-top:3px;font-weight:600}
.chip{display:flex;align-items:center;gap:8px;background:var(--card);padding:8px 14px 8px 8px;border-radius:99px;box-shadow:var(--sh);font-weight:700;font-size:17px}
.chip i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fde68a,var(--acc));display:grid;place-items:center;font-style:normal;font-size:13px;color:#92400e;font-weight:800}
main{flex:1;padding:8px 16px calc(96px + env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden}
.view{display:none;animation:in .25s ease}.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stage{position:relative;height:min(60vh,540px);min-height:360px;border-radius:24px;overflow:hidden;box-shadow:var(--sh),0 0 0 1px var(--line);background:#d1fae5}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
.pill{background:rgba(255,255,255,.88);backdrop-filter:blur(6px);border-radius:14px;padding:6px 12px;box-shadow:0 4px 12px rgba(15,36,23,.1)}
.pill b{font-size:22px;font-weight:800;display:block;line-height:1.1}
.pill span{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:var(--mut);font-weight:600}
.badges{position:absolute;top:70px;left:12px;display:flex;gap:6px;pointer-events:none}
.badges em{font-style:normal;background:rgba(255,255,255,.9);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,rgba(244,250,246,.35),rgba(244,250,246,.82));transition:opacity .25s,transform .25s}
.ov.off{opacity:0;pointer-events:none;transform:scale(.96)}
.panel{background:#fff;border-radius:24px;padding:24px 20px;width:100%;max-width:320px;text-align:center;box-shadow:0 18px 50px rgba(15,36,23,.18)}
.panel h2{font-size:28px;font-weight:800;letter-spacing:-.6px}
.panel p{color:var(--mut);font-size:15px;margin:6px 0 16px;line-height:1.4}
.big{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1;color:var(--g2)}
.tag{display:inline-block;background:#fef3c7;color:#92400e;font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;padding:4px 10px;border-radius:99px;margin-bottom:8px}
.btn{width:100%;border:0;border-radius:18px;padding:16px;font:700 17px 'Outfit',sans-serif;color:#fff;background:linear-gradient(180deg,#4ade80,var(--g2));box-shadow:0 8px 20px rgba(34,197,94,.45),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .15s;cursor:pointer;margin-top:8px}
.btn:active{transform:scale(.96)}
.btn.sec{background:#fff;color:var(--gd);box-shadow:0 0 0 2px var(--line)}
.btn[disabled]{opacity:.45;box-shadow:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--sh);text-align:center}
.stat b{font-size:22px;font-weight:800;display:block}
.stat span{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:var(--mut);font-weight:600}
.how{margin-top:12px;font-size:13px;color:var(--mut);text-align:center}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:var(--mut);font-weight:700;margin:6px 4px 12px}
h2.t{font-size:28px;font-weight:800;letter-spacing:-.6px;margin:4px 4px 2px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.row.me{background:linear-gradient(135deg,#dcfce7,#f0fdf4);box-shadow:0 0 0 2px var(--g),var(--sh)}
.rk{width:30px;text-align:center;font-weight:800;font-size:18px;color:var(--mut)}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,#86efac,var(--g2));color:#fff;display:grid;place-items:center;font-weight:800}
.nm{flex:1;font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vl{font-weight:800;font-size:17px}.vl small{color:var(--mut);font-weight:600}
.sk{height:62px;border-radius:18px;margin-bottom:10px;background:linear-gradient(90deg,#e8f3ec 25%,#f6fbf8 50%,#e8f3ec 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;padding:40px 20px;color:var(--mut)}.empty div{font-size:48px;margin-bottom:8px}
.item{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.ic{width:56px;height:56px;border-radius:18px;background:linear-gradient(145deg,#dcfce7,#bbf7d0);display:grid;place-items:center;font-size:28px;flex:none}
.item .tx{flex:1;min-width:0}.item h3{font-size:17px;font-weight:700}.item p{font-size:13px;color:var(--mut);line-height:1.3;margin-top:2px}
.item .own{font-size:12px;color:var(--g2);font-weight:700;margin-top:4px}
.buy{border:0;border-radius:14px;padding:12px 14px;font:700 15px 'Outfit',sans-serif;background:var(--ink);color:#fff;transition:transform .15s;cursor:pointer;white-space:nowrap}
.buy:active{transform:scale(.94)}.buy[disabled]{opacity:.35}
nav{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:6px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);padding:6px;border-radius:24px;box-shadow:0 10px 30px rgba(15,36,23,.16),0 0 0 1px var(--line);max-width:460px;margin:0 auto}
nav button{flex:1;border:0;background:transparent;border-radius:18px;padding:10px 4px;font:600 12px 'Outfit',sans-serif;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .2s;cursor:pointer}
nav button span{font-size:20px}
nav button.on{background:linear-gradient(180deg,#4ade80,var(--g2));color:#fff;box-shadow:0 6px 14px rgba(34,197,94,.4)}
footer{text-align:center;font-size:11px;color:#8aa093;margin-top:22px;letter-spacing:.4px}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:9;max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">L</div><div><h1>Letmine</h1><small>Run. Collect. Boost.</small></div></div>
  <div class="chip"><i>L</i><span id="bal">0</span></div>
</header>
<main>
  <section class="view on" id="v-run">
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="hud"><div class="pill"><span>Distance</span><b id="hs">0 m</b></div><div class="pill" style="text-align:right"><span>Tokens</span><b id="hc">0</b></div></div>
      <div class="badges" id="badges"></div>
      <div class="ov" id="ov"></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="sb">0</b><span>Best (m)</span></div>
      <div class="stat"><b id="sr">0</b><span>Runs</span></div>
      <div class="stat"><b id="st">0</b><span>LMN</span></div>
    </div>
    <p class="how">Swipe left or right to change lane, swipe up or tap to jump.</p>
  </section>
  <section class="view" id="v-rank">
    <h2 class="t">Leaderboard</h2>
    <div class="lbl">Longest runs</div>
    <div id="rank"></div>
  </section>
  <section class="view" id="v-shop">
    <h2 class="t">Boost shop</h2>
    <div class="lbl">Spend your LMN tokens</div>
    <div id="shop"></div>
  </section>
  <footer>Points have no cash value<br>Made with SayApp</footer>
</main>
<nav>
  <button class="on" data-v="run"><span>🏃</span>Run</button>
  <button data-v="rank"><span>🏆</span>Ranks</button>
  <button data-v="shop"><span>⚡</span>Boosts</button>
</nav>
<div id="toast"></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://jeremstyke.github.io/sayapp/sdk.js" data-app="8zwvkb7j"></script>
<script>
window.addEventListener('load',async()=>{
const $=s=>document.querySelector(s);
try{window.Telegram&&Telegram.WebApp&&(Telegram.WebApp.ready(),Telegram.WebApp.expand())}catch(e){}
let S={coins:0,shield:0,x2:0,runs:0},best=0,dirty=false,cur='run';
const hap=t=>{try{SayApp.haptic(t)}catch(e){}};
const uname=(SayApp.user&&SayApp.user.first_name)||'Runner';
try{const s=await SayApp.get('state');if(s&&typeof s==='object')S=Object.assign(S,s);const b=await SayApp.get('best');best=+b||0}catch(e){}
const touch=()=>{dirty=true};
const flush=()=>{if(dirty){dirty=false;try{SayApp.set('state',S)}catch(e){}}};
setInterval(flush,4000);document.addEventListener('visibilitychange',flush);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}
function num(el,to){const from=+el.dataset.v||0;el.dataset.v=to;const t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/400);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)}
function ui(){num($('#bal'),S.coins);num($('#st'),S.coins);num($('#sb'),best);num($('#sr'),S.runs)}
// tabs
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{cur=b.dataset.v;hap('tap');document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+cur));if(cur==='rank')ranks();if(cur==='shop')shop();if(cur==='run')size()});
async function ranks(){
  const box=$('#rank');box.innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  let list=[];try{list=await SayApp.top('best',20)||[]}catch(e){}
  if(!list.length){box.innerHTML='<div class="empty"><div>🏁</div><b>No runners yet</b><br>Be the first on the board. Go run!</div>';return}
  const med=['🥇','🥈','🥉'];
  box.innerHTML=list.map((r,i)=>`<div class="row ${r.me?'me':''}"><div class="rk">${med[i]||i+1}</div><div class="av">${String(r.name||'?').charAt(0).toUpperCase()}</div><div class="nm">${esc(r.name||'Runner')}${r.me?' (you)':''}</div><div class="vl">${Math.round(r.value)} <small>m</small></div></div>`).join('');
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ITEMS=[{k:'shield',ic:'🛡️',n:'Shield',d:'Absorbs one crash in your next run.',p:50},{k:'x2',ic:'⚡',n:'Double tokens',d:'Every token counts twice for one run.',p:80}];
function shop(){
  $('#shop').innerHTML=ITEMS.map(i=>`<div class="item"><div class="ic">${i.ic}</div><div class="tx"><h3>${i.n}</h3><p>${i.d}</p><div class="own">Owned: ${S[i.k]}</div></div><button class="buy" data-k="${i.k}" ${S.coins<i.p?'disabled':''}>${i.p} L</button></div>`).join('');
  document.querySelectorAll('.buy').forEach(b=>b.onclick=()=>{const i=ITEMS.find(x=>x.k===b.dataset.k);if(S.coins<i.p){hap('error');return}S.coins-=i.p;S[i.k]++;touch();hap('ok');toast(i.n+' added to your next run');ui();shop()});
}
// game
const cv=$('#cv'),ctx=cv.getContext('2d');let W=300,H=400,dpr=1;
function size(){const r=$('#stage').getBoundingClientRect();if(!r.width)return;dpr=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
size();window.addEventListener('resize',size);
let state='idle',objs=[],parts=[],off=0,dist=0,speed=.35,rc=0,tl=1,px=1,jh=0,jv=0,shieldOn=false,x2On=false,nextSp=0,shake=0,tt=0,adUsed=false,lastScore=0,gain=0;
const K=9;
const jumpP=()=>H*.16,G=()=>18.9*jumpP();
function overlay(h){const o=$('#ov');o.innerHTML=h;o.classList.remove('off')}
function startScreen(){overlay(`<div class="panel"><div class="tag">Hi ${esc(uname)}</div><h2>Ready to run?</h2><p>Dodge the blocks, jump the barriers and collect LMN tokens along the road.</p><button class="btn" id="go">Start running</button></div>`);$('#go').onclick=start}
function start(){
  hap('tap');objs=[];parts=[];dist=0;rc=0;tl=1;px=1;jh=0;jv=0;speed=.7;nextSp=.3;adUsed=false;
  shieldOn=false;x2On=false;
  if(S.shield>0){S.shield--;shieldOn=true}if(S.x2>0){S.x2--;x2On=true}
  touch();badges();$('#ov').classList.add('off');state='run';$('#hs').textContent='0 m';$('#hc').textContent='0';
}
function badges(){$('#badges').innerHTML=(shieldOn?'<em>🛡️ Shield</em>':'')+(x2On?'<em>⚡ x2</em>':'')}
function spawn(){
  const z=1.3,r=Math.random(),L=()=>Math.floor(Math.random()*3);
  const coins=(l,n)=>{for(let i=0;i<n;i++)objs.push({t:'c',l,z:z+i*.05})};
  if(r<.4)coins(L(),5);
  else if(r<.65){const a=L();objs.push({t:'b',l:a,z});coins((a+1+Math.floor(Math.random()*2))%3,4)}
  else if(r<.85){const a=L();objs.push({t:'r',l:a,z});if(Math.random()<.5)objs.push({t:'r',l:(a+1)%3,z});coins((a+2)%3,3)}
  else{const a=L(),b=(a+1+Math.floor(Math.random()*2))%3,c=3-a-b;objs.push({t:'b',l:a,z},{t:'b',l:b,z});coins(c,5)}
  nextSp=.32+Math.random()*.22;
}
function burst(x,y,c,n,txt){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=40+Math.random()*90;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,l:1,c})}if(txt)parts.push({x,y:y-10,vx:0,vy:-60,l:1,t:txt})}
let lastHap=0;
function step(dt){
  tt+=dt;
  const run=state==='run'&&cur==='run';
  const sp=run?speed:.35;off+=sp*dt/.3;
  if(!run){px+=(1-px)*Math.min(1,dt*8);return}
  speed=.7+Math.min(.9,dist/1500);dist+=speed*dt*12;
  px+=(tl-px)*Math.min(1,dt*14);
  if(jh>0||jv>0){jh+=jv*dt;jv-=G()*dt;if(jh<=0){jh=0;jv=0}}
  nextSp-=speed*dt;if(nextSp<=0)spawn();
  const laneW=W*.92/3,py=H*.84;
  for(const o of objs){o.z-=speed*dt;
    if(o.d)continue;
    if(o.z<.08&&o.z>-.06&&Math.abs(px-o.l)<.55){
      if(o.t==='c'){o.d=1;const v=x2On?2:1;rc+=v;const s=1/(1+Math.max(o.z,0)*K);burst(W/2+(o.l-1)*laneW*s,py-laneW*.3,'#fbbf24',6,'+'+v);if(tt-lastHap>.12){hap('tap');lastHap=tt}}
      else if(o.t==='r'&&jh>jumpP()*.4){}
      else{o.d=1;
        if(shieldOn){shieldOn=false;badges();hap('ok');shake=.25;burst(W/2+(px-1)*laneW,py-40,'#22c55e',18,'Saved!')}
        else{crash();return}
      }
    }
  }
  objs=objs.filter(o=>o.z>-.15&&!o.d);
  $('#hs').textContent=Math.floor(dist)+' m';$('#hc').textContent=rc;
}
function crash(){
  state='over';hap('error');shake=.5;const laneW=W*.92/3;burst(W/2+(px-1)*laneW,H*.78,'#ef4444',24);
  lastScore=Math.floor(dist);gain=rc;S.coins+=rc;S.runs++;
  const nb=lastScore>best;if(nb){best=lastScore;try{SayApp.set('best',best)}catch(e){}}
  touch();flush();ui();
  setTimeout(()=>over(nb),550);
}
function over(nb){
  overlay(`<div class="panel">${nb?'<div class="tag">New best</div>':''}<h2>${nb?'Amazing run!':'Crashed!'}</h2><div class="big" style="margin-top:12px">${lastScore}<small style="font-size:20px;letter-spacing:0"> m</small></div><p>You collected <b style="color:var(--g2)">${gain} LMN</b> tokens${gain?'':'. Try grabbing some next time'}.</p><button class="btn sec" id="ad" ${gain?'':'style="display:none"'}>🎬 Watch a video, double tokens</button><button class="btn" id="again">Run again</button></div>`);
  $('#again').onclick=start;
  $('#ad').onclick=async()=>{if(adUsed)return;const b=$('#ad');b.disabled=true;let ok=false;try{ok=await SayApp.ad()}catch(e){}
    if(ok){adUsed=true;S.coins+=gain;touch();hap('ok');toast('+'+gain+' LMN bonus!');ui();b.textContent='Doubled! +'+gain+' LMN'}
    else{b.disabled=false;toast('No video available right now')}};
}
// input
function act(a){if(state!=='run'||cur!=='run')return;
  if(a==='l'&&tl>0){tl--;hap('tap')}
  else if(a==='r'&&tl<2){tl++;hap('tap')}
  else if(a==='u'&&jh===0){jv=G()*.325;jh=.01;hap('tap')}}
let sx=0,sy=0,sd=false,hv=false;
cv.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;sd=true;hv=false});
cv.addEventListener('pointermove',e=>{if(!sd||hv)return;const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>28&&Math.abs(dx)>Math.abs(dy)){act(dx<0?'l':'r');hv=true}else if(dy<-28){act('u');hv=true}});
cv.addEventListener('pointerup',()=>{if(sd&&!hv)act('u');sd=false});
document.addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a')act('l');else if(k==='ArrowRight'||k==='d')act('r');else if(k==='ArrowUp'||k==='w'||k===' ')act('u')});
// draw
function quad(x1,y1,w1,x2,y2,w2,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x1-w1,y1);ctx.lineTo(x1+w1,y1);ctx.lineTo(x2+w2,y2);ctx.lineTo(x2-w2,y2);ctx.fill()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function draw(){
  const hor=H*.3,py=H*.84,cx=W/2,laneW=W*.92/3,sb=(H-hor)/(py-hor);
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*10*shake*2,(Math.random()-.5)*10*shake*2)}
  const Y=s=>hor+(py-hor)*s,S_=z=>1/(1+z*K);
  let g=ctx.createLinearGradient(0,0,0,hor);g.addColorStop(0,'#dcfce7');g.addColorStop(1,'#f7fee7');ctx.fillStyle=g;ctx.fillRect(-10,-10,W+20,hor+10);
  ctx.fillStyle='rgba(253,224,71,.7)';ctx.beginPath();ctx.arc(W*.76,hor*.5,26,0,6.3);ctx.fill();
  ctx.fillStyle='#a7f3d0';ctx.beginPath();ctx.moveTo(0,hor);for(let x=0;x<=W+20;x+=20)ctx.lineTo(x,hor-16-12*Math.sin(x*.025+1));ctx.lineTo(W,hor);ctx.fill();
  g=ctx.createLinearGradient(0,hor,0,H);g.addColorStop(0,'#bbf7d0');g.addColorStop(1,'#4ade80');ctx.fillStyle=g;ctx.fillRect(-10,hor,W+20,H-hor+10);
  const fr=off%1,fl=Math.floor(off);
  for(let n=14;n>=-1;n--){
    const z1=Math.max((n-fr)*.3,-.05),z2=(n+1-fr)*.3;if(z2<=z1)continue;
    const s1=S_(z2),s2=S_(z1);
    quad(cx,Y(s1),W*.46*s1,cx,Y(s2),W*.46*s2,((n+fl)&1)?'#e2e8f0':'#d5dde8');
    const zc=z1+.12,sc=S_(Math.max(zc,0)),y=Y(sc);
    if(zc>0){[-1,1].forEach(d=>{const x=cx+d*W*(.46+.14+((n+fl)%3)*.04)*sc,u=W*.16*sc;
      ctx.fillStyle='rgba(20,83,45,.12)';ctx.beginPath();ctx.ellipse(x,y,u*.45,u*.12,0,0,6.3);ctx.fill();
      ctx.fillStyle='#92400e';ctx.fillRect(x-u*.05,y-u*.45,u*.1,u*.45);
      ctx.fillStyle=(n+fl)%2?'#16a34a':'#15803d';ctx.beginPath();ctx.arc(x,y-u*.65,u*.38,0,6.3);ctx.fill()})}
  }
  ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=3;
  [-1.5,1.5].forEach(d=>{ctx.beginPath();ctx.moveTo(cx,hor);ctx.lineTo(cx+d*laneW*sb,H);ctx.stroke()});
  ctx.strokeStyle='rgba(148,163,184,.55)';ctx.lineWidth=2;ctx.setLineDash([10,12]);
  [-.5,.5].forEach(d=>{ctx.beginPath();ctx.moveTo(cx,hor);ctx.lineTo(cx+d*laneW*sb,H);ctx.stroke()});ctx.setLineDash([]);
  const sorted=objs.slice().sort((a,b)=>b.z-a.z);
  const drawO=o=>{const s=S_(Math.max(o.z,-.05)),x=cx+(o.l-1)*laneW*s,y=Y(s),u=laneW*s;
    ctx.globalAlpha=Math.max(0,Math.min(1,(1.3-o.z)*5));
    ctx.fillStyle='rgba(15,36,23,.15)';ctx.beginPath();ctx.ellipse(x,y,u*.4,u*.08,0,0,6.3);ctx.fill();
    if(o.t==='c'){const cy=y-u*.32;const gg=ctx.createRadialGradient(x-u*.05,cy-u*.05,1,x,cy,u*.2);gg.addColorStop(0,'#fef08a');gg.addColorStop(1,'#f59e0b');
      ctx.fillStyle=gg;ctx.beginPath();ctx.arc(x,cy,u*.19,0,6.3);ctx.fill();ctx.strokeStyle='#d97706';ctx.lineWidth=Math.max(1,u*.03);ctx.stroke();
      ctx.fillStyle='#92400e';ctx.font='800 '+Math.max(6,u*.2)+'px Outfit';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('L',x,cy+1)}
    else if(o.t==='b'){const w=u*.8,h=u*.95;g=ctx.createLinearGradient(0,y-h,0,y);g.addColorStop(0,'#94a3b8');g.addColorStop(1,'#475569');ctx.fillStyle=g;rr(x-w/2,y-h,w,h,u*.1);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.35)';rr(x-w/2,y-h,w,h*.18,u*.1);ctx.fill();ctx.fillStyle='rgba(15,23,42,.25)';ctx.fillRect(x-w*.3,y-h*.6,w*.6,u*.05);ctx.fillRect(x-w*.3,y-h*.4,w*.6,u*.05)}
    else{const w=u*.92,h=u*.34;ctx.fillStyle='#ef4444';rr(x-w/2,y-h-u*.1,w,h,u*.08);ctx.fill();ctx.fillStyle='#fff';
      for(let i=0;i<4;i++)ctx.fillRect(x-w/2+w*(.1+i*.22),y-h-u*.1,w*.1,h);
      ctx.fillStyle='#64748b';ctx.fillRect(x-w/2+u*.05,y-u*.1,u*.07,u*.1);ctx.fillRect(x+w/2-u*.12,y-u*.1,u*.07,u*.1)}
    ctx.globalAlpha=1};
  sorted.filter(o=>o.z>=0).forEach(drawO);
  // player
  const pxp=cx+(px-1)*laneW,u=laneW*.5,ph=jh,bob=state==='run'&&jh===0?Math.sin(tt*16)*u*.05:0;
  if(state!=='over'||true){
    ctx.fillStyle='rgba(15,36,23,.22)';ctx.beginPath();ctx.ellipse(pxp,py,u*.5*(1-ph/(H*.4)),u*.1,0,0,6.3);ctx.fill();
    const y=py-ph+bob,sw=state==='run'?Math.sin(tt*16)*u*.22:0;
    ctx.lineCap='round';ctx.strokeStyle='#14532d';ctx.lineWidth=u*.16;
    ctx.beginPath();ctx.moveTo(pxp-u*.12,y-u*.5);ctx.lineTo(pxp-u*.12+sw,y);ctx.moveTo(pxp+u*.12,y-u*.5);ctx.lineTo(pxp+u*.12-sw,y);ctx.stroke();
    g=ctx.createLinearGradient(0,y-u*1.2,0,y-u*.4);g.addColorStop(0,'#4ade80');g.addColorStop(1,'#16a34a');ctx.fillStyle=g;rr(pxp-u*.3,y-u*1.15,u*.6,u*.75,u*.2);ctx.fill();
    ctx.fillStyle='#f59e0b';rr(pxp-u*.22,y-u*1.05,u*.44,u*.4,u*.1);ctx.fill();
    ctx.fillStyle='#fde68a';ctx.beginPath();ctx.arc(pxp,y-u*1.4,u*.26,0,6.3);ctx.fill();
    ctx.fillStyle='#166534';ctx.beginPath();ctx.arc(pxp,y-u*1.5,u*.27,3.14,6.28);ctx.fill();
    if(shieldOn){ctx.strokeStyle='rgba(34,197,94,.8)';ctx.fillStyle='rgba(34,197,94,.15)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(pxp,y-u*.8,u*1.05,0,6.3);ctx.fill();ctx.stroke()}
  }
  sorted.filter(o=>o.z<0).forEach(drawO);
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.l);if(p.t){ctx.fillStyle='#b45309';ctx.font='800 20px Outfit';ctx.textAlign='center';ctx.fillText(p.t,p.x,p.y)}else{ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,4,0,6.3);ctx.fill()}}
  ctx.globalAlpha=1;ctx.restore();
}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;
  if(shake>0)shake=Math.max(0,shake-dt);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.t)p.vy+=240*dt;p.l-=dt*1.6}parts=parts.filter(p=>p.l>0);
  if(cur==='run'){step(dt);draw()}
  requestAnimationFrame(loop)}
ui();startScreen();requestAnimationFrame(loop);
});
</script>
