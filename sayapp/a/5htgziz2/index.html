const H=k=>{try{SayApp.haptic(k)}catch(e){}};
const fmt=v=>{v=Math.floor(v);if(v<1e4)return v.toLocaleString('en-US');const u=[[1e9,'B'],[1e6,'M'],[1e3,'K']];for(const[d,s]of u)if(v>=d)return(v/d).toFixed(v/d<100?1:0).replace('.0','')+s;return ''+v};
const tapVal=()=>1+S.lv.tap, maxE=()=>500+250*S.lv.energy, refill=()=>1+S.lv.refill, autoR=()=>S.lv.auto;
const cost=u=>Math.floor(u.base*Math.pow(u.g,S.lv[u.id]));
const today=()=>Math.floor(Date.now()/864e5);
const mult=()=>Date.now()<(S.boost||0)?2:1;
function adUI(){const left=(S.boost||0)-Date.now(),on=left>0;
  $('boostBtn').style.display=on?'none':'inline-flex';$('boostBtn').textContent='🎬 '+t('boost');
  $('boostBadge').classList.toggle('on',on);if(on)$('boostBadge').textContent='🔥 '+t('boostOn')+' · '+Math.ceil(left/1000)+' s';
  $('stage').classList.toggle('boost',on);
  $('refBtn').style.display=ready&&S.energy<tapVal()?'flex':'none';$('refBtn').textContent='🎬 '+t('refillAd')}
let adBusy=false;
async function watchAd(btn,fn){if(adBusy||!ready)return;adBusy=true;btn.disabled=true;H('tap');let ok=false;
  try{ok=await SayApp.ad()}catch(e){ok=false}
  adBusy=false;btn.disabled=false;
  if(ok===true){fn();dirty=true;H('ok');const r=btn.getBoundingClientRect();sparks(r.left+r.width/2,r.top+r.height/2,30,120);save(true)}
  else{H('error');toast(t('noAd'))}adUI()}
$('boostBtn').addEventListener('click',()=>watchAd($('boostBtn'),()=>{S.boost=Date.now()+60000;toast(t('boosted'))}));
$('refBtn').addEventListener('click',()=>watchAd($('refBtn'),()=>{S.energy=maxE();toast(t('refilled'))}));
function rankOf(v){let i=0;RANKS.forEach((r,k)=>{if(v>=r)i=k});return i}
let tt;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2600)}
function floatTxt(x,y,txt){const e=document.createElement('div');e.className='fl';e.textContent=txt;e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),850)}
function sparks(x,y,n,spread){for(let i=0;i<n;i++){const e=document.createElement('i');e.className='sp';const a=Math.random()*Math.PI*2,r=(spread||60)*(.5+Math.random());e.style.left=x+'px';e.style.top=y+'px';e.style.setProperty('--dx',Math.cos(a)*r+'px');e.style.setProperty('--dy',Math.sin(a)*r+'px');if(Math.random()<.4)e.style.background='radial-gradient(circle,#fff,#FF8A3D)';document.body.appendChild(e);setTimeout(()=>e.remove(),620)}}
function applyLang(){document.documentElement.lang=L;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));buildShop();renderDaily();renderStatic();adUI();if(tab==='top')loadTop()}
function renderStatic(){$('cTap').textContent='👆 '+t('perTap',tapVal());$('cAuto').textContent='⛏️ '+t('perHour',fmt(autoR()*3600));$('enRate').textContent=t('refill',refill())}
function render(){
  $('gold').textContent=fmt(shown);
  const m=maxE();$('enTxt').textContent=Math.floor(S.energy)+' / '+m;$('enBar').style.width=(S.energy/m*100)+'%';
  const r=rankOf(S.total),names=t('ranks');
  if(r>rankIdx&&ready){toast(t('levelUp',names[r]));H('ok');const s=$('nug').getBoundingClientRect();sparks(s.left+s.width/2,s.top+s.height/2,30,140)}
  rankIdx=r;$('lvName').textContent=names[r];$('ulv').textContent=names[r]+' · '+(r+1)+'/6';
  if(r<RANKS.length-1){const a=RANKS[r],b=RANKS[r+1];$('lvBar').style.width=((S.total-a)/(b-a)*100)+'%';$('lvNext').textContent=t('next',fmt(b-S.total))}
  else{$('lvBar').style.width='100%';$('lvNext').textContent=t('maxLv')}
}
function buildShop(){$('shop').innerHTML=UP.map(u=>`<div class="card up"><div class="ic">${u.ic}</div><div class="tx"><b>${t(u.id+'N')}</b><span class="tag">${t('lv',S.lv[u.id])}</span><p>${t(u.id+'D')}</p></div><button class="btn" data-u="${u.id}"><i class="coin"></i><span>${fmt(cost(u))}</span></button></div>`).join('');updateShop()}
function updateShop(){document.querySelectorAll('[data-u]').forEach(b=>{const u=UP.find(x=>x.id===b.dataset.u);b.disabled=S.gold<cost(u)})}
$('shop').addEventListener('click',e=>{const b=e.target.closest('[data-u]');if(!b)return;const u=UP.find(x=>x.id===b.dataset.u),c=cost(u);
  if(S.gold<c){H('error');return}S.gold-=c;S.lv[u.id]++;dirty=true;H('ok');const r=b.getBoundingClientRect();sparks(r.left+r.width/2,r.top+r.height/2,14,70);
  toast(t('bought',t(u.id+'N')));buildShop();renderStatic();setTimeout(()=>save(true),300)});
function dInfo(){const d=S.daily,td=today();if(d.day===td)return{claimed:true,idx:d.streak-1};return{claimed:false,idx:d.day===td-1?(d.streak%7):0}}
function renderDaily(){const inf=dInfo();
  $('days').innerHTML=DR.map((v,i)=>{const done=i<inf.idx||(inf.claimed&&i===inf.idx),now=!inf.claimed&&i===inf.idx;return `<div class="d ${done?'done':''} ${now?'now':''}"><small>${t('day',i+1)}</small><div class="x">${done?'✅':i===6?'💰':'🪙'}</div><b>${fmt(v)}</b></div>`}).join('');
  $('streakTxt').textContent=t('streak',inf.claimed?inf.idx+1:inf.idx+1);
  $('claim').innerHTML=inf.claimed?'✅':'🎁 '+t('claim')+' · +'+fmt(DR[inf.idx]);$('claim').disabled=inf.claimed;
  $('chestE').textContent=inf.claimed?'💰':'🎁';$('dDot').style.display=inf.claimed?'none':'block';tickCd()}
function tickCd(){const inf=dInfo();if(!inf.claimed){$('cd').textContent='';return}const ms=(today()+1)*864e5-Date.now(),h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3),p=x=>String(x).padStart(2,'0');$('cd').innerHTML=t('comeBack')+' <b>'+p(h)+':'+p(m)+':'+p(s)+'</b>'}
$('claim').addEventListener('click',()=>{const inf=dInfo();if(inf.claimed)return;const v=DR[inf.idx];S.daily={streak:inf.idx+1,day:today()};S.gold+=v;S.total+=v;dirty=true;H('ok');
  const r=$('chestE').getBoundingClientRect();sparks(r.left+r.width/2,r.top+r.height/2,40,160);floatTxt(r.left+r.width/2,r.top,'+'+fmt(v));toast(t('claimed',fmt(v)));renderDaily();save(true)});
async function loadTop(){const lb=$('lb');lb.innerHTML='<div class="sk"></div>'.repeat(6);
  try{await save(true);const list=await SayApp.top('gold',20);
    if(!list||!list.length){lb.innerHTML=`<div class="empty"><div>⛏️</div>${t('empty')}</div>`;return}
    const md=['🥇','🥈','🥉'];let h=list.map((p,i)=>`<div class="lr ${p.me?'me':''}"><div class="r">${md[i]||i+1}</div><div class="nm">${esc(p.me?p.name+' ('+t('you')+')':p.name)}</div><div class="v"><i class="coin"></i>${fmt(p.value)}</div></div>`).join('');
    if(!list.some(p=>p.me))h+=`<div class="lr me"><div class="r">-</div><div class="nm">${t('notRanked')}</div><div class="v"><i class="coin"></i>${fmt(S.total)}</div></div>`;
    lb.innerHTML=h}catch(e){lb.innerHTML=`<div class="empty"><div>🪨</div>${t('err')}</div>`}}
function esc(s){return String(s||'Miner').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.t;H('tap');document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='p-'+tab));if(tab==='top')loadTop();if(tab==='daily')renderDaily();if(tab==='shop')buildShop()}));
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{L=b.dataset.l;S.lang=L;dirty=true;H('tap');applyLang()}));
$('nug').addEventListener('pointerdown',e=>{e.preventDefault();if(!ready)return;const v=tapVal();
  if(S.energy<v){H('error');adUI();$('nug').animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:250});toast(t('noEnergy'));return}
  S.energy-=v;const g=v*mult();S.gold+=g;S.total+=g;dirty=true;H('tap');floatTxt(e.clientX,e.clientY,'+'+g);sparks(e.clientX,e.clientY,g>v?12:7,60);
  $('nug').animate([{transform:'scale(1)'},{transform:'scale(.88)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:280,easing:'ease-out'})});
let saving=false;
async function save(force){if((!dirty&&!force)||saving||!ready)return;saving=true;dirty=false;S.last=Date.now();
  try{await SayApp.set('state',S);await SayApp.set('gold',Math.floor(S.total))}catch(e){dirty=true}saving=false}
let lt=performance.now();
function loop(now){const dt=Math.min((now-lt)/1000,1);lt=now;
  if(ready){S.energy=Math.min(maxE(),S.energy+refill()*dt);const a=autoR()*dt*mult();if(a){S.gold+=a;S.total+=a;dirty=true}}
  shown+=(S.gold-shown)*Math.min(1,dt*12);if(Math.abs(S.gold-shown)<.5)shown=S.gold;render();requestAnimationFrame(loop)}
window.addEventListener('load',async()=>{
  try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}
  const u=(window.SayApp&&SayApp.user)||{};$('uname').textContent=u.first_name||'Miner';if(u.first_name)$('av').textContent=u.first_name[0].toUpperCase();
  try{const s=await SayApp.get('state');if(s&&typeof s==='object'){S=Object.assign(S,s);S.lv=Object.assign({tap:0,energy:0,refill:0,auto:0},s.lv||{});S.daily=Object.assign({streak:0,day:-1},s.daily||{})}}catch(e){}
  let code='';try{code=(Telegram.WebApp.initDataUnsafe.user||{}).language_code||u.language_code||''}catch(e){code=u.language_code||''}
  L=S.lang||(String(code).startsWith('fr')?'fr':'en');
  const el=Math.max(0,Math.min((Date.now()-(S.last||Date.now()))/1000,8*3600));
  S.energy=Math.min(maxE(),(S.energy||0)+el*refill());
  const earned=Math.floor(autoR()*el);
  rankIdx=rankOf(S.total);shown=S.gold;ready=true;
  if(earned>0){S.gold+=earned;S.total+=earned;dirty=true;setTimeout(()=>{toast(t('away',fmt(earned)));H('ok')},600)}
  applyLang();requestAnimationFrame(loop);
  setInterval(()=>save(),4000);setInterval(()=>{updateShop();tickCd();adUI()},500);
  setInterval(()=>{if(dInfo().claimed&&$('claim').disabled===false)renderDaily()},5000);
  setInterval(()=>{const c=dInfo().claimed;if(!c&&$('claim').disabled)renderDaily()},10000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save(true)});
});
</script>
</body>
</html>
