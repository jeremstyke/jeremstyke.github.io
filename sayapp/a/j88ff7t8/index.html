function burst(x,y,txt){const f=document.createElement('div');f.className='float';f.textContent=txt;f.style.left=(x-24)+'px';f.style.top=(y-20)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1000);
const cols=['#FFD23F','#FF4FA3','#22D3EE','#8B5CF6','#FF8A5B','#4ADE80'];for(let i=0;i<26;i++){const c=document.createElement('div');c.className='conf';c.style.left=x+'px';c.style.top=y+'px';c.style.background=cols[i%6];const a=Math.random()*Math.PI*2,d=60+Math.random()*120;c.style.setProperty('--x',Math.cos(a)*d+'px');c.style.setProperty('--y',Math.sin(a)*d-40+'px');c.style.setProperty('--r',Math.random()*720+'deg');document.body.appendChild(c);setTimeout(()=>c.remove(),900)}}
function texts(){const l=L();document.title=l.title;$('tTitle').textContent=l.title;$('nPlay').textContent=l.play;$('nTop').textContent=l.top;$('nMe').textContent=l.me;$('nShop').textContent=l.shop;$('tLb').textContent=l.top;$('inviteBtn').textContent=l.invite;$('tLang').textContent=l.lang;$('tSug').textContent=l.sugT;$('tSugSub').textContent=l.sugSub;$('sugA').placeholder=l.sugA;$('sugB').placeholder=l.sugB;$('sugBtn').textContent=l.sugBtn;renderChips();$('tPlayer').textContent=l.player;
document.querySelectorAll('.seg button[data-l]').forEach(b=>b.classList.toggle('on',b.dataset.l===S.lang));
$('modeSeg').children[0].textContent=l.solo;$('modeSeg').children[1].textContent=l.duel;document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',(b.dataset.m==='duel')===duel.on));$('v-play').classList.toggle('duel',duel.on);
const n=D().length,p=Math.min(pos(),n);$('tToday').textContent=p+' / '+n+' '+l.today;$('prog').style.width=(n?p/n*100:0)+'%';renderDaily()}
let chipLang='';
function renderChips(){const l=L();if(chipLang!==S.lang){chipLang=S.lang;const h=(list,a)=>list.map(t=>`<button class="chip" data-${a}="${t}">${t==='prem'&&!owned.has('pack_premium')?'🔒':THE[t]} ${l.themes[t]}</button>`).join('');$('themes').innerHTML=h(TH,'t');$('sugTh').innerHTML=h(TH.slice(1).filter(t=>t!=='prem'),'g')}
document.querySelectorAll('#themes .chip').forEach(b=>b.classList.toggle('on',b.dataset.t===S.th));document.querySelectorAll('#sugTh .chip').forEach(b=>b.classList.toggle('on',b.dataset.g===sugTh))}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function opt(i,side){const li=S.lang==='fr'?0:1;return `<button class="opt ${side}" data-s="${side}"><div class="fill"></div><div class="t">${esc(P[i][li])}</div><div class="p"></div><div class="emo">${P[i][2]}</div></button>`}
function renderQ(){const z=$('playZone'),l=L();texts();
stopTimer();
if(duel.on){renderDuel();return}
if(pos()>=D().length){z.innerHTML=`<div class="card empty"><div class="big">🥳</div><h3>${l.done}</h3><p>${l.doneSub}</p><button class="btn yel" id="doneShare">${l.invite}</button></div>`;$('doneShare').onclick=invite;$('timer').classList.remove('on');return}
const [a,b]=D()[pos()];locked=false;
z.innerHTML=`<div class="qwrap in" id="qw"><div class="ask">${l.ask}</div><div class="tbar"><i id="tbar"></i></div><div class="opts" id="opts">${opt(a,'a')}<div class="or">${l.or}</div>${opt(b,'b')}</div>
<div class="result"><div class="verdict" id="verdict"></div><div class="row" id="acts" style="display:none"><button class="btn ghost" id="shareBtn">${l.share}</button><button class="btn" id="nextBtn">${l.next}</button></div><button class="skip" id="skipBtn">${l.skip}</button></div></div>`;
requestAnimationFrame(()=>requestAnimationFrame(()=>$('qw').classList.remove('in')));
z.querySelectorAll('.opt').forEach(o=>o.onclick=e=>pick(o.dataset.s,e));
$('skipBtn').onclick=()=>{SayApp.haptic('tap');next()};
$('nextBtn').onclick=()=>{SayApp.haptic('tap');next()};
$('shareBtn').onclick=()=>shareQ();
if($('v-play').classList.contains('on'))startTimer();else setTimer(10)}
let lastPick='a',tmr=null,tLeft=10,sugTh='abs',qStart=0;
const DR=10;let duel={on:false,r:0,turn:0,s:[0,0],pk:[],same:0,q:null,pass:false};
function duelNew(){const pool=P.map((p,i)=>i).filter(i=>S.th==='all'?P[i][3]!=='prem':P[i][3]===S.th);let a,b;do{a=pool[Math.floor(Math.random()*pool.length)];b=pool[Math.floor(Math.random()*pool.length)]}while(a===b);duel.q=[a,b];duel.turn=0;duel.pk=[];duel.pass=false}
function duelReset(){duel.r=0;duel.s=[0,0];duel.same=0;duelNew()}
function setMode(m){duel.on=m==='duel';if(duel.on)duelReset();renderQ()}
function renderDuel(){const z=$('playZone'),l=L(),N=l.dP;$('timer').classList.remove('on');
const hl=i=>duel.pk.length<2&&duel.r<DR&&duel.turn===i?'on':'';
const head=`<div class="dhead"><div class="dsc p1 ${hl(0)}">${N[0]}<b id="dS0">${duel.s[0]}</b></div><div class="label">${l.dRound(Math.min(duel.r+1,DR),DR)}</div><div class="dsc p2 ${hl(1)}">${N[1]}<b id="dS1">${duel.s[1]}</b></div></div>`;
if(duel.r>=DR){const w=duel.s[0]===duel.s[1]?-1:duel.s[0]>duel.s[1]?0:1;z.innerHTML=head+`<div class="card empty"><div class="big">${w<0?'🤝':'🏆'}</div><h3>${w<0?l.dTie:l.dWin(N[w])}</h3><p>${l.dAgree(duel.same,DR)}</p><div class="row"><button class="btn ghost" id="dSolo">${l.dSoloBtn}</button><button class="btn yel" id="dAgain">${l.dAgain}</button></div></div>`;
$('dAgain').onclick=()=>{SayApp.haptic('tap');duelReset();renderDuel()};$('dSolo').onclick=()=>{SayApp.haptic('tap');setMode('solo')};return}
if(duel.pass){z.innerHTML=head+`<div class="card empty"><div class="big">🙈</div><h3>${l.dPass(N[1])}</h3><p>${l.dPassSub}</p><button class="btn" id="dReady">${l.dReady}</button></div>`;$('dReady').onclick=()=>{SayApp.haptic('tap');duel.pass=false;renderDuel()};return}
const [a,b]=duel.q;
z.innerHTML=head+`<div class="qwrap in" id="dw"><div class="ask">${l.dTurn(N[duel.turn])}</div><div class="opts" id="opts">${opt(a,'a')}<div class="or">${l.or}</div>${opt(b,'b')}</div><div class="result"><div class="verdict" id="verdict"></div><div class="row" id="acts" style="display:none"><button class="btn" id="dNext">${l.next}</button></div></div></div>`;
requestAnimationFrame(()=>requestAnimationFrame(()=>{const w=$('dw');if(w)w.classList.remove('in')}));
z.querySelectorAll('.opt').forEach(o=>o.onclick=e=>duelPick(o.dataset.s,e));
$('dNext').onclick=()=>{SayApp.haptic('tap');duel.r++;duelNew();const w=$('dw');w.classList.add('out');setTimeout(renderDuel,260)};
if(duel.pk.length===2)duelReveal(null)}
function duelPick(side,e){if(duel.pk.length>=2||duel.pass)return;duel.pk.push(side);SayApp.haptic('tap');
if(duel.turn===0){duel.turn=1;duel.pass=true;const w=$('dw');w.classList.add('out');setTimeout(renderDuel,260);return}
const [a,b]=duel.q,pa=pctA(a,b),maj=pa>=50?'a':'b',same=duel.pk[0]===duel.pk[1],g=[0,0];
duel.pk.forEach((p,i)=>{g[i]=(p===maj?10:0)+(same?5:0);duel.s[i]+=g[i]});if(same)duel.same++;
duelReveal(g);SayApp.haptic('ok');const r=$('opts').querySelector('.opt.'+side).getBoundingClientRect();burst(e&&e.clientX?e.clientX:r.left+r.width/2,e&&e.clientY?e.clientY:r.top+r.height/2,same?'🤝':'⚔️')}
function duelReveal(g){const [a,b]=duel.q,pa=pctA(a,b),l=L(),N=l.dP,opts=$('opts');if(!opts)return;opts.classList.add('done');
['a','b'].forEach(s=>{const o=opts.querySelector('.opt.'+s),p=s==='a'?pa:100-pa;o.querySelector('.p').textContent=p+'%';requestAnimationFrame(()=>{o.querySelector('.fill').style.width=p+'%'});const who=[0,1].filter(i=>duel.pk[i]===s);if(who.length)o.classList.add('pick');o.insertAdjacentHTML('beforeend',`<div class="dtags">${who.map(i=>`<span class="dtag p${i+1}">${N[i]}</span>`).join('')}</div>`)});
const v=$('verdict');v.textContent=(duel.pk[0]===duel.pk[1]?l.dSame:l.dDiff)+(g?` · ${N[0]} +${g[0]} · ${N[1]} +${g[1]}`:'');v.classList.add('on');$('acts').style.display='flex';
$('dS0').textContent=duel.s[0];$('dS1').textContent=duel.s[1];document.querySelectorAll('.dsc').forEach(d=>d.classList.remove('on'))}
function setTimer(v){const t=$('timer');t.textContent='⏱ '+v+'s';t.classList.add('on');t.classList.toggle('hot',v<=3&&v>0)}
function stopTimer(){if(tmr){clearInterval(tmr);tmr=null}$('timer').classList.remove('hot');const b=$('tbar');if(b){b.style.width=getComputedStyle(b).width;b.style.transition='none'}}
function startTimer(){stopTimer();tLeft=10;setTimer(tLeft);qStart=performance.now();const b=$('tbar');if(b){b.style.transition='none';b.style.width='100%';void b.offsetWidth;b.style.transition='width 10s linear';b.style.width='0%'}
tmr=setInterval(()=>{tLeft--;setTimer(Math.max(0,tLeft));if(tLeft<=3&&tLeft>0)SayApp.haptic('tap');if(tLeft<=0){stopTimer();timeUp()}},1000)}
function timeUp(){if(locked||!$('opts'))return;locked=true;$('opts').classList.add('late');const v=$('verdict');v.textContent=L().late;v.classList.add('on');$('skipBtn').style.display='none';SayApp.haptic('error');const q=$('qw');setTimeout(()=>{if($('qw')===q)next()},1200)}
function pick(side,e){if(locked)return;locked=true;stopTimer();lastPick=side;const [a,b]=D()[pos()],pa=pctA(a,b),pb=100-pa,mine=side==='a'?pa:pb,maj=mine>=50;
const opts=$('opts');opts.classList.add('done');const oa=opts.querySelector('.opt.a'),ob=opts.querySelector('.opt.b');(side==='a'?oa:ob).classList.add('pick');
oa.querySelector('.p').textContent=pa+'%';ob.querySelector('.p').textContent=pb+'%';
requestAnimationFrame(()=>{oa.querySelector('.fill').style.width=pa+'%';ob.querySelector('.fill').style.width=pb+'%'});
const fast=qStart&&performance.now()-qStart<3000,bx=boostOn();let pts=(10+(maj?5:0)+(fast?(isVip()?10:5):0))*(bx?2:1);
S.score+=pts;S.total++;if(fast)S.fast=(S.fast||0)+1;
S.dsc+=pts;S.dc.n++;if(fast)S.dc.fast++;if(maj)S.dc.maj++;
if(!S.dc.done&&S.dc[dch.k]>=dch.g){S.dc.done=true;S.score+=50;S.dsc+=50;setTimeout(()=>{toast(L().dDone);SayApp.haptic('ok');const dc=$('dCard').getBoundingClientRect();burst(dc.left+dc.width/2,Math.max(80,dc.top+dc.height/2),'+50')},1700)}
const nb=BADGES.find(x=>x[0]===S.total);if(nb)setTimeout(()=>{toast(L().badgeNew(nb[1]+' '+nb[2][S.lang]));SayApp.haptic('ok');burst(window.innerWidth/2,window.innerHeight/2,nb[1])},900);
if(S.lastDay!==today){S.streak=S.lastDay===yest?S.streak+1:1;S.lastDay=today;S.best=Math.max(S.best,S.streak)}
const v=$('verdict');v.textContent=(maj?L().maj:L().min)+(fast?' · '+L().fast:'')+(bx?' · '+L().boostX:'');v.classList.add('on');
$('acts').style.display='flex';$('skipBtn').style.display='none';
const r=(side==='a'?oa:ob).getBoundingClientRect();burst(e&&e.clientX?e.clientX:r.left+r.width/2,e&&e.clientY?e.clientY:r.top+r.height/2,'+'+pts);
SayApp.haptic('ok');animScore();texts();save()}
function next(){stopTimer();S.pos[S.th]=pos()+1;save();const q=$('qw');if(q){q.classList.add('out');setTimeout(renderQ,260)}else renderQ()}
function openShare(text){const url='https://t.me/share/url?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(text);try{tg.openTelegramLink(url)}catch(e){window.open(url,'_blank')}}
function shareQ(){const [a,b]=D()[pos()],li=S.lang==='fr'?0:1,A=P[a][li],B=P[b][li];SayApp.haptic('tap');openShare(L().shareTxt(A,B,lastPick==='a'?A:B))}
function invite(){SayApp.haptic('tap');openShare(L().inviteTxt(S.score))}
$('inviteBtn').onclick=invite;
async function renderLB(){const ul=$('lb');ul.innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>';
if(saveT){clearTimeout(saveT);saveT=null;try{await SayApp.set('wyr',S);await SayApp.set('score',S.score)}catch(e){}}
let list=[];try{list=await SayApp.top('score',20)||[]}catch(e){ul.innerHTML=`<div class="empty"><div class="big">📡</div><p>${L().lbErr}</p></div>`;return}
if(!list.length){ul.innerHTML=`<div class="empty"><div class="big">🏆</div><p>${L().lbEmpty}</p></div>`;return}
const med=['🥇','🥈','🥉'];ul.innerHTML=list.map((p,i)=>{const n=p.name||'?';return `<li class="${p.me?'me':''}"><div class="r">${med[i]||i+1}</div><div class="av">${esc(n.charAt(0).toUpperCase())}</div><div class="n">${esc(n)}</div><div class="v">${Number(p.value)||0}</div></li>`}).join('')}
function renderMe(){const l=L(),n=u.first_name||l.player;$('meName').textContent=n+(isVip()?' 👑':'');$('meAv').textContent=n.charAt(0).toUpperCase();
$('stats').innerHTML=[[l.score,S.score],[l.total,S.total],[l.streak,S.streak+' 🔥'],[l.best,S.best],[l.flashN,(S.fast||0)+' ⚡']].map(s=>`<div class="stat"><div class="label">${s[0]}</div><b>${s[1]}</b></div>`).join('');
$('tBadges').textContent=l.badges;$('badges').innerHTML=BADGES.map(b=>{const on=S.total>=b[0];return `<div class="bdg ${on?'on':'off'}"><i>${on?b[1]:'🔒'}</i><b>${b[2][S.lang]}</b><small>${l.badgeReq(b[0])}</small></div>`}).join('');
const nx=BADGES.find(b=>b[0]>S.total);$('bNext').textContent=nx?l.badgeNext(nx[0]-S.total):l.badgeAll;texts()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{SayApp.haptic('tap');const was=$('v-play').classList.contains('on');if(b.dataset.v==='play'){if(!was&&!locked&&$('qw'))setTimeout(startTimer,0)}else stopTimer();document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+b.dataset.v));
if(b.dataset.v==='top')renderLB();if(b.dataset.v==='me')renderMe();if(b.dataset.v==='shop')renderShop();if(b.dataset.v==='play')loadBest();window.scrollTo({top:0,behavior:'smooth'})});
$('modeSeg').onclick=e=>{const b=e.target.closest('button');if(!b||(b.dataset.m==='duel')===duel.on)return;SayApp.haptic('tap');setMode(b.dataset.m)};
document.querySelectorAll('.seg button[data-l]').forEach(b=>b.onclick=()=>{if(S.lang===b.dataset.l)return;S.lang=b.dataset.l;SayApp.haptic('tap');save();renderMe();renderQ()});
$('themes').onclick=e=>{const b=e.target.closest('.chip');if(!b||b.dataset.t===S.th)return;if(b.dataset.t==='prem'&&!owned.has('pack_premium')){SayApp.haptic('error');toast(L().premLock);document.querySelector('nav button[data-v="shop"]').click();return}S.th=b.dataset.t;if(duel.on&&!duel.pk.length&&duel.r<DR)duelNew();SayApp.haptic('tap');save();renderQ()};
$('sugTh').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;sugTh=b.dataset.g;SayApp.haptic('tap');renderChips()};
$('sugBtn').onclick=async()=>{const btn=$('sugBtn'),A=$('sugA').value.trim(),B=$('sugB').value.trim();if(btn.disabled)return;if(A.length<3||B.length<3){SayApp.haptic('error');toast(L().sugErr);return}
btn.disabled=true;btn.style.opacity=.6;let ok=false;try{await SayApp.submit({type:'dilemme',optionA:A,optionB:B,theme:sugTh,lang:S.lang,from:u.first_name||''});ok=true}catch(e){}
btn.disabled=false;btn.style.opacity=1;if(ok){$('sugA').value='';$('sugB').value='';SayApp.haptic('ok');toast(L().sugOk);const r=btn.getBoundingClientRect();burst(r.left+r.width/2,r.top,'💡')}else{SayApp.haptic('error');toast(L().sugFail)}};
$('score').textContent=S.score;
renderQ();loadBest();
stopTimer();
const sp=$('splash');$('spTitle').textContent=L().title;$('spSub').textContent=L().spSub;$('spGo').textContent=L().spGo;sp.classList.add('ready');
{const l0=L(),qs=S.th==='all'?l0.quotes.concat(...Object.values(l0.qt)):(l0.qt[S.th]||l0.quotes);let qi=Math.floor(Math.random()*qs.length);if(qi===S.lq)qi=(qi+1)%qs.length;S.lq=qi;save();$('spQ').textContent='“'+qs[qi]+'”';
$('spShare').textContent=L().qShare;$('spShare').onclick=()=>{SayApp.haptic('tap');openShare(L().qShareTxt(qs[qi]))}}
$('spGo').onclick=()=>{if(sp.classList.contains('off'))return;SayApp.haptic('ok');const r=$('spGo').getBoundingClientRect();sp.classList.add('off');setTimeout(()=>{burst(r.left+r.width/2,r.top,'🎲');sp.remove()},300);
if(!duel.on&&!locked&&$('qw')&&$('v-play').classList.contains('on'))setTimeout(startTimer,450)};
});
</script>
</body>
