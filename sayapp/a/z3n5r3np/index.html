<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pièce d'Or</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#FFC23D;--gold2:#FF9F1C;--gold3:#B86E00;
  --accent:#8B5CF6;--accent2:#C084FC;
  --bg:#0B0A12;--bg2:#13111F;--card:#1A1729;--card2:#221E36;
  --line:rgba(255,255,255,.07);--text:#F6F3FF;--muted:#9C96B8;
  --r:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;user-select:none;-webkit-user-select:none}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(600px 420px at 50% 32%,rgba(255,170,40,.16),transparent 70%),radial-gradient(500px 400px at 100% 100%,rgba(139,92,246,.16),transparent 70%),radial-gradient(400px 300px at 0% 0%,rgba(139,92,246,.10),transparent 70%);pointer-events:none}
#app{position:relative;height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
header{padding:calc(var(--sa-top,0px) + 8px) 20px 8px;display:flex;align-items:center;justify-content:space-between}
.hello{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.name{font-size:20px;font-weight:800;margin-top:2px}
.rank{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:linear-gradient(135deg,rgba(139,92,246,.25),rgba(192,132,252,.12));border:1px solid rgba(192,132,252,.3);font-weight:700;font-size:13px}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 20px 120px}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.scoreBox{text-align:center;margin-top:8px}
.score{font-size:52px;font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(180deg,#FFF3C9,var(--gold) 55%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 24px rgba(255,170,40,.35))}
.score i{font-style:normal;-webkit-text-fill-color:initial;font-size:36px}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.sub b{color:var(--text)}
.coinWrap{position:relative;display:flex;justify-content:center;margin:24px 0 16px;perspective:700px}
.coinWrap:before{content:"";position:absolute;width:300px;height:300px;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,190,60,.35),transparent 65%);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.08);opacity:.7}}
#coin{position:relative;width:250px;height:250px;border-radius:50%;cursor:pointer;touch-action:none;transition:transform .15s ease;
  background:radial-gradient(circle at 32% 28%,#FFF6CF 0%,#FFD45E 22%,var(--gold) 45%,var(--gold2) 72%,var(--gold3) 100%);
  box-shadow:0 0 0 6px rgba(255,200,80,.18),0 0 0 14px rgba(255,200,80,.06),inset 0 -12px 24px rgba(120,60,0,.45),inset 0 10px 20px rgba(255,255,255,.4),0 24px 60px rgba(255,140,20,.35)}
#coin:after{content:"";position:absolute;inset:18px;border-radius:50%;border:3px dashed rgba(140,70,0,.35);box-shadow:inset 0 0 0 10px rgba(255,230,150,.18)}
#coin svg{position:absolute;inset:0;margin:auto;width:46%;height:46%;filter:drop-shadow(0 3px 0 rgba(255,240,190,.6))}
#coin.tired{filter:grayscale(.7) brightness(.6)}
.energy{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.erow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700}
.erow span:last-child{color:var(--muted);font-weight:600;font-size:14px}
.bar{height:12px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}
.bar>div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 16px rgba(192,132,252,.6);transition:width .3s ease}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.stat b{display:block;font-size:20px;font-weight:800;margin-top:4px}
.float{position:fixed;pointer-events:none;font-weight:900;font-size:30px;color:#FFE79A;text-shadow:0 2px 12px rgba(255,150,0,.8);animation:up .8s ease-out forwards;z-index:50}
@keyframes up{to{transform:translate(-50%,-110px) scale(1.2);opacity:0}}
.pt{position:fixed;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle,#FFF2B8,var(--gold2));pointer-events:none;z-index:49;animation:burst .6s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
h2{font-size:26px;font-weight:800;margin:8px 0 4px}
.lead{color:var(--muted);margin-bottom:16px}
.up{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 10px 28px rgba(0,0,0,.3)}
.ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:linear-gradient(135deg,rgba(255,194,61,.22),rgba(139,92,246,.2));border:1px solid rgba(255,255,255,.08);flex:none}
.up .t{flex:1;min-width:0}
.up .t b{font-size:16px;display:block}
.up .t small{color:var(--muted);font-size:13px}
.lv{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent2)}
.buy{border:0;font:inherit;font-weight:800;font-size:14px;padding:12px 14px;border-radius:14px;color:#2A1600;background:linear-gradient(135deg,#FFE08A,var(--gold) 50%,var(--gold2));box-shadow:0 6px 18px rgba(255,160,30,.35);transition:transform .15s,opacity .2s;white-space:nowrap}
.buy:active{transform:scale(.94)}
.buy:disabled{opacity:.35;box-shadow:none}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin:8px 0 16px}
.pod{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 6px;overflow:hidden}
.pod .m{font-size:30px}
.pod .n{font-weight:700;font-size:14px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .v{color:var(--gold);font-weight:800;font-size:14px}
.pod.p1{padding:22px 6px;background:linear-gradient(180deg,rgba(255,194,61,.18),var(--card));border-color:rgba(255,194,61,.35);box-shadow:0 10px 30px rgba(255,160,30,.2)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.row .i{width:28px;color:var(--muted);font-weight:800;text-align:center}
.row .n{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-weight:800;color:var(--gold)}
.row.me,.pod.me{border-color:rgba(192,132,252,.6);background:linear-gradient(135deg,rgba(139,92,246,.22),var(--card))}
.sk{height:52px;border-radius:16px;margin-bottom:8px;background:linear-gradient(90deg,var(--card) 0%,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty div{font-size:48px;margin-bottom:8px}
.refresh{border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:700;padding:10px 14px;border-radius:12px;transition:transform .15s}
.refresh:active{transform:scale(.94)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);width:calc(100% - 32px);max-width:440px;display:flex;gap:6px;padding:6px;border-radius:22px;background:rgba(26,23,41,.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 16px 40px rgba(0,0,0,.5);z-index:20}
nav button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:12px;padding:8px 4px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .2s}
nav button span{font-size:20px}
nav button.on{color:#fff;background:linear-gradient(135deg,rgba(139,92,246,.45),rgba(192,132,252,.25));box-shadow:0 4px 16px rgba(139,92,246,.35)}
nav button:active{transform:scale(.94)}
footer{text-align:center;color:rgba(156,150,184,.5);font-size:11px;margin-top:24px}
.toast{position:fixed;left:50%;top:calc(var(--sa-top,0px) + 70px);transform:translate(-50%,-20px);opacity:0;background:var(--card2);border:1px solid rgba(255,194,61,.35);padding:10px 16px;border-radius:14px;font-weight:700;transition:all .25s;z-index:60;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><div class="hello">Bonjour</div><div class="name" id="uname">Joueur</div></div>
    <div class="rank" id="rank">🥉 Bronze</div>
  </header>
  <main>
    <section class="view on" id="v-play">
      <div class="scoreBox">
        <div class="label">Tes pièces</div>
        <div class="score"><i>🪙</i><span id="score">0</span></div>
        <div class="sub">+<b id="pw">1</b> par tape · prochain rang : <b id="next">Argent</b></div>
      </div>
      <div class="coinWrap">
        <div id="coin"><svg viewBox="0 0 100 100"><path d="M50 8l11.8 27.6 29.9 2.6-22.7 19.7 6.8 29.2L50 71.6 24.2 87.1 31 57.9 8.3 38.2l29.9-2.6z" fill="#B86E00" opacity=".75"/></svg></div>
      </div>
      <div class="energy">
        <div class="erow"><span>⚡ Énergie</span><span id="etxt">500 / 500</span></div>
        <div class="bar"><div id="ebar" style="width:100%"></div></div>
      </div>
      <div class="stats">
        <div class="stat"><div class="label">Total gagné</div><b id="tot">0</b></div>
        <div class="stat"><div class="label">Tapes</div><b id="taps">0</b></div>
      </div>
    </section>
    <section class="view" id="v-up">
      <h2>Améliorations</h2>
      <p class="lead">Dépense tes pièces pour taper plus fort et plus longtemps.</p>
      <div id="ups"></div>
    </section>
    <section class="view" id="v-top">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2>Classement</h2><button class="refresh" id="refresh">↻ Actualiser</button>
      </div>
      <p class="lead">Les meilleurs tapeurs, selon le total de pièces gagnées.</p>
      <div id="board"></div>
    </section>
    <footer>Made with SayApp</footer>
  </main>
  <nav>
    <button class="on" data-v="play"><span>🪙</span>Jouer</button>
    <button data-v="up"><span>🚀</span>Bonus</button>
    <button data-v="top"><span>🏆</span>Classement</button>
  </nav>
</div>
<div class="toast" id="toast"></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://jeremstyke.github.io/sayapp/sdk.js" data-app="z3n5r3np" data-full="1"></script>
<script>
window.addEventListener('load', async () => {
  const $ = id => document.getElementById(id);
  const SA = window.SayApp || {user:null,get:async()=>null,set:async()=>{},top:async()=>[],haptic(){}};
  const fmt = n => { n = Math.floor(n); if (n >= 1e6) return (n/1e6).toFixed(n>=1e7?1:2).replace('.',',')+' M'; return n.toLocaleString('fr-FR'); };
  const RANKS = [[0,'🥉 Bronze'],[1000,'🥈 Argent'],[5000,'🥇 Or'],[25000,'💠 Platine'],[100000,'💎 Diamant'],[500000,'👑 Légende']];
  const UPS = [
    {k:'p',ico:'👆',name:"Doigt d'or",desc:'+1 pièce par tape',base:40,mul:1.7},
    {k:'e',ico:'🔋',name:'Grand réservoir',desc:"+250 d'énergie max",base:60,mul:1.8},
    {k:'r',ico:'⚡',name:'Recharge rapide',desc:"+1 d'énergie par seconde",base:120,mul:2}
  ];
  let S = {pts:0,total:0,taps:0,lv:{p:0,e:0,r:0},energy:500,last:Date.now()};
  let dirty = false, shown = 0;
  const power = () => 1 + S.lv.p, maxE = () => 500 + S.lv.e*250, regen = () => 1 + S.lv.r;
  const cost = u => Math.floor(u.base * Math.pow(u.mul, S.lv[u.k]));

  const u = SA.user || {};
  if (u.first_name) $('uname').textContent = u.first_name;

  try {
    const saved = await SA.get('state');
    if (saved && typeof saved === 'object') {
      S = Object.assign(S, saved); S.lv = Object.assign({p:0,e:0,r:0}, saved.lv || {});
      const secs = Math.max(0, (Date.now() - (S.last||Date.now()))/1000);
      S.energy = Math.min(maxE(), S.energy + secs*regen());
    }
  } catch(e) {}
  shown = S.pts;

  function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),1800); }

  function renderStatic(){
    $('pw').textContent = power();
    $('tot').textContent = fmt(S.total);
    $('taps').textContent = fmt(S.taps);
    let r = RANKS[0], nx = null;
    for (let i=0;i<RANKS.length;i++){ if (S.total >= RANKS[i][0]) { r = RANKS[i]; nx = RANKS[i+1]||null; } }
    if ($('rank').textContent !== r[1]) { if (shown && $('rank').dataset.set) toast('Nouveau rang : '+r[1]); $('rank').textContent = r[1]; $('rank').dataset.set=1; }
    $('next').textContent = nx ? nx[1].split(' ')[1]+' ('+fmt(nx[0])+')' : 'maximum';
    renderEnergy();
  }
  function renderEnergy(){
    const m = maxE();
    $('etxt').textContent = Math.floor(S.energy)+' / '+m;
    $('ebar').style.width = (S.energy/m*100)+'%';
    $('coin').classList.toggle('tired', S.energy < power());
  }
  function renderUps(){
    $('ups').innerHTML = UPS.map(x => {
      const c = cost(x);
      return `<div class="up"><div class="ico">${x.ico}</div><div class="t"><b>${x.name}</b><small>${x.desc}</small><div class="lv">NIVEAU ${S.lv[x.k]}</div></div><button class="buy" data-k="${x.k}" ${S.pts<c?'disabled':''}>🪙 ${fmt(c)}</button></div>`;
    }).join('');
  }
  $('ups').addEventListener('click', e => {
    const b = e.target.closest('.buy'); if (!b) return;
    const x = UPS.find(y => y.k === b.dataset.k), c = cost(x);
    if (S.pts < c) { SA.haptic('error'); return; }
    S.pts -= c; S.lv[x.k]++;
    if (x.k === 'e') S.energy = Math.min(maxE(), S.energy + 250);
    dirty = true; SA.haptic('ok'); toast(x.ico+' '+x.name+' niveau '+S.lv[x.k]);
    renderUps(); renderStatic();
  });

  (function tick(){
    shown += (S.pts - shown) * 0.25;
    if (Math.abs(S.pts - shown) < 0.5) shown = S.pts;
    $('score').textContent = fmt(shown);
    requestAnimationFrame(tick);
  })();

  const coin = $('coin');
  let lastHap = 0;
  coin.addEventListener('pointerdown', e => {
    e.preventDefault();
    const p = power();
    if (S.energy < p) { SA.haptic('error'); toast('⚡ Plus d\'énergie, patiente un peu'); return; }
    S.energy -= p; S.pts += p; S.total += p; S.taps++; dirty = true;
    const r = coin.getBoundingClientRect();
    const dx = (e.clientX - r.left)/r.width - .5, dy = (e.clientY - r.top)/r.height - .5;
    coin.style.transition = 'transform .06s';
    coin.style.transform = `rotateX(${-dy*28}deg) rotateY(${dx*28}deg) scale(.94)`;
    setTimeout(()=>{ coin.style.transition='transform .2s ease'; coin.style.transform=''; }, 80);
    const f = document.createElement('div');
    f.className = 'float'; f.textContent = '+'+p;
    f.style.left = e.clientX+'px'; f.style.top = (e.clientY-20)+'px'; f.style.transform='translate(-50%,0)';
    document.body.appendChild(f); setTimeout(()=>f.remove(), 800);
    for (let i=0;i<6;i++){
      const s = document.createElement('div'); s.className='pt';
      const a = Math.random()*Math.PI*2, d = 40+Math.random()*50;
      s.style.left = e.clientX+'px'; s.style.top = e.clientY+'px';
      s.style.setProperty('--x', Math.cos(a)*d+'px'); s.style.setProperty('--y', Math.sin(a)*d+'px');
      document.body.appendChild(s); setTimeout(()=>s.remove(), 600);
    }
    const now = Date.now(); if (now - lastHap > 60) { SA.haptic('tap'); lastHap = now; }
    renderStatic();
  });

  setInterval(() => {
    if (S.energy < maxE()) { S.energy = Math.min(maxE(), S.energy + regen()); renderEnergy(); }
    if ($('v-up').classList.contains('on')) renderUps();
  }, 1000);

  async function save(){
    if (!dirty) return; dirty = false; S.last = Date.now();
    try { await SA.set('state', S); await SA.set('score', Math.floor(S.total)); } catch(e){ dirty = true; }
  }
  setInterval(save, 4000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

  const medal = ['🥇','🥈','🥉'];
  async function loadBoard(){
    const b = $('board');
    b.innerHTML = '<div class="sk"></div>'.repeat(6);
    await save();
    let list = [];
    try { list = await SA.top('score', 30) || []; } catch(e){}
    if (!list.length) { b.innerHTML = '<div class="empty"><div>🏆</div>Personne n\'est encore classé.<br>Tape la pièce et prends la 1re place !</div>'; return; }
    const esc = s => String(s||'Joueur').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
    let html = '';
    if (list.length >= 3) {
      const ord = [1,0,2];
      html += '<div class="podium">' + ord.map(i => `<div class="pod p${i+1} ${list[i].me?'me':''}"><div class="m">${medal[i]}</div><div class="n">${esc(list[i].name)}</div><div class="v">${fmt(list[i].value)}</div></div>`).join('') + '</div>';
    }
    const start = list.length >= 3 ? 3 : 0;
    html += list.slice(start).map((x,j) => { const i = j+start; return `<div class="row ${x.me?'me':''}"><div class="i">${i<3?medal[i]:i+1}</div><div class="n">${esc(x.name)}${x.me?' (toi)':''}</div><div class="v">🪙 ${fmt(x.value)}</div></div>`; }).join('');
    b.innerHTML = html;
  }
  $('refresh').addEventListener('click', () => { SA.haptic('tap'); loadBoard(); });

  document.querySelectorAll('nav button').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === btn));
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-'+btn.dataset.v));
    SA.haptic('tap');
    if (btn.dataset.v === 'up') renderUps();
    if (btn.dataset.v === 'top') loadBoard();
  }));

  renderStatic(); renderUps();
});
</script>
</body>
</html>
