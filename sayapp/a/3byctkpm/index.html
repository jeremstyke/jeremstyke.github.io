<!-- sayapp 3byctkpm v2 -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Coin Tap Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --main:#ffb627;--main2:#ff7a18;--accent:#8b5cf6;--accent2:#c084fc;
  --bg:#0b0a12;--bg2:#14121f;--card:#1a1728;--line:rgba(255,255,255,.07);
  --text:#f6f3ff;--muted:#9a93b5;--ok:#34d399;--green:#22c55e;--green2:#10b981;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Sora',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(120% 70% at 50% 0%,#2a1d4a 0%,var(--bg) 60%);color:var(--text);font-size:15px;user-select:none;-webkit-user-select:none}
.app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto}
header{padding:calc(var(--sa-top,0px) + 8px) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;box-shadow:0 6px 20px rgba(139,92,246,.4);flex-shrink:0}
.who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rank-pill{padding:8px 12px;border-radius:999px;background:rgba(255,182,39,.12);border:1px solid rgba(255,182,39,.3);font-size:12px;font-weight:700;color:var(--main);white-space:nowrap}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 16px 16px;position:relative}
.view{display:none;animation:fade .3s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.score{text-align:center;margin-top:8px}
.score .num{font-size:44px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;gap:10px}
.score .num i{font-style:normal;font-size:34px;filter:drop-shadow(0 4px 12px rgba(255,182,39,.5))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.stat b{display:block;font-size:16px;margin-top:4px}
.coin-wrap{position:relative;display:grid;place-items:center;height:290px;margin:8px 0}
.coin-glow{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,182,39,.35),transparent 65%);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.7}}
#coin{width:240px;height:240px;border-radius:50%;cursor:pointer;position:relative;transition:transform .12s ease;touch-action:manipulation;filter:drop-shadow(0 18px 40px rgba(255,122,24,.45))}
#coin svg{width:100%;height:100%;display:block}
#coin.tired{filter:grayscale(.8) brightness(.6)}
.float{position:fixed;pointer-events:none;font-weight:800;font-size:26px;color:var(--main);text-shadow:0 2px 12px rgba(255,122,24,.8);animation:up .9s ease-out forwards;z-index:50}
@keyframes up{to{transform:translateY(-110px) scale(1.2);opacity:0}}
.spark{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;background:var(--main);z-index:49;transition:transform .6s cubic-bezier(.2,.8,.3,1),opacity .6s}
.energy{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.energy .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.energy .row b{font-size:16px}
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.bar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--main));box-shadow:0 0 14px rgba(255,182,39,.6);transition:width .25s ease}
.btn{border:0;font-family:inherit;font-weight:700;font-size:15px;color:#04210f;background:linear-gradient(135deg,#4ade80,var(--green2));padding:14px 18px;border-radius:16px;cursor:pointer;box-shadow:0 8px 24px rgba(34,197,94,.4);transition:transform .15s,opacity .15s;width:100%}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;box-shadow:none}
.btn.ghost{background:linear-gradient(135deg,#4ade80,var(--green2));color:#04210f;border:0;box-shadow:0 8px 24px rgba(34,197,94,.4);margin-top:12px}
.brand{text-align:center;font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:4px;background:linear-gradient(135deg,var(--main),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:24px;font-weight:800;margin:8px 0 4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.up{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.up .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:linear-gradient(135deg,rgba(139,92,246,.3),rgba(255,182,39,.2));flex-shrink:0}
.up .tx{flex:1;min-width:0}
.up .tx b{display:block;font-size:15px}
.up .tx small{color:var(--muted);font-size:13px}
.up .btn{width:auto;padding:10px 14px;font-size:13px;white-space:nowrap}
.lb{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.lr{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.lr:last-child{border-bottom:0}
.lr.me{background:linear-gradient(90deg,rgba(255,182,39,.14),transparent)}
.pos{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;background:rgba(255,255,255,.06);flex-shrink:0}
.lr .nm{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .vl{font-weight:800;color:var(--main)}
.skel{height:60px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty div{font-size:44px;margin-bottom:8px}
nav{display:flex;gap:8px;padding:8px 16px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(transparent,var(--bg) 30%)}
nav button{flex:1;border:1px solid var(--line);background:var(--bg2);color:var(--muted);font-family:inherit;font-weight:600;font-size:12px;padding:10px 4px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .15s,color .2s,background .2s;cursor:pointer}
nav button span{font-size:20px}
nav button:active{transform:scale(.94)}
nav button.on{color:var(--text);background:linear-gradient(135deg,rgba(139,92,246,.35),rgba(255,182,39,.18));border-color:rgba(255,182,39,.35)}
.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);opacity:0;background:#241f38;border:1px solid var(--line);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;transition:all .25s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;font-size:11px;color:rgba(154,147,181,.5);padding:16px 0 4px}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100;transition:opacity .3s}
.loading div{font-size:56px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotateY(360deg)}}
</style>
</head>
<body>
<div class="loading" id="loading"><div>🪙</div></div>
<div class="app">
  <header>
    <div class="who">
      <div class="avatar" id="av">?</div>
      <div><span class="label">Joueur</span><b id="uname">Toi</b></div>
    </div>
    <div class="rank-pill" id="league">🥉 Bronze</div>
  </header>
  <main>
    <section class="view on" id="v-play">
      <h1 class="brand">Coin Tap Pro</h1>
      <div class="score">
        <span class="label">Tes points</span>
        <div class="num"><i>🪙</i><span id="pts">0</span></div>
      </div>
      <div class="stats">
        <div class="stat"><span class="label">Par tap</span><b id="sTap">+1</b></div>
        <div class="stat"><span class="label">Recharge</span><b id="sReg">2/s</b></div>
        <div class="stat"><span class="label">Total</span><b id="sTot">0</b></div>
      </div>
      <div class="coin-wrap">
        <div class="coin-glow"></div>
        <div id="coin">
          <svg viewBox="0 0 200 200">
            <defs>
              <radialGradient id="g1" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fff3b0"/><stop offset=".45" stop-color="#ffc83d"/><stop offset="1" stop-color="#e0680f"/></radialGradient>
              <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffdd6b"/><stop offset="1" stop-color="#b8500a"/></linearGradient>
            </defs>
            <circle cx="100" cy="100" r="96" fill="url(#g2)"/>
            <circle cx="100" cy="100" r="84" fill="url(#g1)"/>
            <circle cx="100" cy="100" r="70" fill="none" stroke="#c66a10" stroke-width="3" stroke-dasharray="4 6" opacity=".6"/>
            <path d="M100 52l13 28 30 4-22 21 6 30-27-15-27 15 6-30-22-21 30-4z" fill="#b8500a" opacity=".85"/>
            <path d="M100 56l11 25 27 3-20 19 5 27-23-13" fill="#ffe58a" opacity=".5"/>
            <ellipse cx="72" cy="58" rx="26" ry="12" fill="#fff" opacity=".35" transform="rotate(-30 72 58)"/>
          </svg>
        </div>
      </div>
      <div class="energy">
        <div class="row"><span class="label">⚡ Énergie</span><b><span id="eNow">0</span> / <span id="eMax">0</span></b></div>
        <div class="bar"><span id="eBar" style="width:0%"></span></div>
        <button class="btn ghost" id="adBtn">🎬 Recharge complète gratuite</button>
      </div>
    </section>

    <section class="view" id="v-boost">
      <h2>Boosts</h2>
      <p class="sub">Dépense tes points pour taper plus fort et plus longtemps.</p>
      <div id="ups"></div>
    </section>

    <section class="view" id="v-top">
      <h2>Classement</h2>
      <p class="sub">Les meilleurs tapeurs, selon le total de points gagnés.</p>
      <div class="lb" id="lb"></div>
    </section>
    <footer>Made with SayApp</footer>
  </main>
  <nav>
    <button class="on" data-v="play"><span>🪙</span>Jouer</button>
    <button data-v="boost"><span>🚀</span>Boosts</button>
    <button data-v="top"><span>🏆</span>Classement</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://jeremstyke.github.io/sayapp/sdk.js" data-app="3byctkpm" data-full="1"></script>
<script>
window.addEventListener('load', async () => {
  try { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } catch (e) {}
  const $ = id => document.getElementById(id);
  const S = {points:0,total:0,energy:1000,lvTap:0,lvMax:0,lvRegen:0,ts:Date.now()};
  const maxE = () => 1000 + 500 * S.lvMax;
  const tapP = () => 1 + S.lvTap;
  const regen = () => 2 + S.lvRegen;
  const fmt = n => Math.floor(n).toLocaleString('fr-FR');
  const LEAGUES = [[0,'🥉 Bronze'],[5000,'🥈 Argent'],[25000,'🥇 Or'],[100000,'💠 Platine'],[500000,'💎 Diamant']];
  const UPS = [
    {k:'lvTap',ic:'👆',t:'Doigt d\'or',d:l=>`+1 point par tap (niv. ${l})`,c:l=>Math.round(200*Math.pow(2,l))},
    {k:'lvMax',ic:'🔋',t:'Grosse batterie',d:l=>`+500 énergie max (niv. ${l})`,c:l=>Math.round(300*Math.pow(1.9,l))},
    {k:'lvRegen',ic:'⚡',t:'Recharge turbo',d:l=>`+1 énergie par seconde (niv. ${l})`,c:l=>Math.round(400*Math.pow(2.1,l))}
  ];
  let dirty = false, shown = 0;

  const u = (window.SayApp && SayApp.user) || {};
  $('uname').textContent = u.first_name || 'Toi';
  $('av').textContent = (u.first_name || 'T')[0].toUpperCase();

  try {
    const d = await SayApp.get('state');
    if (d && typeof d === 'object') Object.assign(S, d);
  } catch (e) {}
  const away = Math.max(0, (Date.now() - (S.ts || Date.now())) / 1000);
  S.energy = Math.min(maxE(), S.energy + away * regen());
  shown = S.points;
  $('loading').style.opacity = 0;
  setTimeout(() => $('loading').remove(), 300);

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 1800);
  }

  function render() {
    $('eNow').textContent = fmt(S.energy);
    $('eMax').textContent = fmt(maxE());
    $('eBar').style.width = (S.energy / maxE() * 100) + '%';
    $('sTap').textContent = '+' + tapP();
    $('sReg').textContent = regen() + '/s';
    $('sTot').textContent = fmt(S.total);
    let lg = LEAGUES[0][1];
    LEAGUES.forEach(l => { if (S.total >= l[0]) lg = l[1]; });
    $('league').textContent = lg;
    $('coin').classList.toggle('tired', S.energy < tapP());
    $('adBtn').disabled = S.energy >= maxE();
  }

  (function anim() {
    const diff = S.points - shown;
    shown = Math.abs(diff) < 1 ? S.points : shown + diff * 0.2;
    $('pts').textContent = fmt(shown);
    requestAnimationFrame(anim);
  })();

  const coin = $('coin');
  coin.addEventListener('pointerdown', e => {
    e.preventDefault();
    const p = tapP();
    if (S.energy < p) { SayApp.haptic('error'); toast('⚡ Plus d\'énergie, patiente un peu'); return; }
    S.energy -= p; S.points += p; S.total += p; dirty = true;
    const r = coin.getBoundingClientRect();
    const dx = (e.clientX - r.left - r.width / 2) / r.width;
    const dy = (e.clientY - r.top - r.height / 2) / r.height;
    coin.style.transform = `perspective(500px) rotateY(${dx * 30}deg) rotateX(${-dy * 30}deg) scale(.94)`;
    clearTimeout(coin.h); coin.h = setTimeout(() => coin.style.transform = '', 120);
    const f = document.createElement('div');
    f.className = 'float'; f.textContent = '+' + p;
    f.style.left = (e.clientX - 16) + 'px'; f.style.top = (e.clientY - 30) + 'px';
    document.body.appendChild(f); setTimeout(() => f.remove(), 900);
    for (let i = 0; i < 5; i++) {
      const s = document.createElement('div');
      s.className = 'spark';
      s.style.left = e.clientX + 'px'; s.style.top = e.clientY + 'px';
      if (i % 2) s.style.background = '#c084fc';
      document.body.appendChild(s);
      const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 50;
      requestAnimationFrame(() => { s.style.transform = `translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.3)`; s.style.opacity = 0; });
      setTimeout(() => s.remove(), 650);
    }
    const now = Date.now();
    if (!coin.lastH || now - coin.lastH > 80) { SayApp.haptic('tap'); coin.lastH = now; }
    render();
  });

  setInterval(() => {
    if (S.energy < maxE()) { S.energy = Math.min(maxE(), S.energy + regen()); dirty = true; render(); }
  }, 1000);

  async function save() {
    if (!dirty) return;
    dirty = false; S.ts = Date.now();
    try { await SayApp.set('state', S); await SayApp.set('score', Math.floor(S.total)); } catch (e) { dirty = true; }
  }
  setInterval(save, 4000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

  $('adBtn').addEventListener('click', async () => {
    SayApp.haptic('tap');
    const b = $('adBtn'); b.disabled = true; b.textContent = '⏳ Chargement…';
    let ok = false;
    try { ok = await SayApp.ad(); } catch (e) {}
    b.textContent = '🎬 Recharge complète gratuite';
    if (ok) { S.energy = maxE(); dirty = true; SayApp.haptic('ok'); toast('🔋 Énergie rechargée à fond !'); save(); }
    else toast('Aucune vidéo dispo pour le moment');
    render();
  });

  function renderUps() {
    $('ups').innerHTML = UPS.map((x, i) => {
      const l = S[x.k], c = x.c(l);
      return `<div class="up"><div class="ic">${x.ic}</div><div class="tx"><b>${x.t}</b><small>${x.d(l)}</small></div>
      <button class="btn" data-i="${i}" ${S.points < c ? 'disabled' : ''}>🪙 ${fmt(c)}</button></div>`;
    }).join('');
  }
  $('ups').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const x = UPS[+b.dataset.i], c = x.c(S[x.k]);
    if (S.points < c) { SayApp.haptic('error'); return; }
    S.points -= c; S[x.k]++; dirty = true;
    if (x.k === 'lvMax') S.energy = Math.min(maxE(), S.energy + 500);
    SayApp.haptic('ok'); toast('✨ ' + x.t + ' niveau ' + S[x.k]);
    renderUps(); render(); save();
  });

  async function renderTop() {
    const lb = $('lb');
    lb.innerHTML = '<div class="skel"></div>'.repeat(5);
    await save();
    let rows = [];
    try { rows = await SayApp.top('score', 20) || []; } catch (e) {}
    if (!rows.length) { lb.innerHTML = '<div class="empty"><div>🏆</div>Personne au classement pour l\'instant.<br>Tape la pièce et sois le premier !</div>'; return; }
    const medal = ['🥇','🥈','🥉'];
    lb.innerHTML = rows.map((r, i) => `<div class="lr ${r.me ? 'me' : ''}"><div class="pos">${medal[i] || i + 1}</div>
      <div class="nm"></div><div class="vl">${fmt(r.value || 0)}</div></div>`).join('');
    lb.querySelectorAll('.nm').forEach((n, i) => n.textContent = (rows[i].name || 'Joueur') + (rows[i].me ? ' (toi)' : ''));
  }

  document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
    SayApp.haptic('tap');
    document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
    $('v-' + b.dataset.v).classList.add('on');
    if (b.dataset.v === 'boost') renderUps();
    if (b.dataset.v === 'top') renderTop();
  }));

  render();
});
</script>
</body>
</html>
