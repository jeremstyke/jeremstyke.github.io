<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__NAME__</title>
<!-- SayApp template "Pass the baton" (2 nov 2026). Engine: SayApp.game(state | take | pass_link | pass_random | top). Virtual points only. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--c:__C1__;--bg:#0b0a10;--card:rgba(255,255,255,.05);--card2:rgba(255,255,255,.09);--line:rgba(255,255,255,.09);--fg:#f6f4ff;--mute:#a6a3b8;--dim:#6f6c82;--good:#3ee08f;--warn:#ffcc4d;--tab:64px;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(var(--tab) + 20px + env(safe-area-inset-bottom,0px));overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body::before{content:"";position:fixed;inset:-20% -20% auto;height:70vh;background:radial-gradient(60% 60% at 50% 0%,color-mix(in srgb,var(--c) 38%,transparent),transparent 70%);pointer-events:none;z-index:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,.sora{font-family:Sora,Inter,sans-serif}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand i{flex:0 0 38px;height:38px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:20px;background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 45%,#000));box-shadow:0 8px 24px -8px var(--c)}
.brand h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:0 0 auto;padding:7px 12px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:13px}
.bal{text-align:center;margin:6px 0 18px}
.bal small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
.bal b{display:block;font:800 42px/1.1 Sora,sans-serif;margin-top:4px;background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--c) 55%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent}
.bal span{font-size:13px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;position:relative;overflow:hidden}
.hero{text-align:center;padding:24px 20px 20px}
.ring{position:relative;width:200px;height:200px;margin:0 auto 14px}
.ring::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 26%,transparent),transparent)}
.ring svg{position:relative;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .bg{stroke:rgba(255,255,255,.07)}
.ring .fg{stroke:var(--c);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.baton{font-size:52px;line-height:1;animation:bob 2.4s ease-in-out infinite}
.idle .baton{animation:none;filter:grayscale(.6);opacity:.55}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-6px) rotate(8deg)}}
.ring .tm{font:700 20px Sora,sans-serif;margin-top:8px;font-variant-numeric:tabular-nums}
.ring .lb{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em}
.hero h2{font-size:21px;margin-bottom:6px}
.hero p{color:var(--mute);font-size:14px;max-width:320px;margin:0 auto}
.earn{display:inline-flex;gap:6px;align-items:center;margin-top:12px;padding:8px 14px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);font-weight:700;font-variant-numeric:tabular-nums}
.acts{display:grid;gap:10px;margin-top:18px}
.cta{width:100%;padding:16px;border-radius:16px;font:700 16px Sora,sans-serif;color:#fff;background:linear-gradient(120deg,var(--c),color-mix(in srgb,var(--c) 55%,#ff3d9a));box-shadow:0 14px 30px -12px var(--c);transition:transform .15s}
.cta:active,.ghost:active,.tabs button:active{transform:scale(.97)}
.cta:disabled{opacity:.5}
.ghost{width:100%;padding:14px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:600;transition:transform .15s}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.st{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.st b{display:block;font:700 19px Sora,sans-serif}
.st span{font-size:11.5px;color:var(--mute)}
.sec{margin-top:22px}
.sec h3{font:600 12px Inter,sans-serif;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
.rules{display:grid;gap:8px}
.rule{display:flex;gap:12px;align-items:flex-start;padding:13px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.rule i{flex:0 0 32px;height:32px;border-radius:10px;display:grid;place-items:center;font-style:normal;background:var(--card2)}
.rule div{min-width:0;font-size:13.5px;color:var(--mute)}
.rule b{display:block;color:var(--fg);font-size:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.row.me{border-color:color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent)}
.row em{flex:0 0 30px;font:700 15px Sora,sans-serif;font-style:normal;color:var(--mute);text-align:center}
.row span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.row b{font-variant-numeric:tabular-nums}
.inv{text-align:center;padding:26px 20px}
.inv .big{font-size:46px}
.inv h2{font-size:22px;margin:8px 0 6px}
.inv p{color:var(--mute);font-size:14px}
.code{margin:16px 0 4px;padding:12px;border-radius:14px;background:#0f0e16;border:1px dashed var(--line);font-size:12.5px;color:var(--mute);word-break:break-all}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:6px;justify-content:center;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));background:rgba(11,10,16,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabs button{flex:1;max-width:170px;padding:10px 6px;border-radius:14px;color:var(--mute);font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s}
.tabs button i{font-style:normal;font-size:19px}
.tabs button.on{background:var(--card2);color:var(--fg)}
[hidden]{display:none!important}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);z-index:20;max-width:92vw;padding:12px 16px;border-radius:14px;background:#1b1a24;border:1px solid var(--line);font-weight:600;font-size:14px;box-shadow:0 14px 40px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
.toast.on{transform:translate(-50%,0)}
.float{position:fixed;z-index:15;font:800 22px Sora,sans-serif;color:var(--good);pointer-events:none;animation:up 1.1s ease-out forwards}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-70px)}}
.skel{opacity:.35}
.foot{text-align:center;color:var(--dim);font-size:11.5px;margin:24px 0 6px}
.foot a{color:var(--mute);text-decoration:none}
.note{text-align:center;color:var(--dim);font-size:11.5px;margin-top:10px}
</style>
</head>
<body>
<main>
  <div class="top"><div class="brand"><i>🏃</i><h1 id="nm">__NAME__</h1></div><div class="pill" id="rank">#-</div></div>

  <section id="vHome">
    <div class="bal"><small id="lBal"></small><b id="bal">0</b><span>$__TOKEN__</span></div>
    <div class="card hero" id="hero">
      <div class="ring"><svg viewBox="0 0 200 200"><circle class="bg" cx="100" cy="100" r="88"/><circle class="fg" id="arc" cx="100" cy="100" r="88" stroke-dasharray="553" stroke-dashoffset="553"/></svg>
        <div class="in"><div class="baton">🏃</div><div class="tm" id="tm">--:--</div><div class="lb" id="tmL"></div></div></div>
      <h2 id="hT"></h2><p id="hP"></p>
      <div class="earn" id="earn" hidden></div>
      <div class="acts" id="acts"></div>

    <div class="stats"><div class="st"><b id="sStreak">0</b><span id="lStreak"></span></div><div class="st"><b id="sPass">0</b><span id="lPass"></span></div><div class="st"><b id="sInv">0</b><span id="lInv"></span></div></div>
    <div class="sec"><h3 id="lHow"></h3><div class="rules" id="rules"></div></div>
    <p class="note" id="noCash"></p>
  </section>

  <section id="vTop" hidden><div class="sec" style="margin-top:4px"><h3 id="lTop"></h3><div id="topList"></div></div></section>

  <section id="vInv" hidden>
    <div class="card inv"><div class="big">🤝</div><h2 id="iT"></h2><p id="iP"></p><div class="code" id="invLink">…</div>
      <div class="acts"><button class="cta" id="iShare"></button><button class="ghost" id="iCopy"></button></div></div>
  </section>

  <p class="foot">Made with SayApp</p>
</main>

<nav class="tabs"><button class="on" id="tHome"><i>🏃</i><span id="lHome"></span></button><button id="tTop"><i>🏆</i><span id="lRank"></span></button><button id="tInv"><i>🤝</i><span id="lInvT"></span></button></nav>
<div class="toast" id="toast"></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://jeremstyke.github.io/sayapp/sdk.js" data-app="__APP__"></script>

    welcome: 'Welcome! +500 ' + TK + ' for you 🎁', invited: 'Welcome! +500 ' + TK + ' thanks to your friend 🎁', got: 'Someone passed you the baton! 🏃 Hold it and earn', taken: 'Too late, someone already took this baton.', dropped: 'Your baton fell: you kept half.',

    shareTxt: function (n) { return '🏃 I am passing you my baton in ' + n + '! Grab it fast and earn ' + TK + '.'; }, invTxt: function (n) { return '🏃 Come play ' + n + ' with me, we earn ' + TK + ' by passing the baton!'; },
    iT: 'Invite your friends', iP: '+1000 ' + TK + ' for you and +500 for your friend when they join.', share: '📨 Share my link', copy: 'Copy the link', copied: 'Link copied ✅', topT: 'Top players', you: 'you', err: 'Oops, try again in a moment.', noCash: TK + ' are game points with no cash value.'
  };
  var S = null, skew = 0, busy = false, toastT;
  var fmt = function (n) { return Number(n || 0).toLocaleString(fr ? 'fr-FR' : 'en-US'); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('on'); }, 2800); }
  function floatUp(txt, el) { var r = (el || $('bal')).getBoundingClientRect(), f = document.createElement('div'); f.className = 'float'; f.textContent = txt; f.style.left = (r.left + r.width / 2 - 30) + 'px'; f.style.top = (r.top) + 'px'; document.body.appendChild(f); setTimeout(function () { f.remove(); }, 1200); }
  function countTo(el, to) { var from = Number(el.getAttribute('data-v') || 0), t0 = performance.now(); el.setAttribute('data-v', to); (function step(t) { var k = Math.min(1, (t - t0) / 700), v = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3))); el.textContent = fmt(v); if (k < 1) requestAnimationFrame(step); })(t0); }
  function share(url, txt) { var u = 'https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(txt); try { tw.openTelegramLink(u); } catch (e) { location.href = u; } }

  ['lBal:bal', 'lStreak:streak', 'lPass:pass', 'lInv:inv', 'lHow:how', 'lHome:home', 'lRank:rank', 'lInvT:invT', 'iT:iT', 'iP:iP', 'iShare:share', 'iCopy:copy', 'lTop:topT', 'noCash:noCash'].forEach(function (p) { var k = p.split(':'); $(k[0]).textContent = T[k[1]]; });

  function bonusFor(st) { return 100 * Math.min((S && S.streak ? S.streak : 0) + 1, 7); }
  function paint() {
    if (!S) return;
    countTo($('bal'), S.bal); $('rank').textContent = '#' + S.rank + ' / ' + fmt(S.players);
    $('sStreak').textContent = S.streak; $('sPass').textContent = fmt(S.passes); $('sInv').textContent = fmt(S.invited);
    var r2 = T.r2(S.rate, S.maxh);
    $('rules').innerHTML = [['📅', T.r1], ['💰', r2], ['⏳', T.r3], ['🤝', T.r4]].map(function (r) { return '<div class="rule"><i>' + r[0] + '</i><div><b>' + esc(r[1][0]) + '</b>' + esc(r[1][1]) + '</div></div>'; }).join('');

      acts.innerHTML = '<button class="cta" id="aLink">' + esc(T.pLink) + '</button><button class="ghost" id="aRand">' + esc(T.pRand) + '</button>';
      $('aLink').onclick = function () { act('pass_link'); }; $('aRand').onclick = function () { act('pass_random'); };
    } else if (S.can_take) {
      var b = bonusFor(); $('hT').textContent = T.takeT; $('hP').textContent = T.takeP(b); $('earn').hidden = true;
      acts.innerHTML = '<button class="cta" id="aTake">' + esc(T.take(b)) + '</button>'; $('aTake').onclick = function () { act('take'); };

      $('hT').textContent = T.waitT; $('hP').textContent = T.waitP; $('earn').hidden = true;

      var h = Math.floor(left / 3600), m = Math.floor(left % 3600 / 60), s = Math.floor(left % 60);

      var d = new Date(now), mid = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() + 1), l2 = Math.max(0, (mid - now) / 1000);

      else { $('tm').textContent = Math.floor(l2 / 3600) + ':' + String(Math.floor(l2 % 3600 / 60)).padStart(2, '0') + ':' + String(Math.floor(l2 % 60)).padStart(2, '0'); $('tmL').textContent = T.next; arc.style.strokeDashoffset = String(C); }
    }

    if (w === 'Top') SayApp.game('top').then(function (r) {
      if (!r || !r.ok) return; apply(r);
      $('topList').innerHTML = (r.top || []).map(function (p, i) { return '<div class="row' + (p.me ? ' me' : '') + '"><em>' + (i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1) + '</em><span>' + esc(p.name) + (p.me ? ' (' + esc(T.you) + ')' : '') + '</span><b>' + fmt(p.bal) + '</b></div>'; }).join('');
    });
  }
  $('tHome').onclick = function () { tab('Home'); }; $('tTop').onclick = function () { tab('Top'); }; $('tInv').onclick = function () { tab('Inv'); };
  $('iShare').onclick = function () { if (S) share(S.invite, T.invTxt(NAME)); };
  $('iCopy').onclick = function () { if (!S) return; try { navigator.clipboard.writeText(S.invite).then(function () { toast(T.copied); }); } catch (e) { toast(S.invite); } };
  var j = (new URLSearchParams(location.search).get('j') || '').toLowerCase();
  load(/^[br][a-z0-9]{1,16}$/.test(j) ? j : null);
});
</script>
