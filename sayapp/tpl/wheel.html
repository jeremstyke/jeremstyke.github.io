<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__NAME__</title>
<!-- SayApp template "Lucky wheel" (2 nov 2026). One spin every 4 hours. Saves with SayApp.set, leaderboard with SayApp.top('score'). Virtual points only. -->
<!-- tpl-ideas: {"fr":["Ajoute une case jackpot plus rare","Ajoute un tour bonus pour 7 jours de suite","Ajoute des effets de confettis dorés","Ajoute l'historique des 10 derniers tours"],"en":["Add a rarer jackpot slice","Add a bonus spin for a 7 day streak","Add golden confetti effects","Add the history of the last 10 spins"]} -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--c:__C1__;--bg:#0b0a10;--card:rgba(255,255,255,.05);--card2:rgba(255,255,255,.09);--line:rgba(255,255,255,.09);--fg:#f6f4ff;--mute:#a6a3b8;--dim:#6f6c82;--gold:#ffd166;--tab:64px;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(var(--tab) + 20px + env(safe-area-inset-bottom,0px));overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body::before{content:"";position:fixed;inset:-20% -20% auto;height:70vh;background:radial-gradient(60% 60% at 50% 0%,color-mix(in srgb,var(--c) 38%,transparent),transparent 70%);pointer-events:none;z-index:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand i{flex:0 0 38px;height:38px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:20px;background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 45%,#000));box-shadow:0 8px 24px -8px var(--c)}
.brand h1{font:700 18px Sora,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:0 0 auto;padding:7px 12px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:13px}
.bal{text-align:center;margin:8px 0 10px}
.bal small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
.bal b{display:block;font:800 42px/1.1 Sora,sans-serif;margin-top:4px;background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--c) 55%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.bal span{font-size:13px;color:var(--mute)}
.wheelbox{position:relative;width:300px;max-width:86vw;aspect-ratio:1;margin:8px auto 0}
.wheelbox::before{content:"";position:absolute;inset:-16px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 30%,transparent),transparent)}
.wheel{position:relative;width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 8px #191722,0 0 0 10px color-mix(in srgb,var(--c) 60%,transparent),0 30px 60px -20px var(--c);transition:transform 4.2s cubic-bezier(.12,.75,.08,1)}
.wheel svg{width:100%;height:100%;display:block}
.wheel text{font:800 15px Sora,sans-serif;fill:#fff}
.pin{position:absolute;left:50%;top:-14px;transform:translateX(-50%);z-index:2;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:28px solid var(--gold);filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.hub{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--gold) 45%,#b07d10);box-shadow:0 6px 18px rgba(0,0,0,.5);display:grid;place-items:center;font-size:26px;z-index:2}
.spin{display:block;width:100%;margin-top:26px;padding:17px;border-radius:16px;font:800 17px Sora,sans-serif;color:#fff;background:linear-gradient(120deg,var(--c),color-mix(in srgb,var(--c) 55%,#ff3d9a));box-shadow:0 14px 30px -12px var(--c);transition:transform .15s}
.spin:active{transform:scale(.97)}
.spin:disabled{opacity:.45;box-shadow:none}
.next{text-align:center;margin-top:10px;color:var(--mute);font-size:13.5px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.st{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.st b{display:block;font:700 18px Sora,sans-serif}
.st span{font-size:11.5px;color:var(--mute)}
.sec h3{font:600 12px Inter,sans-serif;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin:18px 0 10px}
.lb{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.lb.me{border-color:color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent)}
.lb em{flex:0 0 30px;font:700 15px Sora,sans-serif;font-style:normal;color:var(--mute);text-align:center}
.lb span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.lb b{font-variant-numeric:tabular-nums}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:6px;justify-content:center;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));background:rgba(11,10,16,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabs button{flex:1;max-width:170px;padding:10px 6px;border-radius:14px;color:var(--mute);font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button i{font-style:normal;font-size:19px}
.tabs button.on{background:var(--card2);color:var(--fg)}
[hidden]{display:none!important}
.win{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(5,4,10,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .25s}
.win.on{opacity:1;pointer-events:auto}
.win div{text-align:center;padding:30px 26px;border-radius:26px;background:#15131d;border:1px solid var(--line);min-width:250px;transform:scale(.85);transition:transform .3s cubic-bezier(.2,1.4,.4,1)}
.win.on div{transform:scale(1)}
.win i{display:block;font-style:normal;font-size:52px}
.win b{display:block;font:800 36px Sora,sans-serif;margin:6px 0 2px;color:var(--gold)}
.win span{color:var(--mute)}
.conf{position:fixed;top:-12px;width:9px;height:14px;z-index:31;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.6}}
.foot{text-align:center;color:var(--dim);font-size:11.5px;margin:24px 0 6px}
.note{text-align:center;color:var(--dim);font-size:11.5px;margin-top:12px}
</style>
</head>
<body>
<main>
  <div class="top"><div class="brand"><i>🎡</i><h1 id="nm">__NAME__</h1></div><div class="pill" id="rank">#-</div></div>
  <section id="vWheel">
    <div class="bal"><small id="lBal"></small><b id="bal">0</b><span>$__TOKEN__</span></div>
    <div class="wheelbox"><div class="pin"></div><div class="wheel" id="wheel"><svg viewBox="-150 -150 300 300" id="svg"></svg></div><div class="hub">🎁</div></div>
    <button class="spin" id="spin"></button>
    <div class="next" id="next"></div>
    <div class="stats"><div class="st"><b id="sSp">0</b><span id="lSp"></span></div><div class="st"><b id="sBest">0</b><span id="lBest"></span></div><div class="st"><b id="sStr">0</b><span id="lStr"></span></div></div>
    <p class="note" id="noCash"></p>
  </section>
  <section id="vTop" hidden><div class="sec"><h3 id="lTop"></h3><div id="topList"></div></div></section>
  <p class="foot">Made with SayApp</p>
</main>
<nav class="tabs"><button class="on" id="tWheel"><i>🎡</i><span id="nWheel"></span></button><button id="tTop"><i>🏆</i><span id="nTop"></span></button></nav>
<div class="win" id="win"><div><i id="wI">🎉</i><b id="wB">+0</b><span id="wS"></span></div></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://jeremstyke.github.io/sayapp/sdk.js" data-app="__APP__"></script>
<script>
window.addEventListener('load', function () {
  var $ = function (id) { return document.getElementById(id); };
  var TK = '$__TOKEN__', EVERY = 4 * 3600 * 1000;
  var fr = /^fr/.test(String((SayApp.user && SayApp.user.language_code) || navigator.language || ''));
  var T = fr ? { bal: 'Ton solde', spin: '🎡 Tourner la roue', wait: 'Prochain tour dans ', ready: 'Un tour gratuit toutes les 4 heures', sp: 'tours', best: 'meilleur gain', str: 'jours de suite', wheel: 'Roue', top: 'Classement', topT: 'Meilleurs joueurs', you: 'toi', won: 'gagnés !', jack: 'JACKPOT !', streakB: function (n) { return 'Bonus de série x' + n; }, noCash: 'Les ' + TK + ' sont des points du jeu, sans valeur en argent.' }
             : { bal: 'Your balance', spin: '🎡 Spin the wheel', wait: 'Next spin in ', ready: 'One free spin every 4 hours', sp: 'spins', best: 'best win', str: 'day streak', wheel: 'Wheel', top: 'Ranking', topT: 'Top players', you: 'you', won: 'won!', jack: 'JACKPOT!', streakB: function (n) { return 'Streak bonus x' + n; }, noCash: TK + ' are game points with no cash value.' };
  // slices: value, weight
  var SL = [[100, 22], [250, 18], [50, 22], [500, 12], [150, 20], [1000, 6], [75, 22], [5000, 1]];
  var S = { bal: 0, score: 0, last: 0, spins: 0, best: 0, day: '', streak: 0 }, rot = 0, busy = false;
  var fmt = function (n) { return Math.floor(n).toLocaleString(fr ? 'fr-FR' : 'en-US'); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  (function draw() {
    var n = SL.length, a = 2 * Math.PI / n, h = '';
    for (var i = 0; i < n; i++) {
      var a0 = i * a - Math.PI / 2 - a / 2, a1 = a0 + a, r = 140;
      var x0 = Math.cos(a0) * r, y0 = Math.sin(a0) * r, x1 = Math.cos(a1) * r, y1 = Math.sin(a1) * r;
      var fill = SL[i][0] === 5000 ? 'var(--gold)' : (i % 2 ? 'color-mix(in srgb,var(--c) 55%,#000)' : 'var(--c)');
      h += '<path d="M0 0 L' + x0 + ' ' + y0 + ' A' + r + ' ' + r + ' 0 0 1 ' + x1 + ' ' + y1 + ' Z" fill="' + fill + '" stroke="rgba(255,255,255,.18)" stroke-width="2"/>';
      var am = (a0 + a1) / 2, tx = Math.cos(am) * 92, ty = Math.sin(am) * 92, deg = am * 180 / Math.PI + 90;
      h += '<text x="' + tx + '" y="' + ty + '" text-anchor="middle" dominant-baseline="middle" transform="rotate(' + deg + ' ' + tx + ' ' + ty + ')"' + (SL[i][0] === 5000 ? ' style="fill:#2a1c00"' : '') + '>' + (SL[i][0] === 5000 ? '★5K' : SL[i][0]) + '</text>';
    }
    $('svg').innerHTML = h;
  })();
  function pick() { var tot = SL.reduce(function (s, x) { return s + x[1]; }, 0), r = Math.random() * tot; for (var i = 0; i < SL.length; i++) { r -= SL[i][1]; if (r < 0) return i; } return 0; }
  function paint() {
    $('bal').textContent = fmt(S.bal); $('sSp').textContent = fmt(S.spins); $('sBest').textContent = fmt(S.best); $('sStr').textContent = S.streak;
    var left = S.last + EVERY - Date.now();
    $('spin').disabled = busy || left > 0;
    if (left > 0) { var h = Math.floor(left / 3600000), m = Math.floor(left % 3600000 / 60000), s = Math.floor(left % 60000 / 1000); $('next').textContent = T.wait + h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); }
    else $('next').textContent = T.ready;
  }
  function confetti() { for (var i = 0; i < 40; i++) { var c = document.createElement('i'); c.className = 'conf'; c.style.left = Math.random() * 100 + 'vw'; c.style.background = ['#ffd166', 'var(--c)', '#fff', '#3ee08f'][i % 4]; c.style.animationDelay = Math.random() * .4 + 's'; document.body.appendChild(c); setTimeout(function (x) { x.remove(); }.bind(null, c), 2400); } }
  $('spin').onclick = function () {
    if (busy || S.last + EVERY > Date.now()) return;
    busy = true; SayApp.haptic('tap'); paint();
    var i = pick(), n = SL.length, seg = 360 / n;
    rot += 360 * 6 + (360 - ((rot % 360) + i * seg) % 360) + (Math.random() - .5) * seg * .6;
    $('wheel').style.transform = 'rotate(' + rot + 'deg)';
    setTimeout(function () {
      var td = new Date().toISOString().slice(0, 10), y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
      if (S.day !== td) { S.streak = S.day === y ? S.streak + 1 : 1; S.day = td; }
      var mult = Math.min(S.streak, 3), v = SL[i][0] * mult;
      S.bal += v; S.score += v; S.spins++; S.best = Math.max(S.best, v); S.last = Date.now(); busy = false;
      SayApp.set('w', S); SayApp.set('score', Math.floor(S.score));
      SayApp.haptic('ok'); if (SL[i][0] >= 1000) confetti();
      $('wI').textContent = SL[i][0] === 5000 ? '💰' : '🎉'; $('wB').textContent = '+' + fmt(v) + ' ' + TK; $('wS').textContent = (SL[i][0] === 5000 ? T.jack + ' ' : '') + (mult > 1 ? T.streakB(mult) : T.won);
      $('win').classList.add('on'); paint();
    }, 4300);
  };
  $('win').onclick = function () { $('win').classList.remove('on'); };
  function tab(w) {
    ['Wheel', 'Top'].forEach(function (k) { $('v' + k).hidden = k !== w; $('t' + k).classList.toggle('on', k === w); });
    window.scrollTo(0, 0); SayApp.haptic('tap');
    if (w === 'Top') SayApp.top('score', 30).then(function (rows) {
      $('topList').innerHTML = rows.map(function (p, i) { return '<div class="lb' + (p.me ? ' me' : '') + '"><em>' + (i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1) + '</em><span>' + esc(p.name) + (p.me ? ' (' + esc(T.you) + ')' : '') + '</span><b>' + fmt(p.value) + '</b></div>'; }).join('');
    });
  }
  $('tWheel').onclick = function () { tab('Wheel'); }; $('tTop').onclick = function () { tab('Top'); };
  ['lBal:bal', 'spin:spin', 'lSp:sp', 'lBest:best', 'lStr:str', 'nWheel:wheel', 'nTop:top', 'lTop:topT', 'noCash:noCash'].forEach(function (p) { var k = p.split(':'); $(k[0]).textContent = T[k[1]]; });
  setInterval(paint, 1000);
  SayApp.get('w').then(function (v) { if (v && typeof v === 'object') for (var k in S) if (v[k] !== undefined) S[k] = v[k]; paint(); SayApp.top('score', 30).then(function (rows) { rows.forEach(function (r, i) { if (r.me) $('rank').textContent = '#' + (i + 1); }); }); });
  paint();
});
</script>
</body>
</html>
