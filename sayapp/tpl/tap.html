<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__NAME__</title>
<!-- SayApp template "Tap to earn" (2 nov 2026). Saves with SayApp.set, leaderboard with SayApp.top('score'). Virtual points only. -->
<!-- tpl-ideas: {"fr":["Ajoute un skin doré pour la pièce","Ajoute des missions du jour","Ajoute un boost x2 pendant 1 minute","Ajoute un concours de la semaine"],"en":["Add a golden coin skin","Add daily missions","Add a x2 boost for 1 minute","Add a weekly contest"]} -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--c:__C1__;--bg:#0b0a10;--card:rgba(255,255,255,.05);--card2:rgba(255,255,255,.09);--line:rgba(255,255,255,.09);--fg:#f6f4ff;--mute:#a6a3b8;--dim:#6f6c82;--good:#3ee08f;--tab:64px;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(var(--tab) + 20px + env(safe-area-inset-bottom,0px));overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body::before{content:"";position:fixed;inset:-20% -20% auto;height:70vh;background:radial-gradient(60% 60% at 50% 0%,color-mix(in srgb,var(--c) 38%,transparent),transparent 70%);pointer-events:none;z-index:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand i{flex:0 0 38px;height:38px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:20px;background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 45%,#000));box-shadow:0 8px 24px -8px var(--c)}
.brand h1{font:700 18px Sora,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:0 0 auto;padding:7px 12px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:13px}
.bal{text-align:center;margin:8px 0 4px}
.bal small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
.bal b{display:block;font:800 44px/1.1 Sora,sans-serif;margin-top:4px;background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--c) 55%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.bal span{font-size:13px;color:var(--mute)}
.chips{display:flex;justify-content:center;gap:8px;margin:10px 0 0;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:12.5px;color:var(--mute)}
.chip b{color:var(--fg)}
.stage{position:relative;display:grid;place-items:center;height:300px;margin:6px 0}
.coin{position:relative;width:236px;height:236px;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 40%,#fff) 0%,var(--c) 38%,color-mix(in srgb,var(--c) 55%,#000) 100%);box-shadow:0 0 0 10px color-mix(in srgb,var(--c) 22%,transparent),0 24px 60px -10px var(--c),inset 0 -12px 30px rgba(0,0,0,.35),inset 0 10px 24px rgba(255,255,255,.35);display:grid;place-items:center;transition:transform .08s}
.coin:active{transform:scale(.95)}
.coin::after{content:"";position:absolute;inset:22px;border-radius:50%;border:3px dashed rgba(255,255,255,.35)}
.coin span{font:800 46px Sora,sans-serif;color:#fff;text-shadow:0 4px 14px rgba(0,0,0,.35);letter-spacing:.02em}
.pop{position:fixed;z-index:15;font:800 24px Sora,sans-serif;color:#fff;text-shadow:0 2px 10px var(--c);pointer-events:none;animation:up .9s ease-out forwards}
@keyframes up{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-90px) scale(1.3)}}
.energy{margin:4px 0 0}
.energy .row{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:6px}
.energy .row b{color:var(--fg)}
.bar{height:12px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 50%,#fff));transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px}
.daily{display:flex;align-items:center;gap:12px;margin-top:16px}
.daily i{flex:0 0 44px;height:44px;border-radius:14px;display:grid;place-items:center;font-style:normal;font-size:22px;background:var(--card2)}
.daily div{flex:1;min-width:0}
.daily b{display:block;font-size:14.5px}
.daily span{font-size:12.5px;color:var(--mute)}
.btn{padding:11px 14px;border-radius:13px;font-weight:700;font-size:13.5px;color:#fff;background:linear-gradient(120deg,var(--c),color-mix(in srgb,var(--c) 55%,#ff3d9a));box-shadow:0 10px 24px -12px var(--c);transition:transform .15s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;box-shadow:none}
.sec h3{font:600 12px Inter,sans-serif;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin:18px 0 10px}
.up{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:10px}
.up i{flex:0 0 44px;height:44px;border-radius:14px;display:grid;place-items:center;font-style:normal;font-size:22px;background:color-mix(in srgb,var(--c) 20%,transparent)}
.up div{flex:1;min-width:0}
.up b{display:block;font-size:14.5px}
.up span{font-size:12.5px;color:var(--mute)}
.lb{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.lb.me{border-color:color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent)}
.lb em{flex:0 0 30px;font:700 15px Sora,sans-serif;font-style:normal;color:var(--mute);text-align:center}
.lb span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.lb b{font-variant-numeric:tabular-nums}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:6px;justify-content:center;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));background:rgba(11,10,16,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabs button{flex:1;max-width:170px;padding:10px 6px;border-radius:14px;color:var(--mute);font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button i{font-style:normal;font-size:19px}
.tabs button.on{background:var(--card2);color:var(--fg)}
[hidden]{display:none!important}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);z-index:20;max-width:92vw;padding:12px 16px;border-radius:14px;background:#1b1a24;border:1px solid var(--line);font-weight:600;font-size:14px;box-shadow:0 14px 40px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
.toast.on{transform:translate(-50%,0)}
.foot{text-align:center;color:var(--dim);font-size:11.5px;margin:24px 0 6px}
.note{text-align:center;color:var(--dim);font-size:11.5px;margin-top:12px}
</style>
</head>
<body>
<main>
  <div class="top"><div class="brand"><i>🪙</i><h1 id="nm">__NAME__</h1></div><div class="pill" id="rank">#-</div></div>

  <section id="vTap">
    <div class="bal"><small id="lBal"></small><b id="bal">0</b><span>$__TOKEN__</span></div>
    <div class="chips"><div class="chip" id="cTap"></div><div class="chip" id="cAuto"></div></div>
    <div class="stage"><button class="coin" id="coin" aria-label="tap"><span>$__TOKEN__</span></button></div>
    <div class="energy"><div class="row"><span id="lEn"></span><b id="en">0 / 0</b></div><div class="bar"><i id="enBar" style="width:100%"></i></div></div>
    <div class="card daily"><i>🎁</i><div><b id="dT"></b><span id="dP"></span></div><button class="btn" id="dGo"></button></div>
    <p class="note" id="noCash"></p>
  </section>

  <section id="vBoost" hidden><div class="sec"><h3 id="lBoost"></h3><div id="ups"></div></div></section>
  <section id="vTop" hidden><div class="sec"><h3 id="lTop"></h3><div id="topList"></div></div></section>

  <p class="foot">Made with SayApp</p>
</main>

<nav class="tabs"><button class="on" id="tTap"><i>🪙</i><span id="nTap"></span></button><button id="tBoost"><i>⚡</i><span id="nBoost"></span></button><button id="tTop"><i>🏆</i><span id="nTop"></span></button></nav>
<div class="toast" id="toast"></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://jeremstyke.github.io/sayapp/sdk.js" data-app="__APP__"></script>
<script>
window.addEventListener('load', function () {
  var $ = function (id) { return document.getElementById(id); };
  var TK = '$__TOKEN__';
  var fr = /^fr/.test(String((SayApp.user && SayApp.user.language_code) || navigator.language || ''));
  var T = fr ? {
    bal: 'Ton solde', en: 'Énergie', tap: 'Tape', boost: 'Boosts', top: 'Classement', perTap: function (n) { return '<b>+' + n + '</b> par tape'; }, perH: function (n) { return '<b>' + n + '</b> / heure'; },
    dT: 'Cadeau du jour', dP: function (s, b) { return 'Série de ' + s + ' jour' + (s > 1 ? 's' : '') + ' · +' + b + ' ' + TK; }, dGo: 'Récupérer', dDone: 'Revenu demain', dOk: function (b) { return '+' + b + ' ' + TK + ' 🎁'; },
    ups: [['👆', 'Multi-tape', '+1 ' + TK + ' par tape'], ['🔋', 'Batterie', '+250 énergie max'], ['⚡', 'Recharge', 'L\'énergie remonte plus vite'], ['🤖', 'Robot mineur', '+300 ' + TK + ' par heure, même hors ligne']],
    lvl: 'niv.', buy: function (c) { return c + ' ' + TK; }, poor: 'Pas assez de ' + TK + ' 😅', bought: 'Amélioration achetée ⚡', tired: 'Plus d\'énergie, elle remonte toute seule ⏳', away: function (n) { return 'Ton robot a miné +' + n + ' ' + TK + ' 🤖'; },
    topT: 'Meilleurs joueurs', you: 'toi', noCash: 'Les ' + TK + ' sont des points du jeu, sans valeur en argent.'
  } : {
    bal: 'Your balance', en: 'Energy', tap: 'Tap', boost: 'Boosts', top: 'Ranking', perTap: function (n) { return '<b>+' + n + '</b> per tap'; }, perH: function (n) { return '<b>' + n + '</b> / hour'; },
    dT: 'Daily gift', dP: function (s, b) { return s + ' day streak · +' + b + ' ' + TK; }, dGo: 'Claim', dDone: 'Back tomorrow', dOk: function (b) { return '+' + b + ' ' + TK + ' 🎁'; },
    ups: [['👆', 'Multitap', '+1 ' + TK + ' per tap'], ['🔋', 'Battery', '+250 max energy'], ['⚡', 'Recharge', 'Energy refills faster'], ['🤖', 'Mining bot', '+300 ' + TK + ' per hour, even offline']],
    lvl: 'lvl', buy: function (c) { return c + ' ' + TK; }, poor: 'Not enough ' + TK + ' 😅', bought: 'Upgrade bought ⚡', tired: 'Out of energy, it refills by itself ⏳', away: function (n) { return 'Your bot mined +' + n + ' ' + TK + ' 🤖'; },
    topT: 'Top players', you: 'you', noCash: TK + ' are game points with no cash value.'
  };
  var cs = $('coin').querySelector('span'); if (TK.length > 6) cs.style.fontSize = Math.max(24, 46 - (TK.length - 6) * 6) + 'px';
  var BASE = [200, 300, 500, 1000];
  var S = { bal: 0, score: 0, lv: [0, 0, 0, 0], en: 500, t: Date.now(), day: '', streak: 0 };
  var dirty = false, toastT;
  var fmt = function (n) { return Math.floor(n).toLocaleString(fr ? 'fr-FR' : 'en-US'); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('on'); }, 2600); }
  var perTap = function () { return 1 + S.lv[0]; }, maxEn = function () { return 500 + 250 * S.lv[1]; }, regen = function () { return 1 + S.lv[2]; }, perH = function () { return 300 * S.lv[3]; };
  var cost = function (k) { return BASE[k] * Math.pow(2, S.lv[k]); };
  var today = function () { return new Date().toISOString().slice(0, 10); };
  function earn(n) { S.bal += n; S.score += n; dirty = true; }
  function catchUp() {
    var now = Date.now(), dt = Math.max(0, (now - S.t) / 1000);
    S.en = Math.min(maxEn(), S.en + dt * regen());
    var mined = Math.floor(Math.min(dt, 3 * 3600) / 3600 * perH());
    S.t = now; if (mined > 0) earn(mined);
    return mined;
  }
  function paint() {
    $('bal').textContent = fmt(S.bal); $('cTap').innerHTML = T.perTap(perTap()); $('cAuto').innerHTML = T.perH(fmt(perH()));
    $('en').textContent = fmt(S.en) + ' / ' + fmt(maxEn()); $('enBar').style.width = (S.en / maxEn() * 100) + '%';
    var can = S.day !== today(), st = can ? (S.day === new Date(Date.now() - 864e5).toISOString().slice(0, 10) ? S.streak + 1 : 1) : S.streak;
    $('dT').textContent = T.dT; $('dP').textContent = T.dP(Math.max(1, st), 500 * Math.min(Math.max(1, st), 7)); $('dGo').textContent = can ? T.dGo : T.dDone; $('dGo').disabled = !can;
    $('ups').innerHTML = T.ups.map(function (u, k) { var c = cost(k); return '<div class="up"><i>' + u[0] + '</i><div><b>' + esc(u[1]) + ' · ' + T.lvl + ' ' + S.lv[k] + '</b><span>' + esc(u[2]) + '</span></div><button class="btn" data-k="' + k + '"' + (S.bal < c ? ' disabled' : '') + '>' + esc(T.buy(fmt(c))) + '</button></div>'; }).join('');
    $('ups').querySelectorAll('button').forEach(function (b) { b.onclick = function () { buy(+b.getAttribute('data-k')); }; });
  }
  function buy(k) { var c = cost(k); if (S.bal < c) { SayApp.haptic('error'); return toast(T.poor); } S.bal -= c; S.lv[k]++; dirty = true; SayApp.haptic('ok'); toast(T.bought); paint(); save(); }
  $('coin').addEventListener('pointerdown', function (e) {
    catchUp();
    if (S.en < 1) { SayApp.haptic('error'); return toast(T.tired); }
    var n = perTap(); S.en -= 1; earn(n); SayApp.haptic('tap');
    var p = document.createElement('div'); p.className = 'pop'; p.textContent = '+' + n; p.style.left = (e.clientX - 16) + 'px'; p.style.top = (e.clientY - 30) + 'px'; document.body.appendChild(p); setTimeout(function () { p.remove(); }, 950);
    paint();
  });
  $('dGo').onclick = function () {
    if (S.day === today()) return;
    var y = new Date(Date.now() - 864e5).toISOString().slice(0, 10); S.streak = S.day === y ? S.streak + 1 : 1; S.day = today();
    var b = 500 * Math.min(S.streak, 7); earn(b); SayApp.haptic('ok'); toast(T.dOk(fmt(b))); paint(); save();
  };
  function save() { if (!dirty) return; dirty = false; SayApp.set('s', S); SayApp.set('score', Math.floor(S.score)); }
  setInterval(function () { catchUp(); paint(); }, 1000);
  setInterval(save, 4000);
  document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });
  function rank() { SayApp.top('score', 30).then(function (rows) { var me = rows.filter(function (r) { return r.me; })[0]; if (me) $('rank').textContent = '#' + (rows.indexOf(me) + 1); return rows; }); }
  function tab(w) {
    ['Tap', 'Boost', 'Top'].forEach(function (k) { $('v' + k).hidden = k !== w; $('t' + k).classList.toggle('on', k === w); });
    window.scrollTo(0, 0); SayApp.haptic('tap'); paint();
    if (w === 'Top') { save(); SayApp.top('score', 30).then(function (rows) {
      $('topList').innerHTML = rows.map(function (p, i) { return '<div class="lb' + (p.me ? ' me' : '') + '"><em>' + (i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1) + '</em><span>' + esc(p.name) + (p.me ? ' (' + esc(T.you) + ')' : '') + '</span><b>' + fmt(p.value) + '</b></div>'; }).join('');
    }); }
  }
  $('tTap').onclick = function () { tab('Tap'); }; $('tBoost').onclick = function () { tab('Boost'); }; $('tTop').onclick = function () { tab('Top'); };
  ['lBal:bal', 'lEn:en', 'nTap:tap', 'nBoost:boost', 'nTop:top', 'lBoost:boost', 'lTop:topT', 'noCash:noCash'].forEach(function (p) { var k = p.split(':'); $(k[0]).textContent = T[k[1]]; });
  SayApp.get('s').then(function (v) {
    if (v && typeof v === 'object') { for (var k in S) if (v[k] !== undefined) S[k] = v[k]; }
    var mined = catchUp(); if (mined > 0) toast(T.away(fmt(mined)));
    paint(); rank();
  });
  paint();
});
</script>
</body>
</html>
