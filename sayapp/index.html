    openSheet('<div class="prohead"><div>⭐</div><div><h2>' + esc(T.limT) + '</h2><p class="sub" style="margin:0">' + esc(T.limP) + '</p></div></div><p class="sub">' + esc(T.limPick) + '</p><div class="apps" id="lp"></div>');
    list.slice(0, 6).forEach(function (a) {
      var b = document.createElement('button'); b.className = 'ac'; b.style.textAlign = 'left'; b.style.width = '100%';
      b.innerHTML = '<div class="ah"><div class="ico" style="background:' + col(a.id) + '">' + (a.logo_url ? '<img alt="" src="' + esc(a.logo_url) + '">' : esc((a.title || 'A').charAt(0).toUpperCase())) + '</div><div class="an"><b>' + esc(a.title || 'App') + '</b></div></div>';
      b.onclick = function () { proSheet(a, false); }; $('lp').appendChild(b);
    });
  }
  function launch(a) {
    if (a.bot_username && sub(a)) return link('https://t.me/' + a.bot_username);
    if (sub(a)) return botSheet(a);
    if (S.lim && S.lim.trialOk) return trialSheet(a);
    proSheet(a, false);
  }
  // 2 nov 2026 (22h26, Jeremy): launch free for 1 month on your own bot (once per account), then SayApp Pro or the app is paused
  function trialSheet(a) {
    var p = ((S.lim && S.lim.price) || 1000).toLocaleString(LOC), d = (S.lim && S.lim.trialDays) || 30;
    openSheet('<div class="prohead"><div>🎁</div><div><h2>' + esc(T.trT) + '</h2><p class="sub" style="margin:0">' + esc(T.trP(d)) + '</p></div></div>' +
      '<div class="feat">' + T.trFeats(p).map(function (f) { return '<div><i>✓</i>' + esc(f) + '</div>'; }).join('') + '</div>' +
      '<button class="cta gold" id="trGo">' + esc(T.trGo(d)) + '</button><button class="ghost" id="trPro" style="margin-top:10px">' + esc(T.trPro) + '</button><div class="note">' + esc(T.trN) + '</div>');
    $('trPro').onclick = function () { hap(); proSheet(a, false); };
    $('trGo').onclick = function () {
      hap(); $('trGo').disabled = true;
      call('trial', { id: a.id }).then(function (r) {
        $('trGo').disabled = false;
        if (!r.ok) { hap('err'); if (r.error === 'trialused') return proSheet(a, false); return toast(T.inv); }
        hap('ok'); if (S.lim) S.lim.trialOk = false; refresh(); botSheet(r.app || a);
      });
    };
  }
  // 2 nov 2026 (22h26, Jeremy): the customer's bot is created in 1 tap (Telegram managed bots), the pasted token stays as a fallback
  function botSheet(a) {
    openSheet('<div class="prohead"><div>🤖</div><div><h2>' + esc(T.mbT) + '</h2><p class="sub" style="margin:0">' + esc(T.mbP) + '</p></div></div>' +
      '<button class="cta" id="mbGo">' + esc(T.mbGo) + '</button><div class="note" id="mbW" hidden>⏳ ' + esc(T.mbWait) + '</div><button class="ghost" id="mbTk" style="margin-top:12px">' + esc(T.mbTk) + '</button>');
    $('mbTk').onclick = function () { hap(); tokenSheet(a); };
    $('mbGo').onclick = function () {
      hap(); $('mbGo').disabled = true;
      call('mbot', { id: a.id }).then(function (r) {
        $('mbGo').disabled = false;
        if (!r.ok) { hap('err'); return toast(T.inv); }
        $('mbW').hidden = false; link(r.link);
        var n = 0, iv = setInterval(function () {
          if (!$('mbW')) return clearInterval(iv);
          call('app', { id: a.id }).then(function (q) {
            if (q.ok && q.app && q.app.bot_username) {
              clearInterval(iv); hap('ok'); refresh();
              openSheet('<div style="text-align:center;padding:10px 0"><div style="font-size:54px">🎉</div><h2 style="margin-top:8px">' + esc(T.liveT) + '</h2><p class="sub">' + esc(T.liveP(q.app.bot_username)) + '</p></div><button class="cta" id="lvGo">' + esc(T.openBot) + '</button><button class="ghost" id="lvNext" style="margin-top:10px">' + esc(T.nsGo) + '</button>');
              $('lvNext').onclick = function () { hap(); manageSheet(q.app); };
              $('lvGo').onclick = function () { link('https://t.me/' + q.app.bot_username); };
            } else if (++n > 100) clearInterval(iv);
          });
        }, 3000);
      });
    };
  }
  function tokenSheet(a) {
    openSheet('<h2>' + esc(T.tkT) + '</h2><p class="sub">' + esc(T.tkP) + '</p><ol class="ol">' + T.tkS.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol>' +
      '<button class="ghost" id="tkBF" style="margin-bottom:12px">🤖 ' + esc(T.tkBF) + '</button>' +
      '<input class="tk" id="tkI" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="' + esc(T.tkPh) + '">' +
      '<button class="cta" id="tkGo">' + esc(T.tkGo) + '</button><div class="note">🔒 ' + esc(T.tkN) + '</div>');
    $('tkBF').onclick = function () { link('https://t.me/BotFather'); };
    $('tkGo').onclick = function () {
      var v = $('tkI').value.trim();
      if (!/^\d{6,12}:[A-Za-z0-9_-]{30,}$/.test(v)) { hap('err'); return toast(T.tkBad); }
      $('tkGo').disabled = true;
      call('plug', { id: a.id, token: v }).then(function (r) {
        $('tkGo').disabled = false;
        if (!r.ok) { hap('err'); return toast(r.error === 'sub' ? T.inv : T.tkBad); }
        $('tkI').value = ''; hap('ok'); refresh();
        openSheet('<div style="text-align:center;padding:10px 0"><div style="font-size:54px">🎉</div><h2 style="margin-top:8px">' + esc(T.liveT) + '</h2><p class="sub">' + esc(T.liveP(r.bot)) + '</p></div><button class="cta" id="lvGo">' + esc(T.openBot) + '</button><button class="ghost" id="lvNext" style="margin-top:10px">' + esc(T.nsGo) + '</button>');
        $('lvNext').onclick = function () { hap(); manageSheet(Object.assign({}, a, { bot_username: r.bot })); };
        $('lvGo').onclick = function () { link('https://t.me/' + r.bot); };
      });
    };
  }

  // ---------- Pro tools: users, announcement, channel post (2 nov 2026, 14h40) ----------
  function manageSheet(a) {
    var t = a.title || 'App';
    openSheet('<div class="mg"><div class="ico" style="background:' + col(a.id) + '">' + (a.logo_url ? '<img alt="" src="' + esc(a.logo_url) + '">' : esc(t.charAt(0).toUpperCase())) + '</div><div class="an"><h2 style="margin:0">' + esc(t) + '</h2><span>@' + esc(a.bot_username) + '</span></div></div>' +
      '<div class="stat"><div><b id="mgU">…</b><span>' + esc(T.users) + '</span></div><div><b>' + (a.trial ? '🎁' : '⭐') + '</b><span>' + esc(a.trial ? T.trRenT.replace(/^\S+\s/, '') : 'Pro') + '</span></div></div>' +
      '<button class="ghost" id="mgBot">' + esc(T.openMyBot) + '</button><div id="mgTier"></div>' +
      '<div class="blk"><h3>' + esc(T.imT) + '</h3><p>' + esc(T.imP) + '</p><div class="supx" style="margin-top:10px"><button id="imLogo">' + esc(T.imLogo) + '</button><button id="imWel">' + esc(T.imWel) + '</button></div><button class="cta" id="imGen" style="margin-top:10px">' + esc(LG.btn) + '</button></div>' +
      '<div class="blk"><h3>' + esc(T.mtT) + '</h3><p>' + esc(T.mtP) + '</p><button class="ghost" id="mtAi" style="margin-bottom:10px">' + esc(MA[0]) + '</button><input class="xin" id="mtN" maxlength="40" placeholder="' + esc(T.xName) + '"><input class="xin" id="mtD" maxlength="120" placeholder="' + esc(T.xDesc) + '" style="margin-top:8px"><p class="xl" style="margin:12px 0 6px">' + esc(T.mtShort) + '</p><input class="xin" id="mtS" maxlength="85"><p class="xl" style="margin:12px 0 6px">' + esc(T.mtLong) + '</p><textarea class="xin" id="mtL" maxlength="450" style="min-height:90px;resize:vertical"></textarea><p class="xl" style="margin:12px 0 6px">' + esc(T.mtWel) + '</p><textarea class="xin" id="mtW" maxlength="700" style="min-height:80px;resize:vertical"></textarea><p class="note" style="margin:6px 0 0">' + esc(T.mtHint) + '</p><button class="cta" id="mtGo">' + esc(T.mtSave) + '</button></div>' +
      (!a.sub_recurring && a.sub_until && a.plan !== 'credit' && String(a.sub_until).slice(0, 4) < '2090' ? '<div class="blk"><h3>' + esc(a.trial ? T.trRenT : T.renT) + '</h3><p>' + esc((a.trial ? T.trRenP : T.renP)(new Date(a.sub_until).toLocaleDateString(LOC))) + '</p><button class="cta gold" id="renGo">' + esc(T.renGo(((S.lim && S.lim.price) || 1000).toLocaleString(LOC))) + '</button></div>' : '') +
      '<div class="blk"><h3>' + esc(T.mnT) + '</h3><p>' + esc(T.mnP) + '</p><input class="xin" id="mnAg" inputmode="numeric" maxlength="12" placeholder="' + esc(T.mnAg) + '"><input class="xin" id="mnAgi" inputmode="numeric" maxlength="12" placeholder="' + esc(T.mnAgi) + '" style="margin-top:8px"><input class="xin" id="mnAgx" inputmode="numeric" maxlength="12" placeholder="' + esc(T.mnAgx) + '" style="margin-top:8px"><label class="tg"><input type="checkbox" id="mnOpen"><span>' + esc(T.mnOpen) + '</span></label><button class="cta" id="mnGo">' + esc(T.mnSave) + '</button><button class="ghost" id="mnHow" style="margin-top:8px">' + esc(T.mnHow) + '</button><p style="margin:12px 0 0">' + esc(T.mnBuy) + '</p><p style="margin:14px 0 8px">' + esc(PY.t) + '</p><input class="xin" id="mnPay" type="url" inputmode="url" maxlength="300" placeholder="' + esc(PY.ph) + '"><button class="cta" id="mnPayGo" style="margin-top:8px">' + esc(PY.save) + '</button></div>' +
      '<div class="blk"><h3>' + esc(T.bcT) + '</h3><p>' + esc(T.bcP) + '</p><div class="field"><textarea id="bcT" maxlength="1000" style="min-height:80px" placeholder="' + esc(T.bcPh) + '"></textarea></div><button class="cta" id="bcGo" disabled>…</button></div>' +
      '<div class="blk"><h3>' + esc(T.poT) + '</h3><p>' + esc(T.poP) + '</p><div class="field"><textarea id="poT" maxlength="1000" style="min-height:90px"></textarea></div><input id="poB" maxlength="40" placeholder="' + esc(T.poBtn) + '"><button class="cta" id="poGo">' + esc(T.poGo) + '</button></div>');
    $('poT').value = T.poDef(t); $('poB').value = '▶️ ' + t;
    $('mgBot').onclick = function () { link('https://t.me/' + a.bot_username); };
    $('mtN').value = a.custom_name || a.title || ''; $('mtD').value = a.custom_desc || '';
    $('mtGo').onclick = function () { $('mtGo').disabled = true; call('meta', { id: a.id, name: $('mtN').value.trim(), desc: $('mtD').value.trim(), short: $('mtS').value.trim(), long: $('mtL').value.trim(), welcome: $('mtW').value.trim() }).then(function (r) { $('mtGo').disabled = false; if (r.ok) { hap('ok'); toast(T.mtOk); if (r.texts) { $('mtS').value = r.texts.bot_short || ''; $('mtL').value = r.texts.bot_long || ''; $('mtW').value = r.texts.bot_welcome || ''; } refresh(); } else { hap('err'); toast(T.net); } }); };
    if ($('renGo')) $('renGo').onclick = function () { $('renGo').disabled = true; call('invoice', { id: a.id, renew: 1 }).then(function (r) { $('renGo').disabled = false; if (!r.ok) { hap('err'); return toast(T.inv); } try { tw.openInvoice(r.link, function (st) { if (st === 'paid') { hap('ok'); toast(T.renOk); closeSheet(); setTimeout(refresh, 2500); } }); } catch (e) { link(r.link); } }); };
    var up = function (kind, btn) { pickImg(kind === 'logo', function (d) { btn.disabled = true; toast(T.imWait); call(kind, { id: a.id, img: d }).then(function (r) { btn.disabled = false; if (!r.ok) { hap('err'); return toast(r.error === 'img' ? T.imBad : T.net); } hap('ok'); toast(T.imOk); if (r.logo) { a.logo_url = r.logo; refresh(); } btn.textContent = '✅ ' + (kind === 'logo' ? T.imLogo : T.imWel).replace(/^\S+\s/, ''); }); }); };
    $('imLogo').onclick = function () { hap(); up('logo', $('imLogo')); };
    $('imWel').onclick = function () { hap(); up('welcome', $('imWel')); };
    $('imGen').onclick = function () { hap(); logoSheet(a); };
    // 3 nov 2026 (13h45, Jeremy): name, description and bot texts suggested by the AI, then saved by the owner
    $('mtAi').onclick = function () { hap(); var bt = $('mtAi'); bt.disabled = true; bt.textContent = MA[2]; call('metagen', { id: a.id }).then(function (r) { bt.disabled = false; bt.textContent = MA[0]; if (!r.ok) { hap('err'); return toast(r.error === 'logolimit' ? LG.lim.replace('{n}', r.per || 10) : T.net); } hap('ok'); if (r.name) $('mtN').value = r.name; if (r.desc) $('mtD').value = r.desc; if (r.short) $('mtS').value = r.short; if (r.long) $('mtL').value = r.long; if (r.welcome) $('mtW').value = r.welcome; toast(MA[1]); }); };
    $('mnHow').onclick = function () { var u = 'https://jeremstyke.github.io/sayapp/monetize.html' + (lang === 'fr' ? '' : '#en'); try { tw.openLink(u); } catch (e) { window.open(u); } };
    $('mnGo').onclick = function () { $('mnGo').disabled = true; call('ads', { id: a.id, ag: $('mnAg').value, agi: $('mnAgi').value, agx: $('mnAgx').value, open: $('mnOpen').checked, pay: $('mnPay').value.trim() }).then(function (r) { $('mnGo').disabled = false; if (r.ok) { hap('ok'); toast(T.mnOk); } else { hap('err'); toast(T.net); } }); };
    $('mnPayGo').onclick = function () { var v = $('mnPay').value.trim(); if (v && !/^https:\/\/\S{4,}$/.test(v)) { hap('err'); return toast(PY.ph); } $('mnPayGo').disabled = true; call('ads', { id: a.id, ag: $('mnAg').value, agi: $('mnAgi').value, agx: $('mnAgx').value, open: $('mnOpen').checked, pay: v }).then(function (r) { $('mnPayGo').disabled = false; if (r.ok) { hap('ok'); toast(PY.ok); } else { hap('err'); toast(T.net); } }); };
    var users = 0;
    call('manage', { id: a.id }).then(function (r) {
      if (!r.ok) return;
      // 2 nov 2026 (19h54, Jeremy): size of the app (active players) and the plan above when it is over
      var need = r.mau >= 100000 ? 2 : r.mau >= 10000 ? 1 : 0, tl = '';
      if (r.mau >= 1000 || r.tier || r.overSince) {
        var dl = r.overSince ? Math.max(0, 7 - Math.floor((Date.now() - new Date(r.overSince).getTime()) / 86400000)) : 0;
        tl = '<div class="blk"><h3>' + esc(T.tiT) + '</h3><p>' + esc(T.tiP(r.mau.toLocaleString(LOC), r.tier)) + '</p>' +
          (r.overPaused ? '<div class="tier">' + esc(T.tiPaused) + '</div>' : need > (r.tier || 0) ? '<div class="tier">' + esc(T.tiOver(dl)) + '</div>' : '') +
          (need > (r.tier || 0) ? (need === 1 ? '<button class="cta gold" id="tiGo">' + esc(T.tiGo1(Number(r.tier1).toLocaleString(LOC))) + '</button>' : '<button class="cta" id="tiJ">' + esc(T.tiGo2(Number(r.tier2).toLocaleString(LOC))) + '</button>') : '') + '</div>';
      }
      $('mgTier').innerHTML = tl;
      if (r.texts) { $('mtS').value = r.texts.bot_short || ''; $('mtL').value = r.texts.bot_long || ''; $('mtW').value = r.texts.bot_welcome || ''; if (!$('mtD').value && r.texts.bot_short) $('mtD').value = String(r.texts.bot_short).slice(0, 120); }
      if (r.logo && $('imLogo')) $('imLogo').textContent = '✅ ' + T.imLogo.replace(/^\S+\s/, '');
      if (r.welcome && $('imWel')) $('imWel').textContent = '✅ ' + T.imWel.replace(/^\S+\s/, '');
      if ($('tiGo')) $('tiGo').onclick = function () { $('tiGo').disabled = true; call('invoice', { id: a.id, tier: 1 }).then(function (x) { $('tiGo').disabled = false; if (!x.ok) { hap('err'); return toast(T.inv); } try { tw.openInvoice(x.link, function (st) { if (st === 'paid') { hap('ok'); toast(T.tiOk); closeSheet(); setTimeout(refresh, 2500); } }); } catch (e) { link(x.link); } }); };
      if ($('tiJ')) $('tiJ').onclick = function () { link('https://t.me/jeremstyke?direct'); };
      var ad = r.ads || {}; $('mnAg').value = ad.ag || ''; $('mnAgi').value = ad.agi || ''; $('mnAgx').value = ad.agx || ''; $('mnOpen').checked = !!ad.open; $('mnPay').value = ad.pay || '';
      users = r.users; $('mgU').textContent = users.toLocaleString(LOC);
      var b = $('bcGo');
      if (r.nextAt) { b.textContent = T.bcWait(Math.max(1, Math.ceil((r.nextAt - Date.now()) / 3600000))); return; }
      if (!users) { b.textContent = T.bcNone; return; }
      b.disabled = false; b.textContent = T.bcGo(users);
    });
    $('bcGo').onclick = function () {
      var v = $('bcT').value.trim(); if (v.length < 3) { hap('err'); return toast(T.short); }
      $('bcGo').disabled = true;
      call('broadcast', { id: a.id, text: v }).then(function (r) {
        if (r.ok) { hap('ok'); toast(T.bcOk); $('bcT').value = ''; $('bcGo').textContent = T.bcWait(20); return; }
        hap('err'); if (r.error === 'wait') { $('bcGo').textContent = T.bcWait(Math.max(1, Math.ceil((r.nextAt - Date.now()) / 3600000))); return; }
        $('bcGo').disabled = false; toast(T.net);
      });
    };
    $('poGo').onclick = function () {
      var v = $('poT').value.trim(); if (v.length < 3) { hap('err'); return toast(T.short); }
      $('poGo').disabled = true;
      call('post', { id: a.id, text: v, btn: $('poB').value.trim() }).then(function (r) {
        $('poGo').disabled = false;
        if (r.ok) { hap('ok'); toast(T.poOk); } else { hap('err'); toast(T.net); }
      });
    };
  }

  // ---------- boot ----------
  var q = new URLSearchParams(location.search), sp = '';
  try { sp = tw.initDataUnsafe.start_param || ''; } catch (e) {}
  if (/^demo_[a-z0-9]{4,16}$/.test(sp)) { document.body.style.opacity = '0'; location.replace(PAGES + sp.slice(5) + '/?src=share'); }  // 2 nov 2026: a shared demo opens straight away
  if (q.get('idea')) { idea.value = q.get('idea'); idea.oninput(); W.i = T.wiz.length; wizRender(); }
  if (q.get('tab') === 'apps') tab('apps');
  paintApps();
  refresh().then(function (r) {
    if (!r || !r.ok) return toast(T.net);
    var open = q.get('open') || (sp.indexOf('app_') === 0 ? sp.slice(4) : '');
    var gen = S.apps.filter(function (a) { return a.status === 'generating'; })[0];
    if (gen) return startBuild(gen.id, gen.version > 0);
    if (q.get('tab') === 'support' || sp === 'support') return supOpen();
    // 2 nov 2026 (21h32, Jeremy): shortcuts from the bot menu: ready-made games, referral
    if (q.get('go') === 'tpl' || sp === 'tpl') { tab('create'); return tplList(); }
    if (q.get('go') === 'ref' || sp === 'ref') { supOpen(); return refSheet(); }
    if (q.get('packs') || sp === 'packs') return packSheet(null, false);  // 3 nov 2026: "Top up my credits" from the bot
    if (open) { var a = S.apps.filter(function (x) { return x.id === open; })[0]; if (a) { tab('apps'); if (sub(a) && !a.bot_username) botSheet(a); else if (q.get('renew') && a.bot_username) manageSheet(a); } }
  });
})();
</script>
