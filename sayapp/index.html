<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#05040f;color:#fff;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));background:radial-gradient(70% 50% at 50% 30%,#2a0f4d 0,#05040f 70%)}
.w{width:100%;max-width:400px;text-align:center}
.sky{position:relative;height:200px;margin-bottom:6px}
.burst{position:absolute;left:50%;top:50%;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 6%,rgba(255,170,80,.55) 8%,transparent 11% 22%,rgba(140,110,255,.5) 24%,transparent 27% 40%,rgba(80,200,255,.45) 42%,transparent 45% 58%,rgba(255,110,170,.5) 60%,transparent 63% 76%,rgba(255,210,120,.5) 78%,transparent 81% 100%);-webkit-mask:radial-gradient(circle,#000 0,transparent 60%);mask:radial-gradient(circle,#000 0,transparent 60%);animation:spin 18s linear infinite}
.glow{position:absolute;left:50%;top:50%;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:radial-gradient(circle,rgba(255,230,180,.95) 0,rgba(255,140,60,.5) 35%,transparent 70%);animation:pulse 2.6s ease-in-out infinite}
.lg{position:absolute;left:50%;top:50%;width:88px;height:88px;margin:-44px 0 0 -44px;border-radius:26px;object-fit:cover;background:#140b2a;box-shadow:0 0 0 3px rgba(255,255,255,.12),0 16px 44px rgba(255,140,60,.55)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{transform:scale(.9);opacity:.85}50%{transform:scale(1.15);opacity:1}}
.old{display:inline-block;margin-bottom:12px;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.08);color:#b9b6dc;font-size:13px;font-weight:600}
.old s{opacity:.7}
h1{margin:0 0 10px;font-size:27px;line-height:1.15;letter-spacing:-.02em;font-weight:850}
p{margin:0 0 18px;color:#c9c6ea}
ul{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:8px;text-align:left}
li{padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.07);font-weight:600;font-size:14.5px}
.go{display:block;width:100%;border:0;border-radius:17px;padding:16px;font:800 17px/1.2 inherit;font-family:inherit;color:#1a0c00;background:linear-gradient(120deg,#ffd27a,#ff8a4c 55%,#ff5fa2);box-shadow:0 16px 36px -12px rgba(255,120,70,.85);cursor:pointer}
.ch{display:block;width:100%;margin-top:10px;border:1px solid rgba(255,255,255,.16);border-radius:17px;padding:14px;font:700 15.5px/1.2 inherit;font-family:inherit;color:#fff;background:rgba(255,255,255,.06);cursor:pointer}
.n{margin-top:16px;font-size:12.5px;color:#8d8ab0}
@media (prefers-reduced-motion:reduce){.burst,.glow{animation:none}}
</style>
</head>
<body>
