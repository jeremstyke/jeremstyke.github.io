<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SayApp - Maintenance</title>
<!-- 2 nov 2026 (21h51, Jeremy): SayApp in maintenance. The real studio is kept in ds_assets sayapp_studio_held (put it back to end the maintenance). -->
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#07070d;color:#f4f3ff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px));box-sizing:border-box;background:radial-gradient(60% 40% at 50% 0%,rgba(139,92,255,.25),transparent),#07070d}
.k{max-width:340px}
.l{width:76px;height:76px;margin:0 auto 22px;border-radius:24px;display:grid;place-items:center;font-size:34px;background:linear-gradient(140deg,#8b5cff,#2fd6ff);box-shadow:0 18px 40px -14px #6b6bff;animation:p 2.4s ease-in-out infinite}
@keyframes p{50%{transform:translateY(-6px) rotate(-4deg)}}
h1{margin:0 0 10px;font-size:24px}
p{margin:0 0 8px;color:#a9a8c4;line-height:1.55;font-size:15px}
small{display:block;margin-top:22px;color:#6f6e8c;font-size:12px}
</style>
</head>
<body>
<div class="k">
  <div class="l">🛠</div>
  <h1 id="t">SayApp est en maintenance</h1>
  <p id="p1">On améliore SayApp pour toi. On revient très vite.</p>
  <p id="p2">Tes applis restent en ligne et tes joueurs peuvent continuer à jouer.</p>
  <small>by @jeremstyke</small>
</div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
try { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } catch (e) {}
var lang = ''; try { lang = Telegram.WebApp.initDataUnsafe.user.language_code || ''; } catch (e) {}
if (!/^fr/.test(lang || navigator.language || '')) {
  document.documentElement.lang = 'en';
  document.getElementById('t').textContent = 'SayApp is under maintenance';
  document.getElementById('p1').textContent = 'We are improving SayApp for you. Back very soon.';
  document.getElementById('p2').textContent = 'Your apps stay online and your players can keep playing.';
}
</script>
</body>
</html>
