<style>
:root{

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.aur{position:fixed;inset:-20% -30% auto;height:70vh;z-index:0;pointer-events:none;filter:blur(60px);opacity:.55}

.mg{display:flex;align-items:center;gap:12px;margin-bottom:16px}.mg .ico{flex:0 0 52px;height:52px}.stat{display:flex;gap:10px;margin-bottom:16px}.stat div{flex:1;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:center}.stat b{display:block;font:800 22px Sora,sans-serif}.stat span{font-size:12px;color:var(--mute)}.blk{padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-top:12px}.blk h3{font-size:15px;margin-bottom:4px}.blk p{margin:0 0 10px;font-size:13px;color:var(--mute)}.blk input{width:100%;margin-top:8px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0a0a14;color:var(--fg);font:14px Inter,system-ui,sans-serif;outline:0}
.idea{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;margin-top:10px;font-size:12.5px;line-height:1.4;color:#dcdaf5;background:rgba(139,92,255,.1);border:1px solid rgba(139,92,255,.28);padding:8px 10px;border-radius:10px}.idea b{color:#c3afff;white-space:nowrap}.idea span{flex:1;min-width:0}.ideas{display:grid;gap:8px;width:100%;max-width:320px;margin-top:18px;text-align:left}.ideas h4{margin:0;font:600 12px Inter,sans-serif;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}.chip.dyn{border-radius:14px;white-space:normal;text-align:left;flex:0 0 auto;max-width:240px}
.trust{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px}.trust span{font-size:12px;font-weight:600;color:#cfe9ff;background:rgba(47,214,255,.08);border:1px solid rgba(47,214,255,.22);padding:5px 10px;border-radius:99px}
.wiz{border-radius:22px;padding:16px;background:linear-gradient(160deg,rgba(139,92,255,.12),rgba(47,214,255,.05));border:1px solid rgba(139,92,255,.3);margin-bottom:14px}.wtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}.wback{width:32px;height:32px;border-radius:10px;background:var(--card2);font-size:20px;line-height:1}.wback[disabled]{opacity:.25}.dots{display:flex;gap:5px;flex:1}.dots i{flex:1;height:4px;border-radius:9px;background:var(--card2)}.dots i.on{background:var(--grad)}.wstep{font-size:12px;color:var(--dim);font-weight:600}.wiz h2{font-size:20px}.wsub{margin:4px 0 14px;color:var(--mute);font-size:13.5px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opt{display:flex;align-items:center;gap:8px;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left;font-size:13.5px;font-weight:600;min-width:0}.opt i{font-style:normal;font-size:20px}.opt span{min-width:0}.opt.on{border-color:transparent;background:linear-gradient(#141428,#141428) padding-box,var(--grad) border-box;border:1.5px solid transparent;box-shadow:0 8px 20px -12px #6b6bff}#wNext{margin-top:12px}.recap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.recap span{font-size:12px;padding:5px 9px;border-radius:99px;background:var(--card2);color:#dcdaf5}
.launch{display:block;width:max-content;max-width:100%;margin:0 auto 8px;font-size:12px;font-weight:700;color:#2a1700;background:var(--gold);padding:5px 12px;border-radius:99px;box-shadow:0 6px 18px -8px #ff9f43}
.crup{display:block;margin:8px auto 0;font-size:13px;font-weight:700;color:#ffd76a;padding:6px 12px;border-radius:99px;background:rgba(255,215,106,.08);border:1px solid rgba(255,215,106,.25)}.plan{cursor:pointer}.plan.cr{background:linear-gradient(120deg,#8b5cff,#2fd6ff);color:#fff;border:0}
.extra{display:grid;gap:8px;margin-bottom:12px}.xin{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:#0d0d18;color:var(--fg);font:15px Inter,system-ui,sans-serif;outline:0}.xin:focus{border-color:var(--v)}.xl{margin:6px 0 0;font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}.cols{display:flex;gap:10px;flex-wrap:wrap}.col{width:38px;height:38px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}.col.on{border-color:#fff;transform:scale(1.08)}.col.auto{width:auto;padding:0 12px;border-radius:99px;background:var(--card2);font-size:12px;font-weight:700;color:var(--mute)}
.price{flex-wrap:wrap}.price .then{flex-basis:100%;text-align:center;font-style:normal;font-size:14px;font-weight:700;color:#ffd76a;margin-top:2px}
.tos{margin:12px 0 0;text-align:center;font-size:11.5px;color:var(--dim)}.tos a{color:var(--mute)}
.abtn button.hl{background:var(--gold);color:#2a1700;border:0}
.tst{margin-top:10px;font-size:12.5px;color:#a8a6c9;text-align:center}.tier{margin-top:10px;padding:12px;border-radius:14px;background:rgba(255,190,80,.08);border:1px solid rgba(255,190,80,.3);font-size:13px;line-height:1.5}.shr{width:100%;margin-top:8px;padding:10px;border-radius:12px;background:transparent;border:1px dashed var(--line);font-size:12.5px;font-weight:600;color:var(--fg)}

.tabs button{flex:1;max-width:220px;padding:11px;border-radius:14px;font-weight:600;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:7px}
.tabs button.on{background:var(--card2);color:var(--fg)}
/* 2 nov 2026 (16h56, Jeremy): Support tab */
.sup{display:flex;flex-direction:column;gap:10px;padding-bottom:150px}.suph{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:6px}.suph b{flex:0 0 40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--grad);font-size:18px;color:#fff}.suph div{min-width:0}.suph strong{display:block;font:700 15px Sora,sans-serif}.suph span{font-size:12.5px;color:var(--mute)}
.msg{max-width:86%;padding:11px 14px;border-radius:18px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.msg.u{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:6px}.msg.a{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:6px}.msg.j{align-self:flex-start;background:rgba(62,224,143,.12);border:1px solid rgba(62,224,143,.35);border-bottom-left-radius:6px}.msg small{display:block;font-size:11px;color:var(--mute);margin-bottom:3px;font-weight:600}.msg.dots{color:var(--mute)}

.tabs{gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}

      '<div class="price">' + (L.founder && L.creatorFull > p ? '<s class="was">' + fmt(L.creatorFull) + ' ⭐</s>' : '') + '<b>' + fmt(p) + ' ⭐</b><span>' + esc(T.per) + '</span></div>' +
      (L.founder && L.founderLeft > 0 && !L.isFounder ? '<div class="fdr">🔥 ' + esc(T.fdN(L.founderLeft)) + '</div>' : '') + '<button class="cta" id="crGo">' + esc(T.crGo(fmt(p))) + '</button><button class="ghost" id="crPro" style="margin-top:10px">' + esc(T.orPro) + '</button><div class="note">' + esc(T.perN) + '</div>');
    $('crPro').onclick = pickProSheet;
    $('crGo').onclick = function () {
      hap(); $('crGo').disabled = true;
      call('invoice', { plan: 'creator' }).then(function (r) {
        $('crGo').disabled = false;
        if (!r.ok) { hap('err'); return toast(T.inv); }
        try { tw.openInvoice(r.link, function (st) { if (st !== 'paid') return; hap('ok'); toast(T.crOk); closeSheet(); setTimeout(refresh, 2000); setTimeout(refresh, 6000); }); } catch (e) { link(r.link); }
      });
    };
  }
  function pickProSheet() {
    var list = S.apps.filter(function (a) { return a.version > 0; });
    if (list.length === 1) return proSheet(list[0], false);
    if (!list.length) { closeSheet(); tab('create'); return; }
    openSheet('<div class="prohead"><div>⭐</div><div><h2>' + esc(T.limT) + '</h2><p class="sub" style="margin:0">' + esc(T.limP) + '</p></div></div><p class="sub">' + esc(T.limPick) + '</p><div class="apps" id="lp"></div>');
    list.slice(0, 6).forEach(function (a) {
      var b = document.createElement('button'); b.className = 'ac'; b.style.textAlign = 'left'; b.style.width = '100%';
      b.innerHTML = '<div class="ah"><div class="ico" style="background:' + col(a.id) + '">' + esc((a.title || 'A').charAt(0).toUpperCase()) + '</div><div class="an"><b>' + esc(a.title || 'App') + '</b></div></div>';
      b.onclick = function () { proSheet(a, false); }; $('lp').appendChild(b);
    });
  }
  function launch(a) {
    if (a.bot_username && sub(a)) return link('https://t.me/' + a.bot_username);
    if (sub(a)) return botSheet(a);
    if (S.lim && S.lim.trialOk) return trialSheet(a);
    proSheet(a, false);
  }
  // 2 nov 2026 (22h26, Jeremy): launch free for 1 month on your own bot (once per account), then SayApp Pro or the app is paused
  function trialSheet(a) {
    var p = ((S.lim && S.lim.price) || 1000).toLocaleString(lang === 'fr' ? 'fr-FR' : 'en-US'), d = (S.lim && S.lim.trialDays) || 30;
    openSheet('<div class="prohead"><div>🎁</div><div><h2>' + esc(T.trT) + '</h2><p class="sub" style="margin:0">' + esc(T.trP(d)) + '</p></div></div>' +
      '<div class="feat">' + T.trFeats(p).map(function (f) { return '<div><i>✓</i>' + esc(f) + '</div>'; }).join('') + '</div>' +
      '<button class="cta gold" id="trGo">' + esc(T.trGo(d)) + '</button><button class="ghost" id="trPro" style="margin-top:10px">' + esc(T.trPro) + '</button><div class="note">' + esc(T.trN) + '</div>');
    $('trPro').onclick = function () { hap(); proSheet(a, false); };
    $('trGo').onclick = function () {
      hap(); $('trGo').disabled = true;
      call('trial', { id: a.id }).then(function (r) {
        $('trGo').disabled = false;
        if (!r.ok) { hap('err'); if (r.error === 'trialused') return proSheet(a, false); return toast(T.inv); }
        hap('ok'); if (S.lim) S.lim.trialOk = false; refresh(); botSheet(r.app || a);
      });
    };
  }
  // 2 nov 2026 (22h26, Jeremy): the customer's bot is created in 1 tap (Telegram managed bots), the pasted token stays as a fallback
  function botSheet(a) {
    openSheet('<div class="prohead"><div>🤖</div><div><h2>' + esc(T.mbT) + '</h2><p class="sub" style="margin:0">' + esc(T.mbP) + '</p></div></div>' +
      '<button class="cta" id="mbGo">' + esc(T.mbGo) + '</button><div class="note" id="mbW" hidden>⏳ ' + esc(T.mbWait) + '</div><button class="ghost" id="mbTk" style="margin-top:12px">' + esc(T.mbTk) + '</button>');
    $('mbTk').onclick = function () { hap(); tokenSheet(a); };
    $('mbGo').onclick = function () {
      hap(); $('mbGo').disabled = true;
      call('mbot', { id: a.id }).then(function (r) {
        $('mbGo').disabled = false;
        if (!r.ok) { hap('err'); return toast(T.inv); }
        $('mbW').hidden = false; link(r.link);
        var n = 0, iv = setInterval(function () {
          if (!$('mbW')) return clearInterval(iv);
          call('app', { id: a.id }).then(function (q) {
            if (q.ok && q.app && q.app.bot_username) {
              clearInterval(iv); hap('ok'); refresh();
              openSheet('<div style="text-align:center;padding:10px 0"><div style="font-size:54px">🎉</div><h2 style="margin-top:8px">' + esc(T.liveT) + '</h2><p class="sub">' + esc(T.liveP(q.app.bot_username)) + '</p></div><button class="cta" id="lvGo">' + esc(T.openBot) + '</button>');
              $('lvGo').onclick = function () { link('https://t.me/' + q.app.bot_username); };
            } else if (++n > 100) clearInterval(iv);
          });
        }, 3000);
      });
    };
  }
  function tokenSheet(a) {
    openSheet('<h2>' + esc(T.tkT) + '</h2><p class="sub">' + esc(T.tkP) + '</p><ol class="ol">' + T.tkS.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol>' +
      '<button class="ghost" id="tkBF" style="margin-bottom:12px">🤖 ' + esc(T.tkBF) + '</button>' +
      '<input class="tk" id="tkI" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="' + esc(T.tkPh) + '">' +
      '<button class="cta" id="tkGo">' + esc(T.tkGo) + '</button><div class="note">🔒 ' + esc(T.tkN) + '</div>');
    $('tkBF').onclick = function () { link('https://t.me/BotFather'); };
    $('tkGo').onclick = function () {
      var v = $('tkI').value.trim();
      if (!/^\d{6,12}:[A-Za-z0-9_-]{30,}$/.test(v)) { hap('err'); return toast(T.tkBad); }
      $('tkGo').disabled = true;
      call('plug', { id: a.id, token: v }).then(function (r) {
        $('tkGo').disabled = false;
        if (!r.ok) { hap('err'); return toast(r.error === 'sub' ? T.inv : T.tkBad); }
        $('tkI').value = ''; hap('ok'); refresh();
        openSheet('<div style="text-align:center;padding:10px 0"><div style="font-size:54px">🎉</div><h2 style="margin-top:8px">' + esc(T.liveT) + '</h2><p class="sub">' + esc(T.liveP(r.bot)) + '</p></div><button class="cta" id="lvGo">' + esc(T.openBot) + '</button>');
        $('lvGo').onclick = function () { link('https://t.me/' + r.bot); };
      });
    };
  }

  // ---------- Pro tools: users, announcement, channel post (2 nov 2026, 14h40) ----------
  function manageSheet(a) {
    var t = a.title || 'App';
    openSheet('<div class="mg"><div class="ico" style="background:' + col(a.id) + '">' + esc(t.charAt(0).toUpperCase()) + '</div><div class="an"><h2 style="margin:0">' + esc(t) + '</h2><span>@' + esc(a.bot_username) + '</span></div></div>' +
      '<div class="stat"><div><b id="mgU">…</b><span>' + esc(T.users) + '</span></div><div><b>⭐</b><span>Pro</span></div></div>' +
      '<button class="ghost" id="mgBot">' + esc(T.openMyBot) + '</button><div id="mgTier"></div>' +
      '<div class="blk"><h3>' + esc(T.mtT) + '</h3><p>' + esc(T.mtP) + '</p><input class="xin" id="mtN" maxlength="40" placeholder="' + esc(T.xName) + '"><input class="xin" id="mtD" maxlength="120" placeholder="' + esc(T.xDesc) + '" style="margin-top:8px"><button class="cta" id="mtGo">' + esc(T.mtSave) + '</button></div>' +
      (!a.sub_recurring && a.sub_until ? '<div class="blk"><h3>' + esc(a.trial ? T.trRenT : T.renT) + '</h3><p>' + esc((a.trial ? T.trRenP : T.renP)(new Date(a.sub_until).toLocaleDateString(lang === 'fr' ? 'fr-FR' : 'en-US'))) + '</p><button class="cta gold" id="renGo">' + esc(T.renGo(((S.lim && S.lim.price) || 1000).toLocaleString(lang === 'fr' ? 'fr-FR' : 'en-US'))) + '</button></div>' : '') +
      '<div class="blk"><h3>' + esc(T.mnT) + '</h3><p>' + esc(T.mnP) + '</p><input class="xin" id="mnAg" inputmode="numeric" maxlength="12" placeholder="' + esc(T.mnAg) + '"><input class="xin" id="mnAgi" inputmode="numeric" maxlength="12" placeholder="' + esc(T.mnAgi) + '" style="margin-top:8px"><input class="xin" id="mnAgx" inputmode="numeric" maxlength="12" placeholder="' + esc(T.mnAgx) + '" style="margin-top:8px"><label class="tg"><input type="checkbox" id="mnOpen"><span>' + esc(T.mnOpen) + '</span></label><button class="cta" id="mnGo">' + esc(T.mnSave) + '</button><button class="ghost" id="mnHow" style="margin-top:8px">' + esc(T.mnHow) + '</button><p style="margin:12px 0 0">' + esc(T.mnBuy) + '</p></div>' +
      '<div class="blk"><h3>' + esc(T.bcT) + '</h3><p>' + esc(T.bcP) + '</p><div class="field"><textarea id="bcT" maxlength="1000" style="min-height:80px" placeholder="' + esc(T.bcPh) + '"></textarea></div><button class="cta" id="bcGo" disabled>…</button></div>' +
      '<div class="blk"><h3>' + esc(T.poT) + '</h3><p>' + esc(T.poP) + '</p><div class="field"><textarea id="poT" maxlength="1000" style="min-height:90px"></textarea></div><input id="poB" maxlength="40" placeholder="' + esc(T.poBtn) + '"><button class="cta" id="poGo">' + esc(T.poGo) + '</button></div>');
    $('poT').value = T.poDef(t); $('poB').value = '▶️ ' + t;
    $('mgBot').onclick = function () { link('https://t.me/' + a.bot_username); };
    $('mtN').value = a.custom_name || a.title || ''; $('mtD').value = a.custom_desc || '';
    $('mtGo').onclick = function () { $('mtGo').disabled = true; call('meta', { id: a.id, name: $('mtN').value.trim(), desc: $('mtD').value.trim() }).then(function (r) { $('mtGo').disabled = false; if (r.ok) { hap('ok'); toast(T.mtOk); refresh(); } else { hap('err'); toast(T.net); } }); };
    if ($('renGo')) $('renGo').onclick = function () { $('renGo').disabled = true; call('invoice', { id: a.id, renew: 1 }).then(function (r) { $('renGo').disabled = false; if (!r.ok) { hap('err'); return toast(T.inv); } try { tw.openInvoice(r.link, function (st) { if (st === 'paid') { hap('ok'); toast(T.renOk); closeSheet(); setTimeout(refresh, 2500); } }); } catch (e) { link(r.link); } }); };
    $('mnHow').onclick = function () { var u = 'https://jeremstyke.github.io/sayapp/monetize.html' + (lang === 'fr' ? '' : '#en'); try { tw.openLink(u); } catch (e) { window.open(u); } };
    $('mnGo').onclick = function () { $('mnGo').disabled = true; call('ads', { id: a.id, ag: $('mnAg').value, agi: $('mnAgi').value, agx: $('mnAgx').value, open: $('mnOpen').checked }).then(function (r) { $('mnGo').disabled = false; if (r.ok) { hap('ok'); toast(T.mnOk); } else { hap('err'); toast(T.net); } }); };
    var users = 0;
    call('manage', { id: a.id }).then(function (r) {
      if (!r.ok) return;
      // 2 nov 2026 (19h54, Jeremy): size of the app (active players) and the plan above when it is over
      var need = r.mau >= 100000 ? 2 : r.mau >= 10000 ? 1 : 0, tl = '';
      if (r.mau >= 1000 || r.tier || r.overSince) {
        var dl = r.overSince ? Math.max(0, 7 - Math.floor((Date.now() - new Date(r.overSince).getTime()) / 86400000)) : 0;
        tl = '<div class="blk"><h3>' + esc(T.tiT) + '</h3><p>' + esc(T.tiP(r.mau.toLocaleString(lang === 'fr' ? 'fr-FR' : 'en-US'), r.tier)) + '</p>' +
          (r.overPaused ? '<div class="tier">' + esc(T.tiPaused) + '</div>' : need > (r.tier || 0) ? '<div class="tier">' + esc(T.tiOver(dl)) + '</div>' : '') +
          (need > (r.tier || 0) ? (need === 1 ? '<button class="cta gold" id="tiGo">' + esc(T.tiGo1(Number(r.tier1).toLocaleString(lang === 'fr' ? 'fr-FR' : 'en-US'))) + '</button>' : '<button class="cta" id="tiJ">' + esc(T.tiGo2(Number(r.tier2).toLocaleString(lang === 'fr' ? 'fr-FR' : 'en-US'))) + '</button>') : '') + '</div>';
      }
      $('mgTier').innerHTML = tl;
      if ($('tiGo')) $('tiGo').onclick = function () { $('tiGo').disabled = true; call('invoice', { id: a.id, tier: 1 }).then(function (x) { $('tiGo').disabled = false; if (!x.ok) { hap('err'); return toast(T.inv); } try { tw.openInvoice(x.link, function (st) { if (st === 'paid') { hap('ok'); toast(T.tiOk); closeSheet(); setTimeout(refresh, 2500); } }); } catch (e) { link(x.link); } }); };
      if ($('tiJ')) $('tiJ').onclick = function () { link('https://t.me/jeremstyke?direct'); };
      var ad = r.ads || {}; $('mnAg').value = ad.ag || ''; $('mnAgi').value = ad.agi || ''; $('mnAgx').value = ad.agx || ''; $('mnOpen').checked = !!ad.open;
      users = r.users; $('mgU').textContent = users.toLocaleString(lang === 'fr' ? 'fr-FR' : 'en-US');
      var b = $('bcGo');
      if (r.nextAt) { b.textContent = T.bcWait(Math.max(1, Math.ceil((r.nextAt - Date.now()) / 3600000))); return; }
      if (!users) { b.textContent = T.bcNone; return; }
      b.disabled = false; b.textContent = T.bcGo(users);
    });
    $('bcGo').onclick = function () {
      var v = $('bcT').value.trim(); if (v.length < 3) { hap('err'); return toast(T.short); }
      $('bcGo').disabled = true;
      call('broadcast', { id: a.id, text: v }).then(function (r) {
        if (r.ok) { hap('ok'); toast(T.bcOk); $('bcT').value = ''; $('bcGo').textContent = T.bcWait(20); return; }
        hap('err'); if (r.error === 'wait') { $('bcGo').textContent = T.bcWait(Math.max(1, Math.ceil((r.nextAt - Date.now()) / 3600000))); return; }
        $('bcGo').disabled = false; toast(T.net);
      });
    };
    $('poGo').onclick = function () {
      var v = $('poT').value.trim(); if (v.length < 3) { hap('err'); return toast(T.short); }
      $('poGo').disabled = true;
      call('post', { id: a.id, text: v, btn: $('poB').value.trim() }).then(function (r) {
        $('poGo').disabled = false;
        if (r.ok) { hap('ok'); toast(T.poOk); } else { hap('err'); toast(T.net); }
      });
    };
  }

  // ---------- boot ----------
  var q = new URLSearchParams(location.search), sp = '';
  try { sp = tw.initDataUnsafe.start_param || ''; } catch (e) {}
  if (/^demo_[a-z0-9]{4,16}$/.test(sp)) { document.body.style.opacity = '0'; location.replace(PAGES + sp.slice(5) + '/?src=share'); }  // 2 nov 2026: a shared demo opens straight away
  if (q.get('idea')) { idea.value = q.get('idea'); idea.oninput(); W.i = T.wiz.length; wizRender(); }
  if (q.get('tab') === 'apps') tab('apps');
  paintApps();
  refresh().then(function (r) {
    if (!r || !r.ok) return toast(T.net);
    var open = q.get('open') || (sp.indexOf('app_') === 0 ? sp.slice(4) : '');
    var gen = S.apps.filter(function (a) { return a.status === 'generating'; })[0];
    if (gen) return startBuild(gen.id, gen.version > 0);
    if (q.get('tab') === 'support' || sp === 'support') return supOpen();
    // 2 nov 2026 (21h32, Jeremy): shortcuts from the bot menu: ready-made games, referral
    if (q.get('go') === 'tpl' || sp === 'tpl') { tab('create'); return tplList(); }
    if (q.get('go') === 'ref' || sp === 'ref') { supOpen(); return refSheet(); }
    if (open) { var a = S.apps.filter(function (x) { return x.id === open; })[0]; if (a) { tab('apps'); if (sub(a) && !a.bot_username) botSheet(a); else if (q.get('renew') && a.bot_username) manageSheet(a); } }
  });
})();
</script>
</body>
