<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SayApp</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
html,body{margin:0;height:100%;background:#07070d;color:#f4f3ff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;background:radial-gradient(600px 360px at 50% 20%,rgba(139,92,255,.25),transparent 60%)}
b{display:grid;place-items:center;width:72px;height:72px;border-radius:22px;background:linear-gradient(120deg,#8b5cff,#2fd6ff);font-size:34px;margin-bottom:20px;animation:p 2s ease-in-out infinite}
@keyframes p{50%{transform:scale(1.06)}}
h1{margin:0 0 10px;font-size:24px}p{margin:0;max-width:320px;color:#a9a8c4;font-size:15px;line-height:1.5}
</style></head><body><div class="w"><b>&#10022;</b><h1 id="t"></h1><p id="s"></p></div>
<script>
// 3 nov 2026 (09h10, Jeremy): SayApp in maintenance while the credits are being built
var L={fr:['SayApp revient très vite','Nouvelle formule en préparation : crée ton appli Telegram dès 50 ⭐. Tes applis déjà en ligne continuent de tourner normalement.'],en:['SayApp is back very soon','A new plan is on its way: build your Telegram app from 50 ⭐. Your apps already online keep running normally.'],es:['SayApp vuelve muy pronto','Nueva fórmula en camino: crea tu app de Telegram desde 50 ⭐. Tus apps ya en línea siguen funcionando.'],pt:['O SayApp volta muito em breve','Novo plano a caminho: crie seu app do Telegram a partir de 50 ⭐. Seus apps já online continuam funcionando.'],ru:['SayApp скоро вернётся','Готовим новый тариф: приложение в Telegram от 50 ⭐. Твои приложения работают как обычно.'],id:['SayApp segera kembali','Paket baru sedang disiapkan: buat aplikasi Telegram mulai 50 ⭐. Aplikasimu yang sudah online tetap berjalan.'],tr:['SayApp çok yakında geri dönüyor','Yeni paket hazırlanıyor: Telegram uygulamanı 50 ⭐\'dan itibaren oluştur. Yayındaki uygulamaların normal çalışmaya devam eder.']};
var lg='en';try{lg=String(Telegram.WebApp.initDataUnsafe.user.language_code||'').slice(0,2)}catch(e){}if(!L[lg])lg=/^fr/.test(navigator.language||'')?'fr':'en';
document.getElementById('t').textContent=L[lg][0];document.getElementById('s').textContent=L[lg][1];
try{Telegram.WebApp.ready();Telegram.WebApp.expand();Telegram.WebApp.setHeaderColor('#07070d');Telegram.WebApp.setBackgroundColor('#07070d')}catch(e){}
</script></body></html>
