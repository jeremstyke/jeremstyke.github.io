<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

      '<h1>' + esc(M.t) + '</h1><p>' + esc(msg || M.p) + '</p>' + (st.eta ? '<div class="me">⏰ ' + esc(M.eta.replace('{h}', st.eta)) + '</div>' : '') +

    el.hidden = false; mtOn = true; try { tw.disableClosingConfirmation(); } catch (e) {}

    if (q.get('go') === 'tpl' || sp === 'tpl') { tab('create'); return tplList(); }

    if (open) { var a = S.apps.filter(function (x) { return x.id === open; })[0]; if (a) { tab('apps'); if (sub(a) && !a.bot_username) botSheet(a); else if (q.get('renew') && a.bot_username) manageSheet(a); } }
