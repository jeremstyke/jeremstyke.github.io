<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SayApp</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
html,body{margin:0;height:100%;background:#0b0a14;color:#f4f3ff;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
.w{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px max(20px,env(safe-area-inset-left,0px));box-sizing:border-box}
.i{width:84px;height:84px;border-radius:26px;display:grid;place-items:center;font-size:42px;background:linear-gradient(140deg,#8b5cff,#2fd6ff);box-shadow:0 14px 40px rgba(139,92,255,.45);margin-bottom:22px}
h1{margin:0 0 10px;font-size:24px}
p{margin:0;max-width:320px;color:#b9b7d6;font-size:15px;line-height:1.55}
a{display:inline-block;margin-top:24px;padding:12px 20px;border-radius:14px;background:#1b1930;border:1px solid #2c2947;color:#f4f3ff;text-decoration:none;font-weight:600;font-size:14px}
</style>
</head>
<body>
<div class="w">
  <div class="i">🛠️</div>
  <h1 id="t">SayApp est en maintenance</h1>
  <p id="p">On améliore SayApp pour toi. Reviens dans un petit moment, tes applis sont bien gardées.</p>
  <a id="a" href="https://t.me/jeremstyke?direct">Une question ? Écris-nous</a>
</div>
<script>
try { var tw = Telegram.WebApp; tw.ready(); tw.expand(); tw.setHeaderColor('#0b0a14'); tw.setBackgroundColor('#0b0a14'); } catch (e) {}
var l = ((window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user && Telegram.WebApp.initDataUnsafe.user.language_code) || navigator.language || 'en').slice(0, 2);
if (l !== 'fr') { document.documentElement.lang = 'en'; document.getElementById('t').textContent = 'SayApp is under maintenance'; document.getElementById('p').textContent = 'We are improving SayApp for you. Come back in a little while, your apps are safe.'; document.getElementById('a').textContent = 'A question? Write to us'; }
document.getElementById('a').onclick = function (e) { try { Telegram.WebApp.openTelegramLink(this.href); e.preventDefault(); } catch (x) {} };
</script>
</body>
</html>
