<style>
:root{
  --bg:#07070d;--bg2:#0e0e18;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.08);--line:rgba(255,255,255,.09);
  --fg:#f4f3ff;--mute:#a09fbd;--dim:#6d6c88;--v:#8b5cff;--c:#2fd6ff;--p:#ff5ca8;--g:#3ee08f;--y:#ffcc4d;--r:#ff6b6b;
  --grad:linear-gradient(120deg,#8b5cff 0%,#5b7bff 45%,#2fd6ff 100%);
  --gold:linear-gradient(120deg,#ffd76a,#ff9f43);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
h1,h2,h3{font-family:Sora,Inter,system-ui,sans-serif;margin:0;letter-spacing:-.02em;text-wrap:balance}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
[hidden]{display:none!important}
.aur{position:fixed;inset:-20% -30% auto;height:70vh;z-index:0;pointer-events:none;filter:blur(60px);opacity:.55}
.aur i{position:absolute;border-radius:50%;animation:fl 14s ease-in-out infinite alternate}
.aur i:nth-child(1){width:55vw;height:55vw;left:5%;top:10%;background:#6b3cff}
.aur i:nth-child(2){width:45vw;height:45vw;right:5%;top:0;background:#1fb8ff;animation-delay:-5s}
.aur i:nth-child(3){width:35vw;height:35vw;left:40%;top:35%;background:#ff4f9a;opacity:.6;animation-delay:-9s}
@keyframes fl{to{transform:translate(8%,10%) scale(1.15)}}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
.logo{display:flex;align-items:center;gap:9px;font:800 19px Sora,sans-serif;letter-spacing:-.03em}
.logo b{width:30px;height:30px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:15px;box-shadow:0 6px 20px -6px #8b5cff}
.plan{font-size:12px;font-weight:600;padding:6px 11px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--mute)}
.plan.pro{background:var(--gold);color:#2a1700;border:0}
.hero{padding:26px 0 18px}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#cbbcff;background:rgba(139,92,255,.14);border:1px solid rgba(139,92,255,.3);padding:5px 10px;border-radius:99px;margin-bottom:14px}
.hero h1{font-size:34px;line-height:1.08;font-weight:800}
.hero h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mute);margin:10px 0 0;font-size:15.5px}
.comp{position:relative;border-radius:22px;padding:1.5px;background:linear-gradient(140deg,rgba(139,92,255,.7),rgba(47,214,255,.35) 50%,rgba(255,255,255,.06));box-shadow:0 20px 50px -20px rgba(91,123,255,.55)}
.comp .in{border-radius:21px;background:#0d0d18;padding:14px}
textarea{width:100%;min-height:120px;resize:none;border:0;outline:0;background:transparent;color:var(--fg);font:16px/1.5 Inter,system-ui,sans-serif}
textarea::placeholder{color:var(--dim)}
.crow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.cnt{font-size:12px;color:var(--dim)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:13px;padding:8px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:#dcdaf5;white-space:nowrap}
.chip:active{transform:scale(.97)}
.cta{width:100%;margin-top:14px;padding:16px;border-radius:16px;background:var(--grad);font:700 16px Sora,sans-serif;color:#fff;box-shadow:0 14px 30px -12px #6b6bff;position:relative;overflow:hidden}
.cta:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);animation:sh 3.2s infinite}
@keyframes sh{60%,100%{transform:translateX(100%)}}
.cta:disabled{opacity:.5}
.cta.gold{background:var(--gold);color:#2a1700;box-shadow:0 14px 30px -12px #ff9f43}
.ghost{width:100%;padding:14px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:600}
.quota{text-align:center;font-size:12.5px;color:var(--dim);margin-top:10px}
.sec{margin-top:30px}
.sec h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:12px;font-family:Inter,sans-serif;font-weight:600}
.steps{display:grid;gap:10px}
.st{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.st i{flex:0 0 34px;height:34px;border-radius:11px;display:grid;place-items:center;font-style:normal;background:var(--card2);font-size:17px}
.st b{display:block;font-size:14.5px}
.st span{font-size:13px;color:var(--mute)}
.by{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.by button{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600}
.empty{text-align:center;padding:50px 20px;color:var(--mute)}
.empty div{font-size:44px;margin-bottom:10px}
.apps{display:grid;gap:12px;padding-top:14px}
.ac{padding:14px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.ah{display:flex;gap:12px;align-items:center}
.ico{flex:0 0 46px;height:46px;border-radius:14px;display:grid;place-items:center;font:800 19px Sora,sans-serif;color:#fff}
.an{min-width:0;flex:1}
.an b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.an span{display:block;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;font-weight:700;padding:4px 8px;border-radius:99px;white-space:nowrap}
.p-gen{background:rgba(47,214,255,.14);color:var(--c)}.p-demo{background:rgba(139,92,255,.16);color:#c3afff}.p-live{background:rgba(62,224,143,.14);color:var(--g)}.p-err{background:rgba(255,107,107,.14);color:var(--r)}
.abtn{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.abtn button{padding:10px 6px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;font-weight:600}
.exp{margin-top:10px;font-size:12px;font-weight:600;color:#ffcf7a;background:rgba(255,190,90,.08);border:1px solid rgba(255,190,90,.2);padding:7px 10px;border-radius:10px}.exp.x{color:var(--r);background:rgba(255,107,107,.08);border-color:rgba(255,107,107,.25)}
.mg{display:flex;align-items:center;gap:12px;margin-bottom:16px}.mg .ico{flex:0 0 52px;height:52px}.stat{display:flex;gap:10px;margin-bottom:16px}.stat div{flex:1;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:center}.stat b{display:block;font:800 22px Sora,sans-serif}.stat span{font-size:12px;color:var(--mute)}.blk{padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-top:12px}.blk h3{font-size:15px;margin-bottom:4px}.blk p{margin:0 0 10px;font-size:13px;color:var(--mute)}.blk input{width:100%;margin-top:8px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0a0a14;color:var(--fg);font:14px Inter,system-ui,sans-serif;outline:0}
.idea{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;margin-top:10px;font-size:12.5px;line-height:1.4;color:#dcdaf5;background:rgba(139,92,255,.1);border:1px solid rgba(139,92,255,.28);padding:8px 10px;border-radius:10px}.idea b{color:#c3afff;white-space:nowrap}.ideas{display:grid;gap:8px;width:100%;max-width:320px;margin-top:18px;text-align:left}.ideas h4{margin:0;font:600 12px Inter,sans-serif;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}.chip.dyn{border-radius:14px;white-space:normal;text-align:left;flex:0 0 auto;max-width:240px}
.trust{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px}.trust span{font-size:12px;font-weight:600;color:#cfe9ff;background:rgba(47,214,255,.08);border:1px solid rgba(47,214,255,.22);padding:5px 10px;border-radius:99px}
.abtn button.hl{background:var(--gold);color:#2a1700;border:0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:6px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(7,7,13,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.tabs button{flex:1;max-width:220px;padding:11px;border-radius:14px;font-weight:600;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:7px}
.tabs button.on{background:var(--card2);color:var(--fg)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--grad);color:#fff;font-size:11px;display:inline-grid;place-items:center}
/* building overlay */
.ov{position:fixed;inset:0;z-index:20;background:rgba(5,5,10,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px max(20px,env(safe-area-inset-left,0px));text-align:center}
.orb{width:150px;height:150px;border-radius:50%;position:relative;margin-bottom:28px}
.orb:before,.orb:after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#8b5cff,#2fd6ff,#ff5ca8,#8b5cff);animation:spin 3s linear infinite;filter:blur(18px);opacity:.85}
.orb:after{inset:14px;filter:none;background:radial-gradient(circle at 35% 30%,#2a2550,#0b0b16 70%);animation:none}
.orb span{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;z-index:2;animation:pulse 2s ease-in-out infinite}
.orb.ok:before{background:conic-gradient(#3ee08f,#2fd6ff,#3ee08f)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.12)}}
.ov h2{font-size:24px}
.ov p{color:var(--mute);margin:8px 0 0;max-width:340px}
.bl{list-style:none;padding:0;margin:22px 0 0;text-align:left;display:grid;gap:10px;width:100%;max-width:300px}
.bl li{display:flex;gap:10px;align-items:center;color:var(--dim);font-size:14px;transition:color .3s}
.bl li i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:11px;flex:0 0 22px}
.bl li.on{color:var(--fg)}.bl li.on i{border-color:var(--c);border-top-color:transparent;animation:spin 1s linear infinite}
.bl li.dn{color:var(--mute)}.bl li.dn i{border:0;background:var(--g);color:#05210f;animation:none}
.bar{width:100%;max-width:300px;height:6px;border-radius:9px;background:var(--card2);margin-top:22px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--grad);border-radius:9px;transition:width 1s linear}
.ovb{display:grid;gap:10px;width:100%;max-width:320px;margin-top:24px}
/* sheet */
.shbg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);opacity:0;transition:opacity .25s}
.shbg.on{opacity:1}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:560px;margin:0 auto;background:#11111e;border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:10px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.3,1);max-height:92vh;overflow-y:auto}
.sh.on{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sh h2{font-size:22px;margin-bottom:6px}
.sh .sub{color:var(--mute);margin:0 0 16px}
.field{border-radius:16px;background:#0a0a14;border:1px solid var(--line);padding:12px}
.field textarea{min-height:96px}
input.tk{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:#0a0a14;color:var(--fg);font:15px ui-monospace,Menlo,monospace;outline:0}
input.tk:focus{border-color:var(--v)}
.feat{display:grid;gap:10px;margin:6px 0 18px}
.feat div{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.feat div i{font-style:normal;flex:0 0 22px;height:22px;border-radius:50%;background:rgba(62,224,143,.15);color:var(--g);display:grid;place-items:center;font-size:12px;font-weight:800}
.price{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:16px;border-radius:18px;background:linear-gradient(140deg,rgba(255,215,106,.12),rgba(255,159,67,.06));border:1px solid rgba(255,190,90,.3);margin-bottom:12px}
.price b{font:800 32px Sora,sans-serif}
.price span{color:var(--mute);font-size:13px}
.prohead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.prohead>div+div{flex:1;min-width:0}
.prohead>div:first-child{flex:0 0 52px;width:52px;height:52px;border-radius:16px;background:var(--gold);display:grid;place-items:center;font-size:26px;box-shadow:0 10px 30px -10px #ff9f43}
.ol{margin:0 0 14px;padding:0;list-style:none;display:grid;gap:10px;counter-reset:s}
.ol li{counter-increment:s;display:flex;gap:10px;font-size:14px;color:#dcdaf5}
.ol li:before{content:counter(s);flex:0 0 24px;height:24px;border-radius:8px;background:var(--card2);display:grid;place-items:center;font-weight:700;font-size:12px}
.note{font-size:12px;color:var(--dim);text-align:center;margin-top:10px}
/* preview */
.pv{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column}
.pvh{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:#0d0d18;border-bottom:1px solid var(--line)}
.pvh b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.pvh button{padding:8px 12px;border-radius:10px;background:var(--card2);font-size:13px;font-weight:600}
.pv iframe{flex:1;border:0;width:100%;background:#fff}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:60;background:#1b1b2e;border:1px solid var(--line);padding:11px 16px;border-radius:14px;font-size:14px;opacity:0;transition:.25s;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.out{text-align:center;padding:90px 24px}
.out h2{margin:16px 0 8px}
.out p{color:var(--mute)}
.out a{display:inline-block;margin-top:18px;padding:14px 22px;border-radius:14px;background:var(--grad);color:#fff;text-decoration:none;font-weight:700}
.sk{height:76px;border-radius:20px;background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>

    }
    $('ovTry').onclick = function () { $('ov').hidden = true; preview(a); };
    $('ovEd').onclick = function () { $('ov').hidden = true; editSheet(a); };
  }

  // ---------- preview ----------
  function preview(a) {
    S.cur = a; $('pvT').textContent = a.title || 'App';
    $('pvF').src = PAGES + a.id + '/?v=' + a.version + '&t=' + Date.now();
    $('pv').hidden = false; try { tw.BackButton.show(); } catch (e) {}
  }
  function closePv() { $('pv').hidden = true; $('pvF').src = 'about:blank'; try { tw.BackButton.hide(); } catch (e) {} }
  $('pvX').onclick = closePv;
  $('pvE').onclick = function () { var a = S.cur; closePv(); editSheet(a); };
  try { tw.BackButton.onClick(function () { if (!$('pv').hidden) closePv(); else closeSheet(); }); } catch (e) {}

  // ---------- sheets ----------
  function openSheet(html) {
    $('shc').innerHTML = html; $('shbg').hidden = false;
    requestAnimationFrame(function () { $('shbg').classList.add('on'); $('sh').classList.add('on'); });
    try { tw.BackButton.show(); } catch (e) {}
  }
  function closeSheet() {
    $('shbg').classList.remove('on'); $('sh').classList.remove('on');
    setTimeout(function () { $('shbg').hidden = true; }, 250);
    try { if ($('pv').hidden) tw.BackButton.hide(); } catch (e) {}
  }
  $('shbg').onclick = closeSheet;

  function editSheet(a, pre) {
    var L = S.lim || { edits: 0, freeEdits: 3, pro: false }, free = !L.pro && !sub(a);
    openSheet('<h2>' + esc(T.editT) + '</h2><p class="sub">' + esc(a.title || '') + ' · ' + esc(T.editP) + '</p>' +
      '<div class="field"><textarea id="edT" maxlength="2000" placeholder="' + esc(T.editPh) + '"></textarea></div>' +
      (a.ideas && a.ideas.length ? '<p class="sub" style="margin:14px 0 0;font-size:13px">' + esc(T.ideasT) + '</p>' : '') + '<div class="chips" id="edC"></div><button class="cta" id="edGo">' + esc(T.editGo) + '</button>' +
      (free ? '<div class="quota">' + esc(T.editQ(L.edits, L.freeEdits)) + '</div>' : ''));
    if (pre) $('edT').value = pre;
    if (a.ideas && a.ideas.length) a.ideas.forEach(function (c) { var b = document.createElement('button'); b.className = 'chip dyn'; b.textContent = c; b.onclick = function () { hap(); var t = $('edT'); t.value = (t.value ? t.value + ', ' : '') + c; t.focus(); }; $('edC').appendChild(b); });
    else T.editChips.forEach(function (c) { var b = document.createElement('button'); b.className = 'chip'; b.textContent = c; b.onclick = function () { hap(); var t = $('edT'); t.value = (t.value ? t.value + ', ' : '') + c.replace(/^\S+\s/, ''); t.focus(); }; $('edC').appendChild(b); });
    $('edGo').onclick = function () {
      var t = $('edT').value.trim();
      if (t.length < 4) { hap('err'); return toast(T.short); }
      if (free && L.edits >= L.freeEdits) { hap('err'); return proSheet(a, true); }
      $('edGo').disabled = true;
      call('edit', { id: a.id, prompt: t }).then(function (r) {
        if (r.ok) { if (S.lim) S.lim.edits++; startBuild(a.id, true); refresh(); return; }
        $('edGo').disabled = false;
        if (r.error === 'limit') return proSheet(a, true);
        fail(r);
      });
    };
  }

  function proSheet(a, lim) {
    var p = (S.lim && S.lim.price) || 1000, intro = !!(S.lim && S.lim.intro && S.lim.introPrice), ip = intro ? S.lim.introPrice : p;  // 2 nov 2026 (15h02): 250 the 1st month, then 1000
    openSheet('<div class="prohead"><div>⭐</div><div><h2>' + esc(lim ? T.limT : T.proT) + '</h2><p class="sub" style="margin:0">' + esc(lim ? T.limP : T.proP) + '</p></div></div>' +
      '<div class="feat">' + T.feats.map(function (f) { return '<div><i>✓</i>' + esc(f) + '</div>'; }).join('') + '</div>' +
      '<div class="price"><b>' + ip.toLocaleString(lang === 'fr' ? 'fr-FR' : 'en-US') + ' ⭐</b><span>' + esc(intro ? T.introPer : T.per) + '</span></div>' +
      '<button class="cta gold" id="subGo">' + esc(intro ? T.introGo(ip) : T.subGo(p)) + '</button><div class="note">' + esc(intro ? T.introN(p.toLocaleString(lang === 'fr' ? 'fr-FR' : 'en-US')) : T.perN) + '</div>');
    $('subGo').onclick = function () {
      hap(); $('subGo').disabled = true;
      call('invoice', { id: a.id }).then(function (r) {
        $('subGo').disabled = false;
        if (!r.ok) { hap('err'); return toast(T.inv); }
        try {
          tw.openInvoice(r.link, function (st) {
            if (st !== 'paid') return;
            hap('ok'); toast(T.paidW);
            var n = 0, iv = setInterval(function () {
              call('app', { id: a.id }).then(function (q) {
                if ((q.ok && sub(q.app)) || ++n > 10) { clearInterval(iv); toast(T.paidOk); refresh(); tokenSheet(q.app || a); }
              });
            }, 2000);
          });
        } catch (e) { link(r.link); }
      });
    };
  }
  function limitSheet() {
    var list = S.apps.filter(function (a) { return a.version > 0; });
    if (list.length === 1) return proSheet(list[0], true);
    if (!list.length) { toast(T.limP); return; }
    openSheet('<div class="prohead"><div>⭐</div><div><h2>' + esc(T.limT) + '</h2><p class="sub" style="margin:0">' + esc(T.limP) + '</p></div></div><p class="sub">' + esc(T.limPick) + '</p><div class="apps" id="lp"></div>');
    list.slice(0, 6).forEach(function (a) {
      var b = document.createElement('button'); b.className = 'ac'; b.style.textAlign = 'left'; b.style.width = '100%';
      b.innerHTML = '<div class="ah"><div class="ico" style="background:' + col(a.id) + '">' + esc((a.title || 'A').charAt(0).toUpperCase()) + '</div><div class="an"><b>' + esc(a.title || 'App') + '</b></div></div>';
      b.onclick = function () { proSheet(a, false); }; $('lp').appendChild(b);
    });
  }
  function launch(a) {
    if (a.bot_username && sub(a)) return link('https://t.me/' + a.bot_username);
    if (sub(a) || (S.lim && S.lim.pro && sub(a))) return tokenSheet(a);
    proSheet(a, false);
  }
  function tokenSheet(a) {
    openSheet('<h2>' + esc(T.tkT) + '</h2><p class="sub">' + esc(T.tkP) + '</p><ol class="ol">' + T.tkS.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol>' +
      '<button class="ghost" id="tkBF" style="margin-bottom:12px">🤖 ' + esc(T.tkBF) + '</button>' +
      '<input class="tk" id="tkI" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="' + esc(T.tkPh) + '">' +
      '<button class="cta" id="tkGo">' + esc(T.tkGo) + '</button><div class="note">🔒 ' + esc(T.tkN) + '</div>');
    $('tkBF').onclick = function () { link('https://t.me/BotFather'); };
    $('tkGo').onclick = function () {
      var v = $('tkI').value.trim();
      if (!/^\d{6,12}:[A-Za-z0-9_-]{30,}$/.test(v)) { hap('err'); return toast(T.tkBad); }
      $('tkGo').disabled = true;
      call('plug', { id: a.id, token: v }).then(function (r) {
        $('tkGo').disabled = false;
        if (!r.ok) { hap('err'); return toast(r.error === 'sub' ? T.inv : T.tkBad); }
        $('tkI').value = ''; hap('ok'); refresh();
        openSheet('<div style="text-align:center;padding:10px 0"><div style="font-size:54px">🎉</div><h2 style="margin-top:8px">' + esc(T.liveT) + '</h2><p class="sub">' + esc(T.liveP(r.bot)) + '</p></div><button class="cta" id="lvGo">' + esc(T.openBot) + '</button>');
        $('lvGo').onclick = function () { link('https://t.me/' + r.bot); };
      });
    };
  }

  // ---------- Pro tools: users, announcement, channel post (2 nov 2026, 14h40) ----------
  function manageSheet(a) {
    var t = a.title || 'App';
    openSheet('<div class="mg"><div class="ico" style="background:' + col(a.id) + '">' + esc(t.charAt(0).toUpperCase()) + '</div><div class="an"><h2 style="margin:0">' + esc(t) + '</h2><span>@' + esc(a.bot_username) + '</span></div></div>' +
      '<div class="stat"><div><b id="mgU">…</b><span>' + esc(T.users) + '</span></div><div><b>⭐</b><span>Pro</span></div></div>' +
      '<button class="ghost" id="mgBot">' + esc(T.openMyBot) + '</button>' +
      (!a.sub_recurring && a.sub_until ? '<div class="blk"><h3>' + esc(T.renT) + '</h3><p>' + esc(T.renP(new Date(a.sub_until).toLocaleDateString(lang === 'fr' ? 'fr-FR' : 'en-US'))) + '</p><button class="cta gold" id="renGo">' + esc(T.renGo(((S.lim && S.lim.price) || 1000).toLocaleString(lang === 'fr' ? 'fr-FR' : 'en-US'))) + '</button></div>' : '') +
      '<div class="blk"><h3>' + esc(T.bcT) + '</h3><p>' + esc(T.bcP) + '</p><div class="field"><textarea id="bcT" maxlength="1000" style="min-height:80px" placeholder="' + esc(T.bcPh) + '"></textarea></div><button class="cta" id="bcGo" disabled>…</button></div>' +
      '<div class="blk"><h3>' + esc(T.poT) + '</h3><p>' + esc(T.poP) + '</p><div class="field"><textarea id="poT" maxlength="1000" style="min-height:90px"></textarea></div><input id="poB" maxlength="40" placeholder="' + esc(T.poBtn) + '"><button class="cta" id="poGo">' + esc(T.poGo) + '</button></div>');
    $('poT').value = T.poDef(t); $('poB').value = '▶️ ' + t;
    $('mgBot').onclick = function () { link('https://t.me/' + a.bot_username); };
    if ($('renGo')) $('renGo').onclick = function () { $('renGo').disabled = true; call('invoice', { id: a.id, renew: 1 }).then(function (r) { $('renGo').disabled = false; if (!r.ok) { hap('err'); return toast(T.inv); } try { tw.openInvoice(r.link, function (st) { if (st === 'paid') { hap('ok'); toast(T.renOk); closeSheet(); setTimeout(refresh, 2500); } }); } catch (e) { link(r.link); } }); };
    var users = 0;
    call('manage', { id: a.id }).then(function (r) {
      if (!r.ok) return;
      users = r.users; $('mgU').textContent = users.toLocaleString(lang === 'fr' ? 'fr-FR' : 'en-US');
      var b = $('bcGo');
      if (r.nextAt) { b.textContent = T.bcWait(Math.max(1, Math.ceil((r.nextAt - Date.now()) / 3600000))); return; }
      if (!users) { b.textContent = T.bcNone; return; }
      b.disabled = false; b.textContent = T.bcGo(users);
    });
    $('bcGo').onclick = function () {
      var v = $('bcT').value.trim(); if (v.length < 3) { hap('err'); return toast(T.short); }
      $('bcGo').disabled = true;
      call('broadcast', { id: a.id, text: v }).then(function (r) {
        if (r.ok) { hap('ok'); toast(T.bcOk); $('bcT').value = ''; $('bcGo').textContent = T.bcWait(20); return; }
        hap('err'); if (r.error === 'wait') { $('bcGo').textContent = T.bcWait(Math.max(1, Math.ceil((r.nextAt - Date.now()) / 3600000))); return; }
        $('bcGo').disabled = false; toast(T.net);
      });
    };
    $('poGo').onclick = function () {
      var v = $('poT').value.trim(); if (v.length < 3) { hap('err'); return toast(T.short); }
      $('poGo').disabled = true;
      call('post', { id: a.id, text: v, btn: $('poB').value.trim() }).then(function (r) {
        $('poGo').disabled = false;
        if (r.ok) { hap('ok'); toast(T.poOk); } else { hap('err'); toast(T.net); }
      });
    };
  }

  // ---------- boot ----------
  var q = new URLSearchParams(location.search), sp = '';
  try { sp = tw.initDataUnsafe.start_param || ''; } catch (e) {}
  if (q.get('idea')) { idea.value = q.get('idea'); idea.oninput(); }
  if (q.get('tab') === 'apps') tab('apps');
  paintApps();
  refresh().then(function (r) {
    if (!r || !r.ok) return toast(T.net);
    var open = q.get('open') || (sp.indexOf('app_') === 0 ? sp.slice(4) : '');
    var gen = S.apps.filter(function (a) { return a.status === 'generating'; })[0];
    if (gen) return startBuild(gen.id, gen.version > 0);
    if (open) { var a = S.apps.filter(function (x) { return x.id === open; })[0]; if (a) { tab('apps'); if (sub(a) && !a.bot_username) tokenSheet(a); else if (q.get('renew') && a.bot_username) manageSheet(a); } }
  });
})();
</script>
</body>
</html>
