function gameContests() {
  const X = GC[LG], md = ['🥇', '🥈', '🥉'];
  const rows = (top, unit, pz, mn) => (top || []).slice(0, 5).map((x, i) => `<div class="rk${x.me ? ' me' : ''}"><span>${md[x.rank - 1] || x.rank + '.'} ${esc(x.name)}${x.me ? ' (' + esc(L.you) + ')' : ''}</span><span>${Number(x.n).toLocaleString(LG)} ${esc(unit)}${pz && pz[x.rank - 1] && Number(x.n) >= (mn || 1) ? ' · ' + money(pz[x.rank - 1]) : ''}</span></div>`).join('') || `<p class="what">${esc(X.none)}</p>`;
  const meL = (c, unit) => c && c.me && c.me.rank ? `<p class="what" style="font-size:13px;margin:8px 0 0">${esc(X.me)} : <b>#${c.me.rank}</b> · ${Number(c.me.n).toLocaleString(LG)} ${esc(unit)}</p>` : '';
  let h = '';
  const m = S && S.contest;
  if (m && m.on) {
    const pz = m.prizes || [];
    h += `<section class="card" style="--c:#ffd43b"><div class="lbl">${esc(X.mT)}</div><p class="what" style="margin:0 0 8px">${esc(X.mX)} <b>${pz.map((x) => money(x)).join(' / ')}</b> ${esc(X.ton)}.${Number(m.min) > 1 ? ' ' + esc(X.mMin(m.min)) : ''}</p>`
      + rows(m.top, X.fr, pz, Number(m.min) || 1) + meL(m, X.fr) + `<button class="ghost" data-gc="mct" style="margin-top:12px">${esc(X.mGo)}</button></section>`;
  }
  const g = (TP && TP.gp_contest) || (S && S.tap && S.tap.gp_contest);
  if (g && g.on) {
    const pz = g.prizes || [];
    h += `<section class="card" style="--c:#2ee6ff"><div class="lbl">${esc(X.gT)}</div><p class="what" style="margin:0 0 8px">${esc(X.gX)} <b>${pz.map((x) => money(x)).join(' / ')}</b> ${esc(X.ton)}.${Number(g.min) > 1 ? ' ' + esc(X.gMin.replace('{n}', g.min)) : ''}</p>`

  return h;
}

// ---------- page ----------
function tabs() {
  const T = [['tap', '💎', L.tTap], ['con', '🏆', L.tCon], ['pro', '🔗', L.tPro]];
  // 16 oct 2026 (Jeremy, 8h17): the Programs tab is back (the 3 games and what each pays per friend), the Tasks tab is gone; InsideAds stays out of Earn
  $('tabs').innerHTML = T.map(([k, e, l]) => `<button data-t="${k}" class="${k === TAB ? 'on' : ''}"><span>${e}</span>${esc(l)}</button>`).join('');
  $('tabs').querySelectorAll('[data-t]').forEach((b) => b.onclick = () => { haptic(); TAB = b.dataset.t; render(); window.scrollTo(0, 0); });
}
function render() {
  tabs();
  if (!INIT) { $('app').innerHTML = `<section class="card"><p class="what">${esc(L.noApp)}</p></section>` + (TAB === 'pro' ? proTab() : ''); bind(); return; }

  $('app').innerHTML = TAB === 'tap' ? tapTab() : TAB === 'tsk' ? taskTab() : TAB === 'con' ? conTab() : proTab();

}
function bind() {

  q('wchg', (e) => { e.preventDefault(); haptic(); EDIT = true; render(); setTimeout(showWalForm, 200); });

    const a = ($('wa').value || '').trim(); if (!a) return; haptic(); $('ws').disabled = true;
    let r; try { r = await call({ action: 'wallet', addr: a }); } catch (e) { r = null; }
    if (!r || !r.ok) { toast(L.bad); $('ws').disabled = false; return; }
    S = r; TP = r.tap || TP; EDIT = false; toast(L.saved); render();
  });
  const link = S && S.earn && S.earn.link;

  q('cgo', () => { haptic(); TAB = 'tap'; render(); window.scrollTo(0, 0); });

  q('tsj', () => { haptic('medium'); track('sub', 'open'); open('https://t.me/jeremstyke'); });

  document.querySelectorAll('[data-gc]').forEach((b) => b.onclick = () => { haptic('medium'); track('con_' + b.dataset.gc, 'open'); open(GCURL[b.dataset.gc]); });
  document.querySelectorAll('[data-tinv]').forEach((b) => b.onclick = () => { haptic('medium'); track('inv_' + b.dataset.tinv, 'open'); open(TINV[b.dataset.tinv][1]); });
  document.querySelectorAll('[data-task]').forEach((b) => b.onclick = () => { haptic('medium'); track('task_' + b.dataset.task, 'open'); open(TASKURL[b.dataset.task]); });
  q('subj', () => { haptic('medium'); track('sub', 'open'); open('https://t.me/jeremstyke'); });

  document.querySelectorAll('[data-open]').forEach((b) => b.onclick = () => { haptic('medium'); track(b.dataset.open, 'open'); open(PROGS.find((x) => x.k === b.dataset.open).url); });
}

if (INIT) call({}).then((r) => { if (r && r.ok) { S = r; TP = r.tap; render(); askWrite(); } }).catch(() => {});
// Telegram's own "allow messages from the bot" request, asked once, 2 s after loading
function askWrite() {
  let done = false; try { done = localStorage.getItem('earn_wa') === '1'; } catch (e) {}
  if (done || !tw || typeof tw.requestWriteAccess !== 'function') return;
  setTimeout(() => {
    try {
      tw.requestWriteAccess((ok) => {
        try { localStorage.setItem('earn_wa', '1'); } catch (e) {}
        track('write', ok ? 'allowed' : 'refused');
        if (ok) toast(L.notif);
      });
    } catch (e) {}
  }, 2000);
}
