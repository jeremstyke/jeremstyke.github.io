// 15 oct 2026: the app was too long: 4 tabs at the bottom. Earnings (balance, wallet, payment board), the diamond, the contest, the programs.
// 15 oct 2026: links ?startapp=tap_... (and the bot button ?tab=tap) open the diamond tab directly
const ESP = String((tw && tw.initDataUnsafe && tw.initDataUnsafe.start_param) || '') + ' ' + (new URLSearchParams(location.search).get('tab') || '');
let ETAB = /(^|\s)contest/.test(ESP) ? 'contest' : /(^|\s)tap/.test(ESP) ? 'tap' : 'home';
function tabOf(el, inList) {
  if (el.id === 'tapbox') return 'tap';
  if (/^🏆/.test((el.querySelector('.lbl') || {}).textContent || '')) return 'contest';
  if (!inList) return 'home';
  if (el.id === 'adm' || el.querySelector('[data-join]')) return 'home';
  return 'progs';
}
function applyTab() {
  if (!S) { ['wal', 'list'].forEach((id) => { const box = $(id); if (box) [...box.children].forEach((el) => { el.style.display = ''; }); }); return; }
  [['wal', false], ['list', true]].forEach(([id, inList]) => { const box = $(id); if (box) [...box.children].forEach((el) => { el.style.display = tabOf(el, inList) === ETAB ? '' : 'none'; }); });
  let nav = $('etabs');
  if (!nav) {
    nav = document.createElement('nav'); nav.id = 'etabs';
    nav.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(14,10,30,.96);border-top:1px solid rgba(255,255,255,.1);padding:6px 6px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)';
    document.body.appendChild(nav); document.body.style.paddingBottom = '84px';
  }
  const T = [['home', '💰', FR ? 'Gains' : 'Earnings'], ['tap', '💎', 'Tap'], ['contest', '🏆', FR ? 'Concours' : 'Contest'], ['progs', '🔗', FR ? 'Programmes' : 'Programs']]
    .filter(([k]) => k !== 'tap' || (S && S.tap && S.tap.on)).filter(([k]) => k !== 'contest' || (S && S.contest && S.contest.on));
  nav.style.gridTemplateColumns = `repeat(${T.length},1fr)`;
  nav.innerHTML = T.map(([k, e, l]) => `<button data-et="${k}" style="background:none;border:0;color:${k === ETAB ? '#fff' : 'rgba(255,255,255,.55)'};font:600 12px system-ui;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer"><span style="font-size:22px">${e}</span>${l}</button>`).join('');
  nav.querySelectorAll('[data-et]').forEach((b) => b.onclick = () => { haptic(); ETAB = b.dataset.et; applyTab(); window.scrollTo(0, 0); });
}
const renderBase = render;
render = function () { renderBase.apply(this, arguments); applyTab(); };
// 15 oct 2026: the Programs tab was too long: each program is a compact card (icon, name, what you earn, Copy / Share);
// tapping its title opens the details (explanation, stats, how it works)
(() => {
  const css = document.createElement('style');
  css.textContent = '#list .card.mini .what,#list .card.mini .push,#list .card.mini .lbl,#list .card.mini .link,#list .card.mini .stats,#list .card.mini .warn,#list .card.mini details,#list .card.mini .ghost[data-open]{display:none}'
    + '#list .card.mini{padding-top:12px;padding-bottom:12px}#list .card.mini .row2{margin:10px 0 0}#list .card.mini .btn[data-open]{margin-top:10px}'
    + '#list .card.mini.ext .btn[data-open]{display:none}#list .card .head{cursor:pointer;position:relative}#list .card .head::after{content:"▾";position:absolute;right:0;top:4px;opacity:.5;transition:transform .2s}#list .card:not(.mini) .head::after{transform:rotate(180deg)}';
  document.head.appendChild(css);
})();
const EOPEN = {};
function miniCards() {
  const box = $('list'); if (!box || !S) return;
  [...box.children].forEach((el, i) => {
    if (tabOf(el, true) !== 'progs' || !el.classList.contains('card')) return;
    const k = (el.querySelector('h2') || {}).textContent || String(i);
    el.classList.toggle('mini', !EOPEN[k]); el.classList.toggle('ext', !!el.querySelector('.btn[data-open]'));
    const h = el.querySelector('.head'); if (h && !h.dataset.mini) { h.dataset.mini = '1'; h.onclick = () => { haptic(); EOPEN[k] = !EOPEN[k]; el.classList.toggle('mini', !EOPEN[k]); el.classList.toggle('ext', !!el.querySelector('.btn[data-open]')); }; }
  });
}
const applyTabBase = applyTab;
applyTab = function () { applyTabBase.apply(this, arguments); miniCards(); };
render();
if (INIT) call({}).then((r) => { if (r && r.ok) { S = r; render(); askWrite(); } }).catch(() => {});
// 15 oct 2026: Telegram's own "allow messages from the bot" request, so Earn can tell people when they earn or get paid
// (people who open the mini app from a link never started the bot, and the bot cannot write first). Asked once, 2 s after loading.
function askWrite() {
  let done = false; try { done = localStorage.getItem('earn_wa') === '1'; } catch (e) {}
  if (done || !tw || typeof tw.requestWriteAccess !== 'function') return;
  setTimeout(() => {
    try {
      tw.requestWriteAccess((ok) => {
        try { localStorage.setItem('earn_wa', '1'); } catch (e) {}
        call({ action: 'track', prog: 'write', kind: ok ? 'allowed' : 'refused' }).catch(() => {});
        if (ok) toast(FR ? '✅ Tu seras prévenu de tes gains et paiements' : '✅ You will be told about your earnings and payouts');
      });
    } catch (e) {}
  }, 2000);
}
