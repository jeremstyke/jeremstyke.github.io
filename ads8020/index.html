  document.querySelectorAll('[data-fc]').forEach((c) => { c.onclick = () => { readF(); const k = c.dataset.fc; F.cats = F.cats.includes(k) ? F.cats.filter((x) => x !== k) : F.cats.concat(k); c.classList.toggle('on'); hap(); }; });
  document.querySelectorAll('[data-pd]').forEach((c) => { c.onclick = async () => { hap(); await api('chat_set', { chat_id: c.dataset.c, per_day: Number(c.dataset.pd) }); load(); }; });
  document.querySelectorAll('[data-cc]').forEach((c) => { c.onclick = async () => { hap(); const ch = S.chats.find((x) => String(x.chat_id) === c.dataset.c); const cur = (ch && ch.cats) || []; const k = c.dataset.cc; const cats = cur.includes(k) ? cur.filter((x) => x !== k) : cur.concat(k); ch.cats = cats; c.classList.toggle('on'); await api('chat_set', { chat_id: c.dataset.c, cats }); }; });
  document.querySelectorAll('[data-adm]').forEach((b) => { b.onclick = async () => { hap(); b.disabled = true; await api(b.dataset.adm, { id: Number(b.dataset.id), ok: b.dataset.ok === '1' }); load(); }; });
  document.querySelectorAll('[data-k]').forEach((b) => { b.onclick = async () => {
    const k = b.dataset.k, id = Number(b.dataset.id || 0);
    if (k === 'next') { if (!stepOk()) { hap('error'); return; } hap(); STEP = Math.min(3, STEP + 1); return draw(); }
    if (k === 'prev') { readF(); hap(); STEP = Math.max(1, STEP - 1); return draw(); }
    if (k === 'preview') { hap(); PREV = true; STEP = 1; return draw(); }
    if (k === 'paynow') { if (!(S.cfg && S.cfg.live)) { hap('error'); return toast(L.waitH); } return pay(PAYM); }
    if (k === 'gobal') { hap(); TAB = 'aff'; return draw(); }
    if (k === 'advwait') { hap('success'); await api('adv_wait'); S.me = Object.assign({}, S.me, { adv_waitlist: true }); toast(L.waitOk); return draw(); }
    if (k === 'addchan') return openUrl(addLinks().chan);
    if (k === 'addgroup') return openUrl(addLinks().group);
    if (k === 'paystars') return pay('stars');
    if (k === 'payusdt') return pay('usdt');
    if (k === 'paybal') return pay('bal');
    if (k === 'paydraft') return pay('stars', id);
    if (k === 'usdtdraft') return pay('usdt', id);
    if (k === 'deldraft' || k === 'pause' || k === 'resume') { hap(); await api({ deldraft: 'camp_del', pause: 'camp_pause', resume: 'camp_resume' }[k], { id }); return load(); }
    if (k === 'savewal') { hap(); const r = await api('wallet', { wallet: $('#wal').value.trim() }); if (r && r.ok) { toast('✅'); load(); } else toast(errT(r)); return; }
    if (k === 'withdraw') { hap(); b.disabled = true; const r = await api('withdraw'); if (r && r.ok) { hap('success'); toast('✅ ' + money(r.usd)); load(); } else { b.disabled = false; toast(errT(r)); } return; }
    if (k === 'share') { const ref = 'https://t.me/' + S.bot + '?start=r' + S.uid; const t = FR ? '💰 Gagne de l\'argent avec ta chaîne ou ton groupe Telegram : 80 % de chaque clic reversés, avec 80/20 Ads.' : '💰 Earn money with your Telegram channel or group: 80 % of every click paid to you, with 80/20 Ads.'; return openUrl('https://t.me/share/url?url=' + encodeURIComponent(ref) + '&text=' + encodeURIComponent(t)); }
  }; });
}
document.querySelectorAll('nav button').forEach((b) => { b.onclick = () => { if (!S) return; hap(); readF(); TAB = b.dataset.t; draw(); }; });

if (/^c\d+_\d+$/.test(SP)) click(); else { if (SP === 'adv') TAB = 'adv'; load(); }
})();
</script>
