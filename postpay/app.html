 ov.innerHTML='<div class="ovh"><b>'+e(T.cT.replace('{t}',c.title))+'</b><i id="cx">✕</i></div><p class="ep" style="margin:0 14px">'+c.price+' USDT · 24 h</p>'
 +'<label class="fl">'+T.cTxt+'</label><textarea class="in" id="ct" maxlength="3500"></textarea><div class="cnt" id="cc">0 / 3500</div>'
 +'<label class="fl">'+T.cBtn+'</label><input class="in" id="cb" maxlength="40" placeholder="'+e(T.cBtnPh)+'">'
 +'<label class="fl">'+T.cUrl+'</label><input class="in" id="cu" inputmode="url" placeholder="https://t.me/...">'
 +'<a class="lnk" id="cm" style="text-align:left;margin:12px 14px 0">'+T.cMedia+'</a><input type="file" id="cf" accept="image/*" style="display:none"><div class="cnt" id="cph" style="display:none;text-align:left">'+T.cPh+'</div>'
 +'<label class="fl">'+T.cPrev+'</label><div class="box" style="margin:6px 14px 0"><img id="ci" style="display:none;width:100%;border-radius:10px;margin-bottom:8px"><div class="prev" id="cp"></div><div class="fakebtn" id="cpb">'+e(T.cBtnPh)+'</div></div>'
 +'<button class="payb" id="cs">'+T.cSend+'</button>';
 document.body.appendChild(ov);const $=id=>ov.querySelector('#'+id);
 let photo='';const lim=()=>photo?1024:3500;
 const upd=()=>{$('cp').textContent=$('ct').value||'...';$('cpb').textContent=$('cb').value||T.cBtnPh;$('cc').textContent=$('ct').value.length+' / '+lim();$('ct').maxLength=lim();};
 $('ct').oninput=upd;$('cb').oninput=upd;upd();
 $('cx').onclick=()=>{hap();ov.remove();};
 // 13 nov 2026 (Jeremy): the photo is chosen here too (resized to 1280 px JPEG), no need for the bot chat
 const setPhoto=p=>{photo=p;$('ci').src=p||'';$('ci').style.display=p?'block':'none';$('cph').style.display=p?'block':'none';$('cm').textContent=p?T.cMediaDel:T.cMedia;upd();};
 $('cm').onclick=()=>{hap();if(photo)return setPhoto('');$('cf').click();};
 $('cf').onchange=()=>{const f=$('cf').files[0];if(!f)return;const img=new Image();img.onload=()=>{const k=Math.min(1,1280/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(img.src);setPhoto(cv.toDataURL('image/jpeg',0.82));};img.onerror=()=>toast(T.cErr.photo,1);img.src=URL.createObjectURL(f);$('cf').value='';};
 // 14 nov 2026 (Jeremy): the server knows the form was opened (reminder later if the ad is not sent)
 post('/api/draft',{channelId:c.id}).catch(()=>{});
 // 14 nov 2026 (Jeremy): checked before sending, the wrong field is shown in red with a message that stays
 const bad=(id,k)=>{const f=$(id);f.style.borderColor='#ef4444';f.focus();f.oninput=((o)=>function(){f.style.borderColor='';if(o)o.apply(this,arguments);})(f.oninput);try{tg.HapticFeedback.notificationOccurred('error')}catch(_){}tg.showAlert(T.cErr[k]);};
 $('cs').onclick=async()=>{hap();
  let u=$('cu').value.trim();if(u&&!/^[a-z]+:/i.test(u)&&!u.startsWith('@')){u='https://'+u;}
  if(!$('ct').value.trim()||$('ct').value.length>lim())return bad('ct','text');
  if(!$('cb').value.trim())return bad('cb','btn');
  if(!/^@[A-Za-z0-9_]{4,}$/.test(u)&&!/^https?:\/\/[^\s.]+\.[^\s]+$/i.test(u))return bad('cu','url');
  const b=$('cs');b.disabled=true;const r=await post('/api/order',{channelId:c.id,text:$('ct').value,btnText:$('cb').value,btnUrl:u,photo:photo||undefined}).catch(()=>({error:'send'}));b.disabled=false;
  if(r.ok){try{tg.HapticFeedback.notificationOccurred('success')}catch(_){}ov.remove();tg.showAlert(T.cOk);const t=document.querySelector('.tabs b[data-t=ord]');if(t)t.click();}
  else{const f={text:'ct',btn:'cb',url:'cu'}[r.error];if(f)bad(f,r.error);else tg.showAlert(T.cErr[r.error]||'Error: '+r.error);}};
}
async function orders(quiet){
 const box=document.getElementById('ord');if(!box||!tg.initData)return;const d=await post('/api/orders',{});if(d.error)return;
 const np=(d.requests||[]).filter(o=>o.s==='pending').length+(d.review||[]).length;const tb=document.querySelector('.tabs b[data-t=ord]');if(tb)tb.innerHTML=T.tOrd+(np?'<sup>'+np+'</sup>':'');
 if(quiet&&!np)return box.innerHTML||void 0;
 const when=t=>new Date(t).toLocaleDateString((lang==='en'?'en-GB':lang),{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
 const ad=o=>(o.preview?'<div class="pv">'+e(o.preview)+'</div>':'')+(o.btnText?'<div class="bt">🔘 '+e(o.btnText)+(o.btnUrl?' → '+e(o.btnUrl):'')+'</div>':'');
 let h='';
 if(d.review&&d.review.length){h+='<div class="sh">'+T.oRev+'</div>'+d.review.map(c=>'<div class="oc"><div class="h"><span style="white-space:normal">'+e(c.title)+(c.banned?' · '+T.oBan:'')+'</span><span>'+c.price+' USDT</span></div><div class="s">'+(c.username?'@'+e(c.username)+' · ':'')+fmtN(c.members)+' '+T.members+' · '+c.perDay+T.perDay+' · '+e(c.owner)+'</div><div class="ac">'+(c.username?'<button class="gh" data-see="'+e(c.username)+'">'+T.oView+'</button>':'')+'<button data-rv="'+e(c.id)+'" data-ok="1">'+T.oVal+'</button><button class="no" data-rv="'+e(c.id)+'" data-ok="0">'+T.oRef+'</button></div></div>').join('');}
 const rq=d.requests||[];
 if(rq.length){h+='<div class="sh">'+T.oReq+'</div>'+rq.map(o=>'<div class="oc"><div class="h"><span style="white-space:normal">'+e(o.ch)+'</span><span>'+o.price+' USDT</span></div><div class="s">'+(T.oSt[o.s]||o.s)+' · '+T.oYou+' '+o.you+' USDT · '+when(o.at)+'</div>'+ad(o)+(o.s==='pending'?'<div class="ac"><button data-dc="'+e(o.id)+'" data-ok="1">'+T.oAcc+'</button><button class="no" data-dc="'+e(o.id)+'" data-ok="0">'+T.oRef+'</button></div>':'')+'</div>').join('');}
 const mo=d.orders||[];
 h+='<div class="sh">'+T.oMine+'</div>'+(mo.length?mo.map(o=>'<div class="oc"><div class="h"><span style="white-space:normal">'+e(o.ch)+'</span><span>'+o.price+' USDT</span></div><div class="s">'+(T.oSt[o.s]||o.s)+(o.s==='posted'||o.s==='done'?' · 👆 '+o.clicks:'')+' · '+when(o.at)+'</div>'+ad(o)+(o.s==='approved'?'<div class="ac"><button data-pay="'+e(o.id)+'">'+T.oPay+' '+o.price+' USDT</button></div>':'')+(o.link&&o.s==='posted'?'<div class="ac"><button class="gh" data-lk="'+e(o.link)+'">'+T.oSee+'</button></div>':'')+'</div>').join(''):'<p class="ep" style="margin:10px 2px">'+T.oNone+'</p>');
 box.innerHTML=h;
 box.querySelectorAll('[data-see]').forEach(b=>b.onclick=()=>{hap();tg.openTelegramLink('https://t.me/'+b.dataset.see);});
 box.querySelectorAll('[data-lk]').forEach(b=>b.onclick=()=>{hap();tg.openTelegramLink(b.dataset.lk);});
 box.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{hap();location.href='/app?pay='+encodeURIComponent(b.dataset.pay);});
 box.querySelectorAll('[data-dc]').forEach(b=>b.onclick=async()=>{hap();b.disabled=true;const r=await post('/api/decide',{orderId:b.dataset.dc,ok:b.dataset.ok==='1'});
  if(r.ok){toast(T.oDone);orders();}else if(r.error==='wallet'){toast(T.oNeedW,1);setTimeout(()=>location.href='/app?wallet=1',1200);}else{toast(r.error==='busy'?T.busy:'Error: '+r.error,1);b.disabled=false;}});
 box.querySelectorAll('[data-rv]').forEach(b=>b.onclick=async()=>{hap();b.disabled=true;const r=await post('/api/review',{id:b.dataset.rv,ok:b.dataset.ok==='1'});if(r.ok){toast(T.oDone);orders();}else{toast('Error: '+r.error,1);b.disabled=false;}});
}
async function mine(){
 const box=document.getElementById('mine');const d=tg.initData?await post('/api/mine',{}):{channels:[]};nCh=(d.channels||[]).length;
 if(!d.channels||!d.channels.length){box.innerHTML='<div class="empty">'+T.mNone+'<br><button id="addc" style="margin-top:16px;padding:12px 20px">'+T.mAdd+'</button></div>';addc.onclick=addCh;return;}
 box.innerHTML=d.channels.map(c=>{const col=COLORS[Math.abs(String(c.id).split('').reduce((a,x)=>a+x.charCodeAt(0),0))%COLORS.length];

  +'<div class="mrow"><div class="l">'+T.mPrice+'<small>'+T.mMax+' '+c.max+' USDT</small></div><div class="stp"><i data-d="-1">−</i><span class="pv">'+(c.price||1)+' USDT</span><i data-d="1">+</i></div></div>'
  +'<div class="mrow"><div class="l">'+T.mPer+'<small>'+T.mPerS+'</small></div><div class="seg">'+[1,2,3,4,5].map(n=>'<i data-n="'+n+'" class="'+(n===c.perDay?'on':'')+'">'+n+'</i>').join('')+'</div></div>'
  +'<div class="mrow"><div class="l">'+T.mTheme+'</div><select class="sel th">'+Object.keys(TH).map(k=>'<option value="'+k+'"'+(k===c.theme?' selected':'')+'>'+TH[k][1]+'</option>').join('')+'</select></div>'
  +'<div class="mrow"><div class="l">'+T.mLang+'</div><select class="sel lg">'+[...Object.entries(LN),['other',T.other]].map(x=>'<option value="'+x[0]+'"'+(x[0]===c.lang?' selected':'')+'>'+x[1]+'</option>').join('')+'</select></div>'
  +'<div class="mrow"><div class="l">'+T.mLink+'<small>'+T.mLinkS+'</small></div><div class="lb"><i class="cpl">'+T.eCopy+'</i><i class="shl">'+T.eShare+'</i></div></div>'
  +'</div>';}).join('');
 box.querySelectorAll('.av').forEach(a=>{const img=new Image();img.onload=()=>{a.textContent=''};img.onerror=()=>{a.style.backgroundImage='none'};img.src=a.style.backgroundImage.slice(5,-2)});
 d.channels.forEach((c,i)=>{const card=box.querySelectorAll('.mc')[i];let st={price:c.price||1,perDay:c.perDay,theme:c.theme,lang:c.lang},tm;const stepOf=p=>p<10?0.5:1;
  const send=()=>{clearTimeout(tm);tm=setTimeout(async()=>{const r=await post('/api/channel',{id:c.id,...st});if(r.ok){toast(T.mSaved);try{tg.HapticFeedback.notificationOccurred('success')}catch(_){}}else toast(r.error==='price'?T.mErrP+r.max+' USDT':r.error==='wallet'?T.mErrW:'Error: '+r.error,1);},500);};
  card.querySelectorAll('.stp i').forEach(b=>b.onclick=()=>{hap();const up=Number(b.dataset.d)>0;st.price=Math.round(Math.min(c.max,Math.max(0.5,up?st.price+stepOf(st.price):st.price-stepOf(st.price-0.001)))*100)/100;card.querySelector('.pv').textContent=st.price+' USDT';send();});
  card.querySelectorAll('.seg i').forEach(x=>x.onclick=()=>{hap();st.perDay=Number(x.dataset.n);card.querySelectorAll('.seg i').forEach(y=>y.className=y===x?'on':'');send();});
  card.querySelector('.sel.th').onchange=function(){hap();st.theme=this.value;send();};
  card.querySelector('.sel.lg').onchange=function(){hap();st.lang=this.value;send();};
  card.querySelector('.cpl').onclick=()=>{hap();const ok=()=>toast(T.eCopied);try{navigator.clipboard.writeText(c.link).then(ok,()=>toast(c.link))}catch(_){toast(c.link)}};
  card.querySelector('.shl').onclick=()=>{hap();tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(c.link)+'&text='+encodeURIComponent(T.mShare.replace('{t}',c.title).replace('{m}',fmtN(c.members))));};
});
}

 const box=document.getElementById('earn');if(!tg.initData)return;const d=await post('/api/earn',{});if(d.error)return;
 box.innerHTML='<div class="et"><span>'+T.eTot+'</span><b>'+d.ch+' <small>USDT</small></b><div class="eg"><div><span>'+T.eCh+'</span><b>'+d.ads+'</b></div><div><span>'+T.eKeep+'</span><b>'+(100-d.feePct)+' %</b></div></div></div>'

async function pay(){
 const o=await post('/api/pay',{orderId:payId});
 if(o.error){root.innerHTML='<div class="empty"><div class="big">⚠️</div>'+e(o.error)+'</div>';return;}
 const live=o.status==='posted'||o.status==='done'||o.status==='paid';
 root.innerHTML='<div class="ph"><h1>💳 '+T.pay+'</h1><p>'+T.paySub+'</p></div>'
 +'<div class="steps"><div class="step on">✓ '+T.s1+'</div><div class="step'+(o.status==='approved'?' on':'')+'">'+T.s2+'</div><div class="step'+(live?' on':'')+'">'+T.s3+'</div></div>'
 +'<div class="box"><div class="prev">'+e(o.preview)+'</div><div class="fakebtn">'+e(o.btnText)+'</div></div>'
 +'<div class="box"><div class="line"><span>📢 '+e(o.channel)+'</span><span></span></div><div class="line"><span>'+T.you+'</span><span>'+o.pub+' USDT</span></div>'+(o.fee!=='0'?'<div class="line"><span>'+T.fee+'</span><span>'+o.fee+' USDT</span></div>':'')+'<div class="line tot"><span>'+T.total+'</span><span>'+o.price+' USDT</span></div></div>'
 +'<div id="tc"></div><button class="payb" id="pb">'+T.payBtn+' '+o.price+' USDT</button><div class="msg" id="st"></div><div class="note">'+T.note+'</div>';
 const show=(cls,txt)=>{st.className='msg '+cls;st.textContent=txt;};
 if(o.status!=='approved'){pb.disabled=true;show(live?'ok':'err',live?T.done:T.notReady);}
 const ui=new TON_CONNECT_UI.TonConnectUI({manifestUrl:location.origin+'/tonconnect-manifest.json',buttonRootId:'tc'});
 ui.uiOptions={twaReturnUrl:'https://t.me/__BOT__'};
 pb.onclick=async()=>{hap();
  if(!ui.connected){await ui.openModal();return;}
  pb.disabled=true;show('wait','...');
  const tx=await post('/api/tx',{orderId:payId,owner:ui.account.address});
  if(tx.error){pb.disabled=false;show('err',tx.error==='balance'?T.bal+tx.balance+' USDT':tx.error==='no_usdt'?T.nousdt:'Error: '+tx.error);return;}
  try{await ui.sendTransaction({validUntil:tx.validUntil,messages:tx.messages});show('wait',T.wait);watch();}
  catch(err){pb.disabled=false;show('err',String(err&&err.message||err));}
 };
 function watch(){const iv=setInterval(async()=>{const r=await post('/api/pay',{orderId:payId});if(r.status==='posted'||r.status==='done'){clearInterval(iv);show('ok',T.done);try{tg.HapticFeedback.notificationOccurred('success')}catch(_){}}},8000);}
}
async function wallet(){
 root.innerHTML='<div class="ph"><h1>👛 '+T.wT+'</h1><p>'+T.wS+'</p></div><div id="tc"></div><div class="msg" id="st"></div><button class="payb" id="bk" style="display:none">'+T.wBtn+'</button>';
 const ui=new TON_CONNECT_UI.TonConnectUI({manifestUrl:location.origin+'/tonconnect-manifest.json',buttonRootId:'tc'});
 ui.uiOptions={twaReturnUrl:'https://t.me/__BOT__'};
 let done=false;
 const save=async a=>{if(done||!a)return;done=true;const r=await post('/api/wallet',{address:a.address});
  if(r.ok){st.className='msg ok';st.textContent=T.wOk;bk.style.display='block';try{tg.HapticFeedback.notificationOccurred('success')}catch(_){}setTimeout(()=>location.href='/app?tab=ord',1800);}
  else{done=false;st.className='msg err';st.textContent='Error: '+r.error;}};
 bk.onclick=()=>location.href='/app?tab=ord';
 ui.onStatusChange(w=>save(w&&w.account));
 await ui.connectionRestored;
 if(ui.connected){await ui.disconnect().catch(()=>{});}
 ui.openModal();
}
q.get('wallet')?wallet():payId?pay():catalog();
