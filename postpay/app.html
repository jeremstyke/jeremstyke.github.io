 d.channels.forEach((c,i)=>{const card=box.querySelectorAll('.mc')[i];let st={price:c.price||1,perDay:c.perDay,theme:c.theme,lang:c.lang},tm;const stepOf=p=>p<10?0.5:1;

async function pay(){
 const o=await post('/api/pay',{orderId:payId});
 if(o.error){root.innerHTML='<div class="empty"><div class="big">⚠️</div>'+e(o.error)+'</div>';return;}
 const live=o.status==='posted'||o.status==='done'||o.status==='paid';
 root.innerHTML='<div class="ph"><h1>💳 '+T.pay+'</h1><p>'+T.paySub+'</p></div>'
 +'<div class="steps"><div class="step on">✓ '+T.s1+'</div><div class="step'+(o.status==='approved'?' on':'')+'">'+T.s2+'</div><div class="step'+(live?' on':'')+'">'+T.s3+'</div></div>'
 +'<div class="box"><div class="prev">'+e(o.preview)+'</div><div class="fakebtn">'+e(o.btnText)+'</div></div>'
 +'<div class="box"><div class="line"><span>📢 '+e(o.channel)+'</span><span></span></div><div class="line"><span>'+T.you+'</span><span>'+o.pub+' USDT</span></div>'+(o.fee!=='0'?'<div class="line"><span>'+T.fee+'</span><span>'+o.fee+' USDT</span></div>':'')+'<div class="line tot"><span>'+T.total+'</span><span>'+o.price+' USDT</span></div></div>'
 +'<div id="tc"></div><button class="payb" id="pb">'+T.payBtn+' '+o.price+' USDT</button><div class="msg" id="st"></div><div class="note">'+T.note+'</div>';
 const show=(cls,txt)=>{st.className='msg '+cls;st.textContent=txt;};
 if(o.status!=='approved'){pb.disabled=true;show(live?'ok':'err',live?T.done:T.notReady);}
 const ui=new TON_CONNECT_UI.TonConnectUI({manifestUrl:location.origin+'/tonconnect-manifest.json',buttonRootId:'tc'});
 ui.uiOptions={twaReturnUrl:'https://t.me/__BOT__'};
 pb.onclick=async()=>{hap();
  if(!ui.connected){await ui.openModal();return;}
  pb.disabled=true;show('wait','...');
  const tx=await post('/api/tx',{orderId:payId,owner:ui.account.address});
  if(tx.error){pb.disabled=false;show('err',tx.error==='balance'?T.bal+tx.balance+' USDT':tx.error==='no_usdt'?T.nousdt:'Error: '+tx.error);return;}
  try{await ui.sendTransaction({validUntil:tx.validUntil,messages:tx.messages});show('wait',T.wait);watch();}
  catch(err){pb.disabled=false;show('err',String(err&&err.message||err));}
 };
 function watch(){const iv=setInterval(async()=>{const r=await post('/api/pay',{orderId:payId});if(r.status==='posted'||r.status==='done'){clearInterval(iv);show('ok',T.done);try{tg.HapticFeedback.notificationOccurred('success')}catch(_){}}},8000);}
}
