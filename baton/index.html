.dot{background:#2f8dff;box-shadow:0 0 8px #2f8dff}

.foot,.foot a{color:#6f87b8}

.sd.on{background:linear-gradient(180deg,#5aa9ff,#1667e8);border-color:transparent;box-shadow:0 0 12px rgba(47,141,255,.5)}.sd.on span{color:#dbeaff}
.sd.nx{border:1.5px dashed #56c8ff}
[hidden]{display:none!important}
.timer:empty{display:none}
.landing{min-height:100%;display:grid;place-items:center;padding:28px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));background:radial-gradient(80% 40% at 50% -5%,rgba(47,141,255,.35),transparent 70%),#050a18}
.lwrap{max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center}

.landing h1{margin:0;font-family:var(--display);font-weight:900;font-size:52px;background:linear-gradient(180deg,#fff,#9fcbff);-webkit-background-clip:text;background-clip:text;color:transparent}
.ltag{margin:0 0 6px;color:#bfe2ff;font-size:16px;line-height:1.4}
.landing .row{text-align:start}.lic{font-size:26px;width:34px;text-align:center}
.landing .row .t b{white-space:normal}
.landing .btn{text-decoration:none;margin-top:6px}
.demo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:35;background:linear-gradient(180deg,#5aa9ff,#1667e8);color:#fff;font-weight:800;font-size:14px;padding:11px 18px;border-radius:999px;text-decoration:none;box-shadow:0 0 24px rgba(47,141,255,.6);white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.crewtot span{display:flex;flex-direction:column;gap:3px}.crewtot small{font-size:11.5px;color:var(--mute)}
.tip{display:block;margin-top:7px;font-size:13px;font-weight:700;color:#bfe2ff;line-height:1.35}
.mult{display:flex;flex-direction:column;align-items:flex-end;line-height:1}.mult .pg{font-family:var(--body);font-size:12px;font-weight:800;color:var(--gain);margin-top:4px;text-shadow:none}
.maint{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));background:radial-gradient(70% 50% at 50% 35%,rgba(47,141,255,.3),transparent 70%),#050a18}
.mspin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(80,150,255,.25);border-top-color:#2f8dff;animation:spin 1s linear infinite;margin-top:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.score .big{max-width:100%;overflow-wrap:anywhere}

</style>

<body>
<div class="loader" id="loader"><div>BATON</div></div>
<div class="app">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14.5" fill="#06122e" stroke="#2f8dff" stroke-width="2"/><text x="16" y="22" text-anchor="middle" font-family="Outfit,system-ui,sans-serif" font-weight="900" font-size="17" fill="#fff">B</text><rect x="7" y="15" width="18" height="4" rx="2" fill="#2f8dff" transform="rotate(-35 16 17)"/></svg>Baton</div>
    <div class="chips"><button class="chip" id="helpBtn" aria-label="Help" style="font-weight:800;min-width:34px;justify-content:center">?</button><div class="chip"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ff6a2a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c4 4 6 7 6 11a6 6 0 01-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-3 0-5 1-8z"/></svg><b class="num" id="streak">0</b></div><div class="chip g"><b class="num" id="bonusChip">+0%</b></div></div>
  </header>

  <main>
    <section class="panel" id="p-home">
      <div class="score"><small data-t="your"></small><div class="big num" id="bal">0</div><div class="rate num" id="rate"></div><div class="conv" data-t="conv"></div></div>

      <div class="card" id="myChain" hidden>
        <div class="meta"><span id="myH"></span><span class="myBig num"><span id="myLinks">0</span> <small data-t="links" style="font-size:13px;font-weight:600;color:var(--mute)"></small></span></div>
        <div class="foot" id="myAt" style="text-align:start;margin:0"></div>
      </div>

      <div class="card" id="chainCard" hidden>
        <div class="meta"><span id="chainBy"></span><span class="myBig num"><span id="links">0</span> <small data-t="links" style="font-size:13px;font-weight:600;color:var(--mute)"></small></span></div>
        <div class="foot" id="worldAt" style="text-align:start;margin:0"></div>
        <div class="chain" id="chain"></div>
      </div>

      <div class="card batonCard" id="batonCard">
        <div class="batonRow">
          <div class="stick" aria-hidden="true"><div class="rod"></div><div class="fire"></div></div>
          <div class="hold"><h3 id="holdT"></h3><p id="holdP"></p><div class="timer num" id="timer"></div></div>
        </div>
        <button class="btn gold" id="passBtn"></button>
        <button class="btn ghost" id="extBtn" hidden></button>
        <div class="more" id="moreBat" hidden></div>
      </div>

      <div class="card">
        <h2 data-t="mine"></h2>
        <div class="mineRow">
          <div class="ring" id="ring" style="--p:0"><div><b class="num" id="ready">0</b><span data-t="ready"></span></div></div>
          <div class="mineInfo"><strong id="lvl"></strong><span id="fillTxt"></span><button class="btn mint" id="harvest"></button></div>
        </div>
      </div>

      <div class="record" hidden><span data-t="record"></span><b class="num" id="record">0</b></div>
      <p class="foot" data-t="airdrop"></p>
    </section>

    <section class="panel" id="p-mine" hidden>
      <div class="score"><small data-t="upgrade"></small><div class="big num" id="lvBig"></div><div class="rate num" id="rate2"></div></div>
      <div class="list" id="upg"></div>
    </section>

    <section class="panel" id="p-tasks" hidden>
      <div class="score"><small data-t="earnMore"></small><div class="big" data-t="tasks"></div></div>
      <div class="list" id="tasks"></div>
    </section>

    <section class="panel" id="p-friends" hidden>
      <div class="score"><small data-t="crew"></small><div class="big num" id="nFriends">0</div><div class="rate" data-t="crewSub"></div></div>
      <button class="btn gold" id="invite"></button>
      <button class="btn ghost" id="copy"></button>
      <p class="foot" id="invRule"></p>
      <div class="list" id="friends"></div>
    </section>

    <section class="panel" id="p-rank" hidden>
      <div class="score"><small data-t="week"></small><div class="big" data-t="ranks"></div></div>
      <div class="seg"><button id="sChains" aria-pressed="true" data-t="chains"></button><button id="sMiners" aria-pressed="false" data-t="miners"></button></div>
      <div class="list" id="ranks"></div>
    </section>
  </main>

  <nav class="tabs">
    <button data-p="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="10" y="3" width="4" height="18" rx="2" transform="rotate(28 12 12)"/></svg><span data-t="tHome"></span><span class="dot" id="dotHome" hidden></span></button>
    <button data-p="mine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4l6 6M4 20l9-9M15 3l6 6-3 3-6-6z"/></svg><span data-t="tMine"></span></button>
    <button data-p="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V5a2 2 0 012-2h9"/></svg><span data-t="tTasks"></span><span class="dot" id="dotTasks" hidden></span></button>
    <button data-p="friends"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0M16 4.5a3.5 3.5 0 010 7M18 14a6 6 0 013.5 6"/></svg><span data-t="tFriends"></span></button>
    <button data-p="rank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0zM17 6h3v2a3 3 0 01-3 3M7 6H4v2a3 3 0 003 3"/></svg><span data-t="tRanks"></span></button>
  </nav>
</div>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>

    return;

  doPass(k);
};
// 21 oct 2026: opening a bot closes Baton, so "already opened today" is remembered on the phone
const opened = new Proxy({}, { get: (o, k) => o[k] || (() => { try { return localStorage.getItem('bt_op_' + String(k)) === new Date().toDateString(); } catch (e) { return false; } })(), set: (o, k, v) => { o[k] = v; try { localStorage.setItem('bt_op_' + String(k), new Date().toDateString()); } catch (e) {} return true; } });
$('#upg').onclick = async (e) => {
  const b = e.target.closest('[data-up]'); if (!b) return; hap(); b.disabled = true;
  const r = await api('upgrade', { what: b.dataset.up });
  if (!r.ok) { hap('err'); toast(errMsg(r)); b.disabled = false; return; }
  hap('ok'); toast(T('upgraded')); setState(r.state);
};
$('#tasks').onclick = async (e) => {
  const b = e.target.closest('[data-task]'); if (!b) return; hap();
  const id = Number(b.dataset.task);
  // partner links (InsideAds, Ads Galaxy...) cannot be checked: the reward is given on the tap, then the link opens
  const tk = ((S && S.tasks) || []).find((x) => x.id === id) || {};
  if (tk.kind === 'link') { b.disabled = true; const r = await api('task', { id }); if (r.ok) { hap('ok'); toast(T('reward', fmt(r.reward))); setState(r.state); } else b.disabled = false; if (b.dataset.url) openLink(b.dataset.url); return; }
  if (!opened[id]) { opened[id] = true; if (b.dataset.url) openLink(b.dataset.url); setTimeout(render, 600); return; }
  b.disabled = true;
  const r = await api('task', { id });
  if (!r.ok) { hap('err'); toast(errMsg(r)); b.disabled = false; return; }
  hap('ok'); toast(T('reward', fmt(r.reward))); setState(r.state);
};
const myLink = () => 'https://t.me/' + BOT + '/play?startapp=r' + (S ? S.uid : user.id || '');
$('#invite').textContent = T('invite'); $('#copy').textContent = T('copy');
$('#invite').onclick = () => { hap(); openLink('https://t.me/share/url?url=' + encodeURIComponent(myLink()) + '&text=' + encodeURIComponent(T('inviteTxt'))); };
$('#copy').onclick = async () => { hap(); try { await navigator.clipboard.writeText(myLink()); toast(T('copied')); } catch (e) { toast(myLink()); } };
async function loadFriends() {
  const r = await api('friends'); if (!r.ok) return;
  const tot = '<div class="record crewtot"><span>' + T('crewEarned') + '<small>' + T('crewSplit', fmt((r.earned_total || 0) - (r.earned_ref || 0)), fmt(r.earned_ref || 0)) + '</small></span><b class="num">+' + fmt(r.earned_total || 0) + '</b></div>';
  $('#friends').innerHTML = tot + (r.list.length ? r.list.map((x) => '<div class="row"><span class="av" style="background:' + hueOf(x.name) + '">' + init(x.name) + '</span><div class="t"><b>' + esc(x.name) + '</b><span>' + (x.sponsor ? T('sponsor') : x.holding ? T('holding') : T('mined', fmt(x.mined))) + '</span></div>' + (x.earned ? '<span class="r">+' + fmt(x.earned) + '</span>' : '') + '</div>').join('') : '<div class="empty">' + T('noFriends') + '</div>');
}
let rankMode = 'chains';  // 'chains' now shows the best passers (22 oct 2026)
async function loadRanks() {
  const r = await api('ranks'); if (!r.ok) return;
  const rows = rankMode === 'chains'
    ? (r.passers || []).map((m, i) => '<div class="row' + (m.me ? ' me' : '') + '"><span class="rank' + (i < 3 ? ' g' : '') + '">' + (i + 1) + '</span><span class="av" style="background:' + hueOf(m.name) + '">' + init(m.name) + '</span><div class="t"><b>' + esc(m.name) + '</b></div><span class="r">' + T('nPass', fmt(m.n)) + '</span></div>')
    : r.miners.map((m, i) => '<div class="row' + (m.me ? ' me' : '') + '"><span class="rank' + (i < 3 ? ' g' : '') + '">' + (i + 1) + '</span><span class="av" style="background:' + hueOf(m.name) + '">' + init(m.name) + '</span><div class="t"><b>' + esc(m.name) + '</b></div><span class="r">' + fmt(m.pts) + '</span></div>');
  $('#ranks').innerHTML = rows.join('') || '<div class="empty">…</div>';
}
$('#sChains').onclick = () => { rankMode = 'chains'; $('#sChains').setAttribute('aria-pressed', 'true'); $('#sMiners').setAttribute('aria-pressed', 'false'); loadRanks(); };
$('#sMiners').onclick = () => { rankMode = 'miners'; $('#sMiners').setAttribute('aria-pressed', 'true'); $('#sChains').setAttribute('aria-pressed', 'false'); loadRanks(); };
function go(p) {
  document.querySelectorAll('nav.tabs button').forEach((x) => x.toggleAttribute('aria-current', x.dataset.p === p));
  document.querySelectorAll('nav.tabs button[aria-current]').forEach((x) => x.setAttribute('aria-current', 'page'));
  document.querySelectorAll('.panel').forEach((x) => { x.hidden = x.id !== 'p-' + p; });
  document.querySelector('main').scrollTop = 0;
  if (p === 'friends') loadFriends();
  if (p === 'rank') loadRanks();
}
document.querySelectorAll('nav.tabs button').forEach((b) => { b.onclick = () => { hap(); go(b.dataset.p); }; });

// ---------- 21 oct 2026: tutorial, bonus explainer, invite nudge ----------
const LS = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
function tutorial() {
  const steps = [['⛏️', 't1h', 't1p'], ['🔥', 't2h', 't2p'], ['🔗', 't3h', 't3p'], ['🪂', 't4h', 't4p']];
  let i = 0;
  const el = document.createElement('div'); el.className = 'tuto'; document.body.appendChild(el);
  const draw = () => {
    const [ic, h, p] = steps[i], last = i === steps.length - 1, pass = last && S && S.holding;
    el.innerHTML = '<div class="tcard"><div class="tic">' + ic + '</div><h2>' + T(h) + '</h2><p>' + T(p) + '</p><div class="tdots">' + steps.map((_, j) => '<i' + (j === i ? ' class="on"' : '') + '></i>').join('') + '</div><button class="btn gold" data-n>' + (pass ? '🔥 ' + T('passNow') : last ? T('start') : T('next')) + '</button>' + (pass ? '<button class="btn ghost" data-x>' + T('later') + '</button>' : '') + '</div>';
  };
  el.onclick = (e) => {
    if (e.target.closest('[data-x]')) { el.remove(); return; }
    if (!e.target.closest('[data-n]')) return;
    hap();
    if (i < steps.length - 1) { i++; draw(); return; }
    el.remove();
    if (S && S.holding) $('#passBtn').onclick();
  };
  draw();
}
document.querySelector('.chip.g').onclick = () => {
  if (!S) return; hap();
  const perk = S.perk || 0, chain = Math.max(0, (S.bonus || 0) - perk);
  sheet('<h3>' + T('bonusH') + ' +' + (S.bonus || 0) + '%</h3><div class="row"><div class="t"><b>🔗 ' + T('bChain', chain) + '</b></div></div><div class="row"><div class="t"><b>📢 ' + T('bSub', perk) + '</b></div></div><p class="foot">' + T('bTip') + '</p><button class="btn ghost" data-k="keep">OK</button>');
};
// 21 oct 2026: the streak flame opens its explanation (7 days around today, today's and tomorrow's bonus)
(() => {
  const sk = $('#streak').closest('.chip'); sk.style.cursor = 'pointer';
  sk.onclick = () => {
    if (!S) return; hap();
    const p = S.streak_pts || 200, cap = S.streak_cap || 30, bon = (d) => p * Math.min(d, cap);
    const live = S.streak_live || 0, today = !!S.streak_today, nx = today ? live + 1 : (S.streak_next || 1);
    const start = Math.max(1, nx - 3), days = [];
    for (let d = start; d < start + 7; d++) days.push('<div class="sd' + (d < nx ? ' on' : '') + (d === nx ? ' nx' : '') + '"><b>' + d + '</b><span>+' + fmt(bon(d)) + '</span></div>');
    sheet('<div class="tic" style="text-align:center">🔥</div><h3 style="text-align:center">' + T('sH', live) + '</h3><div class="sdays">' + days.join('') + '</div>'
      + (today ? '<div class="row on"><div class="t"><b>✓ ' + T('sDone', fmt(bon(live))) + '</b><span>' + T('sTomorrow', fmt(bon(live + 1))) + '</span></div></div>'
               : '<div class="row"><div class="t"><b>' + T('sNext', fmt(bon(nx))) + '</b></div></div>')
      + '<p class="foot">' + T('sRule', cap, fmt(bon(cap))) + '</p>'
      + (today ? '<button class="btn ghost" data-k="keep">OK</button>' : '<button class="btn mint" data-k="harv">⛏️ ' + T('harvest') + '</button>'));
  };
})();
// 21 oct 2026: maintenance screen (the server answers error 'maint'); it checks again every 15 s and reloads when Baton is back
function maint() {
  if (document.querySelector('.maint')) return;
  const el = document.createElement('div'); el.className = 'maint';
  el.innerHTML = '<div class="tcard"><div class="tic">🛠️</div><h2>' + T('mH') + '</h2><p>' + T('mP') + '</p><div class="mspin"></div></div>';
  document.body.appendChild(el); $('#loader').hidden = true;
  setInterval(async () => {
    try { const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ initData: (tg && tg.initData) || '', action: 'state' }) }).then((x) => x.json()); if (r && r.ok) location.reload(); } catch (e) {}
  }, 15000);
}
let nudged = false;
function nudge() {
  if (nudged || !S || S.friends > 0) return; nudged = true;
  setTimeout(() => sheet('<div class="tic" style="text-align:center">🎁</div><h3 style="text-align:center">' + T('shareH') + '</h3><p class="foot" style="font-size:15px">' + T('shareP') + '</p><button class="btn gold" data-k="invite">🚀 ' + T('invite') + '</button><button class="btn ghost" data-k="keep">' + T('later') + '</button>'), 1600);
}

(async () => {
  // 21 oct 2026: outside Telegram (a browser, an ad network reviewer) a presentation page: what Baton is, and a button to play
  if (!(tg && tg.initData)) {
    $('#loader').hidden = true; document.querySelector('.app').hidden = true;
    const steps = [['⛏️', 't1h', 't1p'], ['🔥', 't2h', 't2p'], ['🔗', 't3h', 't3p'], ['🪂', 't4h', 't4p']];
    const lp = document.createElement('div'); lp.className = 'landing';
    lp.innerHTML = '<div class="lwrap"><div class="lbadge">B</div><h1>Baton</h1><p class="ltag">' + T('lTag') + '</p>'
      + steps.map((x) => '<div class="row"><span class="lic">' + x[0] + '</span><div class="t"><b>' + T(x[1]) + '</b><span>' + T(x[2]) + '</span></div></div>').join('')
      + '<a class="btn gold" href="https://t.me/PassTheBatonBot/play">▶ ' + T('lPlay') + '</a><p class="foot">by @jeremstyke</p></div>';
    document.body.appendChild(lp);
    return;
  }
  // 21 oct 2026: a network hiccup at opening is retried 3 times, then a retry button instead of an empty page
  let r = await api('state');
  for (let i = 0; i < 3 && r && !r.ok && r.error === 'other'; i++) { await new Promise((ok) => setTimeout(ok, 1500)); r = await api('state'); }
  $('#loader').hidden = true;
  if (!r.ok) { if (r.error !== 'maint') { toast(errMsg(r)); const ld = $('#loader'); ld.innerHTML = '<button class="btn gold" style="width:auto;padding:0 28px" onclick="location.reload()">↻</button>'; ld.hidden = false; } return; }
  setState(r);
  // 21 oct 2026: ask once to let @PassTheBatonBot send messages (players who came by a link never pressed Start)
  try { if (tg && tg.requestWriteAccess && !LS.get('bt_wa')) setTimeout(() => { try { tg.requestWriteAccess((ok) => LS.set('bt_wa', ok ? '1' : '0')); } catch (e) {} }, 2500); } catch (e) {}
  if ((!LS.get('bt_tuto') && (S.pts || 0) < 1000) || ((tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '') === 'tuto') { LS.set('bt_tuto', '1'); tutorial(); }
  $('#helpBtn').onclick = () => { hap(); tutorial(); };
  const sp = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
  if (sp === 'friends') go('friends');
  setInterval(tick, 1000);
  setInterval(refresh, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
})();
})();
</script>
