<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Baton</title>
<!-- 21 oct 2026 (Jeremy): Baton, by @jeremstyke. Mini app of @PassTheBatonBot: a mine that fills every 4 h and a baton passed between players.
     All the logic is on the server (Supabase function "baton" + SQL bt_*); this page only shows and asks. 10 languages, like Meme Coin Tycoon's players. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Figtree:wght@400;600;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --night:#0b1626; --lane:#13243a; --lane2:#1b3150; --chalk:#e9f1ff; --mute:#8fa5c4;
  --baton:#ffc531; --flame:#ff6a2a; --gain:#3ee6a0; --warn:#ff4d6d;
  --display:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--chalk);font-family:var(--body);font-size:15px;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--baton);outline-offset:3px;border-radius:12px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;
  background:radial-gradient(120% 50% at 50% -8%,#1d3a63 0%,transparent 60%),repeating-linear-gradient(90deg,transparent 0 24.6%,rgba(233,241,255,.03) 24.6% 25%),var(--night)}
.top{padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:.05em;text-transform:uppercase}
.brand svg{width:28px;height:28px}
.chips{display:flex;gap:6px}
.chip{display:flex;align-items:center;gap:5px;background:rgba(19,36,58,.9);border:1px solid rgba(233,241,255,.06);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700}
.chip b{color:var(--flame)} .chip.g b{color:var(--gain)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px))}
.panel{display:flex;flex-direction:column;gap:14px}
.panel[hidden]{display:none!important}
.score{text-align:center;padding:4px 0 2px}
.score small{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.score .big{font-family:var(--display);font-weight:900;font-size:68px;line-height:1;margin-top:2px}
.score .big span{color:var(--baton);font-size:.6em}
.score .rate{font-family:var(--mono);font-size:13px;color:var(--gain);margin-top:2px}
.card{background:var(--lane);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;border:1px solid rgba(233,241,255,.05)}
.card h2,.sec{margin:0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:700}
.batonCard{background:radial-gradient(140% 120% at 0% 0%,rgba(255,106,42,.28) 0%,transparent 55%),linear-gradient(160deg,#2b1c10 0%,var(--lane) 65%)}
.batonCard.off{background:var(--lane)}
.batonRow{display:flex;align-items:center;gap:14px}
.stick{width:96px;height:96px;flex:none;position:relative;display:grid;place-items:center}
.stick .rod{width:18px;height:72px;border-radius:9px;background:linear-gradient(90deg,#c98d00,var(--baton) 45%,#fff2bf 55%,var(--baton) 70%,#c98d00);transform:rotate(28deg);box-shadow:0 0 26px rgba(255,197,49,.5)}
.stick .fire{position:absolute;top:0;right:16px;width:32px;height:40px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff3c4 0 18%,var(--baton) 30%,var(--flame) 62%,transparent 70%);animation:flick 1.1s infinite ease-in-out alternate;transform-origin:50% 90%}
.off .stick{opacity:.35} .off .stick .rod{box-shadow:none} .off .fire{display:none}
@keyframes flick{0%{transform:scale(1,1) rotate(-4deg)}50%{transform:scale(.9,1.12) rotate(3deg)}100%{transform:scale(1.05,.95) rotate(-2deg)}}
.hold{flex:1;min-width:0}
.hold h3{margin:0;font-family:var(--display);font-weight:900;font-size:30px;line-height:1;text-transform:uppercase}
.hold p{margin:5px 0 0;color:var(--mute);font-size:14px;line-height:1.35}
.hold p b{color:var(--baton)}
.timer{font-family:var(--mono);font-size:22px;color:var(--baton);margin-top:6px}
.timer.low{color:var(--warn)}
.more{font-size:13px;color:var(--mute);text-align:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:17px;font-weight:800;font-size:16px;padding:0 18px;width:100%}
.btn.gold{background:linear-gradient(180deg,#ffd45c,var(--baton));color:#241600;box-shadow:0 6px 18px rgba(255,197,49,.25)}
.btn.mint{background:var(--gain);color:#032a1c}
.btn.ghost{background:var(--lane2);color:var(--chalk)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none}
.chain{display:flex;align-items:center;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
.chain::-webkit-scrollbar{display:none}
.link{flex:none;display:flex;align-items:center}
.av{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#08121f;border:2px solid var(--night);flex:none}
.av.me{outline:2px solid var(--baton);outline-offset:1px;background:var(--baton)}
.bar{width:16px;height:3px;background:linear-gradient(90deg,var(--baton),var(--flame))}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.meta b{color:var(--chalk);font-family:var(--mono);font-weight:500}
.mineRow{display:flex;align-items:center;gap:16px}
.ring{width:104px;height:104px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gain) calc(var(--p)*1%),var(--lane2) 0);transition:background .4s}
.ring>div{width:84px;height:84px;border-radius:50%;background:var(--lane);display:grid;place-items:center;text-align:center;font-family:var(--mono);font-size:11px;color:var(--mute);line-height:1.15}
.ring b{display:block;font-family:var(--display);font-size:24px;color:var(--chalk);font-weight:900}
.mineInfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.mineInfo strong{font-size:17px}
.mineInfo span{color:var(--mute);font-size:13px}
.record{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--lane);border-radius:18px;padding:12px 16px;font-size:14px}
.record b{font-family:var(--display);font-weight:900;font-size:28px;color:var(--baton)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--lane);border-radius:18px;padding:12px 14px;min-height:64px}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t span{color:var(--mute);font-size:13px}
.row .r{font-family:var(--mono);font-size:13px;color:var(--gain);white-space:nowrap}
.row.me{outline:2px solid var(--baton)}
.sm{background:var(--baton);color:#241600;font-weight:800;border-radius:12px;padding:0 14px;min-height:42px;font-size:14px;white-space:nowrap}
.sm.done,.sm[disabled]{background:var(--lane2);color:var(--mute)}
.rank{font-family:var(--display);font-weight:900;font-size:24px;width:30px;text-align:center;color:var(--mute)}
.rank.g{color:var(--baton)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--lane);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:40px;border-radius:10px;font-weight:700;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--lane2);color:var(--chalk)}
.empty{color:var(--mute);text-align:center;padding:18px;font-size:14px;background:var(--lane);border-radius:18px}
nav.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:rgba(19,36,58,.97);border-top:1px solid rgba(233,241,255,.07);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;font-size:11px;font-weight:700;color:var(--mute);position:relative}
nav.tabs button[aria-current="page"]{color:var(--baton)}
nav.tabs svg{width:23px;height:23px}
.dot{position:absolute;top:6px;left:calc(50% + 8px);width:9px;height:9px;border-radius:5px;background:var(--flame)}
.dot[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgba(3,8,16,.62);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.scrim[hidden]{display:none}
.sheet{width:100%;max-width:520px;max-height:86%;overflow-y:auto;background:var(--lane);border-radius:26px 26px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h3{margin:0;font-family:var(--display);font-weight:900;font-size:30px;text-transform:uppercase}
.opt{display:flex;align-items:center;gap:12px;background:var(--lane2);border-radius:18px;padding:12px 14px;text-align:start;width:100%;min-height:64px}
.opt .t{flex:1;display:flex;flex-direction:column;gap:2px}
.opt .t span{font-size:13px;color:var(--mute)}
.mult{font-family:var(--display);font-weight:900;font-size:28px;color:var(--baton)}
.mult.x5{color:var(--flame)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--chalk);color:#08121f;font-weight:800;padding:12px 18px;border-radius:999px;font-size:14px;z-index:30;max-width:92%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.toast[hidden]{display:none}
.loader{position:fixed;inset:0;display:grid;place-items:center;background:var(--night);z-index:40}
.loader[hidden]{display:none}
.loader div{font-family:var(--display);font-weight:900;font-size:40px;letter-spacing:.06em;color:var(--baton);animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.4}}
.burst{animation:pop .5s ease-out}
@keyframes pop{30%{transform:scale(1.08)}}
.foot{font-size:12px;color:var(--mute);text-align:center;padding-top:4px}
.foot a{color:var(--mute)}
[dir="rtl"] .bar{background:linear-gradient(270deg,var(--baton),var(--flame))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="loader" id="loader"><div>BATON</div></div>
<div class="app">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="13" y="6" width="6" height="22" rx="3" fill="#ffc531" transform="rotate(28 16 17)"/><path d="M22 2c3 3 3 7 0 9-1-2-3-2-3-4 0-2 2-3 3-5z" fill="#ff6a2a"/></svg>Baton</div>
    <div class="chips"><div class="chip"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ff6a2a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c4 4 6 7 6 11a6 6 0 01-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-3 0-5 1-8z"/></svg><b class="num" id="streak">0</b></div><div class="chip g"><b class="num" id="bonusChip">+0%</b></div></div>
  </header>

  <main>
    <section class="panel" id="p-home">
      <div class="score"><small data-t="your"></small><div class="big num" id="bal">0</div><div class="rate num" id="rate"></div></div>

      <div class="card batonCard" id="batonCard">
        <div class="batonRow">
          <div class="stick" aria-hidden="true"><div class="rod"></div><div class="fire"></div></div>
          <div class="hold"><h3 id="holdT"></h3><p id="holdP"></p><div class="timer num" id="timer"></div></div>
        </div>
        <button class="btn gold" id="passBtn"></button>
        <div class="more" id="moreBat" hidden></div>
      </div>

      <div class="card" id="chainCard" hidden>
        <div class="meta"><span id="chainBy"></span><span><b id="links">0</b> <span data-t="links"></span></span></div>
        <div class="chain" id="chain"></div>
      </div>

      <div class="card">
        <h2 data-t="mine"></h2>
        <div class="mineRow">
          <div class="ring" id="ring" style="--p:0"><div><b class="num" id="ready">0</b><span data-t="ready"></span></div></div>
          <div class="mineInfo"><strong id="lvl"></strong><span id="fillTxt"></span><button class="btn mint" id="harvest"></button></div>
        </div>
      </div>

      <div class="record"><span data-t="record"></span><b class="num" id="record">0</b></div>
      <p class="foot" data-t="airdrop"></p>
    </section>

    <section class="panel" id="p-mine" hidden>
      <div class="score"><small data-t="upgrade"></small><div class="big num" id="lvBig"></div><div class="rate num" id="rate2"></div></div>
      <div class="list" id="upg"></div>
    </section>

    <section class="panel" id="p-tasks" hidden>
      <div class="score"><small data-t="earnMore"></small><div class="big" data-t="tasks"></div></div>
      <div class="list" id="tasks"></div>
    </section>

    <section class="panel" id="p-friends" hidden>
      <div class="score"><small data-t="crew"></small><div class="big num" id="nFriends">0</div><div class="rate" data-t="crewSub"></div></div>
      <button class="btn gold" id="invite"></button>
      <button class="btn ghost" id="copy"></button>
      <div class="list" id="friends"></div>
    </section>

    <section class="panel" id="p-rank" hidden>
      <div class="score"><small data-t="week"></small><div class="big" data-t="ranks"></div></div>
      <div class="seg"><button id="sChains" aria-pressed="true" data-t="chains"></button><button id="sMiners" aria-pressed="false" data-t="miners"></button></div>
      <div class="list" id="ranks"></div>
    </section>
  </main>

  <nav class="tabs">
    <button data-p="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="10" y="3" width="4" height="18" rx="2" transform="rotate(28 12 12)"/></svg><span data-t="tHome"></span><span class="dot" id="dotHome" hidden></span></button>
    <button data-p="mine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4l6 6M4 20l9-9M15 3l6 6-3 3-6-6z"/></svg><span data-t="tMine"></span></button>
    <button data-p="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V5a2 2 0 012-2h9"/></svg><span data-t="tTasks"></span><span class="dot" id="dotTasks" hidden></span></button>
    <button data-p="friends"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0M16 4.5a3.5 3.5 0 010 7M18 14a6 6 0 013.5 6"/></svg><span data-t="tFriends"></span></button>
    <button data-p="rank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0zM17 6h3v2a3 3 0 01-3 3M7 6H4v2a3 3 0 003 3"/></svg><span data-t="tRanks"></span></button>
  </nav>
</div>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
'use strict';
const API = 'https://txvrlvcxfnylnrpdrxtt.supabase.co/functions/v1/baton';
const BOT = 'PassTheBatonBot';
const tg = window.Telegram && Telegram.WebApp;
try { tg.ready(); tg.expand(); tg.setHeaderColor('#0b1626'); tg.setBackgroundColor('#0b1626'); if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
const $ = (s) => document.querySelector(s);

const hap = (k) => { try { k === 'ok' ? tg.HapticFeedback.notificationOccurred('success') : k === 'err' ? tg.HapticFeedback.notificationOccurred('error') : tg.HapticFeedback.impactOccurred('light'); } catch (e) {} };

// ---------- 10 languages ----------
const L = {

const user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};
const lc = String(user.language_code || navigator.language || 'en').toLowerCase();
const LANG = /^fr/.test(lc) ? 'fr' : /^es/.test(lc) ? 'es' : /^pt/.test(lc) ? 'pt' : /^ru|^be|^kk/.test(lc) ? 'ru' : /^uk/.test(lc) ? 'uk' : /^tr/.test(lc) ? 'tr' : /^(id|ms)/.test(lc) ? 'id' : /^ar/.test(lc) ? 'ar' : /^fa/.test(lc) ? 'fa' : 'en';
const T = (k, ...a) => { const v = L[LANG][k] !== undefined ? L[LANG][k] : L.en[k]; return typeof v === 'function' ? v(...a) : v; };
const errMsg = (r) => (L[LANG].err[r && r.error] || L.en.err[r && r.error] || T('err').other);
document.documentElement.lang = LANG;
if (LANG === 'ar' || LANG === 'fa') document.documentElement.dir = 'rtl';
document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = T(el.dataset.t); });
const nf = new Intl.NumberFormat(LANG === 'fa' ? 'fa-IR' : LANG, { maximumFractionDigits: 0 });
const fmt = (n) => nf.format(Math.floor(Number(n) || 0));
const dur = (s) => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? h + ' h ' + String(m).padStart(2, '0') : m + ' min'; };
const clock = (s) => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 3600) + ':' + String(Math.floor(s % 3600 / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const hues = ['#ffc531', '#3ee6a0', '#7cc4ff', '#ff9ec4', '#c9a7ff', '#ffb27a'];
const hueOf = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return hues[h % hues.length]; };
const init = (s) => esc(String(s || '?').trim().charAt(0).toUpperCase() || '?');

let S = null, got = 0, fetchedAt = 0;
async function api(action, body) {
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ initData: (tg && tg.initData) || '', action }, body || {})) });

function openLink(u) { try { /^https:\/\/t\.me\//.test(u) ? tg.openTelegramLink(u) : tg.openLink(u); } catch (e) { window.open(u, '_blank'); } }

function pendingNow() {

  const n = now(), t0 = fetchedAt / 1000, end = Math.min(n, S.full_at);
  const extra = Math.max(0, end - Math.max(t0, S.harvest_at)) / 3600 * S.rate * (S.holding ? 2 : 1);

}
function render() {

  // tasks
  $('#tasks').innerHTML = S.tasks.map((t) => '<div class="row"><div class="t"><b>' + esc(t.title) + '</b><span>' + esc(t.sub || '') + '</span></div><span class="r">+' + fmt(t.reward) + '</span>' + (t.done ? '<button class="sm done" disabled>' + T('done') + '</button>' : '<button class="sm" data-task="' + t.id + '" data-url="' + esc(t.url || '') + '">' + (opened[t.id] ? T('claim') : T('go')) + '</button>') + '</div>').join('');

  hap(); const b = $('#harvest'); b.disabled = true;
  const r = await api('harvest');
  if (!r.ok) { hap('err'); toast(errMsg(r)); b.disabled = false; return; }
  hap('ok'); setState(r.state);
  const el = $('#bal'); el.classList.remove('burst'); void el.offsetWidth; el.classList.add('burst');
  toast(T('harvested', fmt(r.amount)) + (r.streak_bonus > 0 ? ' · ' + T('streakB', r.streak, fmt(r.streak_bonus)) : ''));
};
function sheet(html) { $('#sheet').innerHTML = html; $('#scrim').hidden = false; }
function closeSheet() { $('#scrim').hidden = true; }
$('#scrim').onclick = (e) => { if (e.target.id === 'scrim') closeSheet(); };
$('#passBtn').onclick = () => {
  hap();
  sheet('<h3>' + T('who') + '</h3>' +
    '<button class="opt" data-k="new"><span class="t"><b>' + T('newP') + '</b><span>' + T('newS') + '</span></span><span class="mult x5">x5</span></button>' +
    '<button class="opt" data-k="friend"><span class="t"><b>' + T('friendP') + '</b><span>' + T('friendS') + '</span></span><span class="mult">x3</span></button>' +
    '<button class="opt" data-k="random"><span class="t"><b>' + T('randP') + '</b><span>' + T('randS') + '</span></span><span class="mult">x1</span></button>' +
    '<button class="btn ghost" data-k="keep">' + T('keep') + '</button>');
};
async function doPass(kind, to) {
  const b = S && S.batons[0]; if (!b) return;
  const r = await api('pass', { baton: b.id, kind, to });
  if (!r.ok) { hap('err'); toast(errMsg(r)); return; }
  if (kind === 'new') {
    const link = 'https://t.me/' + BOT + '/play?startapp=' + r.start;
    openLink('https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(T('shareTxt')));
    toast(T('linkReady')); closeSheet(); setState(r.state); return;
  }
  hap('ok'); closeSheet(); setState(r.state);
  toast(T('passed', fmt(r.gain), r.mult, r.to));
}
$('#sheet').onclick = async (e) => {
  const o = e.target.closest('[data-k]'); const f = e.target.closest('[data-f]');
  if (f) { hap(); return doPass('friend', Number(f.dataset.f)); }
  if (!o) return;
  hap(); const k = o.dataset.k;
  if (k === 'keep') return closeSheet();
  if (k === 'friend') {
    const r = await api('friends');
    const inChain = new Set(((S.chain && S.chain.runners) || []).map((x) => x.n));
    const list = (r.list || []).filter((x) => !inChain.has(x.name));
    sheet('<h3>' + T('pick') + '</h3>' + (list.length ? list.map((x) => '<button class="opt" data-f="' + x.id + '"><span class="av" style="background:' + hueOf(x.name) + '">' + init(x.name) + '</span><span class="t"><b>' + esc(x.name) + '</b><span>' + (x.holding ? T('holding') : T('mined', fmt(x.mined))) + '</span></span><span class="mult">x3</span></button>').join('') : '<div class="empty">' + T('noPick') + '</div><button class="opt" data-k="new"><span class="t"><b>' + T('newP') + '</b><span>' + T('newS') + '</span></span><span class="mult x5">x5</span></button>') + '<button class="btn ghost" data-k="keep">' + T('keep') + '</button>');
    return;
  }
  doPass(k);
};
const opened = {};
$('#upg').onclick = async (e) => {
  const b = e.target.closest('[data-up]'); if (!b) return; hap(); b.disabled = true;
  const r = await api('upgrade', { what: b.dataset.up });
  if (!r.ok) { hap('err'); toast(errMsg(r)); b.disabled = false; return; }
  hap('ok'); toast(T('upgraded')); setState(r.state);
};
$('#tasks').onclick = async (e) => {
  const b = e.target.closest('[data-task]'); if (!b) return; hap();
  const id = Number(b.dataset.task);
  if (!opened[id]) { opened[id] = true; if (b.dataset.url) openLink(b.dataset.url); setTimeout(render, 600); return; }
  b.disabled = true;
  const r = await api('task', { id });
  if (!r.ok) { hap('err'); toast(errMsg(r)); b.disabled = false; return; }
  hap('ok'); toast(T('reward', fmt(r.reward))); setState(r.state);
};
const myLink = () => 'https://t.me/' + BOT + '/play?startapp=r' + (S ? S.uid : user.id || '');
$('#invite').textContent = T('invite'); $('#copy').textContent = T('copy');
$('#invite').onclick = () => { hap(); openLink('https://t.me/share/url?url=' + encodeURIComponent(myLink()) + '&text=' + encodeURIComponent(T('inviteTxt'))); };
$('#copy').onclick = async () => { hap(); try { await navigator.clipboard.writeText(myLink()); toast(T('copied')); } catch (e) { toast(myLink()); } };
async function loadFriends() {
  const r = await api('friends'); if (!r.ok) return;
  $('#friends').innerHTML = r.list.length ? r.list.map((x) => '<div class="row"><span class="av" style="background:' + hueOf(x.name) + '">' + init(x.name) + '</span><div class="t"><b>' + esc(x.name) + '</b><span>' + (x.sponsor ? T('sponsor') : x.holding ? T('holding') : T('mined', fmt(x.mined))) + '</span></div>' + (x.earned ? '<span class="r">+' + fmt(x.earned) + '</span>' : '') + '</div>').join('') : '<div class="empty">' + T('noFriends') + '</div>';
}
let rankMode = 'chains';
async function loadRanks() {
  const r = await api('ranks'); if (!r.ok) return;
  const rows = rankMode === 'chains'
    ? r.chains.map((c, i) => '<div class="row' + (c.me ? ' me' : '') + '"><span class="rank' + (i < 3 ? ' g' : '') + '">' + (i + 1) + '</span><div class="t"><b>' + esc(T('chainOf', c.starter)) + '</b><span>' + (c.stopped ? T('stopped') : T('running')) + '</span></div><span class="r">' + fmt(c.links) + ' ' + T('links') + '</span></div>')
    : r.miners.map((m, i) => '<div class="row' + (m.me ? ' me' : '') + '"><span class="rank' + (i < 3 ? ' g' : '') + '">' + (i + 1) + '</span><span class="av" style="background:' + hueOf(m.name) + '">' + init(m.name) + '</span><div class="t"><b>' + esc(m.name) + '</b></div><span class="r">' + fmt(m.pts) + '</span></div>');
  $('#ranks').innerHTML = rows.join('') || '<div class="empty">…</div>';
}
$('#sChains').onclick = () => { rankMode = 'chains'; $('#sChains').setAttribute('aria-pressed', 'true'); $('#sMiners').setAttribute('aria-pressed', 'false'); loadRanks(); };
$('#sMiners').onclick = () => { rankMode = 'miners'; $('#sMiners').setAttribute('aria-pressed', 'true'); $('#sChains').setAttribute('aria-pressed', 'false'); loadRanks(); };
function go(p) {
  document.querySelectorAll('nav.tabs button').forEach((x) => x.toggleAttribute('aria-current', x.dataset.p === p));
  document.querySelectorAll('nav.tabs button[aria-current]').forEach((x) => x.setAttribute('aria-current', 'page'));
  document.querySelectorAll('.panel').forEach((x) => { x.hidden = x.id !== 'p-' + p; });
  document.querySelector('main').scrollTop = 0;
  if (p === 'friends') loadFriends();
  if (p === 'rank') loadRanks();
}
document.querySelectorAll('nav.tabs button').forEach((b) => { b.onclick = () => { hap(); go(b.dataset.p); }; });

(async () => {
  const r = await api('state');
  $('#loader').hidden = true;
  if (!r.ok) { toast(errMsg(r)); return; }
  setState(r);
  const sp = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
  if (sp === 'friends') go('friends');
  setInterval(tick, 1000);
  setInterval(refresh, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
})();
})();
</script>
</body>
</html>
