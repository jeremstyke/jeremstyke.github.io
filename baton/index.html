const FAQ = {
en:{h:'Help',tuto:'▶ Replay the tutorial',more:'Another question? Write to us:',q:[
['What is Pass The Baton?','A Telegram game: you mine $BATON points and you pass batons from hand to hand.'],
['How do I earn $BATON?','Harvest your mine, pass batons, do the tasks, grow your crew (you get 10 % of what they mine) and keep your daily streak.'],
['Why did my mine stop?','It fills up in 4 h, then waits for you. Harvest it to start it again.'],
['How do I get a baton?','You get one every day when you open the game, if your hands are free. Someone can also pass you theirs.'],
['What does a baton do?','While you hold it, your mine runs 2× faster. You have 4 h to pass it.'],
['Who can I pass it to?','Someone new with your link (x5), someone from your crew (x3), or a random player (x1). A player who already holds a baton, or who already held this one, cannot get it.'],
['How much does a pass pay?','120 $BATON × the number of hands the baton went through × the bonus (x5, x3 or x1). The more it travelled, the more it pays.'],
['What if I do not pass it?','When the timer hits zero, you drop the baton: its trip ends and you get no bonus.'],
['Why can I not pick someone from my crew?','They already hold a baton or already held this one. Send your link to someone new instead.'],
['Can I keep my baton longer?','Yes: +4 h for 10 ⭐, once per baton.'],
['What do I get for inviting someone to my crew?','5,000 $BATON at their first harvest and 10 % of everything they mine.'],
['What is the % bonus?','+1 % mining per hand of the baton you started, as long as it is travelling (up to +100 %), and +10 % for each Telegram channel you join, as long as you stay subscribed.'],
['What are upgrades?','The drill makes you mine faster. The tank (a mine that lasts longer) and the grip (a baton kept longer) unlock at drill level 3.'],
['What is the 🔥 streak?','Harvest every day: each day in a row adds a bonus.'],
['How do the rankings work?','Batons: the longest trips of the week (since Monday). Miners: the most $BATON earned this week. Both start again from zero every Monday.'],
['Are $BATON worth money?','They are points. An airdrop is planned: they would be turned into tokens based on your share of all points. No date or value is guaranteed.']]},
fr:{h:'Aide',tuto:'▶ Revoir le tutoriel',more:'Une autre question ? Écris-nous :',q:[
['C\'est quoi Pass The Baton ?','Un jeu Telegram : tu mines des points $BATON et tu fais passer des bâtons de main en main.'],
['Comment je gagne des $BATON ?','Récolte ta mine, passe des bâtons, fais les tâches, agrandis ton équipe (tu touches 10 % de ce qu\'ils minent) et garde ta série quotidienne.'],
['Pourquoi ma mine s\'est arrêtée ?','Elle se remplit en 4 h, puis elle t\'attend. Récolte-la pour la relancer.'],
['Comment j\'ai un bâton ?','Tu en reçois un chaque jour en ouvrant le jeu, si tu n\'en tiens pas déjà un. Quelqu\'un peut aussi te passer le sien.'],
['À quoi sert le bâton ?','Tant que tu l\'as, ta mine va 2× plus vite. Tu as 4 h pour le passer.'],
['À qui je peux le passer ?','À quelqu\'un de nouveau avec ton lien (x5), à quelqu\'un de ton équipe (x3) ou à un joueur au hasard (x1). Un joueur qui tient déjà un bâton, ou qui a déjà tenu celui-ci, ne peut pas le recevoir.'],
['Combien rapporte une passe ?','120 $BATON × le nombre de mains par lesquelles le bâton est passé × le bonus (x5, x3 ou x1). Plus il a voyagé, plus il rapporte.'],
['Et si je ne le passe pas ?','Quand le chrono arrive à zéro, tu laisses tomber le bâton : son voyage s\'arrête et tu n\'as pas de bonus.'],
['Pourquoi je ne peux pas choisir quelqu\'un de mon équipe ?','Il tient déjà un bâton ou il a déjà tenu celui-ci. Envoie plutôt ton lien à quelqu\'un de nouveau.'],
['Je peux garder mon bâton plus longtemps ?','Oui : +4 h pour 10 ⭐, une fois par bâton.'],
['Qu\'est-ce que je gagne en invitant quelqu\'un dans mon équipe ?','5 000 $BATON à sa première récolte et 10 % de tout ce qu\'il mine.'],
['C\'est quoi le bonus en % ?','+1 % de minage par main du bâton que tu as lancé, tant qu\'il voyage (jusqu\'à +100 %), et +10 % par chaîne Telegram rejointe, tant que tu restes abonné.'],
['C\'est quoi les améliorations ?','La foreuse te fait miner plus vite. Le réservoir (mine qui dure plus longtemps) et la poignée (bâton gardé plus longtemps) se débloquent au niveau 3 de la foreuse.'],
['C\'est quoi la série 🔥 ?','Récolte chaque jour : chaque jour d\'affilée ajoute un bonus.'],
['Comment marchent les classements ?','Bâtons : les plus longs voyages de la semaine (depuis lundi). Mineurs : le plus de $BATON gagnés cette semaine. Les deux repartent de zéro chaque lundi.'],
['Les $BATON valent de l\'argent ?','Ce sont des points. Un airdrop est prévu : ils seraient convertis en tokens selon ta part de tous les points. Aucune date ni valeur n\'est garantie.']]},
es:{h:'Ayuda',tuto:'▶ Ver el tutorial',more:'¿Otra pregunta? Escríbenos:',q:[
['¿Qué es Pass The Baton?','Un juego de Telegram: minas puntos $BATON y pasas bastones de mano en mano.'],
['¿Cómo gano $BATON?','Recolecta tu mina, pasa bastones, haz las tareas, invita amigos (ganas el 10 % de lo que minan) y mantén tu racha diaria.'],
['¿Por qué se paró mi mina?','Se llena en 4 h y luego te espera. Recolecta para reiniciarla.'],
['¿Cómo consigo un bastón?','Recibes uno cada día al abrir el juego, si no tienes ya uno. Alguien también puede pasarte el suyo.'],
['¿Para qué sirve el bastón?','Mientras lo tienes, tu mina va 2× más rápido. Tienes 4 h para pasarlo.'],
['¿A quién puedo pasarlo?','A alguien nuevo con tu enlace (x5), a un amigo (x3) o a un jugador al azar (x1). Quien ya tiene un bastón, o ya tuvo este, no puede recibirlo.'],
['¿Cuánto da un pase?','120 $BATON × el número de manos por las que pasó el bastón × el bonus (x5, x3 o x1). Cuanto más viaja, más da.'],
['¿Y si no lo paso?','Cuando el tiempo llega a cero, se te cae el bastón: su viaje termina y no ganas bonus.'],
['¿Por qué no puedo elegir a un amigo?','Ya tiene un bastón o ya tuvo este. Envía tu enlace a alguien nuevo.'],
['¿Puedo quedarme el bastón más tiempo?','Sí: +4 h por 10 ⭐, una vez por bastón.'],
['¿Qué gano invitando a un amigo?','5 000 $BATON en su primera recolección y el 10 % de todo lo que mine.'],
['¿Qué es el bonus en %?','+1 % de minería por cada mano del bastón que lanzaste, mientras siga viajando (hasta +100 %), y +10 % por cada canal de Telegram al que te unas, mientras sigas suscrito.'],
['¿Qué son las mejoras?','El taladro te hace minar más rápido. El depósito y el agarre se desbloquean en el nivel 3 del taladro.'],
['¿Qué es la racha 🔥?','Recolecta cada día: cada día seguido suma un bonus.'],
['¿Cómo funcionan las clasificaciones?','Bastones: los viajes más largos de la semana (desde el lunes). Mineros: más $BATON ganados esta semana. Ambas vuelven a cero cada lunes.'],
['¿Los $BATON valen dinero?','Son puntos. Hay un airdrop previsto: se convertirían en tokens según tu parte de todos los puntos. Sin fecha ni valor garantizados.']]},
pt:{h:'Ajuda',tuto:'▶ Ver o tutorial',more:'Outra pergunta? Fale com a gente:',q:[
['O que é o Pass The Baton?','Um jogo do Telegram: você minera pontos $BATON e passa bastões de mão em mão.'],
['Como ganho $BATON?','Colete sua mina, passe bastões, faça as tarefas, convide amigos (você ganha 10 % do que eles mineram) e mantenha sua sequência diária.'],
['Por que minha mina parou?','Ela enche em 4 h e depois espera por você. Colete para reiniciar.'],
['Como consigo um bastão?','Você recebe um por dia ao abrir o jogo, se ainda não tiver um. Alguém também pode passar o dele.'],
['Para que serve o bastão?','Enquanto estiver com ele, sua mina vai 2× mais rápido. Você tem 4 h para passá-lo.'],
['Para quem posso passar?','Para alguém novo com seu link (x5), um amigo (x3) ou um jogador aleatório (x1). Quem já tem um bastão, ou já teve este, não pode recebê-lo.'],
['Quanto rende um passe?','120 $BATON × o número de mãos por onde o bastão passou × o bônus (x5, x3 ou x1). Quanto mais viajou, mais rende.'],
['E se eu não passar?','Quando o tempo chega a zero, você deixa o bastão cair: a viagem acaba e você não ganha bônus.'],
['Por que não posso escolher um amigo?','Ele já tem um bastão ou já teve este. Mande seu link para alguém novo.'],
['Posso ficar mais tempo com o bastão?','Sim: +4 h por 10 ⭐, uma vez por bastão.'],
['O que ganho convidando um amigo?','5 000 $BATON na primeira coleta dele e 10 % de tudo o que ele minerar.'],
['O que é o bônus em %?','+1 % de mineração por mão do bastão que você lançou, enquanto ele viajar (até +100 %), e +10 % por canal do Telegram em que você entrar, enquanto continuar inscrito.'],
['O que são as melhorias?','A broca faz você minerar mais rápido. O tanque e a empunhadura são liberados no nível 3 da broca.'],
['O que é a sequência 🔥?','Colete todo dia: cada dia seguido soma um bônus.'],
['Como funcionam os rankings?','Bastões: as viagens mais longas da semana (desde segunda). Mineradores: mais $BATON ganhos nesta semana. Os dois recomeçam do zero toda segunda.'],
['Os $BATON valem dinheiro?','São pontos. Há um airdrop previsto: seriam convertidos em tokens conforme sua parte de todos os pontos. Sem data nem valor garantidos.']]},
ru:{h:'Помощь',tuto:'▶ Пройти обучение снова',more:'Другой вопрос? Напиши нам:',q:[
['Что такое Pass The Baton?','Игра в Telegram: ты добываешь очки $BATON и передаёшь эстафеты из рук в руки.'],
['Как заработать $BATON?','Собирай шахту, передавай эстафеты, выполняй задания, приглашай друзей (10 % от их добычи) и держи ежедневную серию.'],
['Почему шахта остановилась?','Она заполняется за 4 ч и ждёт тебя. Собери, чтобы запустить снова.'],
['Как получить эстафету?','Каждый день при входе в игру, если у тебя её ещё нет. Её также может передать другой игрок.'],
['Что даёт эстафета?','Пока она у тебя, шахта работает в 2 раза быстрее. У тебя 4 ч, чтобы её передать.'],
['Кому можно передать?','Новичку по твоей ссылке (x5), другу (x3) или случайному игроку (x1). Тот, у кого уже есть эстафета или кто уже держал эту, получить её не может.'],
['Сколько приносит передача?','120 $BATON × число рук, через которые прошла эстафета × бонус (x5, x3 или x1). Чем дальше она прошла, тем больше приносит.'],
['А если не передать?','Когда таймер дойдёт до нуля, ты уронишь эстафету: её путь закончится, бонуса не будет.'],
['Почему нельзя выбрать друга?','У него уже есть эстафета или он уже держал эту. Отправь ссылку новичку.'],
['Можно держать эстафету дольше?','Да: +4 ч за 10 ⭐, один раз на эстафету.'],
['Что я получу за приглашение друга?','5 000 $BATON после его первого сбора и 10 % от всей его добычи.'],
['Что такое бонус в %?','+1 % к добыче за каждую руку твоей эстафеты, пока она в пути (до +100 %), и +10 % за каждый канал Telegram, на который ты подписан.'],
['Что такое улучшения?','Бур ускоряет добычу. Бак и рукоять открываются на 3-м уровне бура.'],
['Что такое серия 🔥?','Собирай каждый день: каждый день подряд добавляет бонус.'],
['Как работают рейтинги?','Эстафеты: самые длинные путешествия недели (с понедельника). Шахтёры: больше всего $BATON за эту неделю. Оба рейтинга обнуляются каждый понедельник.'],
['$BATON стоят денег?','Это очки. Планируется аирдроп: их обменяют на токены по твоей доле от всех очков. Дата и стоимость не гарантируются.']]},
uk:{h:'Допомога',tuto:'▶ Пройти навчання знову',more:'Інше питання? Напиши нам:',q:[
['Що таке Pass The Baton?','Гра в Telegram: ти видобуваєш очки $BATON і передаєш естафети з рук у руки.'],
['Як заробити $BATON?','Збирай шахту, передавай естафети, виконуй завдання, запрошуй друзів (10 % від їхнього видобутку) і тримай щоденну серію.'],
['Чому шахта зупинилася?','Вона наповнюється за 4 год і чекає на тебе. Збери, щоб запустити знову.'],
['Як отримати естафету?','Щодня при вході в гру, якщо в тебе її ще немає. Її також може передати інший гравець.'],
['Що дає естафета?','Поки вона в тебе, шахта працює вдвічі швидше. У тебе 4 год, щоб її передати.'],
['Кому можна передати?','Новачку за твоїм посиланням (x5), другові (x3) або випадковому гравцеві (x1). Хто вже має естафету чи вже тримав цю, отримати її не може.'],
['Скільки дає передача?','120 $BATON × кількість рук, через які пройшла естафета × бонус (x5, x3 або x1). Що далі вона пройшла, то більше дає.'],
['А якщо не передати?','Коли таймер дійде до нуля, ти впустиш естафету: її подорож закінчиться, бонусу не буде.'],
['Чому не можна обрати друга?','Він уже має естафету або вже тримав цю. Надішли посилання новачку.'],
['Можна тримати естафету довше?','Так: +4 год за 10 ⭐, один раз на естафету.'],
['Що я отримаю за запрошення друга?','5 000 $BATON після його першого збору і 10 % від усього його видобутку.'],
['Що таке бонус у %?','+1 % до видобутку за кожну руку твоєї естафети, поки вона в дорозі (до +100 %), і +10 % за кожен канал Telegram, на який ти підписаний.'],
['Що таке покращення?','Бур прискорює видобуток. Бак і руків\'я відкриваються на 3-му рівні бура.'],
['Що таке серія 🔥?','Збирай щодня: кожен день поспіль додає бонус.'],
['Як працюють рейтинги?','Естафети: найдовші подорожі тижня (з понеділка). Шахтарі: найбільше $BATON за цей тиждень. Обидва рейтинги обнуляються щопонеділка.'],
['$BATON коштують грошей?','Це очки. Планується аірдроп: їх обміняють на токени за твоєю часткою від усіх очок. Дата й вартість не гарантуються.']]},
tr:{h:'Yardım',tuto:'▶ Eğitimi tekrar izle',more:'Başka bir sorun mu var? Bize yaz:',q:[
['Pass The Baton nedir?','Bir Telegram oyunu: $BATON puanı kazar ve bayrakları elden ele geçirirsin.'],
['Nasıl $BATON kazanırım?','Madenini topla, bayrak devret, görevleri yap, arkadaş davet et (kazdıklarının %10\'u senin) ve günlük serini koru.'],
['Madenim neden durdu?','4 saatte dolar, sonra seni bekler. Yeniden başlatmak için topla.'],
['Nasıl bayrak alırım?','Elinde yoksa, oyunu açtığında her gün bir tane alırsın. Biri de sana kendininkini devredebilir.'],
['Bayrak ne işe yarar?','Sende olduğu sürece madenin 2× hızlı çalışır. Devretmek için 4 saatin var.'],
['Kime devredebilirim?','Linkinle yeni birine (x5), bir arkadaşa (x3) ya da rastgele bir oyuncuya (x1). Elinde zaten bayrak olan ya da bunu zaten tutmuş biri alamaz.'],
['Bir devir ne kazandırır?','120 $BATON × bayrağın geçtiği el sayısı × bonus (x5, x3 veya x1). Ne kadar çok gezdiyse o kadar çok kazandırır.'],
['Devretmezsem ne olur?','Süre sıfırlanınca bayrağı düşürürsün: yolculuğu biter ve bonus alamazsın.'],
['Neden bir arkadaş seçemiyorum?','Elinde zaten bayrak var ya da bunu zaten tuttu. Linkini yeni birine gönder.'],
['Bayrağı daha uzun tutabilir miyim?','Evet: 10 ⭐ karşılığında +4 saat, bayrak başına bir kez.'],
['Arkadaş davet edince ne kazanırım?','İlk toplamasında 5 000 $BATON ve kazdığı her şeyin %10\'u.'],
['% bonus nedir?','Başlattığın bayrak yolda olduğu sürece her el için +%1 kazı (en fazla +%100) ve katıldığın her Telegram kanalı için, abone kaldığın sürece +%10.'],
['Geliştirmeler nedir?','Matkap daha hızlı kazmanı sağlar. Depo ve tutamak, matkap 3. seviyede açılır.'],
['🔥 serisi nedir?','Her gün topla: üst üste her gün bir bonus ekler.'],
['Sıralamalar nasıl çalışır?','Bayraklar: haftanın en uzun yolculukları (pazartesiden beri). Madenciler: bu hafta en çok $BATON kazananlar. İkisi de her pazartesi sıfırlanır.'],
['$BATON para eder mi?','Bunlar puan. Bir airdrop planlanıyor: tüm puanlardaki payına göre tokene çevrilecek. Tarih ve değer garanti değil.']]},
id:{h:'Bantuan',tuto:'▶ Ulangi tutorial',more:'Ada pertanyaan lain? Tulis ke kami:',q:[
['Apa itu Pass The Baton?','Game Telegram: kamu menambang poin $BATON dan mengoper tongkat dari tangan ke tangan.'],
['Bagaimana dapat $BATON?','Panen tambangmu, oper tongkat, kerjakan tugas, undang teman (kamu dapat 10 % dari hasil tambang mereka) dan jaga runtutan harianmu.'],
['Kenapa tambangku berhenti?','Tambang penuh dalam 4 jam lalu menunggumu. Panen untuk menjalankannya lagi.'],
['Bagaimana dapat tongkat?','Kamu dapat satu tiap hari saat membuka game, jika belum memegang tongkat. Orang lain juga bisa mengoper miliknya.'],
['Apa gunanya tongkat?','Selama kamu memegangnya, tambangmu 2× lebih cepat. Kamu punya 4 jam untuk mengopernya.'],
['Ke siapa bisa kuoper?','Ke orang baru lewat linkmu (x5), ke teman (x3), atau ke pemain acak (x1). Yang sudah memegang tongkat, atau sudah pernah memegang yang ini, tidak bisa menerimanya.'],
['Berapa hasil satu operan?','120 $BATON × jumlah tangan yang dilewati tongkat × bonus (x5, x3 atau x1). Makin jauh berkelana, makin besar hasilnya.'],
['Kalau tidak kuoper?','Saat waktu habis, tongkatmu jatuh: perjalanannya berakhir dan kamu tidak dapat bonus.'],
['Kenapa tidak bisa memilih teman?','Dia sudah memegang tongkat atau sudah pernah memegang yang ini. Kirim linkmu ke orang baru.'],
['Bisa pegang tongkat lebih lama?','Bisa: +4 jam untuk 10 ⭐, sekali per tongkat.'],
['Apa yang kudapat jika mengundang teman?','5 000 $BATON saat panen pertamanya dan 10 % dari semua hasil tambangnya.'],
['Apa itu bonus %?','+1 % tambang per tangan dari tongkat yang kamu mulai, selama masih berkelana (hingga +100 %), dan +10 % untuk setiap kanal Telegram yang kamu ikuti, selama tetap berlangganan.'],
['Apa itu peningkatan?','Bor membuatmu menambang lebih cepat. Tangki dan pegangan terbuka di level bor 3.'],
['Apa itu runtutan 🔥?','Panen setiap hari: setiap hari berturut-turut menambah bonus.'],
['Bagaimana peringkat bekerja?','Tongkat: perjalanan terpanjang minggu ini (sejak Senin). Penambang: $BATON terbanyak minggu ini. Keduanya mulai dari nol setiap Senin.'],
['Apakah $BATON bernilai uang?','Itu poin. Airdrop direncanakan: poin akan diubah menjadi token sesuai bagianmu dari semua poin. Tanpa jaminan tanggal maupun nilai.']]},
ar:{h:'مساعدة',tuto:'▶ أعد مشاهدة الشرح',more:'سؤال آخر؟ راسلنا:',q:[
['ما هي Pass The Baton؟','لعبة على تيليجرام: تعدّن نقاط $BATON وتمرّر العصي من يد إلى يد.'],
['كيف أربح $BATON؟','اجمع منجمك، مرّر العصي، أنجز المهام، ادعُ أصدقاءك (تحصل على 10 % مما يعدّنون) وحافظ على سلسلة أيامك.'],
['لماذا توقف منجمي؟','يمتلئ في 4 ساعات ثم ينتظرك. اجمعه ليعمل من جديد.'],
['كيف أحصل على عصا؟','تحصل على واحدة كل يوم عند فتح اللعبة إن لم تكن تحمل واحدة. ويمكن لأحدهم أيضًا أن يمرّر لك عصاه.'],
['ما فائدة العصا؟','ما دامت معك، منجمك أسرع مرتين. لديك 4 ساعات لتمريرها.'],
['لمن أمرّرها؟','لشخص جديد عبر رابطك (x5)، لصديق (x3)، أو للاعب عشوائي (x1). من يحمل عصا بالفعل، أو حمل هذه من قبل، لا يمكنه استلامها.'],
['كم تربحني التمريرة؟','120 $BATON × عدد الأيدي التي مرت بها العصا × المكافأة (x5 أو x3 أو x1). كلما سافرت أكثر، ربحت أكثر.'],
['وإذا لم أمرّرها؟','عندما ينتهي الوقت تسقط العصا منك: تنتهي رحلتها ولا تحصل على مكافأة.'],
['لماذا لا أستطيع اختيار صديق؟','معه عصا بالفعل أو حمل هذه من قبل. أرسل رابطك لشخص جديد.'],
['هل يمكنني الاحتفاظ بالعصا أطول؟','نعم: +4 ساعات مقابل 10 ⭐، مرة واحدة لكل عصا.'],
['ماذا أربح عند دعوة صديق؟','5 000 $BATON عند أول جمع له و10 % من كل ما يعدّنه.'],
['ما هي المكافأة بالنسبة المئوية؟','+1 % تعدين لكل يد مرت بها العصا التي أطلقتها ما دامت تسافر (حتى +100 %)، و+10 % لكل قناة تيليجرام تنضم إليها ما دمت مشتركًا.'],
['ما هي التحسينات؟','المثقاب يجعلك تعدّن أسرع. الخزان والمقبض يُفتحان عند المستوى 3 للمثقاب.'],
['ما هي السلسلة 🔥؟','اجمع كل يوم: كل يوم متتالٍ يضيف مكافأة.'],
['كيف تعمل التصنيفات؟','العصي: أطول رحلات الأسبوع (منذ الإثنين). المعدّنون: الأكثر ربحًا لـ $BATON هذا الأسبوع. يبدأ الترتيبان من الصفر كل إثنين.'],
['هل لـ $BATON قيمة مالية؟','إنها نقاط. هناك إيردروب مخطط: ستتحول إلى توكنات حسب حصتك من كل النقاط. لا تاريخ ولا قيمة مضمونان.']]},
fa:{h:'راهنما',tuto:'▶ دیدن دوبارهٔ آموزش',more:'سؤال دیگری داری؟ برایمان بنویس:',q:[
['Pass The Baton چیست؟','یک بازی تلگرامی: امتیاز $BATON استخراج می‌کنی و چوب‌ها را دست به دست می‌کنی.'],
['چطور $BATON به دست بیاورم؟','معدنت را برداشت کن، چوب پاس بده، مأموریت‌ها را انجام بده، دوستانت را دعوت کن (۱۰٪ استخراجشان مال توست) و زنجیرهٔ روزانه‌ات را حفظ کن.'],
['چرا معدنم متوقف شد؟','در ۴ ساعت پر می‌شود و منتظرت می‌ماند. برداشت کن تا دوباره کار کند.'],
['چطور چوب بگیرم؟','هر روز با باز کردن بازی یکی می‌گیری، اگر از قبل چوبی نداشته باشی. کسی هم می‌تواند چوبش را به تو بدهد.'],
['چوب به چه درد می‌خورد؟','تا وقتی دست توست، معدنت ۲ برابر سریع‌تر است. ۴ ساعت وقت داری ردش کنی.'],
['به چه کسی پاسش بدهم؟','به یک تازه‌وارد با لینکت (x5)، به یک دوست (x3) یا به یک بازیکن تصادفی (x1). کسی که چوب دارد یا قبلاً همین را داشته، نمی‌تواند آن را بگیرد.'],
['هر پاس چقدر می‌ارزد؟','۱۲۰ $BATON × تعداد دست‌هایی که چوب از آن‌ها گذشته × پاداش (x5، x3 یا x1). هرچه بیشتر سفر کرده، بیشتر می‌ارزد.'],
['اگر پاسش ندهم؟','وقتی زمان تمام شود، چوب از دستت می‌افتد: سفرش تمام می‌شود و پاداشی نمی‌گیری.'],
['چرا نمی‌توانم دوستی را انتخاب کنم؟','او از قبل چوب دارد یا همین را قبلاً داشته. لینکت را برای یک تازه‌وارد بفرست.'],
['می‌توانم چوب را بیشتر نگه دارم؟','بله: ۴ ساعت بیشتر با ۱۰ ⭐، یک بار برای هر چوب.'],
['با دعوت دوست چه می‌گیرم؟','۵٬۰۰۰ $BATON در اولین برداشتش و ۱۰٪ از همهٔ استخراجش.'],
['پاداش درصدی چیست؟','۱٪+ استخراج برای هر دستِ چوبی که راه انداختی، تا وقتی در سفر است (تا ۱۰۰٪+)، و ۱۰٪+ برای هر کانال تلگرامی که عضوش شوی، تا وقتی عضو بمانی.'],
['ارتقاها چیست؟','مته سرعت استخراجت را بالا می‌برد. مخزن و دسته در سطح ۳ مته باز می‌شوند.'],
['زنجیرهٔ 🔥 چیست؟','هر روز برداشت کن: هر روز پیاپی یک پاداش اضافه می‌کند.'],
['رتبه‌بندی‌ها چطور کار می‌کنند؟','چوب‌ها: طولانی‌ترین سفرهای هفته (از دوشنبه). معدنچی‌ها: بیشترین $BATON در این هفته. هر دو هر دوشنبه از صفر شروع می‌شوند.'],
['آیا $BATON ارزش پولی دارد؟','این‌ها امتیازند. ایردراپی برنامه‌ریزی شده: بر اساس سهمت از کل امتیازها به توکن تبدیل می‌شوند. تاریخ و ارزش تضمین نشده است.']]}
};

const FAQ35 = {
en:[['What is Pass The Baton?','A Telegram game where you pass a baton: it earns you $BATON while you hold it.'],['How do I get a baton?','You get one every day when you open the game. Someone can also pass you theirs.'],['How much does it earn?','300 $BATON per hour while you hold it, plus 10 % for each Telegram channel you joined. You have 4 hours.'],['Why pass it?','Passing it pays a bonus: +5,000 to someone new (with your link), +3,000 to someone from your crew, +1,000 to a random player.'],['What if the timer ends?','The baton falls: you keep what it earned you, but you get no bonus.'],['What does a video do?','It adds 1 hour to the timer, 4 times per baton.'],['What is my crew?','The friends you invite. +5,000 $BATON when they pass their first baton, and 10 % of everything they earn.'],['How do the rankings work?','The players who earned the most $BATON this week. Everyone starts again from zero every Monday.'],['What are $BATON worth?','They are points. An airdrop is planned: they will turn into real tokens according to your share of all points. No date or value guaranteed.']],
fr:[['C\'est quoi Pass The Baton ?','Un jeu Telegram où l\'on se passe un bâton : il te rapporte des $BATON tant que tu le tiens.'],['Comment avoir un bâton ?','Tu en reçois un chaque jour quand tu ouvres le jeu. Quelqu\'un peut aussi te passer le sien.'],['Combien ça rapporte ?','300 $BATON par heure tant que tu le tiens, plus 10 % par chaîne Telegram rejointe. Tu as 4 heures.'],['Pourquoi le passer ?','Le passer rapporte un bonus : +5 000 à un nouveau (avec ton lien), +3 000 à quelqu\'un de ton équipe, +1 000 à un joueur au hasard.'],['Et si le chrono arrive à zéro ?','Le bâton tombe : tu gardes ce qu\'il t\'a rapporté, mais pas de bonus.'],['À quoi sert la vidéo ?','Elle ajoute 1 heure au chrono, 4 fois par bâton.'],['C\'est quoi mon équipe ?','Les amis que tu invites. +5 000 $BATON quand ils passent leur premier bâton, et 10 % de tout ce qu\'ils gagnent.'],['Comment marche le classement ?','Les joueurs qui ont gagné le plus de $BATON cette semaine. Tout le monde repart de zéro chaque lundi.'],['Que valent les $BATON ?','Ce sont des points. Un airdrop est prévu : ils seront convertis en vrais tokens selon ta part de tous les points. Sans date ni valeur garanties.']],
es:[['¿Qué es Pass The Baton?','Un juego de Telegram en el que se pasa un bastón: te da $BATON mientras lo tienes.'],['¿Cómo consigo un bastón?','Recibes uno cada día al abrir el juego. Alguien también puede pasarte el suyo.'],['¿Cuánto da?','300 $BATON por hora mientras lo tienes, más 10 % por cada canal de Telegram al que te unas. Tienes 4 horas.'],['¿Por qué pasarlo?','Pasarlo da un bonus: +5 000 a alguien nuevo (con tu enlace), +3 000 a alguien de tu equipo, +1 000 a un jugador al azar.'],['¿Y si se acaba el tiempo?','El bastón se cae: te quedas con lo que te dio, pero sin bonus.'],['¿Para qué sirve el vídeo?','Añade 1 hora al tiempo, 4 veces por bastón.'],['¿Qué es mi equipo?','Los amigos que invitas. +5 000 $BATON cuando pasen su primer bastón, y 10 % de todo lo que ganen.'],['¿Cómo funciona la clasificación?','Los jugadores que más $BATON ganaron esta semana. Todos vuelven a cero cada lunes.'],['¿Cuánto valen los $BATON?','Son puntos. Hay un airdrop previsto: se convertirán en tokens reales según tu parte de todos los puntos. Sin fecha ni valor garantizados.']],
pt:[['O que é Pass The Baton?','Um jogo do Telegram em que se passa um bastão: ele rende $BATON enquanto você o segura.'],['Como consigo um bastão?','Você recebe um todo dia ao abrir o jogo. Alguém também pode passar o dele.'],['Quanto ele rende?','300 $BATON por hora enquanto você o segura, mais 10 % por canal do Telegram em que você entrou. Você tem 4 horas.'],['Por que passar?','Passar rende um bônus: +5 000 para alguém novo (com seu link), +3 000 para alguém da sua equipe, +1 000 para um jogador ao acaso.'],['E se o tempo acabar?','O bastão cai: você fica com o que ele rendeu, mas sem bônus.'],['Para que serve o vídeo?','Ele adiciona 1 hora ao tempo, 4 vezes por bastão.'],['O que é minha equipe?','Os amigos que você convida. +5 000 $BATON quando eles passarem o primeiro bastão, e 10 % de tudo o que ganharem.'],['Como funciona o ranking?','Os jogadores que mais ganharam $BATON nesta semana. Todos recomeçam do zero toda segunda.'],['Quanto valem os $BATON?','São pontos. Um airdrop está previsto: eles virarão tokens reais conforme sua parte de todos os pontos. Sem data nem valor garantidos.']],
ru:[['Что такое Pass The Baton?','Игра в Telegram, где передают эстафету: пока она у тебя, она приносит $BATON.'],['Как получить эстафету?','Ты получаешь её каждый день, когда открываешь игру. Её также может передать другой игрок.'],['Сколько она приносит?','300 $BATON в час, пока она у тебя, плюс 10 % за каждый канал Telegram, на который ты подписан. У тебя 4 часа.'],['Зачем её передавать?','Передача даёт бонус: +5 000 за новичка (по твоей ссылке), +3 000 за члена команды, +1 000 за случайного игрока.'],['А если таймер закончится?','Эстафета упадёт: заработанное останется, но бонуса не будет.'],['Зачем видео?','Оно добавляет 1 час к таймеру, 4 раза на эстафету.'],['Что такое моя команда?','Друзья, которых ты пригласил. +5 000 $BATON, когда они передадут первую эстафету, и 10 % от всего их заработка.'],['Как работает рейтинг?','Игроки, заработавшие больше всего $BATON за неделю. Каждый понедельник все начинают с нуля.'],['Сколько стоят $BATON?','Это очки. Планируется эйрдроп: они превратятся в настоящие токены по твоей доле всех очков. Без гарантии даты и стоимости.']],
uk:[['Що таке Pass The Baton?','Гра в Telegram, де передають естафету: поки вона в тебе, вона приносить $BATON.'],['Як отримати естафету?','Ти отримуєш її щодня, коли відкриваєш гру. Її також може передати інший гравець.'],['Скільки вона приносить?','300 $BATON на годину, поки вона в тебе, плюс 10 % за кожен канал Telegram, на який ти підписаний. У тебе 4 години.'],['Навіщо її передавати?','Передача дає бонус: +5 000 за новачка (за твоїм посиланням), +3 000 за члена команди, +1 000 за випадкового гравця.'],['А якщо таймер закінчиться?','Естафета впаде: зароблене залишиться, але бонусу не буде.'],['Навіщо відео?','Воно додає 1 годину до таймера, 4 рази на естафету.'],['Що таке моя команда?','Друзі, яких ти запросив. +5 000 $BATON, коли вони передадуть першу естафету, і 10 % від усього їхнього заробітку.'],['Як працює рейтинг?','Гравці, які заробили найбільше $BATON за тиждень. Щопонеділка всі починають з нуля.'],['Скільки коштують $BATON?','Це бали. Планується ейрдроп: вони перетворяться на справжні токени за твоєю часткою всіх балів. Без гарантії дати та вартості.']],
tr:[['Pass The Baton nedir?','Bayrak devretmeye dayalı bir Telegram oyunu: elinde olduğu sürece sana $BATON kazandırır.'],['Nasıl bayrak alırım?','Oyunu her gün açtığında bir tane alırsın. Başka biri de sana kendininkini devredebilir.'],['Ne kadar kazandırır?','Elinde olduğu sürece saatte 300 $BATON, katıldığın her Telegram kanalı için +%10. 4 saatin var.'],['Neden devretmeli?','Devretmek bonus kazandırır: yeni birine +5 000 (linkinle), ekibinden birine +3 000, rastgele birine +1 000.'],['Süre biterse?','Bayrak düşer: kazandırdığını tutarsın ama bonus alamazsın.'],['Video ne işe yarar?','Süreye 1 saat ekler, bayrak başına 4 kez.'],['Ekibim nedir?','Davet ettiğin arkadaşlar. İlk bayraklarını devrettiklerinde +5 000 $BATON ve kazandıkları her şeyin %10\'u.'],['Sıralama nasıl çalışır?','Bu hafta en çok $BATON kazanan oyuncular. Her pazartesi herkes sıfırdan başlar.'],['$BATON ne değerinde?','Bunlar puan. Bir airdrop planlanıyor: tüm puanlardaki payına göre gerçek tokenlara dönüşecek. Tarih ya da değer garantisi yok.']],
id:[['Apa itu Pass The Baton?','Game Telegram tempat orang saling mengoper tongkat: tongkat memberimu $BATON selama kamu memegangnya.'],['Bagaimana dapat tongkat?','Kamu dapat satu setiap hari saat membuka game. Orang lain juga bisa mengoper tongkatnya ke kamu.'],['Berapa hasilnya?','300 $BATON per jam selama kamu memegangnya, plus 10 % per kanal Telegram yang kamu ikuti. Kamu punya 4 jam.'],['Kenapa harus dioper?','Mengoper memberi bonus: +5 000 ke orang baru (lewat linkmu), +3 000 ke anggota timmu, +1 000 ke pemain acak.'],['Kalau waktu habis?','Tongkat jatuh: kamu menyimpan yang sudah didapat, tapi tanpa bonus.'],['Untuk apa video?','Menambah 1 jam ke waktu, 4 kali per tongkat.'],['Apa itu timku?','Teman yang kamu undang. +5 000 $BATON saat mereka mengoper tongkat pertamanya, dan 10 % dari semua hasil mereka.'],['Bagaimana peringkat bekerja?','Pemain yang paling banyak mendapat $BATON minggu ini. Semua mulai dari nol setiap Senin.'],['Berapa nilai $BATON?','Itu poin. Airdrop direncanakan: poin akan jadi token asli sesuai bagianmu dari semua poin. Tanpa jaminan tanggal atau nilai.']],
ar:[['ما هي Pass The Baton؟','لعبة تيليجرام يتبادل فيها اللاعبون عصا: تربحك $BATON ما دامت معك.'],['كيف أحصل على عصا؟','تحصل على واحدة كل يوم عند فتح اللعبة. ويمكن لغيرك أن يمرّر لك عصاه.'],['كم تربح؟','300 $BATON في الساعة ما دامت معك، مع 10 % لكل قناة تيليجرام انضممت إليها. لديك 4 ساعات.'],['لماذا أمرّرها؟','التمرير يمنح مكافأة: +5 000 لشخص جديد (عبر رابطك)، +3 000 لعضو في فريقك، +1 000 للاعب عشوائي.'],['وإذا انتهى الوقت؟','تسقط العصا: تحتفظ بما ربحته منها، لكن دون مكافأة.'],['ما فائدة الفيديو؟','يضيف ساعة إلى الوقت، 4 مرات لكل عصا.'],['ما هو فريقي؟','الأصدقاء الذين تدعوهم. +5 000 $BATON عندما يمرّرون أول عصا، و10 % من كل ما يربحونه.'],['كيف يعمل الترتيب؟','اللاعبون الذين ربحوا أكثر $BATON هذا الأسبوع. يبدأ الجميع من الصفر كل إثنين.'],['كم تساوي $BATON؟','إنها نقاط. هناك إيردروب مخطط له: ستتحول إلى رموز حقيقية حسب حصتك من كل النقاط. دون ضمان تاريخ أو قيمة.']],
fa:[['Pass The Baton چیست؟','یک بازی تلگرامی که در آن چوب دست‌به‌دست می‌شود: تا وقتی دست توست برایت $BATON می‌آورد.'],['چطور چوب بگیرم؟','هر روز با باز کردن بازی یکی می‌گیری. دیگران هم می‌توانند چوبشان را به تو بدهند.'],['چقدر درآمد دارد؟','ساعتی ۳۰۰ $BATON تا وقتی دست توست، به‌علاوه ۱۰٪ برای هر کانال تلگرامی که عضو شدی. ۴ ساعت وقت داری.'],['چرا ردش کنم؟','رد کردن پاداش دارد: +۵٬۰۰۰ برای تازه‌وارد (با لینک تو)، +۳٬۰۰۰ برای یکی از تیمت، +۱٬۰۰۰ برای بازیکن تصادفی.'],['اگر زمان تمام شود؟','چوب می‌افتد: آنچه آورده برایت می‌ماند، اما پاداشی نمی‌گیری.'],['ویدیو چه فایده‌ای دارد؟','۱ ساعت به زمان اضافه می‌کند، ۴ بار برای هر چوب.'],['تیم من چیست؟','دوستانی که دعوت می‌کنی. +۵٬۰۰۰ $BATON وقتی اولین چوبشان را رد کنند، و ۱۰٪ از همه درآمدشان.'],['رتبه‌بندی چطور کار می‌کند؟','بازیکنانی که این هفته بیشترین $BATON را گرفتند. هر دوشنبه همه از صفر شروع می‌کنند.'],['ارزش $BATON چقدر است؟','این‌ها امتیازند. یک ایردراپ برنامه‌ریزی شده: بر اساس سهمت از همه امتیازها به توکن واقعی تبدیل می‌شوند. بدون تضمین تاریخ یا ارزش.']]
};

ru:['На главном экране видео добавляет 1 час к таймеру (4 раза на эстафету). В Заданиях оно даёт +250 $BATON (10 в день).','Можно держать эстафету дольше?','Да: +1 час за видео (4 раза) и +4 часа за 50 ⭐ (один раз на эстафету).','Друзья, которых ты пригласил, и тот, кто пригласил тебя. +10 000 $BATON, когда приглашённый друг передаст первую эстафету, и 10 % от всего его заработка. Ещё +10 000, когда он передаст 10 эстафет.'],
uk:['На головному екрані відео додає 1 годину до таймера (4 рази на естафету). У Завданнях воно дає +250 $BATON (10 на день).','Можна тримати естафету довше?','Так: +1 година за відео (4 рази) і +4 години за 50 ⭐ (один раз на естафету).','Друзі, яких ти запросив, і той, хто запросив тебе. +10 000 $BATON, коли запрошений друг передасть першу естафету, і 10 % від усього його заробітку. Ще +10 000, коли він передасть 10 естафет.'],
tr:['Ana ekranda süreye 1 saat ekler (bayrak başına 4 kez). Görevler\'de +250 $BATON kazandırır (günde 10).','Bayrağı daha uzun tutabilir miyim?','Evet: video başına +1 saat (4 kez) ve 50 ⭐ karşılığında +4 saat (bayrak başına bir kez).','Davet ettiğin arkadaşlar ve seni davet eden kişi. Davet ettiğin biri ilk bayrağını devrettiğinde +10 000 $BATON ve kazandığı her şeyin %10\'u. 10 bayrak devrettiğinde +10 000 daha.'],

en:[['What is Pass The Baton?','A Telegram game where you pass a baton: while you hold it, it earns you $BATON, which you trade for real USDT.'],['How do I get a baton?','You get one every day when you open the game (the next one comes at midnight, Paris time). Once it is passed or dropped, a video gives you a 2nd one, once a day. Someone can also pass you theirs.'],['How much does it earn?','300 $BATON per hour at level 1, up to 840 at level 10. +10 % if you are subscribed to @jeremstyke. A video doubles its earnings for 1 hour (up to 4 times per baton).'],['When should I pass it?','Keep it as long as you can: it pays every hour. Pass it just before the 4 hours end to also get the bonus.'],['What does passing it pay?','+10,000 to someone new (with your link, he joins your crew), +3,000 to someone in your crew, +1,000 to a random player.'],['What if the timer hits zero?','The baton falls: you only keep half of what it earned you, and you get no bonus.'],['What is my crew?','The friends you invite, and the one who invited you. +10,000 when a friend passes his first baton, +10,000 more at 10 batons passed, and 10 % of all his winnings. You can ask each other for your batons.'],['Which tasks are there?','Every day: 1 trade on Meme Coin Tycoon, +1,000 each. Videos: +100 (10 a day). Sponsored tasks: +2,000, no daily limit. And one-time tasks: +5,000 each.'],['What is the 🔥 streak?','Open the game every day: day 1 = +1,000, day 2 = +2,000… up to +7,000 on day 7, then it starts again. Miss a day and it goes back to day 1.'],['How do I upgrade my baton?','With your $BATON: 10 levels, from 300 to 840 $BATON per hour.'],['How do the rankings work?','The players who earned the most $BATON this week. Every Monday the top 10 win $BATON (100,000 for the 1st) and everyone starts again from zero.'],['What are $BATON worth?','In the shop, 1 million $BATON = 1 $ in USDT, sent automatically to your TON wallet. To withdraw: play on 5 different days (Pass The Baton or Meme Coin Tycoon), one withdrawal a week.']],
fr:[['C\'est quoi Pass The Baton ?','Un jeu Telegram où l\'on se passe un bâton : tant que tu le tiens, il te rapporte des $BATON, que tu échanges contre de vrais USDT.'],['Comment avoir un bâton ?','Tu en reçois un chaque jour en ouvrant le jeu (le prochain arrive à minuit, heure de Paris). Une fois passé ou tombé, une vidéo t\'en donne un 2e, une fois par jour. Quelqu\'un peut aussi te passer le sien.'],['Combien ça rapporte ?','300 $BATON par heure au niveau 1, jusqu\'à 840 au niveau 10. +10 % si tu es abonné à @jeremstyke. Une vidéo double ses gains pendant 1 heure (jusqu\'à 4 fois par bâton).'],['Quand le passer ?','Garde-le le plus longtemps possible : il rapporte chaque heure. Passe-le juste avant la fin des 4 heures pour toucher aussi le bonus.'],['Que rapporte le passage ?','+10 000 à quelqu\'un de nouveau (avec ton lien, il rejoint ton équipe), +3 000 à quelqu\'un de ton équipe, +1 000 à un joueur au hasard.'],['Et si le chrono arrive à zéro ?','Le bâton tombe : tu ne gardes que la moitié de ce qu\'il t\'a rapporté, et pas de bonus.'],['C\'est quoi mon équipe ?','Les amis que tu invites, et celui qui t\'a invité. +10 000 quand un ami passe son premier bâton, +10 000 de plus à 10 bâtons passés, et 10 % de tous ses gains. Vous pouvez vous demander vos bâtons.'],['Quelles tâches ?','Chaque jour : 1 échange sur Meme Coin Tycoon, +1 000 chacun. Vidéos : +100 (10 par jour). Tâches sponsorisées : +2 000, sans limite par jour. Et des tâches à faire une seule fois : +5 000 chacune.'],['C\'est quoi la série 🔥 ?','Ouvre le jeu chaque jour : jour 1 = +1 000, jour 2 = +2 000… jusqu\'à +7 000 le jour 7, puis ça recommence. Un jour raté et tu repars au jour 1.'],['Comment améliorer mon bâton ?','Avec tes $BATON : 10 niveaux, de 300 à 840 $BATON par heure.'],['Comment marche le classement ?','Les joueurs qui ont gagné le plus de $BATON cette semaine. Chaque lundi, les 10 premiers gagnent des $BATON (100 000 pour le 1er) et tout le monde repart de zéro.'],['Que valent les $BATON ?','Dans la boutique, 1 million de $BATON = 1 $ en USDT, envoyés automatiquement sur ton wallet TON. Pour retirer : avoir joué 5 jours différents (Pass The Baton ou Meme Coin Tycoon), un retrait par semaine.']],
es:[['¿Qué es Pass The Baton?','Un juego de Telegram en el que se pasa un bastón: mientras lo tienes, te da $BATON, que cambias por USDT reales.'],['¿Cómo consigo un bastón?','Recibes uno cada día al abrir el juego (el siguiente llega a medianoche, hora de París). Cuando lo pasas o se cae, un vídeo te da un 2.º, una vez al día. Alguien también puede pasarte el suyo.'],['¿Cuánto da?','300 $BATON por hora en el nivel 1, hasta 840 en el nivel 10. +10 % si estás suscrito a @jeremstyke. Un vídeo duplica sus ganancias durante 1 hora (hasta 4 veces por bastón).'],['¿Cuándo pasarlo?','Guárdalo lo más posible: paga cada hora. Pásalo justo antes de que acaben las 4 horas para cobrar también el bonus.'],['¿Qué da pasarlo?','+10 000 a alguien nuevo (con tu enlace, se une a tu equipo), +3 000 a alguien de tu equipo, +1 000 a un jugador al azar.'],['¿Y si el tiempo llega a cero?','El bastón se cae: solo te quedas con la mitad de lo que te dio, y sin bonus.'],['¿Qué es mi equipo?','Los amigos que invitas, y quien te invitó. +10 000 cuando un amigo pasa su primer bastón, +10 000 más a los 10 bastones pasados, y el 10 % de todas sus ganancias. Podéis pediros los bastones.'],['¿Qué tareas hay?','Cada día: 1 operación en Meme Coin Tycoon, +1 000 cada una. Vídeos: +100 (10 al día). Tareas patrocinadas: +2 000, sin límite diario. Y tareas de una sola vez: +5 000 cada una.'],['¿Qué es la racha 🔥?','Abre el juego cada día: día 1 = +1 000, día 2 = +2 000… hasta +7 000 el día 7, y vuelve a empezar. Si fallas un día, vuelves al día 1.'],['¿Cómo mejoro mi bastón?','Con tus $BATON: 10 niveles, de 300 a 840 $BATON por hora.'],['¿Cómo funciona la clasificación?','Los jugadores que más $BATON ganaron esta semana. Cada lunes los 10 primeros ganan $BATON (100 000 para el 1.º) y todos vuelven a cero.'],['¿Cuánto valen los $BATON?','En la tienda, 1 millón de $BATON = 1 $ en USDT, enviados automáticamente a tu wallet TON. Para retirar: jugar 5 días distintos (Pass The Baton o Meme Coin Tycoon), un retiro por semana.']],
pt:[['O que é Pass The Baton?','Um jogo do Telegram em que se passa um bastão: enquanto você o segura, ele rende $BATON, que você troca por USDT de verdade.'],['Como consigo um bastão?','Você recebe um todo dia ao abrir o jogo (o próximo chega à meia-noite, horário de Paris). Depois de passado ou caído, um vídeo te dá um 2º, uma vez por dia. Alguém também pode passar o dele.'],['Quanto ele rende?','300 $BATON por hora no nível 1, até 840 no nível 10. +10 % se você seguir @jeremstyke. Um vídeo dobra os ganhos por 1 hora (até 4 vezes por bastão).'],['Quando passar?','Segure o máximo possível: ele rende a cada hora. Passe logo antes do fim das 4 horas para ganhar também o bônus.'],['Quanto rende passar?','+10 000 para alguém novo (com seu link, ele entra na sua equipe), +3 000 para alguém da sua equipe, +1 000 para um jogador aleatório.'],['E se o tempo chegar a zero?','O bastão cai: você fica só com metade do que ele rendeu, e sem bônus.'],['O que é minha equipe?','Os amigos que você convida, e quem te convidou. +10 000 quando um amigo passa o primeiro bastão, +10 000 a mais com 10 bastões passados, e 10 % de todos os ganhos dele. Vocês podem pedir os bastões um ao outro.'],['Quais tarefas existem?','Todo dia: 1 troca no Meme Coin Tycoon, +1 000 cada. Vídeos: +100 (10 por dia). Tarefas patrocinadas: +2 000, sem limite diário. E tarefas únicas: +5 000 cada.'],['O que é a sequência 🔥?','Abra o jogo todo dia: dia 1 = +1 000, dia 2 = +2 000… até +7 000 no dia 7, e recomeça. Perdeu um dia, volta ao dia 1.'],['Como melhoro meu bastão?','Com seus $BATON: 10 níveis, de 300 a 840 $BATON por hora.'],['Como funciona o ranking?','Os jogadores que mais ganharam $BATON nesta semana. Toda segunda os 10 primeiros ganham $BATON (100 000 para o 1º) e todos voltam a zero.'],['Quanto valem os $BATON?','Na loja, 1 milhão de $BATON = 1 $ em USDT, enviados automaticamente para sua wallet TON. Para sacar: jogar em 5 dias diferentes (Pass The Baton ou Meme Coin Tycoon), um saque por semana.']],
ru:[['Что такое Pass The Baton?','Игра в Telegram, где передают эстафету: пока она у тебя, она приносит $BATON, которые можно обменять на настоящие USDT.'],['Как получить эстафету?','Ты получаешь её каждый день, открывая игру (следующая приходит в полночь по Парижу). Когда передашь или уронишь её, видео даст вторую, раз в день. Также тебе может передать её другой игрок.'],['Сколько она приносит?','300 $BATON в час на 1-м уровне, до 840 на 10-м. +10 % за подписку на @jeremstyke. Видео удваивает доход на 1 час (до 4 раз за эстафету).'],['Когда передавать?','Держи её как можно дольше: она приносит каждый час. Передай прямо перед концом 4 часов, чтобы получить и бонус.'],['Что даёт передача?','+10 000 за новичка (по твоей ссылке он вступает в твою команду), +3 000 за члена команды, +1 000 за случайного игрока.'],['А если таймер дойдёт до нуля?','Эстафета падает: у тебя остаётся только половина её дохода, и без бонуса.'],['Что такое моя команда?','Друзья, которых ты пригласил, и тот, кто пригласил тебя. +10 000, когда друг передаст первую эстафету, ещё +10 000 после 10 передач и 10 % всего его выигрыша. Можно просить друг у друга эстафету.'],['Какие есть задания?','Каждый день: 1 сделка в Meme Coin Tycoon, по +1 000. Видео: +100 (10 в день). Спонсорские задания: +2 000, без дневного лимита. И разовые задания: по +5 000.'],['Что такое серия 🔥?','Открывай игру каждый день: день 1 = +1 000, день 2 = +2 000… до +7 000 на 7-й день, потом заново. Пропустишь день, начнёшь с 1-го.'],['Как улучшить эстафету?','За $BATON: 10 уровней, от 300 до 840 $BATON в час.'],['Как работает рейтинг?','Игроки, заработавшие больше всех $BATON за неделю. Каждый понедельник топ-10 получают $BATON (100 000 за 1-е место), и все начинают с нуля.'],['Сколько стоят $BATON?','В магазине 1 млн $BATON = 1 $ в USDT, автоматически на твой TON-кошелёк. Для вывода: играть 5 разных дней (Pass The Baton или Meme Coin Tycoon), один вывод в неделю.']],
uk:[['Що таке Pass The Baton?','Гра в Telegram, де передають естафету: поки вона в тебе, вона приносить $BATON, які можна обміняти на справжні USDT.'],['Як отримати естафету?','Ти отримуєш її щодня, коли відкриваєш гру (наступна приходить опівночі за Парижем). Коли передаси або впустиш її, відео дасть другу, раз на день. Також тобі може передати її інший гравець.'],['Скільки вона приносить?','300 $BATON на годину на 1-му рівні, до 840 на 10-му. +10 % за підписку на @jeremstyke. Відео подвоює дохід на 1 годину (до 4 разів за естафету).'],['Коли передавати?','Тримай її якомога довше: вона приносить щогодини. Передай перед самим кінцем 4 годин, щоб отримати і бонус.'],['Що дає передача?','+10 000 за новачка (за твоїм посиланням він вступає до твоєї команди), +3 000 за члена команди, +1 000 за випадкового гравця.'],['А якщо таймер дійде до нуля?','Естафета падає: у тебе лишається лише половина її доходу, і без бонусу.'],['Що таке моя команда?','Друзі, яких ти запросив, і той, хто запросив тебе. +10 000, коли друг передасть першу естафету, ще +10 000 після 10 передач і 10 % усього його виграшу. Можна просити одне в одного естафету.'],['Які є завдання?','Щодня: 1 угода в Meme Coin Tycoon, по +1 000. Відео: +100 (10 на день). Спонсорські завдання: +2 000, без денного ліміту. І разові завдання: по +5 000.'],['Що таке серія 🔥?','Відкривай гру щодня: день 1 = +1 000, день 2 = +2 000… до +7 000 на 7-й день, потім знову. Пропустиш день, почнеш з 1-го.'],['Як покращити естафету?','За $BATON: 10 рівнів, від 300 до 840 $BATON на годину.'],['Як працює рейтинг?','Гравці, які заробили найбільше $BATON за тиждень. Щопонеділка топ-10 отримують $BATON (100 000 за 1-ше місце), і всі починають з нуля.'],['Скільки коштують $BATON?','У магазині 1 млн $BATON = 1 $ в USDT, автоматично на твій TON-гаманець. Для виведення: грати 5 різних днів (Pass The Baton або Meme Coin Tycoon), одне виведення на тиждень.']],
tr:[['Pass The Baton nedir?','Bayrak devretmeye dayalı bir Telegram oyunu: elinde olduğu sürece sana $BATON kazandırır, bunları gerçek USDT ile takas edersin.'],['Nasıl bayrak alırım?','Oyunu her gün açtığında bir tane alırsın (sonraki Paris saatiyle gece yarısı gelir). Devredince ya da düşünce bir video sana günde bir kez 2. bayrağı verir. Başka biri de sana kendininkini devredebilir.'],['Ne kadar kazandırır?','1. seviyede saatte 300 $BATON, 10. seviyede 840\'a kadar. @jeremstyke abonesiysen +%10. Bir video kazancı 1 saat ikiye katlar (bayrak başına 4 kez).'],['Ne zaman devretmeli?','Olabildiğince uzun tut: her saat kazandırır. Bonusu da almak için 4 saat bitmeden hemen önce devret.'],['Devretmek ne kazandırır?','Yeni birine +10 000 (linkinle ekibine katılır), ekibinden birine +3 000, rastgele bir oyuncuya +1 000.'],['Süre sıfıra inerse?','Bayrak düşer: kazandırdığının sadece yarısı kalır ve bonus yok.'],['Ekibim nedir?','Davet ettiğin arkadaşlar ve seni davet eden kişi. Bir arkadaş ilk bayrağını devredince +10 000, 10 devirde +10 000 daha ve tüm kazancının %10\'u. Birbirinizden bayrak isteyebilirsiniz.'],['Hangi görevler var?','Her gün: Meme Coin Tycoon\'da 1 işlem, her biri +1 000. Videolar: +100 (günde 10). Sponsorlu görevler: +2 000, günlük sınır yok. Ve tek seferlik görevler: her biri +5 000.'],['🔥 serisi nedir?','Oyunu her gün aç: 1. gün = +1 000, 2. gün = +2 000… 7. gün +7 000, sonra yeniden başlar. Bir gün kaçırırsan 1. güne dönersin.'],['Bayrağımı nasıl geliştiririm?','$BATON ile: 10 seviye, saatte 300\'den 840 $BATON\'a.'],['Sıralama nasıl işler?','Bu hafta en çok $BATON kazanan oyuncular. Her pazartesi ilk 10 $BATON kazanır (1.\'ye 100 000) ve herkes sıfırdan başlar.'],['$BATON neye değer?','Mağazada 1 milyon $BATON = 1 $ USDT, TON cüzdanına otomatik gönderilir. Çekmek için: 5 farklı gün oynamak (Pass The Baton veya Meme Coin Tycoon), haftada bir çekim.']],
id:[['Apa itu Pass The Baton?','Game Telegram tempat orang saling mengoper tongkat: selama kamu pegang, tongkat memberimu $BATON yang bisa ditukar USDT asli.'],['Bagaimana dapat tongkat?','Kamu dapat satu setiap hari saat membuka game (berikutnya datang tengah malam waktu Paris). Setelah dioper atau jatuh, satu video memberimu tongkat ke-2, sekali sehari. Orang lain juga bisa mengoper tongkatnya ke kamu.'],['Berapa hasilnya?','300 $BATON per jam di level 1, hingga 840 di level 10. +10 % jika kamu langganan @jeremstyke. Satu video menggandakan hasil selama 1 jam (hingga 4 kali per tongkat).'],['Kapan harus mengoper?','Pegang selama mungkin: dia menghasilkan tiap jam. Oper tepat sebelum 4 jam habis supaya dapat bonus juga.'],['Apa hasil mengoper?','+10 000 ke orang baru (lewat linkmu, dia masuk timmu), +3 000 ke anggota timmu, +1 000 ke pemain acak.'],['Bagaimana jika waktu habis?','Tongkat jatuh: kamu hanya menyimpan separuh dari hasilnya, tanpa bonus.'],['Apa itu timku?','Teman yang kamu undang, dan yang mengundangmu. +10 000 saat teman mengoper tongkat pertamanya, +10 000 lagi di 10 operan, dan 10 % dari semua kemenangannya. Kalian bisa saling minta tongkat.'],['Ada tugas apa saja?','Setiap hari: 1 transaksi di Meme Coin Tycoon, masing-masing +1 000. Video: +100 (10 per hari). Tugas sponsor: +2 000, tanpa batas harian. Dan tugas sekali saja: masing-masing +5 000.'],['Apa itu runtutan 🔥?','Buka game setiap hari: hari 1 = +1 000, hari 2 = +2 000… hingga +7 000 di hari 7, lalu mulai lagi. Lewat satu hari, kembali ke hari 1.'],['Bagaimana meningkatkan tongkatku?','Dengan $BATON-mu: 10 level, dari 300 hingga 840 $BATON per jam.'],['Bagaimana peringkat bekerja?','Pemain yang paling banyak dapat $BATON minggu ini. Setiap Senin 10 teratas dapat $BATON (100 000 untuk juara 1) dan semua mulai dari nol.'],['Berapa nilai $BATON?','Di toko, 1 juta $BATON = 1 $ USDT, dikirim otomatis ke wallet TON-mu. Untuk menarik: main di 5 hari berbeda (Pass The Baton atau Meme Coin Tycoon), sekali penarikan per minggu.']],
ar:[['ما هي Pass The Baton؟','لعبة تيليجرام يتبادل فيها اللاعبون عصا: ما دامت معك تربحك $BATON تبدّلها بـ USDT حقيقية.'],['كيف أحصل على عصا؟','تحصل على واحدة كل يوم عند فتح اللعبة (التالية تصل منتصف الليل بتوقيت باريس). بعد تمريرها أو سقوطها، يعطيك فيديو عصا ثانية مرة يوميًا. ويمكن لشخص آخر أن يمرّر لك عصاه.'],['كم تربح؟','300 $BATON في الساعة في المستوى 1، حتى 840 في المستوى 10. +10 % إذا كنت مشتركًا في @jeremstyke. فيديو يضاعف أرباحها لساعة (حتى 4 مرات لكل عصا).'],['متى أمرّرها؟','احتفظ بها أطول وقت ممكن: تربحك كل ساعة. مرّرها قبيل انتهاء الساعات الأربع لتحصل على المكافأة أيضًا.'],['ماذا يعطي التمرير؟','+10 000 لشخص جديد (عبر رابطك ينضم إلى فريقك)، +3 000 لعضو في فريقك، +1 000 للاعب عشوائي.'],['وإذا وصل الوقت إلى الصفر؟','تسقط العصا: تحتفظ بنصف ما ربحته منها فقط، ودون مكافأة.'],['ما هو فريقي؟','الأصدقاء الذين تدعوهم، ومن دعاك. +10 000 عندما يمرّر صديق أول عصا، و+10 000 إضافية عند 10 عصي، و10 % من كل أرباحه. يمكنكم طلب العصي من بعضكم.'],['ما المهام المتاحة؟','كل يوم: صفقة واحدة في Meme Coin Tycoon، +1 000 لكل منهما. الفيديو: +100 (10 يوميًا). المهام الممولة: +2 000، بلا حد يومي. ومهام لمرة واحدة: +5 000 لكل منها.'],['ما هي السلسلة 🔥؟','افتح اللعبة كل يوم: اليوم 1 = +1 000، اليوم 2 = +2 000… حتى +7 000 في اليوم 7، ثم تبدأ من جديد. إذا فاتك يوم تعود إلى اليوم 1.'],['كيف أطوّر عصاي؟','بـ $BATON: 10 مستويات، من 300 إلى 840 $BATON في الساعة.'],['كيف يعمل الترتيب؟','اللاعبون الذين ربحوا أكثر $BATON هذا الأسبوع. كل يوم إثنين يربح أول 10 $BATON (100 000 للأول) ويبدأ الجميع من الصفر.'],['كم تساوي $BATON؟','في المتجر، مليون $BATON = 1 $ USDT تُرسل تلقائيًا إلى محفظة TON. للسحب: اللعب في 5 أيام مختلفة (Pass The Baton أو Meme Coin Tycoon)، سحب واحد أسبوعيًا.']],
fa:[['Pass The Baton چیست؟','یک بازی تلگرامی که در آن چوب دست‌به‌دست می‌شود: تا وقتی دست توست برایت $BATON می‌آورد که با USDT واقعی عوضش می‌کنی.'],['چطور چوب بگیرم؟','هر روز با باز کردن بازی یکی می‌گیری (بعدی نیمه‌شب به وقت پاریس می‌رسد). وقتی ردش کردی یا افتاد، یک ویدیو روزی یک بار چوب دوم می‌دهد. کسی هم می‌تواند چوبش را به تو بدهد.'],['چقدر درآمد دارد؟','در سطح ۱ ساعتی ۳۰۰ $BATON، تا ۸۴۰ در سطح ۱۰. اگر عضو @jeremstyke باشی +۱۰٪. یک ویدیو درآمدش را ۱ ساعت دو برابر می‌کند (تا ۴ بار برای هر چوب).'],['کی ردش کنم؟','تا می‌توانی نگهش دار: هر ساعت درآمد دارد. درست قبل از پایان ۴ ساعت ردش کن تا پاداش را هم بگیری.'],['رد کردن چه می‌دهد؟','+۱۰٬۰۰۰ برای تازه‌وارد (با لینک تو عضو تیمت می‌شود)، +۳٬۰۰۰ برای یکی از تیمت، +۱٬۰۰۰ برای بازیکن تصادفی.'],['اگر زمان به صفر برسد؟','چوب می‌افتد: فقط نصف درآمدش برایت می‌ماند و پاداشی نیست.'],['تیم من چیست؟','دوستانی که دعوت می‌کنی و کسی که تو را دعوت کرده. +۱۰٬۰۰۰ وقتی دوستی اولین چوبش را رد کند، +۱۰٬۰۰۰ دیگر در ۱۰ چوب، و ۱۰٪ از همهٔ بردش. می‌توانید از هم چوب بخواهید.'],['چه وظایفی هست؟','هر روز: ۱ معامله در Meme Coin Tycoon، هرکدام +۱٬۰۰۰. ویدیو: +۱۰۰ (روزی ۱۰). وظایف اسپانسری: +۲٬۰۰۰، بدون محدودیت روزانه. و وظایف یک‌باره: هرکدام +۵٬۰۰۰.'],['زنجیرهٔ 🔥 چیست؟','هر روز بازی را باز کن: روز ۱ = +۱٬۰۰۰، روز ۲ = +۲٬۰۰۰… تا +۷٬۰۰۰ در روز ۷، بعد از نو. یک روز جا بماند به روز ۱ برمی‌گردی.'],['چطور چوبم را ارتقا دهم؟','با $BATON: ۱۰ سطح، از ۳۰۰ تا ۸۴۰ $BATON در ساعت.'],['رتبه‌بندی چطور است؟','بازیکنانی که این هفته بیشترین $BATON را گرفته‌اند. هر دوشنبه ۱۰ نفر اول $BATON می‌برند (۱۰۰٬۰۰۰ برای اولی) و همه از صفر شروع می‌کنند.'],['ارزش $BATON چقدر است؟','در فروشگاه ۱ میلیون $BATON = ۱ $ USDT که خودکار به کیف پول TON تو می‌رود. برای برداشت: بازی در ۵ روز مختلف (Pass The Baton یا Meme Coin Tycoon)، هفته‌ای یک برداشت.']]};

        else if (b.dataset.lab !== undefined) { b.innerHTML = b.dataset.lab; b.removeAttribute('data-lab'); b.disabled = false; }
      });
    }, 500);
    // a rewarded video (Adsgram 55429); throws when there is no video
    async function watch() {
      // 28 oct 2026 (10h30, Jeremy): 30 s between two videos, everywhere in the app
      const w0 = (window.__rvAt || 0) + 30000 - Date.now(); if (w0 > 0) { try { tw.showAlert((fr ? '⏳ Prochaine vidéo dans ' : '⏳ Next video in ') + Math.ceil(w0 / 1000) + ' s'); } catch (e) {} throw { wait: true }; }
      const v = await call('vid', { mode: 'ttt' });
      if (v && v.error === 'wait') { try { tw.showAlert((fr ? '⏳ Prochaine vidéo dans ' : '⏳ Next video in ') + Math.max(1, Math.ceil(((Number(v.next) || 0) - Date.now()) / 1000)) + ' s'); } catch (e) {} throw { wait: true }; }
      if (!window.Adsgram) await new Promise((ok, ko) => { const s = document.createElement('script'); s.src = 'https://sad.adsgram.ai/js/sad.min.js'; s.onload = ok; s.onerror = ko; document.head.appendChild(s); });
      await window.__showRw();  // 28 oct 2026: Adsgram, or Ads Galaxy 1 time out of 5
    }
    async function onClick(e) {
      if (e.target === sh) { close(); return; }
      if (e.target.closest('[data-g="duel"]')) { hap(); duelHome(); return; }
      if (await dClick(e)) return;
      const c = e.target.closest('[data-c]'), k = e.target.closest('[data-k]'), g = e.target.closest('[data-g]');
      if (g && g.dataset.g === 'ttt') { hap(); ttt(); return; }
      if (g && g.dataset.g === 'spin') { hap(); spinView(); return; }
      if (g && g.dataset.g === 'scratch') { hap(); scratchView(); return; }
      if (g && g.dataset.g === 'mct') { hap(); const u = 'https://t.me/Memecointycoonbot?startapp=src_btjeux'; try { tw.openTelegramLink(u); } catch (x) { location.href = u; } return; }  // 28 oct 2026 (9h06, Jeremy): Meme Coin Tycoon in the Games list
      if (g && g.dataset.g === 'flip') { hap(); flipView(); return; }
      const stb = e.target.closest('[data-st]'), fb = e.target.closest('[data-f]');
      if (stb && !stb.disabled) { hap(); FST = Number(stb.dataset.st); drawFlip(); return; }
      if (fb && !fb.disabled) { doFlip(fb.dataset.f); return; }
      if (c && G && G.status === 'play' && !busy) {
        hap(); const i = Number(c.dataset.c) - 1; G.board = G.board.slice(0, i) + 'X' + G.board.slice(i + 1);
        const r = await act('ttt_move', { cell: i + 1 });
        if (r && r.status === 'win') hap('success'); else if (r && r.status === 'lose') hap('error'); else if (r && r.status === 'draw') hap('warning');
        return;
      }
      if (!k) return;
      if (k.dataset.k === 'close') { close(); return; }
      if (k.dataset.k === 'list') { hap(); full(false); list(); return; }
      if (k.dataset.k === 'new') { hap(); prev = '.........'; await act('ttt_new'); return; }
      if (k.dataset.k === 'spin') { doSpin(false); return; }
      if (k.dataset.k === 'scgo') { buyTicket(false); return; }
      if (k.dataset.k === 'scall') { hap(); reveal(); return; }
      if (k.dataset.k === 'scgov' || k.dataset.k === 'scdbl') {
        hap(); k.disabled = true;
        try {
          await watch();
          if (k.dataset.k === 'scgov') { await buyTicket(true); return; }
          const r = await call('scratch_double', { id: TK && TK.id });
          if (r && r.ok) { TK.doubled = true; hap('success'); drawScratch(); } else { try { tw.showAlert(X.err); } catch (e) {} k.disabled = false; }
        } catch (x) { k.disabled = false; if (!(x && x.wait)) try { tw.showAlert(X.noVid); } catch (e) {} }
        return;
      }
      if (k.dataset.k === 'spinv' || k.dataset.k === 'sdbl') {
        hap(); k.disabled = true;
        try {
          await watch();
          if (k.dataset.k === 'spinv') { await doSpin(true); return; }
          const r = await call('spin_double', { id: SL && SL.id });
          if (r && r.ok) { SL.doubled = true; hap('success'); drawSpin(); } else { try { tw.showAlert(X.err); } catch (e) {} k.disabled = false; }
        } catch (x) { k.disabled = false; if (!(x && x.wait)) try { tw.showAlert(X.noVid); } catch (e) {} }
        return;
      }
      if (k.dataset.k === 'unl') {
        hap(); k.disabled = true;
        try { await watch(); prev = '.........'; const r = await act('ttt_unlock'); if (r) hap('success'); }
        catch (x) { k.disabled = false; if (!(x && x.wait)) try { tw.showAlert(X.noVid); } catch (e) {} }
        return;
      }
      if (k.dataset.k === 'dbl') {
        hap(); k.disabled = true;
        try {
          await watch();
          const r = await act('ttt_double', { id: G.id });
          if (r) hap('success');
        } catch (x) { k.disabled = false; if (!(x && x.wait)) try { tw.showAlert(X.noVid); } catch (e) {} }
      }
    }
    // the tab only shows when the server says this player can play (test version); placed right after Tasks
    call('ttt_state').then((r) => {
      if (!r || !r.ok) return;
      const place = () => {
        if (document.getElementById('gmTab')) return;
        const nav = document.querySelector('nav.tabs'); if (!nav) return;
        const b = document.createElement('button'); b.id = 'gmTab'; b.type = 'button';
        b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="7" width="19" height="11" rx="5.5"/><path d="M7.5 10.5v4M5.5 12.5h4"/><circle cx="15.5" cy="11.5" r=".6" fill="currentColor"/><circle cx="17.5" cy="13.5" r=".6" fill="currentColor"/></svg><span>' + X.tab + '</span><span class="dot" id="gmDot" hidden></span>';  // 28 oct 2026 (13h15): dot while plays are left today
        b.onclick = () => { openSheet(); list(); };
        const tk = nav.querySelector('button[data-p="tasks"]');
        if (tk) tk.insertAdjacentElement('afterend', b); else nav.appendChild(b);
        nav.classList.add('g5');
        // 28 oct 2026 (13h15, Jeremy): the dot on the Games tab stays as long as one of the games still has plays left today
        const gdot = async () => { const g = await call('games_left'); const d = document.getElementById('gmDot'); if (!d || !g || !g.ok) return; d.hidden = !(((g.ttt || 0) + (g.spin || 0) + (g.scratch || 0) + (g.flip || 0)) > 0); };
        window.__gmDot = gdot; gdot(); clearInterval(window.__gmDotI); window.__gmDotI = setInterval(gdot, 60000);
        // 28 oct 2026 (9h36, Jeremy): a link with startapp=games opens the Games list directly (announcement)
        if (!window.__gmAuto && ((tw.initDataUnsafe && tw.initDataUnsafe.start_param) || '') === 'games') { window.__gmAuto = true; setTimeout(() => { openSheet(); list(); }, 900); }
        // 28 oct 2026 (Jeremy): a challenge link (startapp=d<code>) opens the challenge directly
        { const dsp = (tw.initDataUnsafe && tw.initDataUnsafe.start_param) || ''; if (!window.__gmAuto && /^d[0-9a-f]{8}$/.test(dsp)) { window.__gmAuto = true; setTimeout(() => { openSheet(); duelView(dsp.slice(1)); }, 700); } }
      };
      place(); setInterval(place, 1500);
    });
  } catch (e) {}
})();
