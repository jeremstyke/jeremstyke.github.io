['Скільки дає передача?','120 $BATON × кількість рук, через які пройшла естафета × бонус (x5, x3 або x1). Що далі вона пройшла, то більше дає.'],
['А якщо не передати?','Коли таймер дійде до нуля, ти впустиш естафету: її подорож закінчиться, бонусу не буде.'],
['Чому не можна обрати друга?','Він уже має естафету або вже тримав цю. Надішли посилання новачку.'],
['Можна тримати естафету довше?','Так: +4 год за 10 ⭐, один раз на естафету.'],
['Що я отримаю за запрошення друга?','5 000 $BATON після його першого збору і 10 % від усього його видобутку.'],
['Що таке бонус у %?','+1 % до видобутку за кожну руку твоєї естафети, поки вона в дорозі (до +100 %), і +10 % за кожен канал Telegram, на який ти підписаний.'],
['Що таке покращення?','Бур прискорює видобуток. Бак і руків\'я відкриваються на 3-му рівні бура.'],
['Що таке серія 🔥?','Збирай щодня: кожен день поспіль додає бонус.'],
['Як працюють рейтинги?','Естафети: найдовші подорожі тижня (з понеділка). Шахтарі: найбільше $BATON за цей тиждень. Обидва рейтинги обнуляються щопонеділка.'],
['$BATON коштують грошей?','Це очки. Планується аірдроп: їх обміняють на токени за твоєю часткою від усіх очок. Дата й вартість не гарантуються.']]},
tr:{h:'Yardım',tuto:'▶ Eğitimi tekrar izle',more:'Başka bir sorun mu var? Bize yaz:',q:[
['Baton nedir?','Bir Telegram oyunu: $BATON puanı kazar ve bayrakları elden ele geçirirsin.'],
['Nasıl $BATON kazanırım?','Madenini topla, bayrak devret, görevleri yap, arkadaş davet et (kazdıklarının %10\'u senin) ve günlük serini koru.'],
['Madenim neden durdu?','4 saatte dolar, sonra seni bekler. Yeniden başlatmak için topla.'],
['Nasıl bayrak alırım?','Elinde yoksa, oyunu açtığında her gün bir tane alırsın. Biri de sana kendininkini devredebilir.'],
['Bayrak ne işe yarar?','Sende olduğu sürece madenin 2× hızlı çalışır. Devretmek için 4 saatin var.'],
['Kime devredebilirim?','Linkinle yeni birine (x5), bir arkadaşa (x3) ya da rastgele bir oyuncuya (x1). Elinde zaten bayrak olan ya da bunu zaten tutmuş biri alamaz.'],
['Bir devir ne kazandırır?','120 $BATON × bayrağın geçtiği el sayısı × bonus (x5, x3 veya x1). Ne kadar çok gezdiyse o kadar çok kazandırır.'],
['Devretmezsem ne olur?','Süre sıfırlanınca bayrağı düşürürsün: yolculuğu biter ve bonus alamazsın.'],
['Neden bir arkadaş seçemiyorum?','Elinde zaten bayrak var ya da bunu zaten tuttu. Linkini yeni birine gönder.'],
['Bayrağı daha uzun tutabilir miyim?','Evet: 10 ⭐ karşılığında +4 saat, bayrak başına bir kez.'],
['Arkadaş davet edince ne kazanırım?','İlk toplamasında 5 000 $BATON ve kazdığı her şeyin %10\'u.'],
['% bonus nedir?','Başlattığın bayrak yolda olduğu sürece her el için +%1 kazı (en fazla +%100) ve katıldığın her Telegram kanalı için, abone kaldığın sürece +%10.'],
['Geliştirmeler nedir?','Matkap daha hızlı kazmanı sağlar. Depo ve tutamak, matkap 3. seviyede açılır.'],
['🔥 serisi nedir?','Her gün topla: üst üste her gün bir bonus ekler.'],
['Sıralamalar nasıl çalışır?','Bayraklar: haftanın en uzun yolculukları (pazartesiden beri). Madenciler: bu hafta en çok $BATON kazananlar. İkisi de her pazartesi sıfırlanır.'],
['$BATON para eder mi?','Bunlar puan. Bir airdrop planlanıyor: tüm puanlardaki payına göre tokene çevrilecek. Tarih ve değer garanti değil.']]},
id:{h:'Bantuan',tuto:'▶ Ulangi tutorial',more:'Ada pertanyaan lain? Tulis ke kami:',q:[
['Apa itu Baton?','Game Telegram: kamu menambang poin $BATON dan mengoper tongkat dari tangan ke tangan.'],
['Bagaimana dapat $BATON?','Panen tambangmu, oper tongkat, kerjakan tugas, undang teman (kamu dapat 10 % dari hasil tambang mereka) dan jaga runtutan harianmu.'],
['Kenapa tambangku berhenti?','Tambang penuh dalam 4 jam lalu menunggumu. Panen untuk menjalankannya lagi.'],
['Bagaimana dapat tongkat?','Kamu dapat satu tiap hari saat membuka game, jika belum memegang tongkat. Orang lain juga bisa mengoper miliknya.'],
['Apa gunanya tongkat?','Selama kamu memegangnya, tambangmu 2× lebih cepat. Kamu punya 4 jam untuk mengopernya.'],
['Ke siapa bisa kuoper?','Ke orang baru lewat linkmu (x5), ke teman (x3), atau ke pemain acak (x1). Yang sudah memegang tongkat, atau sudah pernah memegang yang ini, tidak bisa menerimanya.'],
['Berapa hasil satu operan?','120 $BATON × jumlah tangan yang dilewati tongkat × bonus (x5, x3 atau x1). Makin jauh berkelana, makin besar hasilnya.'],
['Kalau tidak kuoper?','Saat waktu habis, tongkatmu jatuh: perjalanannya berakhir dan kamu tidak dapat bonus.'],
['Kenapa tidak bisa memilih teman?','Dia sudah memegang tongkat atau sudah pernah memegang yang ini. Kirim linkmu ke orang baru.'],
['Bisa pegang tongkat lebih lama?','Bisa: +4 jam untuk 10 ⭐, sekali per tongkat.'],
['Apa yang kudapat jika mengundang teman?','5 000 $BATON saat panen pertamanya dan 10 % dari semua hasil tambangnya.'],
['Apa itu bonus %?','+1 % tambang per tangan dari tongkat yang kamu mulai, selama masih berkelana (hingga +100 %), dan +10 % untuk setiap kanal Telegram yang kamu ikuti, selama tetap berlangganan.'],
['Apa itu peningkatan?','Bor membuatmu menambang lebih cepat. Tangki dan pegangan terbuka di level bor 3.'],
['Apa itu runtutan 🔥?','Panen setiap hari: setiap hari berturut-turut menambah bonus.'],
['Bagaimana peringkat bekerja?','Tongkat: perjalanan terpanjang minggu ini (sejak Senin). Penambang: $BATON terbanyak minggu ini. Keduanya mulai dari nol setiap Senin.'],
['Apakah $BATON bernilai uang?','Itu poin. Airdrop direncanakan: poin akan diubah menjadi token sesuai bagianmu dari semua poin. Tanpa jaminan tanggal maupun nilai.']]},
ar:{h:'مساعدة',tuto:'▶ أعد مشاهدة الشرح',more:'سؤال آخر؟ راسلنا:',q:[
['ما هي Baton؟','لعبة على تيليجرام: تعدّن نقاط $BATON وتمرّر العصي من يد إلى يد.'],
['كيف أربح $BATON؟','اجمع منجمك، مرّر العصي، أنجز المهام، ادعُ أصدقاءك (تحصل على 10 % مما يعدّنون) وحافظ على سلسلة أيامك.'],
['لماذا توقف منجمي؟','يمتلئ في 4 ساعات ثم ينتظرك. اجمعه ليعمل من جديد.'],
['كيف أحصل على عصا؟','تحصل على واحدة كل يوم عند فتح اللعبة إن لم تكن تحمل واحدة. ويمكن لأحدهم أيضًا أن يمرّر لك عصاه.'],
['ما فائدة العصا؟','ما دامت معك، منجمك أسرع مرتين. لديك 4 ساعات لتمريرها.'],
['لمن أمرّرها؟','لشخص جديد عبر رابطك (x5)، لصديق (x3)، أو للاعب عشوائي (x1). من يحمل عصا بالفعل، أو حمل هذه من قبل، لا يمكنه استلامها.'],
['كم تربحني التمريرة؟','120 $BATON × عدد الأيدي التي مرت بها العصا × المكافأة (x5 أو x3 أو x1). كلما سافرت أكثر، ربحت أكثر.'],
['وإذا لم أمرّرها؟','عندما ينتهي الوقت تسقط العصا منك: تنتهي رحلتها ولا تحصل على مكافأة.'],
['لماذا لا أستطيع اختيار صديق؟','معه عصا بالفعل أو حمل هذه من قبل. أرسل رابطك لشخص جديد.'],
['هل يمكنني الاحتفاظ بالعصا أطول؟','نعم: +4 ساعات مقابل 10 ⭐، مرة واحدة لكل عصا.'],
['ماذا أربح عند دعوة صديق؟','5 000 $BATON عند أول جمع له و10 % من كل ما يعدّنه.'],
['ما هي المكافأة بالنسبة المئوية؟','+1 % تعدين لكل يد مرت بها العصا التي أطلقتها ما دامت تسافر (حتى +100 %)، و+10 % لكل قناة تيليجرام تنضم إليها ما دمت مشتركًا.'],
['ما هي التحسينات؟','المثقاب يجعلك تعدّن أسرع. الخزان والمقبض يُفتحان عند المستوى 3 للمثقاب.'],
['ما هي السلسلة 🔥؟','اجمع كل يوم: كل يوم متتالٍ يضيف مكافأة.'],
['كيف تعمل التصنيفات؟','العصي: أطول رحلات الأسبوع (منذ الإثنين). المعدّنون: الأكثر ربحًا لـ $BATON هذا الأسبوع. يبدأ الترتيبان من الصفر كل إثنين.'],
['هل لـ $BATON قيمة مالية؟','إنها نقاط. هناك إيردروب مخطط: ستتحول إلى توكنات حسب حصتك من كل النقاط. لا تاريخ ولا قيمة مضمونان.']]},
fa:{h:'راهنما',tuto:'▶ دیدن دوبارهٔ آموزش',more:'سؤال دیگری داری؟ برایمان بنویس:',q:[
['Baton چیست؟','یک بازی تلگرامی: امتیاز $BATON استخراج می‌کنی و چوب‌ها را دست به دست می‌کنی.'],
['چطور $BATON به دست بیاورم؟','معدنت را برداشت کن، چوب پاس بده، مأموریت‌ها را انجام بده، دوستانت را دعوت کن (۱۰٪ استخراجشان مال توست) و زنجیرهٔ روزانه‌ات را حفظ کن.'],
['چرا معدنم متوقف شد؟','در ۴ ساعت پر می‌شود و منتظرت می‌ماند. برداشت کن تا دوباره کار کند.'],
['چطور چوب بگیرم؟','هر روز با باز کردن بازی یکی می‌گیری، اگر از قبل چوبی نداشته باشی. کسی هم می‌تواند چوبش را به تو بدهد.'],
['چوب به چه درد می‌خورد؟','تا وقتی دست توست، معدنت ۲ برابر سریع‌تر است. ۴ ساعت وقت داری ردش کنی.'],
['به چه کسی پاسش بدهم؟','به یک تازه‌وارد با لینکت (x5)، به یک دوست (x3) یا به یک بازیکن تصادفی (x1). کسی که چوب دارد یا قبلاً همین را داشته، نمی‌تواند آن را بگیرد.'],
['هر پاس چقدر می‌ارزد؟','۱۲۰ $BATON × تعداد دست‌هایی که چوب از آن‌ها گذشته × پاداش (x5، x3 یا x1). هرچه بیشتر سفر کرده، بیشتر می‌ارزد.'],
['اگر پاسش ندهم؟','وقتی زمان تمام شود، چوب از دستت می‌افتد: سفرش تمام می‌شود و پاداشی نمی‌گیری.'],
['چرا نمی‌توانم دوستی را انتخاب کنم؟','او از قبل چوب دارد یا همین را قبلاً داشته. لینکت را برای یک تازه‌وارد بفرست.'],
['می‌توانم چوب را بیشتر نگه دارم؟','بله: ۴ ساعت بیشتر با ۱۰ ⭐، یک بار برای هر چوب.'],
['با دعوت دوست چه می‌گیرم؟','۵٬۰۰۰ $BATON در اولین برداشتش و ۱۰٪ از همهٔ استخراجش.'],
['پاداش درصدی چیست؟','۱٪+ استخراج برای هر دستِ چوبی که راه انداختی، تا وقتی در سفر است (تا ۱۰۰٪+)، و ۱۰٪+ برای هر کانال تلگرامی که عضوش شوی، تا وقتی عضو بمانی.'],
['ارتقاها چیست؟','مته سرعت استخراجت را بالا می‌برد. مخزن و دسته در سطح ۳ مته باز می‌شوند.'],
['زنجیرهٔ 🔥 چیست؟','هر روز برداشت کن: هر روز پیاپی یک پاداش اضافه می‌کند.'],
['رتبه‌بندی‌ها چطور کار می‌کنند؟','چوب‌ها: طولانی‌ترین سفرهای هفته (از دوشنبه). معدنچی‌ها: بیشترین $BATON در این هفته. هر دو هر دوشنبه از صفر شروع می‌شوند.'],
['آیا $BATON ارزش پولی دارد؟','این‌ها امتیازند. ایردراپی برنامه‌ریزی شده: بر اساس سهمت از کل امتیازها به توکن تبدیل می‌شوند. تاریخ و ارزش تضمین نشده است.']]}

  else if (/^p\d{1,15}$/.test(sp)) openProfile(Number(sp.slice(1)));  // 22 oct 2026: a message from a player opens his profile
  setInterval(tick, 1000);
  setInterval(refresh, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
})();
})();
</script>
